[tasks."vault:unseal"]
description = "Unseal every sealed Vault pod with the keys from the vault-unseal-keys Secret"
run = '''
#!/usr/bin/env bash
set -euo pipefail
CTX="${VAULT_CONTEXT:-$(kubectl config current-context)}"
NS="${VAULT_NAMESPACE:-$(kubectl --context "$CTX" get secret -A --field-selector metadata.name=vault-unseal-keys -o jsonpath='{.items[0].metadata.namespace}')}"
[ -n "$NS" ] || { echo "vault-unseal-keys Secret not found on $CTX" >&2; exit 1; }
vexec() { local pod=$1; shift; kubectl --context "$CTX" -n "$NS" exec "$pod" -c vault -- env VAULT_ADDR=https://127.0.0.1:8200 VAULT_SKIP_VERIFY=true "$@"; }
KEYS="$(kubectl --context "$CTX" -n "$NS" get secret vault-unseal-keys -o json | jq -r '.data | to_entries[] | select(.key | startswith("vault-unseal-")) | .value | @base64d')"
for pod in $(kubectl --context "$CTX" -n "$NS" get pods -l app.kubernetes.io/name=vault -o name); do
  echo "==> $pod on $CTX/$NS"
  # 'vault status' exits 0 only once unsealed, so feed keys until the threshold is reached.
  for key in $KEYS; do
    vexec "$pod" vault status >/dev/null 2>&1 && break
    vexec "$pod" vault operator unseal "$key" >/dev/null
  done
  vexec "$pod" vault status | grep -E '^(Sealed|Unseal Progress)' || true
done
'''

[tasks."vault:status"]
description = "Show the seal status of every Vault pod on the target cluster"
run = '''
#!/usr/bin/env bash
set -euo pipefail
CTX="${VAULT_CONTEXT:-$(kubectl config current-context)}"
NS="${VAULT_NAMESPACE:-$(kubectl --context "$CTX" get secret -A --field-selector metadata.name=vault-unseal-keys -o jsonpath='{.items[0].metadata.namespace}')}"
[ -n "$NS" ] || { echo "vault-unseal-keys Secret not found on $CTX" >&2; exit 1; }
for pod in $(kubectl --context "$CTX" -n "$NS" get pods -l app.kubernetes.io/name=vault -o name); do
  echo "==> $pod on $CTX/$NS"
  kubectl --context "$CTX" -n "$NS" exec "$pod" -c vault -- env VAULT_ADDR=https://127.0.0.1:8200 VAULT_SKIP_VERIFY=true vault status || true
done
'''

[tasks."vault:kv"]
description = "Run 'vault kv' in the Vault pod (e.g. list kv/, get kv/foo, put kv/foo k=v)"
run = '''
#!/usr/bin/env bash
set -euo pipefail
[ $# -gt 0 ] || { echo "usage: mise run vault:kv <list|get|put|patch|delete> kv/<path> [k=v ...]" >&2; exit 1; }
CTX="${VAULT_CONTEXT:-$(kubectl config current-context)}"
echo "context: $CTX" >&2
# The namespace differs between clusters, so locate it from the unseal-keys Secret.
NS="${VAULT_NAMESPACE:-$(kubectl --context "$CTX" get secret -A --field-selector metadata.name=vault-unseal-keys -o jsonpath='{.items[0].metadata.namespace}')}"
[ -n "$NS" ] || { echo "vault-unseal-keys Secret not found on $CTX" >&2; exit 1; }
TOKEN="$(kubectl --context "$CTX" -n "$NS" get secret vault-unseal-keys -o jsonpath='{.data.vault-root}' | base64 -d)"
# -i lets 'put kv/foo key=-' read the value from local stdin.
kubectl --context "$CTX" -n "$NS" exec -i vault-0 -c vault -- \
  env VAULT_ADDR=https://127.0.0.1:8200 VAULT_SKIP_VERIFY=true VAULT_TOKEN="$TOKEN" \
  vault kv "$@"
'''
