[tasks."vault:unseal"]
description = "Unseal every sealed Vault pod with the keys from the vault-unseal-keys Secret"
run = '''
#!/usr/bin/env bash
set -euo pipefail
CTX="${VAULT_CONTEXT:-$(kubectl config current-context)}"
NS="${VAULT_NAMESPACE:-$(kubectl --context "$CTX" get secret -A --field-selector metadata.name=vault-unseal-keys -o jsonpath='{.items[0].metadata.namespace}')}"
[ -n "$NS" ] || { echo "vault-unseal-keys Secret not found on $CTX" >&2; exit 1; }
vexec() { local pod=$1; shift; kubectl --context "$CTX" -n "$NS" exec "$pod" -c vault -- env VAULT_ADDR=https://127.0.0.1:8200 VAULT_SKIP_VERIFY=true "$@"; }
KEYS="$(kubectl --context "$CTX" -n "$NS" get secret vault-unseal-keys -o json | jq -r '.data | to_entries[] | select(.key | startswith("vault-unseal-")) | .value | @base64d')"
for pod in $(kubectl --context "$CTX" -n "$NS" get pods -l app.kubernetes.io/name=vault -o name); do
  echo "==> $pod on $CTX/$NS"
  # 'vault status' exits 0 only once unsealed, so feed keys until the threshold is reached.
  for key in $KEYS; do
    vexec "$pod" vault status >/dev/null 2>&1 && break
    vexec "$pod" vault operator unseal "$key" >/dev/null
  done
  vexec "$pod" vault status | grep -E '^(Sealed|Unseal Progress)' || true
done
'''

[tasks."vault:status"]
description = "Show the seal status of every Vault pod on the target cluster"
run = '''
#!/usr/bin/env bash
set -euo pipefail
CTX="${VAULT_CONTEXT:-$(kubectl config current-context)}"
NS="${VAULT_NAMESPACE:-$(kubectl --context "$CTX" get secret -A --field-selector metadata.name=vault-unseal-keys -o jsonpath='{.items[0].metadata.namespace}')}"
[ -n "$NS" ] || { echo "vault-unseal-keys Secret not found on $CTX" >&2; exit 1; }
for pod in $(kubectl --context "$CTX" -n "$NS" get pods -l app.kubernetes.io/name=vault -o name); do
  echo "==> $pod on $CTX/$NS"
  kubectl --context "$CTX" -n "$NS" exec "$pod" -c vault -- env VAULT_ADDR=https://127.0.0.1:8200 VAULT_SKIP_VERIFY=true vault status || true
done
'''

[tasks."talos-poc:kubeconfig"]
description = "Fetch the talos-poc guest cluster kubeconfig (NodePort endpoint) into a local file"
run = '''
#!/usr/bin/env bash
set -euo pipefail
# Management (Mocha) kubeconfig — the OIDC omni-mocha context hangs headless, so
# default to the direct non-OIDC file.
MGMT="${MOCHA_KUBECONFIG:-$HOME/kubeconfig.mocha}"
NS="${TALOS_NAMESPACE:-talos-poc}"
CLUSTER="${TALOS_CLUSTER:-talos-poc}"
OUT="${TALOS_KUBECONFIG:-$HOME/kubeconfig.talos-poc}"
[ -f "$MGMT" ] || { echo "management kubeconfig not found: $MGMT" >&2; exit 1; }
export KUBECONFIG="$MGMT"

# The CAPI-issued kubeconfig points at the in-cluster ClusterIP; rewrite it to the
# control-plane Service NodePort reachable on the node's address.
NP="$(kubectl -n "$NS" get svc "${CLUSTER}-lb" -o jsonpath='{.spec.ports[0].nodePort}')"
[ -n "$NP" ] || { echo "service ${CLUSTER}-lb is not type NodePort" >&2; exit 1; }
IP="${NODE_IP:-$(kubectl get nodes -o jsonpath='{.items[0].status.addresses[?(@.type=="InternalIP")].address}')}"

tmp="$(mktemp -d)"; trap 'rm -rf "$tmp"' EXIT
kubectl -n "$NS" get secret "${CLUSTER}-kubeconfig" -o jsonpath='{.data.value}' | base64 -d > "$tmp/src"
KUBECONFIG="$tmp/src" kubectl config view --raw -o jsonpath='{.users[0].user.client-certificate-data}' | base64 -d > "$tmp/client.crt"
KUBECONFIG="$tmp/src" kubectl config view --raw -o jsonpath='{.users[0].user.client-key-data}'         | base64 -d > "$tmp/client.key"

# NODE_IP is usually not in the API server cert SANs, so skip TLS verification.
rm -f "$OUT"
KUBECONFIG="$OUT" kubectl config set-cluster     "$CLUSTER"          --server="https://${IP}:${NP}" --insecure-skip-tls-verify=true >/dev/null
KUBECONFIG="$OUT" kubectl config set-credentials "${CLUSTER}-admin"  --client-certificate="$tmp/client.crt" --client-key="$tmp/client.key" --embed-certs=true >/dev/null
KUBECONFIG="$OUT" kubectl config set-context     "$CLUSTER"          --cluster="$CLUSTER" --user="${CLUSTER}-admin" >/dev/null
KUBECONFIG="$OUT" kubectl config use-context     "$CLUSTER" >/dev/null
chmod 600 "$OUT"
echo "wrote $OUT  (server https://${IP}:${NP})"
KUBECONFIG="$OUT" kubectl get nodes
'''

[tasks."vault:kv"]
description = "Run 'vault kv' in the Vault pod (e.g. list kv/, get kv/foo, put kv/foo k=v)"
run = '''
#!/usr/bin/env bash
set -euo pipefail
[ $# -gt 0 ] || { echo "usage: mise run vault:kv <list|get|put|patch|delete> kv/<path> [k=v ...]" >&2; exit 1; }
CTX="${VAULT_CONTEXT:-$(kubectl config current-context)}"
echo "context: $CTX" >&2
# The namespace differs between clusters, so locate it from the unseal-keys Secret.
NS="${VAULT_NAMESPACE:-$(kubectl --context "$CTX" get secret -A --field-selector metadata.name=vault-unseal-keys -o jsonpath='{.items[0].metadata.namespace}')}"
[ -n "$NS" ] || { echo "vault-unseal-keys Secret not found on $CTX" >&2; exit 1; }
TOKEN="$(kubectl --context "$CTX" -n "$NS" get secret vault-unseal-keys -o jsonpath='{.data.vault-root}' | base64 -d)"
# -i lets 'put kv/foo key=-' read the value from local stdin.
kubectl --context "$CTX" -n "$NS" exec -i vault-0 -c vault -- \
  env VAULT_ADDR=https://127.0.0.1:8200 VAULT_SKIP_VERIFY=true VAULT_TOKEN="$TOKEN" \
  vault kv "$@"
'''
