[tools]
# Ships cctl, which drives the Corium nodes (mocha, doppio).
"github:Corium-OS/Corium" = "0.5.0"
# Static analysis of Argo CD manifests, see docs/octodoctor.md.
"github:OctopusDeploy/octodoctor-argocd" = "0.6.0"
# Local resolver for *.nb.mocha.thoughtless.eu, see mocha/apps/netbird-jump/README.md.
"github:coredns/coredns" = "1.15.0"
# Reverse-tunnel client for nb:mac, see mocha/apps/mac-relay/README.md.
"github:jpillora/chisel" = "1.12.0"

[tasks."vault:unseal"]
description = "Unseal every sealed Vault pod with the keys from the vault-unseal-keys Secret"
run = '''
#!/usr/bin/env bash
set -euo pipefail
CTX="${VAULT_CONTEXT:-$(kubectl config current-context)}"
NS="${VAULT_NAMESPACE:-$(kubectl --context "$CTX" get secret -A --field-selector metadata.name=vault-unseal-keys -o jsonpath='{.items[0].metadata.namespace}')}"
[ -n "$NS" ] || { echo "vault-unseal-keys Secret not found on $CTX" >&2; exit 1; }
vexec() { local pod=$1; shift; kubectl --context "$CTX" -n "$NS" exec "$pod" -c vault -- env VAULT_ADDR=https://127.0.0.1:8200 VAULT_SKIP_VERIFY=true "$@"; }
KEYS="$(kubectl --context "$CTX" -n "$NS" get secret vault-unseal-keys -o json | jq -r '.data | to_entries[] | select(.key | startswith("vault-unseal-")) | .value | @base64d')"
for pod in $(kubectl --context "$CTX" -n "$NS" get pods -l app.kubernetes.io/name=vault -o name); do
  echo "==> $pod on $CTX/$NS"
  # 'vault status' exits 0 only once unsealed, so feed keys until the threshold is reached.
  for key in $KEYS; do
    vexec "$pod" vault status >/dev/null 2>&1 && break
    vexec "$pod" vault operator unseal "$key" >/dev/null
  done
  vexec "$pod" vault status | grep -E '^(Sealed|Unseal Progress)' || true
done
'''

[tasks."vault:status"]
description = "Show the seal status of every Vault pod on the target cluster"
run = '''
#!/usr/bin/env bash
set -euo pipefail
CTX="${VAULT_CONTEXT:-$(kubectl config current-context)}"
NS="${VAULT_NAMESPACE:-$(kubectl --context "$CTX" get secret -A --field-selector metadata.name=vault-unseal-keys -o jsonpath='{.items[0].metadata.namespace}')}"
[ -n "$NS" ] || { echo "vault-unseal-keys Secret not found on $CTX" >&2; exit 1; }
for pod in $(kubectl --context "$CTX" -n "$NS" get pods -l app.kubernetes.io/name=vault -o name); do
  echo "==> $pod on $CTX/$NS"
  kubectl --context "$CTX" -n "$NS" exec "$pod" -c vault -- env VAULT_ADDR=https://127.0.0.1:8200 VAULT_SKIP_VERIFY=true vault status || true
done
'''

[tasks."vault:kv"]
description = "Run 'vault kv' in the Vault pod (e.g. list kv/, get kv/foo, put kv/foo k=v)"
run = '''
#!/usr/bin/env bash
set -euo pipefail
[ $# -gt 0 ] || { echo "usage: mise run vault:kv <list|get|put|patch|delete> kv/<path> [k=v ...]" >&2; exit 1; }
CTX="${VAULT_CONTEXT:-$(kubectl config current-context)}"
echo "context: $CTX" >&2
# The namespace differs between clusters, so locate it from the unseal-keys Secret.
NS="${VAULT_NAMESPACE:-$(kubectl --context "$CTX" get secret -A --field-selector metadata.name=vault-unseal-keys -o jsonpath='{.items[0].metadata.namespace}')}"
[ -n "$NS" ] || { echo "vault-unseal-keys Secret not found on $CTX" >&2; exit 1; }
TOKEN="$(kubectl --context "$CTX" -n "$NS" get secret vault-unseal-keys -o jsonpath='{.data.vault-root}' | base64 -d)"
# -i lets 'put kv/foo key=-' read the value from local stdin.
kubectl --context "$CTX" -n "$NS" exec -i vault-0 -c vault -- \
  env VAULT_ADDR=https://127.0.0.1:8200 VAULT_SKIP_VERIFY=true VAULT_TOKEN="$TOKEN" \
  vault kv "$@"
'''

[tasks."octodoctor:scan"]
description = "Run OctoDoctor on the Argo CD manifests tracked in git (optional path, e.g. mocha)"
run = '''
#!/usr/bin/env bash
set -euo pipefail
OUT="${OCTODOCTOR_OUT:-${TMPDIR:-/tmp}/octodoctor}/repo"
# OctoDoctor writes its report inside the scanned directory, so scan a copy.
rm -rf "$OUT" && mkdir -p "$OUT"
git ls-files -co --exclude-standard -z -- "${1:-.}" ':!.claude' | rsync -a --from0 --files-from=- ./ "$OUT/"
octodoctor -d "$OUT" --fail-on none --limit 200
echo "report: $OUT/octodoctor-output/index.html"
'''

[tasks."octodoctor:export"]
description = "Export Argo CD from a cluster and run OctoDoctor on it (context as arg, default current)"
run = '''
#!/usr/bin/env bash
set -euo pipefail
CTX="${1:-$(kubectl config current-context)}"
OUT="${OCTODOCTOR_OUT:-${TMPDIR:-/tmp}/octodoctor}"
# The export lands in the current directory, keep it out of the repo.
mkdir -p "$OUT" && cd "$OUT"
octodoctor -e -c "$CTX" --fail-on none --limit 200
echo "report: $(ls -td "$OUT"/argocd-manifests-export-*/ | head -1)octodoctor-output/index.html"
'''

# *.nb and *.px .mocha.thoughtless.eu on macOS without the NetBird client:
# /etc/resolver sends those zones to a local CoreDNS that answers 127.0.0.1,
# pf maps 127.0.0.1:443/80 to a port-forward of the netbird-jump SNI sidecar,
# which goes through NetBird. Only those zones are affected.
[tasks."nb:setup"]
description = "One-time macOS setup (sudo): /etc/resolver entry and pf redirect 443/80 -> 8443"
run = '''
#!/usr/bin/env bash
set -euo pipefail
# Ask for the sudo password once and reuse it: this Mac does not cache sudo
# credentials across the piped subshells below, so a bare "sudo" would prompt
# for every single call.
if ! sudo -n true 2>/dev/null; then
  read -rs -p "sudo password: " SUDO_PW
  echo >&2
  # Feed the password through an askpass helper, NOT through stdin: sudo -S
  # would eat the pipes and heredocs used below ("... | sudo tee file").
  askpass="$(mktemp)"
  trap 'rm -f "$askpass"' EXIT
  esc=$(printf '%s' "$SUDO_PW" | sed -e 's/\\/\\\\/g' -e 's/"/\\"/g' -e 's/\$/\\$/g' -e 's/`/\\`/g')
  { echo '#!/bin/sh'; printf 'printf "%%s\\n" "%s"\n' "$esc"; } > "$askpass"
  chmod 700 "$askpass"
  SUDO_ASKPASS="$askpass" command sudo -A -v 2>/dev/null || { echo "sudo: wrong password" >&2; exit 1; }
  sudo() { SUDO_ASKPASS="$askpass" command sudo -A "$@"; }
fi
sudo mkdir -p /etc/resolver
printf 'nameserver 127.0.0.1\nport 53535\n' | sudo tee /etc/resolver/nb.mocha.thoughtless.eu >/dev/null
printf 'nameserver 127.0.0.1\nport 53535\n' | sudo tee /etc/resolver/px.mocha.thoughtless.eu >/dev/null
echo 'rdr pass on lo0 inet proto tcp from any to 127.0.0.1 port { 80, 443 } -> 127.0.0.1 port 8443' \
  | sudo tee /etc/pf.anchors/nb.mocha >/dev/null
# The default pf.conf evaluates com.apple/*, so the anchor needs no pf.conf edit.
# The daemon reloads it at boot; pfctl -E keeps pf enabled alongside other users.
sudo tee /Library/LaunchDaemons/eu.thoughtless.nb-mocha.plist >/dev/null <<'PLIST'
<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
<plist version="1.0">
<dict>
  <key>Label</key><string>eu.thoughtless.nb-mocha</string>
  <key>ProgramArguments</key>
  <array>
    <string>/bin/sh</string><string>-c</string>
    <string>/sbin/pfctl -a com.apple/nb.mocha -f /etc/pf.anchors/nb.mocha &amp;&amp; /sbin/pfctl -E</string>
  </array>
  <key>RunAtLoad</key><true/>
</dict>
</plist>
PLIST
sudo launchctl bootout system/eu.thoughtless.nb-mocha 2>/dev/null || true
sudo launchctl bootstrap system /Library/LaunchDaemons/eu.thoughtless.nb-mocha.plist
sudo pfctl -a com.apple/nb.mocha -s nat 2>/dev/null
'''

[tasks."nb:tunnel"]
description = "Serve *.nb.mocha.thoughtless.eu locally through NetBird: CoreDNS + port-forward to netbird-jump (Ctrl-C to stop)"
run = '''
#!/usr/bin/env bash
set -euo pipefail
export KUBECONFIG="${KUBECONFIG:-$MISE_PROJECT_ROOT/mocha/kubeconfig}"
corefile="$(mktemp)"
cat >"$corefile" <<'COREFILE'
nb.mocha.thoughtless.eu:53535 {
    bind 127.0.0.1
    template IN A {
        answer "{% raw %}{{ .Name }}{% endraw %} 60 IN A 127.0.0.1"
    }
    template IN AAAA {
        rcode NOERROR
    }
}
px.mocha.thoughtless.eu:53535 {
    bind 127.0.0.1
    template IN A {
        answer "{% raw %}{{ .Name }}{% endraw %} 60 IN A 127.0.0.1"
    }
    template IN AAAA {
        rcode NOERROR
    }
}
COREFILE
coredns -conf "$corefile" -quiet &
dns=$!
trap 'kill "$dns" 2>/dev/null; rm -f "$corefile"' EXIT
# port-forward drops on idle and on pod restarts.
while true; do
  # 8443: SNI entry for every app; 1080: SOCKS5 for FoxyProxy.
  kubectl ${NB_CONTEXT:+--context "$NB_CONTEXT"} -n netbird-jump port-forward deploy/netbird-jump 8443:8443 1080:1080 || true
  sleep 1
done
'''

# Publish a local port of this Mac as https://mac.nb.mocha.thoughtless.eu to
# every NetBird peer: chisel dials the mac-relay pod over kubectl port-forward
# and asks it to forward :8080 back to the Mac (R:8080). The URL is definitive:
# the *.nb wildcard already resolves to traefik-internal everywhere, so no DNS
# record and no NetBird client on the Mac are needed.
# Needs NB_MAC_RELAY_AUTH (the kv/netbird mac_relay_auth value, user:password)
# and optionally NB_MAC_PORT (local port, default 3000).
[tasks."nb:mac"]
description = "Expose a local Mac port as https://mac.nb.mocha.thoughtless.eu via mac-relay (Ctrl-C to stop)"
run = '''
#!/usr/bin/env bash
set -euo pipefail
export KUBECONFIG="${KUBECONFIG:-$MISE_PROJECT_ROOT/mocha/kubeconfig}"
AUTH="${NB_MAC_RELAY_AUTH:?set NB_MAC_RELAY_AUTH to the kv/netbird mac_relay_auth value (user:password)}"
LOCAL_PORT="${NB_MAC_PORT:-3000}"
# The port-forward drops on idle and on pod restarts, hence the loop.
while true; do
  kubectl ${NB_CONTEXT:+--context "$NB_CONTEXT"} -n mac-relay port-forward deploy/mac-relay 2333:2333 &
  pf=$!
  chisel client --auth "$AUTH" --keepalive 10s 127.0.0.1:2333 "R:8080:127.0.0.1:$LOCAL_PORT" || true
  kill "$pf" 2>/dev/null || true
  wait "$pf" 2>/dev/null || true
  sleep 1
done
'''

# Provision this Mac as a NetBird peer with a reusable setup key, instead of the
# SSO desktop client: no authentik login at all, and the peer survives sleep and
# reboot. The key is the reusable NON-ephemeral key "matcha" (auto-group
# "users"), created once through the management API with the kv/netbird
# operator_api_key PAT and stored as kv/netbird mac_setup_key. Never commit the
# key itself. One-time on the Mac (sudo): mise install && mise run nb:peer
# Then delete the old SSO peer ("Matcha.local") in the NetBird dashboard.
[tasks."nb:peer"]
description = "Join this Mac to NetBird via the kv/netbird mac_setup_key setup key: LaunchDaemon + wake/no-sleep (sudo, one-time)"
run = '''
#!/usr/bin/env bash
set -euo pipefail
# Ask for the sudo password once and reuse it: this Mac does not cache sudo
# credentials across the piped subshells below, so a bare "sudo" would prompt
# for every single call.
if ! sudo -n true 2>/dev/null; then
  read -rs -p "sudo password: " SUDO_PW
  echo >&2
  # Feed the password through an askpass helper, NOT through stdin: sudo -S
  # would eat the pipes and heredocs used below ("... | sudo tee file").
  askpass="$(mktemp)"
  trap 'rm -f "$askpass"' EXIT
  esc=$(printf '%s' "$SUDO_PW" | sed -e 's/\\/\\\\/g' -e 's/"/\\"/g' -e 's/\$/\\$/g' -e 's/`/\\`/g')
  { echo '#!/bin/sh'; printf 'printf "%%s\\n" "%s"\n' "$esc"; } > "$askpass"
  chmod 700 "$askpass"
  SUDO_ASKPASS="$askpass" command sudo -A -v 2>/dev/null || { echo "sudo: wrong password" >&2; exit 1; }
  sudo() { SUDO_ASKPASS="$askpass" command sudo -A "$@"; }
fi
export KUBECONFIG="${KUBECONFIG:-$MISE_PROJECT_ROOT/mocha/kubeconfig}"
export VAULT_CONTEXT="${VAULT_CONTEXT:-mocha-corium}"
command -v netbird >/dev/null || { echo "netbird CLI not found: brew install netbirdio/tap/netbird" >&2; exit 1; }
KEY="$(mise run -q vault:kv get -field=mac_setup_key kv/netbird)"
[ -n "$KEY" ] || { echo "mac_setup_key missing in kv/netbird" >&2; exit 1; }
# The key lives in a root-only file, never in the plist or in git.
printf '%s' "$KEY" | sudo tee /etc/netbird-matcha.key >/dev/null
sudo chmod 600 /etc/netbird-matcha.key
# The loop covers both CLI behaviors: "up" blocking as the daemon, or exiting
# after handing over to the app daemon. "up" is idempotent when already up.
sudo tee /usr/local/bin/netbird-matcha-up >/dev/null <<'WRAPPER'
#!/bin/sh
while true; do
  netbird up --management-url https://netbird.mocha.thoughtless.eu --setup-key "$(cat /etc/netbird-matcha.key)" || true
  sleep 15
done
WRAPPER
sudo chmod 700 /usr/local/bin/netbird-matcha-up
sudo tee /Library/LaunchDaemons/eu.thoughtless.netbird-matcha.plist >/dev/null <<'PLIST'
<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
<plist version="1.0">
<dict>
  <key>Label</key><string>eu.thoughtless.netbird-matcha</string>
  <key>ProgramArguments</key>
  <array>
    <string>/usr/local/bin/netbird-matcha-up</string>
  </array>
  <key>RunAtLoad</key><true/>
  <key>KeepAlive</key><true/>
</dict>
</plist>
PLIST
sudo launchctl bootout system/eu.thoughtless.netbird-matcha 2>/dev/null || true
sudo launchctl bootstrap system /Library/LaunchDaemons/eu.thoughtless.netbird-matcha.plist
# A Mac Mini used as a relay must not sleep, or the peer shows as disconnected.
sudo pmset -a womp 1
sudo pmset -a sleep 0 disksleep 0
echo "peer starting, check with: sudo netbird status"
'''

[tasks."nb:teardown"]
description = "Undo the macOS NetBird setup: nb:setup + nb:peer (sudo)"
run = '''
#!/usr/bin/env bash
set -euo pipefail
# Ask for the sudo password once and reuse it: this Mac does not cache sudo
# credentials across the piped subshells below, so a bare "sudo" would prompt
# for every single call.
if ! sudo -n true 2>/dev/null; then
  read -rs -p "sudo password: " SUDO_PW
  echo >&2
  # Feed the password through an askpass helper, NOT through stdin: sudo -S
  # would eat the pipes and heredocs used below ("... | sudo tee file").
  askpass="$(mktemp)"
  trap 'rm -f "$askpass"' EXIT
  esc=$(printf '%s' "$SUDO_PW" | sed -e 's/\\/\\\\/g' -e 's/"/\\"/g' -e 's/\$/\\$/g' -e 's/`/\\`/g')
  { echo '#!/bin/sh'; printf 'printf "%%s\\n" "%s"\n' "$esc"; } > "$askpass"
  chmod 700 "$askpass"
  SUDO_ASKPASS="$askpass" command sudo -A -v 2>/dev/null || { echo "sudo: wrong password" >&2; exit 1; }
  sudo() { SUDO_ASKPASS="$askpass" command sudo -A "$@"; }
fi
sudo launchctl bootout system/eu.thoughtless.nb-mocha 2>/dev/null || true
sudo launchctl bootout system/eu.thoughtless.netbird-matcha 2>/dev/null || true
sudo pfctl -a com.apple/nb.mocha -F all 2>/dev/null || true
sudo rm -f /Library/LaunchDaemons/eu.thoughtless.nb-mocha.plist /Library/LaunchDaemons/eu.thoughtless.netbird-matcha.plist
sudo rm -f /etc/pf.anchors/nb.mocha /etc/resolver/nb.mocha.thoughtless.eu /etc/resolver/px.mocha.thoughtless.eu /usr/local/bin/netbird-matcha-up /etc/netbird-matcha.key
'''
