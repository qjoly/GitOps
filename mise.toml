[tools]
# Ships cctl, which drives the Corium nodes (mocha, doppio).
"github:Corium-OS/Corium" = "0.5.0"
# Static analysis of Argo CD manifests, see docs/octodoctor.md.
"github:OctopusDeploy/octodoctor-argocd" = "0.5.0"
# Local resolver for *.nb.mocha.thoughtless.eu, see mocha/apps/netbird-jump/README.md.
"github:coredns/coredns" = "1.15.0"

[tasks."vault:unseal"]
description = "Unseal every sealed Vault pod with the keys from the vault-unseal-keys Secret"
run = '''
#!/usr/bin/env bash
set -euo pipefail
CTX="${VAULT_CONTEXT:-$(kubectl config current-context)}"
NS="${VAULT_NAMESPACE:-$(kubectl --context "$CTX" get secret -A --field-selector metadata.name=vault-unseal-keys -o jsonpath='{.items[0].metadata.namespace}')}"
[ -n "$NS" ] || { echo "vault-unseal-keys Secret not found on $CTX" >&2; exit 1; }
vexec() { local pod=$1; shift; kubectl --context "$CTX" -n "$NS" exec "$pod" -c vault -- env VAULT_ADDR=https://127.0.0.1:8200 VAULT_SKIP_VERIFY=true "$@"; }
KEYS="$(kubectl --context "$CTX" -n "$NS" get secret vault-unseal-keys -o json | jq -r '.data | to_entries[] | select(.key | startswith("vault-unseal-")) | .value | @base64d')"
for pod in $(kubectl --context "$CTX" -n "$NS" get pods -l app.kubernetes.io/name=vault -o name); do
  echo "==> $pod on $CTX/$NS"
  # 'vault status' exits 0 only once unsealed, so feed keys until the threshold is reached.
  for key in $KEYS; do
    vexec "$pod" vault status >/dev/null 2>&1 && break
    vexec "$pod" vault operator unseal "$key" >/dev/null
  done
  vexec "$pod" vault status | grep -E '^(Sealed|Unseal Progress)' || true
done
'''

[tasks."vault:status"]
description = "Show the seal status of every Vault pod on the target cluster"
run = '''
#!/usr/bin/env bash
set -euo pipefail
CTX="${VAULT_CONTEXT:-$(kubectl config current-context)}"
NS="${VAULT_NAMESPACE:-$(kubectl --context "$CTX" get secret -A --field-selector metadata.name=vault-unseal-keys -o jsonpath='{.items[0].metadata.namespace}')}"
[ -n "$NS" ] || { echo "vault-unseal-keys Secret not found on $CTX" >&2; exit 1; }
for pod in $(kubectl --context "$CTX" -n "$NS" get pods -l app.kubernetes.io/name=vault -o name); do
  echo "==> $pod on $CTX/$NS"
  kubectl --context "$CTX" -n "$NS" exec "$pod" -c vault -- env VAULT_ADDR=https://127.0.0.1:8200 VAULT_SKIP_VERIFY=true vault status || true
done
'''

[tasks."vault:kv"]
description = "Run 'vault kv' in the Vault pod (e.g. list kv/, get kv/foo, put kv/foo k=v)"
run = '''
#!/usr/bin/env bash
set -euo pipefail
[ $# -gt 0 ] || { echo "usage: mise run vault:kv <list|get|put|patch|delete> kv/<path> [k=v ...]" >&2; exit 1; }
CTX="${VAULT_CONTEXT:-$(kubectl config current-context)}"
echo "context: $CTX" >&2
# The namespace differs between clusters, so locate it from the unseal-keys Secret.
NS="${VAULT_NAMESPACE:-$(kubectl --context "$CTX" get secret -A --field-selector metadata.name=vault-unseal-keys -o jsonpath='{.items[0].metadata.namespace}')}"
[ -n "$NS" ] || { echo "vault-unseal-keys Secret not found on $CTX" >&2; exit 1; }
TOKEN="$(kubectl --context "$CTX" -n "$NS" get secret vault-unseal-keys -o jsonpath='{.data.vault-root}' | base64 -d)"
# -i lets 'put kv/foo key=-' read the value from local stdin.
kubectl --context "$CTX" -n "$NS" exec -i vault-0 -c vault -- \
  env VAULT_ADDR=https://127.0.0.1:8200 VAULT_SKIP_VERIFY=true VAULT_TOKEN="$TOKEN" \
  vault kv "$@"
'''

[tasks."octodoctor:scan"]
description = "Run OctoDoctor on the Argo CD manifests tracked in git (optional path, e.g. mocha)"
run = '''
#!/usr/bin/env bash
set -euo pipefail
OUT="${OCTODOCTOR_OUT:-${TMPDIR:-/tmp}/octodoctor}/repo"
# OctoDoctor writes its report inside the scanned directory, so scan a copy.
rm -rf "$OUT" && mkdir -p "$OUT"
git ls-files -co --exclude-standard -z -- "${1:-.}" ':!.claude' | rsync -a --from0 --files-from=- ./ "$OUT/"
octodoctor -d "$OUT" --fail-on none --limit 200
echo "report: $OUT/octodoctor-output/index.html"
'''

[tasks."octodoctor:export"]
description = "Export Argo CD from a cluster and run OctoDoctor on it (context as arg, default current)"
run = '''
#!/usr/bin/env bash
set -euo pipefail
CTX="${1:-$(kubectl config current-context)}"
OUT="${OCTODOCTOR_OUT:-${TMPDIR:-/tmp}/octodoctor}"
# The export lands in the current directory, keep it out of the repo.
mkdir -p "$OUT" && cd "$OUT"
octodoctor -e -c "$CTX" --fail-on none --limit 200
echo "report: $(ls -td "$OUT"/argocd-manifests-export-*/ | head -1)octodoctor-output/index.html"
'''

# *.nb.mocha.thoughtless.eu on macOS without the NetBird client: /etc/resolver
# sends the zone to a local CoreDNS that answers 127.0.0.1, pf maps
# 127.0.0.1:443/80 to a port-forward of the netbird-jump SNI sidecar, which
# goes through NetBird. Only that zone is affected.
[tasks."nb:setup"]
description = "One-time macOS setup (sudo): /etc/resolver entry and pf redirect 443/80 -> 8443"
run = '''
#!/usr/bin/env bash
set -euo pipefail
sudo mkdir -p /etc/resolver
printf 'nameserver 127.0.0.1\nport 53535\n' | sudo tee /etc/resolver/nb.mocha.thoughtless.eu >/dev/null
echo 'rdr pass on lo0 inet proto tcp from any to 127.0.0.1 port { 80, 443 } -> 127.0.0.1 port 8443' \
  | sudo tee /etc/pf.anchors/nb.mocha >/dev/null
# The default pf.conf evaluates com.apple/*, so the anchor needs no pf.conf edit.
# The daemon reloads it at boot; pfctl -E keeps pf enabled alongside other users.
sudo tee /Library/LaunchDaemons/eu.thoughtless.nb-mocha.plist >/dev/null <<'PLIST'
<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
<plist version="1.0">
<dict>
  <key>Label</key><string>eu.thoughtless.nb-mocha</string>
  <key>ProgramArguments</key>
  <array>
    <string>/bin/sh</string><string>-c</string>
    <string>/sbin/pfctl -a com.apple/nb.mocha -f /etc/pf.anchors/nb.mocha &amp;&amp; /sbin/pfctl -E</string>
  </array>
  <key>RunAtLoad</key><true/>
</dict>
</plist>
PLIST
sudo launchctl bootout system/eu.thoughtless.nb-mocha 2>/dev/null || true
sudo launchctl bootstrap system /Library/LaunchDaemons/eu.thoughtless.nb-mocha.plist
sudo pfctl -a com.apple/nb.mocha -s nat 2>/dev/null
'''

[tasks."nb:tunnel"]
description = "Serve *.nb.mocha.thoughtless.eu locally through NetBird: CoreDNS + port-forward to netbird-jump (Ctrl-C to stop)"
run = '''
#!/usr/bin/env bash
set -euo pipefail
export KUBECONFIG="${KUBECONFIG:-$MISE_PROJECT_ROOT/mocha/kubeconfig}"
corefile="$(mktemp)"
cat >"$corefile" <<'COREFILE'
nb.mocha.thoughtless.eu:53535 {
    bind 127.0.0.1
    template IN A {
        answer "{% raw %}{{ .Name }}{% endraw %} 60 IN A 127.0.0.1"
    }
    template IN AAAA {
        rcode NOERROR
    }
}
COREFILE
coredns -conf "$corefile" -quiet &
dns=$!
trap 'kill "$dns" 2>/dev/null; rm -f "$corefile"' EXIT
# port-forward drops on idle and on pod restarts.
while true; do
  # 8443: SNI entry for every app; 1080: SOCKS5 for FoxyProxy.
  kubectl ${NB_CONTEXT:+--context "$NB_CONTEXT"} -n netbird-jump port-forward deploy/netbird-jump 8443:8443 1080:1080 || true
  sleep 1
done
'''

[tasks."nb:teardown"]
description = "Undo nb:setup (sudo)"
run = '''
#!/usr/bin/env bash
set -euo pipefail
sudo launchctl bootout system/eu.thoughtless.nb-mocha 2>/dev/null || true
sudo pfctl -a com.apple/nb.mocha -F all 2>/dev/null || true
sudo rm -f /Library/LaunchDaemons/eu.thoughtless.nb-mocha.plist /etc/pf.anchors/nb.mocha /etc/resolver/nb.mocha.thoughtless.eu
'''
