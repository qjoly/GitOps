name: batlehub-image
on:
  workflow_dispatch:
    inputs:
      version:
        description: batlehub release to build, without the leading v
        default: 1.9.0
        required: true
permissions:
  contents: read
  packages: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Clone batlehub
        run: git clone --depth 1 --branch "v${{ inputs.version }}" https://github.com/batlehub/batlehub batlehub

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v7
        with:
          context: batlehub
          file: mocha/apps/batlehub/image/Dockerfile
          build-args: VERSION=${{ inputs.version }}
          platforms: linux/amd64
          push: true
          tags: ghcr.io/qjoly/batlehub:${{ inputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
