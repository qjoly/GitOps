name: abcdesktop-image
on:
  workflow_dispatch:
    inputs:
      base_tag:
        description: abcdesktopio/oc.user.ubuntu.sudo.24.04 tag to derive from
        default: "4.4"
        required: true
  push:
    branches: [main]
    paths:
      - mocha/apps/abcdesktop/image/**
      - .github/workflows/abcdesktop-image.yaml
permissions:
  contents: read
  packages: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v7
        with:
          context: mocha/apps/abcdesktop/image
          # amd64 only: the base image publishes nothing else.
          platforms: linux/amd64
          push: true
          build-args: |
            BASE_TAG=${{ inputs.base_tag || '4.4' }}
          tags: ghcr.io/qjoly/oc.user.flatpak:${{ inputs.base_tag || '4.4' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
