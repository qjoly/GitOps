name: spindle-image
on:
  workflow_dispatch:
    inputs:
      ref:
        description: tangled.org/core tag to build
        default: v1.16.1-alpha
        required: true
permissions:
  contents: read
  packages: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Clone tangled.org/core
        run: git clone --depth 1 --branch "${{ inputs.ref }}" https://tangled.org/tangled.org/core core

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: core
          file: core/localinfra/spindle.Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/qjoly/spindle:${{ inputs.ref }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
