name: sandbox-image
on:
  workflow_dispatch:
    inputs:
      version:
        description: Tag to publish, normally the mise version in mocha/apps/sandboxes/image/mise.toml
        required: true
      set_latest:
        description: Also move latest to this build
        type: boolean
        default: true
permissions:
  contents: read
  packages: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v7
        with:
          context: mocha/apps/sandboxes/image
          # amd64 only: nothing on mocha runs arm64, and the gh/kubectl tarballs
          # the Dockerfile installs are amd64-shaped.
          platforms: linux/amd64
          push: true
          # latest is optional so that re-running an old version to repair it
          # does not drag latest backwards.
          tags: |
            ghcr.io/qjoly/sandbox-dev:${{ inputs.version }}
            ${{ inputs.set_latest && 'ghcr.io/qjoly/sandbox-dev:latest' || '' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # The definition of done for this workflow is a digest the tag can be
      # pinned to, so print it in the log instead of trusting "push: true".
      - name: Report digests
        run: |
          set -euo pipefail
          digest="$(docker buildx imagetools inspect \
            "ghcr.io/qjoly/sandbox-dev:${{ inputs.version }}" --format '{{json .Manifest}}' \
            | jq -r '.digest')"
          echo "### sandbox-dev:${{ inputs.version }} -> \`${digest}\`" >> "$GITHUB_STEP_SUMMARY"
          if [ "${{ inputs.set_latest }}" = "true" ]; then
            latest="$(docker buildx imagetools inspect \
              ghcr.io/qjoly/sandbox-dev:latest --format '{{json .Manifest}}' | jq -r '.digest')"
            echo "### sandbox-dev:latest -> \`${latest}\`" >> "$GITHUB_STEP_SUMMARY"
            # Both tags are built from one push, so a mismatch means a stale
            # latest tag from an interleaved run, which must be seen, not assumed.
            test "$digest" = "$latest" || {
              echo "::error::latest ($latest) does not match ${{ inputs.version }} ($digest)"
              exit 1
            }
          fi
