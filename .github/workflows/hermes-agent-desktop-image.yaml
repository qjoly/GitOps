name: hermes-agent-desktop-image
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - mocha/apps/hermes-carolyn/image/**
      - .github/workflows/hermes-agent-desktop-image.yaml
  # Built on the PR too, so the image already exists when the Deployment that
  # references it is merged and synced.
  pull_request:
    paths:
      - mocha/apps/hermes-carolyn/image/**
      - .github/workflows/hermes-agent-desktop-image.yaml
permissions:
  contents: read
  packages: write
jobs:
  build:
    # Fork PRs get a read-only token and cannot push the package.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # The image is tagged like its base, so one Renovate bump of the FROM
      # line produces the matching tag for the Deployment.
      - name: Resolve base tag
        id: base
        run: |
          tag=$(sed -n 's|^FROM docker.io/nousresearch/hermes-agent:\([^ ]*\).*|\1|p' mocha/apps/hermes-carolyn/image/Dockerfile)
          test -n "$tag"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v7
        with:
          context: mocha/apps/hermes-carolyn/image
          # amd64 only: mocha is the only consumer.
          platforms: linux/amd64
          push: true
          tags: ghcr.io/qjoly/hermes-agent-desktop:${{ steps.base.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
