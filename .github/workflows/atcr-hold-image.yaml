name: atcr-hold-image
on:
  workflow_dispatch:
    inputs:
      ref:
        description: at-container-registry ref to build
        default: main
        required: true
permissions:
  contents: read
  packages: write
jobs:
  build:
    # Native arm64: the hold links SQLite with CGO, cross-building it under QEMU
    # takes ages.
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Clone at-container-registry
        run: git clone --depth 1 --branch "${{ inputs.ref }}" https://tangled.org/evan.jarrett.net/at-container-registry atcr

      - name: Resolve commit
        id: rev
        run: echo "sha=$(git -C atcr rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v7
        with:
          context: atcr
          file: atcr/Dockerfile.hold
          platforms: linux/arm64
          push: true
          tags: |
            ghcr.io/qjoly/atcr-hold:${{ inputs.ref }}
            ghcr.io/qjoly/atcr-hold:sha-${{ steps.rev.outputs.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
