# Two engines, on purpose.
#
# zfs-localpv is the one that matters: datapool is a raidz1 of four 4 TB disks,
# so a PVC carved out of it survives a disk. hostpath stays enabled only for
# the volumes that already live on it (vault's raft store); new claims should
# go to the default class, doppio-zfs.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: openebs
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://openebs.github.io/openebs
    chart: openebs
    targetRevision: 4.6.1
    helm:
      values: |
        engines:
          local:
            lvm:
              enabled: false
            zfs:
              enabled: true
          replicated:
            mayastor:
              enabled: false
        zfs-localpv:
          zfsNode:
            # k0s puts the kubelet here, not /var/lib/kubelet; with the default
            # the node plugin mounts volumes into a directory nothing reads.
            kubeletDir: /var/lib/k0s/kubelet
        loki:
          enabled: false
        alloy:
          enabled: false
  destination:
    server: https://kubernetes.default.svc
    namespace: openebs
  syncPolicy:
    automated:
      selfHeal: true
      prune: true
    syncOptions:
      - CreateNamespace=true
    managedNamespaceMetadata:
      labels:
        pod-security.kubernetes.io/enforce: privileged
        pod-security.kubernetes.io/audit: privileged
        pod-security.kubernetes.io/warn: privileged
