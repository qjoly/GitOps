# The OIDC client for this cluster is minted by mocha's authentik provisioner
# (see mocha/system/authentik/authentik.yaml, provider `argocd-doppio`) and
# copied by hand into this cluster's Vault — doppio has its own Vault on
# purpose, so nothing bridges the two.
#
# Merge, not Create: argocd-secret belongs to the k0s Helm release. This only
# adds two keys to it.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: argocd-secret-oidc
  namespace: argocd
spec:
  refreshInterval: "1h"
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: argocd-secret
    creationPolicy: Merge
  data:
    - secretKey: dex.authentik.clientID
      remoteRef:
        key: argocd
        property: client_id
    - secretKey: dex.authentik.clientSecret
      remoteRef:
        key: argocd
        property: client_secret
