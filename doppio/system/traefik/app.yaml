# The ingress controller for doppio.
#
# Unlike mocha, there is no Cilium LB IPAM pool here: the machine has exactly
# one public address and it is already the node's own. The Service claims that
# address with `externalIPs`, which is the one mechanism that works from both
# sides — a hostPort reaches the node from the internet but not from a pod,
# because Cilium's datapath never shows pod egress to the portmap DNAT rules,
# and cert-manager's HTTP-01 self check is a pod.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: traefik
  namespace: argocd
spec:
  project: default
  syncPolicy:
    automated:
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
  destination:
    server: https://kubernetes.default.svc
    namespace: traefik
  source:
    repoURL: https://traefik.github.io/charts
    targetRevision: 41.6.1
    chart: traefik
    helm:
      values: |
        accessLog:
          enabled: true
          format: json

        # Nothing scrapes doppio yet, and the chart's default Prometheus
        # endpoint would hand prometheus-operator-crds a ServiceMonitor that
        # no operator reconciles.
        metrics:
          prometheus: null

        service:
          spec:
            type: ClusterIP
            externalIPs:
              - 51.83.141.155

        ports:
          web:
            # Everything is redirected to TLS except the ACME challenge, which
            # has to answer on :80 — including to cert-manager's own self check.
            allowACMEByPass: true
            http:
              redirections:
                entryPoint:
                  to: websecure
                  scheme: https
                  permanent: true

        # One node: a second replica would sit Pending on the hostPort.
        deployment:
          replicas: 1

        # And for the same reason the default rolling update deadlocks: the new
        # pod cannot bind 80 until the old one lets go, and the old one does not
        # let go until the new one is ready. Recreate accepts the few seconds of
        # downtime instead.
        updateStrategy:
          type: Recreate
          rollingUpdate: null
