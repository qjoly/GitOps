# The default StorageClass for doppio.
#
# Volumes are datasets under datapool/k8s, so they land on the raidz1 array and
# inherit its lz4 compression and its encryption. datapool/k8s is its own
# encryption root (key: /etc/zfs/stockage.key) because the key of the pool's own
# root dataset was lost with the TrueNAS install — a child cannot be created
# under an encryption root whose key is unavailable.
#
# The dataset itself is not created by ArgoCD; see doppio/README.md.
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: doppio-zfs
  annotations:
    storageclass.kubernetes.io/is-default-class: "true"
    # parameters are immutable, so a change here has to be a delete and a
    # create — Replace alone is a PUT and fails the same way. Bound volumes are
    # unaffected: a PV only keeps the class name.
    argocd.argoproj.io/sync-options: Replace=true,Force=true
parameters:
  poolname: datapool/k8s
  # A filesystem rather than a zvol: no fixed block size to get wrong, and the
  # volume can be grown in place.
  fstype: zfs
  # Space is charged as it is written. 10 TiB of array against claims that are
  # routinely sized for the worst case.
  thinprovision: "yes"
  # Lets two pods on the node mount the same volume — which is the only way a
  # downloader and a reader can share one library directory. The cluster has a
  # single node, so this is the whole of what ReadWriteMany would buy here.
  shared: "yes"
provisioner: zfs.csi.openebs.io
volumeBindingMode: WaitForFirstConsumer
reclaimPolicy: Delete
allowVolumeExpansion: true
---
# Kept, no longer the default, for the volumes provisioned before the array was
# usable — today that is vault's raft store. BasePath is on the root filesystem,
# which is a 10 GiB image on a storage box, so nothing new should be sent here.
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: doppio-local
  annotations:
    openebs.io/cas-type: local
    cas.openebs.io/config: |
      - name: StorageType
        value: hostpath
      - name: BasePath
        value: /var/lib/doppio/local
provisioner: openebs.io/local
volumeBindingMode: WaitForFirstConsumer
reclaimPolicy: Delete
allowVolumeExpansion: false
