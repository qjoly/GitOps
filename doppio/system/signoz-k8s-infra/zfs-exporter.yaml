---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: zfs-exporter
  namespace: signoz-k8s-infra
  labels:
    app.kubernetes.io/name: zfs-exporter
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: zfs-exporter
  template:
    metadata:
      labels:
        app.kubernetes.io/name: zfs-exporter
    spec:
      hostNetwork: true
      hostPID: true
      dnsPolicy: ClusterFirstWithHostNet
      tolerations:
        - operator: Exists
      containers:
        - name: zfs-exporter
          image: ghcr.io/pdf/zfs_exporter:v2.5.0
          args:
            - --web.listen-address=:9134
            - --collector.dataset-filesystem
            - --collector.dataset-snapshot
            - --collector.dataset-volume
          ports:
            - name: metrics
              containerPort: 9134
              protocol: TCP
          securityContext:
            privileged: true
          volumeMounts:
            - name: dev-zfs
              mountPath: /dev/zfs
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 128Mi
      volumes:
        - name: dev-zfs
          hostPath:
            path: /dev/zfs
            type: CharDevice
