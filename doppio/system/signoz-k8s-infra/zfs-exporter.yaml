---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: zfs-exporter
  namespace: signoz-k8s-infra
  labels:
    app.kubernetes.io/name: zfs-exporter
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: zfs-exporter
  template:
    metadata:
      labels:
        app.kubernetes.io/name: zfs-exporter
    spec:
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      automountServiceAccountToken: false
      tolerations:
        - operator: Exists
      containers:
        - name: zfs-exporter
          image: ghcr.io/pdf/zfs_exporter:v2.5.0
          ports:
            - name: metrics
              containerPort: 9134
              protocol: TCP
          securityContext:
            privileged: true
            readOnlyRootFilesystem: true
          readinessProbe:
            httpGet:
              path: /
              port: metrics
          volumeMounts:
            - name: host-root
              mountPath: /host
              readOnly: true
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 128Mi
      volumes:
        - name: host-root
          hostPath:
            path: /
            type: Directory
