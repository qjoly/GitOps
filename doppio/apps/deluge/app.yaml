# Deluge — the download client behind flexget.
#
# It writes into kavita-library, the same volume Kavita reads, which is why all
# three live in the `media` namespace and why doppio-zfs sets `shared: "yes"`.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: deluge
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://rubxkube.github.io/charts
    chart: deluge
    targetRevision: 1.2.1
    helm:
      values: |
        common:
          name: "deluge"
          image:
            repository: linuxserver/deluge
            tag: "2.2.0"
            pullPolicy: IfNotPresent

          deployment:
            # The config volume is RWO and holds a state file Deluge rewrites;
            # two pods overlapping during a rollout corrupt it.
            strategy:
              type: Recreate
              rollingUpdate: null

            # Deluge keeps its users in a flat file and refuses remote clients
            # by default, and neither is reachable from a Helm value. Seeding
            # both here is what lets flexget talk to the daemon at all.
            initContainers:
              - name: seed-daemon-auth
                image: busybox:1.37
                command:
                  - sh
                  - -c
                  - |
                    set -e
                    # The daemon password is generated once, here, and kept on
                    # a volume flexget also mounts. Nothing has to put it in
                    # git, and nothing has to be typed in by hand.
                    if [ ! -s /rpc/password ]; then
                      head -c16 /dev/urandom | od -An -tx1 | tr -d ' \n' \
                        > /rpc/password
                      chmod 0640 /rpc/password
                    fi
                    # On a fresh volume deluge has not written auth yet, and a
                    # file holding only our user would leave deluge-web unable
                    # to reach its own daemon.
                    if [ ! -f /config/auth ]; then
                      printf 'localclient:%s:10\n' \
                        "$(head -c16 /dev/urandom | od -An -tx1 | tr -d ' \n')" \
                        > /config/auth
                    fi
                    sed -i '/^flexget:/d' /config/auth
                    printf 'flexget:%s:10\n' "$(cat /rpc/password)" >> /config/auth
                    if [ -f /config/core.conf ]; then
                      sed -i 's/"allow_remote": false/"allow_remote": true/' /config/core.conf
                    else
                      printf '{\n  "file": 1,\n  "format": 1\n}{\n  "allow_remote": true,\n  "download_location": "/downloads"\n}\n' \
                        > /config/core.conf
                    fi
                    chown 1000:1000 /config/auth /config/core.conf /rpc/password
                volumeMounts:
                  - name: config
                    mountPath: /config
                  - name: rpc
                    mountPath: /rpc
            podSecurityContext:
              # The linuxserver image runs as 1000:1000. Without this the pod
              # cannot write into a freshly provisioned dataset, which is owned
              # by root. OnRootMismatch keeps it from walking the whole library
              # on every start.
              fsGroup: 1000
              fsGroupChangePolicy: OnRootMismatch

          variables:
            secret: {}
            nonSecret:
              PUID: "1000"
              PGID: "1000"
              TZ: Europe/Paris

          ingress:
            enabled: true
            hostName: "deluge.doppio.thoughtless.eu"
            ingressClassName: traefik
            tls:
              enabled: true
              secretName: "deluge-tls"
            annotations:
              cert-manager.io/cluster-issuer: letsencrypt

          persistence:
            enabled: true
            volumes:
              - name: "config"
                storageClassName: "doppio-zfs"
                size: "2Gi"
                pvcClaim: ""
                containerMount: "/config"
              # Not a new volume: this is Kavita's library, mounted a second
              # time so finished downloads are already where Kavita looks.
              - name: "downloads"
                pvcClaim: "kavita-library"
                containerMount: "/downloads"
              # Just the generated daemon password, shared with flexget.
              - name: "rpc"
                storageClassName: "doppio-zfs"
                size: "1Gi"
                pvcClaim: ""
                containerMount: "/rpc"

          # The chart's Service carries the web UI only. flexget speaks the
          # daemon protocol, which lives on another port.
          extraResources:
            - apiVersion: v1
              kind: Service
              metadata:
                name: deluge-daemon
                labels:
                  app: deluge
              spec:
                selector:
                  app: deluge
                ports:
                  - name: daemon
                    port: 58846
                    targetPort: 58846
                    protocol: TCP
  destination:
    server: https://kubernetes.default.svc
    namespace: media
  syncPolicy:
    automated:
      selfHeal: true
      prune: true
    syncOptions:
      - CreateNamespace=true
