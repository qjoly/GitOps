# flexget — watches an RSS feed and hands matching releases to deluge.
#
# This is the "application" part of the manga automation, and it is somebody
# else's code on purpose: flexget already does feed polling, de-duplication
# across restarts, regexp filtering and a deluge client, all driven from one
# YAML file. What lives here is the configuration, which is the only part that
# is actually ours.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: flexget
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://rubxkube.github.io/common-charts/
    chart: common
    targetRevision: v0.6.4
    helm:
      values: |
        name: "flexget"
        image:
          repository: flexget/flexget
          tag: "3.22.4"
          pullPolicy: IfNotPresent

        service:
          servicePort: 5050
          containerPort: 5050

        # The daemon takes a few seconds to bind 5050 and has no cheap health
        # endpoint; for a single-replica personal UI, probing it buys nothing.
        startupProbeEnabled: false
        readinessProbeEnabled: false
        livenessProbeEnabled: false

        ingress:
          enabled: true
          hostName: "flexget.doppio.thoughtless.eu"
          ingressClassName: traefik
          tls:
            enabled: true
            secretName: "flexget-tls"
          annotations:
            cert-manager.io/cluster-issuer: letsencrypt

        deployment:
          port: 5050
          strategy:
            type: Recreate
          # The image ships no default command: bare `flexget` looks for a
          # subcommand and exits. /config is already on its config search path.
          args: ["daemon", "start"]
          # flexget reads its config from its working directory, which also
          # holds the sqlite database it writes — so the ConfigMap cannot be
          # mounted there directly. Copy it in instead, and render the deluge
          # password next to it rather than committing it.
          initContainers:
            - name: render-config
              image: busybox:1.38
              command:
                - sh
                - -c
                - |
                  set -e
                  cp /etc/flexget-config/config.yml /config/config.yml
                  # deluge generates the daemon password on its own first
                  # start; on a cold cluster flexget can get here first.
                  until [ -s /rpc/password ]; do
                    echo "waiting for deluge to generate the daemon password"
                    sleep 5
                  done
                  printf 'deluge:\n  password: "%s"\n' "$(cat /rpc/password)" \
                    > /config/variables.yml
              volumeMounts:
                - name: config
                  mountPath: /config
                - name: rpc
                  mountPath: /rpc
                - name: flexget-conf
                  mountPath: /etc/flexget-config
            # The web UI password lives in the database, not in the config
            # file, so it can only be set by flexget itself.
            - name: set-web-password
              image: flexget/flexget:3.22.4
              command:
                - sh
                - -c
                - flexget -c /config/config.yml web passwd "$WEB_PASSWORD"
              env:
                - name: WEB_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: flexget-web
                      key: web_password
              volumeMounts:
                - name: config
                  mountPath: /config

        variables:
          secret: {}
          nonSecret:
            TZ: Europe/Paris

        configMap:
          enabled: true
          data:
            - name: "conf"
              mountPath: "/etc/flexget-config"
              data:
                - content:
                    config.yml: |
                      variables: /config/variables.yml

                      web_server:
                        bind: 0.0.0.0
                        port: 5050
                        web_ui: yes

                      templates:
                        nyaa:
                          rss:
                            # Literature → English-translated. Change the `c`
                            # parameter to follow a different category.
                            url: https://nyaa.si/?page=rss&q=dandadan&c=0_0&f=0
                          deluge:
                            host: deluge-daemon
                            port: 58846
                            username: flexget
                            password: '{? deluge.password ?}'
                            path: /downloads/manga

                      tasks:
                        dandadan:
                          rss: "https://nyaa.si/?page=rss&q=dandadan&c=0_0&f=0"
                          regexp:
                            accept:
                              - '(?i)^Dandadan \d+(\s*\(\d{4}\))?'
                          series:
                            - dandadan:
                                identified_by: sequence
                                begin: 240
                          deluge:
                            host: deluge-daemon
                            port: 58846
                            username: flexget
                            password: '{? deluge.password ?}'
                            path: /downloads/manga
                        manga:
                          template: nyaa
                          regexp:
                            accept:
                              - '(?!)'
                            reject:
                              - '(?i)\b(raw|jpn|chinese|spanish)\b'

                      schedules:
                        - tasks: [manga,dandadan]
                          interval:
                            minutes: 30

        # The password is generated once and kept in doppio's Vault; the
        # username the UI expects is `flexget`.
        extraResources:
          - apiVersion: external-secrets.io/v1
            kind: ExternalSecret
            metadata:
              name: flexget-web
            spec:
              refreshInterval: "1h"
              secretStoreRef:
                name: vault-backend
                kind: ClusterSecretStore
              target:
                name: flexget-web
              data:
                - secretKey: web_password
                  remoteRef:
                    key: flexget
                    property: web_password

        persistence:
          enabled: true
          volumes:
            - name: config
              storageClassName: "doppio-zfs"
              size: 2Gi
              pvcClaim: ""
              containerMount: "/config"
            # deluge's volume, mounted a second time: it holds the one secret
            # the two of them share.
            - name: rpc
              pvcClaim: "deluge-rpc"
              containerMount: "/rpc"
  destination:
    server: https://kubernetes.default.svc
    namespace: media
  syncPolicy:
    automated:
      selfHeal: true
      prune: true
    syncOptions:
      - CreateNamespace=true
