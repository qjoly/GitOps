---
# Stateful side of paperless: PVCs, ExternalSecrets, postgres and redis stay as
# plain manifests. The PVCs must never leave this Application's desired state,
# otherwise prune deletes them (and ceph-block/nfs-turing reclaim on Delete).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: paperless
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/qjoly/gitops.git
    targetRevision: HEAD
    path: turing/apps/paperless/manifests
  destination:
    server: https://kubernetes.default.svc
    namespace: paperless
  syncPolicy:
    automated:
      selfHeal: true
      prune: true
    syncOptions:
      - CreateNamespace=true
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: paperless-ngx
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://charts.derwitt.dev
    chart: paperless-ngx
    targetRevision: 2.1.1
    helm:
      # Resources are named "paperless-ngx", never "paperless": a Service named
      # exactly "paperless" makes the service links inject PAPERLESS_PORT=tcp://…,
      # which collides with paperless-ngx's own PAPERLESS_PORT and crashes granian
      # at boot. The chart exposes no enableServiceLinks knob.
      releaseName: paperless-ngx
      values: |
        # Pinned to the version already running so the chart migration is the only
        # change. Drop the pin (chart appVersion is 3.0.5) once it is confirmed up.
        image:
          tag: 3.0.4

        # Two paperless replicas would run two consumers against the same DB.
        deploymentStrategy:
          type: Recreate

        database:
          engine: postgresql
          host: paperless-postgres
          user: paperless
          databaseName: paperless
          passwordSecret:
            name: paperless-db-credentials
            key: password

        redis:
          connectionUrl: redis://paperless-redis:6379

        hosting:
          secretKey:
            create: false
            name: paperless-oidc
            key: PAPERLESS_SECRET_KEY

        auth:
          allowSignup: false
          sso:
            providersSecret:
              name: paperless-oidc
              key: PAPERLESS_SOCIALACCOUNT_PROVIDERS
            autoSignup: true
            autoRedirect: true

        tweaks:
          apps: allauth.socialaccount.providers.openid_connect
          timezone: Europe/Paris

        ocr:
          language: fra+eng

        # consume/ lives on NFS where inotify never fires, so poll instead.
        documentConsumption:
          pollingInterval: 30

        # The existing volumes, untouched. The chart creates no PVC of its own.
        persistence:
          data:
            enabled: true
            existingVolumeClaim: paperless-data
          media:
            enabled: true
            existingVolumeClaim: paperless-media
          consume:
            enabled: true
            existingVolumeClaim: paperless-consume

        # nfs-turing squashes root to 65534 and the CSI driver ignores fsGroup, so
        # media/consume are owned by nobody:nogroup with the group-write bit (2775).
        # Root writes through that bit; uid 1000 would not. The entrypoint's chown
        # of those files fails as a result — noisy at boot, harmless, and the raw
        # manifests behaved the same. The chart derives USERMAP_UID/GID from runAsUser.
        # fsGroup is dropped, not set to 0: any value makes kubelet walk the whole
        # 50Gi media volume to chgrp it on every pod start, which hangs the pod in
        # ContainerCreating. Running as root needs no fsGroup at all.
        podSecurityContext:
          runAsUser: 0
          runAsGroup: 0
          runAsNonRoot: false
          fsGroup: null
          seccompProfile:
            type: RuntimeDefault
        # Writable rootfs is required by the root mapping above: the entrypoint
        # usermods the bundled uid-1000 "paperless" user to 0, which needs
        # /etc/passwd writable. Read-only root only works when running as 1000.
        securityContext:
          runAsUser: 0
          runAsGroup: 0
          runAsNonRoot: false
          readOnlyRootFilesystem: false
          allowPrivilegeEscalation: false
          privileged: false
          # Not dropping ALL: the entrypoint chowns the volumes to the mapped uid,
          # which needs CAP_CHOWN/CAP_FOWNER. The raw manifests set no capabilities
          # either. Revisit together with the root mapping, not before.
          capabilities: null
          seccompProfile:
            type: RuntimeDefault

        service:
          port: 8000

        ingress:
          enabled: true
          className: traefik
          annotations:
            cert-manager.io/cluster-issuer: cloudflare
            external-dns.alpha.kubernetes.io/cloudflare-proxied: "true"
            external-dns.alpha.kubernetes.io/hostname: paperless.thoughtless.eu
            external-dns.alpha.kubernetes.io/target: "58c15097-f3b2-4ff7-a676-21bbeeea39d7.cfargotunnel.com"
          hosts:
            - host: paperless.thoughtless.eu
              paths:
                - path: /
                  pathType: Prefix
          tls:
            - secretName: paperless-tls
              hosts:
                - paperless.thoughtless.eu
  destination:
    server: https://kubernetes.default.svc
    namespace: paperless
  syncPolicy:
    automated:
      selfHeal: true
      prune: true
    syncOptions:
      - CreateNamespace=true
