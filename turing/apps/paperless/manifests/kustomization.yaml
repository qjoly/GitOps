---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: paperless
resources:
  - secret.yaml
  - oidc-secret.yaml
  - postgres.yaml
  - redis.yaml
  - data-pvc.yaml
  - media-pvc.yaml
  - consume-pvc.yaml

# The documents and the database live here. Prune=false means a manifest refactor
# that drops a PVC can no longer take the volume with it.
patches:
  - target:
      kind: PersistentVolumeClaim
    patch: |
      apiVersion: v1
      kind: PersistentVolumeClaim
      metadata:
        name: patched-by-target
        annotations:
          argocd.argoproj.io/sync-options: Prune=false
