apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: spegel
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/spegel-org/spegel
    targetRevision: v0.7.4
    path: charts/spegel
    helm:
      releaseName: spegel
      values: |
        spegel:
          containerdRegistryConfigPath: /etc/cri/conf.d/hosts
        service:
          registry:
            # Cilium (kubeProxyReplacement) refuses hostPorts inside the NodePort
            # range, so the default 30020 was silently dropped and containerd
            # never reached the mirror. 29999 sits just below the range.
            hostPort: 29999
        image:
          tag: v0.6.0
  destination:
    server: https://kubernetes.default.svc
    namespace: spegel
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
