apiVersion: cilium.io/v2alpha1
kind: CiliumL2AnnouncementPolicy
metadata:
  name: default-l2-announcement-policy
  namespace: kube-system
spec:
  externalIPs: true
  loadBalancerIPs: true
  # Without this, Cilium also announces on kubespan and siderolinktun, which are
  # point-to-point and have no MAC address: the GARP then fails to be crafted.
  interfaces:
    - ^end[0-9]+$
