kind: Cluster
name: mocha
kubernetes:
  # Realigned on what the cluster actually runs: the template had drifted behind
  # (v1.32.3 / v1.11.6), so a template sync would have downgraded the node.
  version: v1.35.6
talos:
  version: v1.13.5
features:
  diskEncryption: true
  useEmbeddedDiscoveryService: true
patches:
   - name: kubespan-enabled
     file: patches/kubespan.yml
   - name: no-cni # we will install cilium in extraManifests
     file: patches/cni.yml
   - name: disable-kubeproxy
     file: patches/disable-kubeproxy.yml
   - name: manifests
     file: patches/extraManifests.yml
   - name: metric-server
     file: patches/metrics-server.yml
   - name: workload-on-cp
     file: patches/workload-on-cp.yml
   - name: load-zfs-module
     file: patches/zfs-module.yml
     # The node hit the kubelet default of 110 pods while sitting at 45% of its
     # CPU requests and 14% of its memory, stranding eleven pods — ArgoCD among
     # them. The ceiling was the default, not the hardware.
   - name: max-pods
     file: patches/max-pods.yml
     # Needed by the Chromium/Electron sandbox: abcdesktop runs VS Code, which
     # cannot start without an unprivileged user namespace.
   - name: user-namespaces
     file: patches/user-namespaces.yml
     # Companion of the sysctl above: the default seccomp filter denies
     # clone(CLONE_NEWUSER) on its own.
   - name: seccomp-userns
     file: patches/seccomp-userns.yml
systemExtensions:
  - siderolabs/iscsi-tools
  - siderolabs/zfs
  - siderolabs/util-linux-tools
---
kind: ControlPlane
machines:
  - 00000000-0000-0000-0000-ac1f6b028950
