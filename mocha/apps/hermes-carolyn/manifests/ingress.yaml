---
# NetBird-only access, plus the webui's own password login.
# hermes-carolyn.nb.mocha.thoughtless.eu resolves for every peer via the
# NetBird zone wildcard (*.nb CNAME to traefik-internal) and the jump CoreDNS
# template, and traefik-internal serves the *.nb wildcard cert by default,
# so no tls section. external-dns only watches the traefik class, so this
# host never lands in public DNS.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: hermes-carolyn-webui
spec:
  ingressClassName: traefik-internal
  rules:
    - host: hermes-carolyn.nb.mocha.thoughtless.eu
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: hermes-carolyn-webui
                port:
                  number: 8787
