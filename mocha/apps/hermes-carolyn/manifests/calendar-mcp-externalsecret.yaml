---
# Google Calendar access for the calendar-mcp sidecar (workspace-mcp in
# single-user mode). credentials.json follows workspace-mcp's credential store
# format; the seed-calendar-creds init container copies it to
# <USER_GOOGLE_EMAIL>.json in a writable emptyDir, where the server writes back
# refreshed access tokens. The refresh token comes from a one-time consent on
# the OAuth client stored in Vault (the OAuth app must be published to
# Production, otherwise Google expires the refresh token after 7 days).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: hermes-carolyn-calendar-mcp
spec:
  refreshInterval: "1h"
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: hermes-carolyn-calendar-mcp
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        user_google_email: "{{ .google_calendar_email }}"
        google_oauth_client_id: "{{ .google_oauth_client_id }}"
        google_oauth_client_secret: "{{ .google_oauth_client_secret }}"
        credentials.json: |
          {
            "token": null,
            "refresh_token": {{ .google_calendar_refresh_token | toJson }},
            "token_uri": "https://oauth2.googleapis.com/token",
            "client_id": {{ .google_oauth_client_id | toJson }},
            "client_secret": {{ .google_oauth_client_secret | toJson }},
            "scopes": [
              "https://www.googleapis.com/auth/userinfo.email",
              "https://www.googleapis.com/auth/userinfo.profile",
              "openid",
              "https://www.googleapis.com/auth/calendar",
              "https://www.googleapis.com/auth/calendar.readonly",
              "https://www.googleapis.com/auth/calendar.events"
            ],
            "expiry": null
          }
  data:
    - secretKey: google_calendar_email
      remoteRef:
        key: hermes-carolyn
        property: google_calendar_email
    - secretKey: google_oauth_client_id
      remoteRef:
        key: hermes-carolyn
        property: google_oauth_client_id
    - secretKey: google_oauth_client_secret
      remoteRef:
        key: hermes-carolyn
        property: google_oauth_client_secret
    - secretKey: google_calendar_refresh_token
      remoteRef:
        key: hermes-carolyn
        property: google_calendar_refresh_token
