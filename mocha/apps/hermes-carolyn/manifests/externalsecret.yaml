---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: hermes-carolyn
spec:
  refreshInterval: "1h"
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: hermes-carolyn
    creationPolicy: Owner
  data:
    - secretKey: bot_token
      remoteRef:
        key: hermes-carolyn
        property: bot_token
    - secretKey: allowed_users
      remoteRef:
        key: hermes-carolyn
        property: allowed_users
    - secretKey: mistral_api_key
      remoteRef:
        key: hermes-carolyn
        property: mistral_api_key
    - secretKey: mail_password
      remoteRef:
        key: hermes-carolyn
        property: mail_password
    - secretKey: mail_password_quentinj
      remoteRef:
        key: hermes-carolyn
        property: mail_password_quentinj
    - secretKey: github_token
      remoteRef:
        key: hermes-carolyn
        property: github_token
    - secretKey: netbird_setup_key
      remoteRef:
        key: hermes-carolyn
        property: netbird_setup_key
    - secretKey: arr_ssh_key
      remoteRef:
        key: hermes-carolyn
        property: arr_ssh_key
    - secretKey: sonarr_api_key
      remoteRef:
        key: hermes-carolyn
        property: sonarr_api_key
    - secretKey: radarr_api_key
      remoteRef:
        key: hermes-carolyn
        property: radarr_api_key
    - secretKey: prowlarr_api_key
      remoteRef:
        key: hermes-carolyn
        property: prowlarr_api_key
    - secretKey: deluge_password
      remoteRef:
        key: hermes-carolyn
        property: deluge_password
    - secretKey: webui_password
      remoteRef:
        key: hermes-carolyn
        property: webui_password
