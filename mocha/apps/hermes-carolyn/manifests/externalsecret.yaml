---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: hermes-carolyn
spec:
  refreshInterval: "1h"
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: hermes-carolyn
    creationPolicy: Owner
  data:
    - secretKey: bot_token
      remoteRef:
        key: hermes-carolyn
        property: bot_token
    - secretKey: allowed_users
      remoteRef:
        key: hermes-carolyn
        property: allowed_users
    - secretKey: mistral_api_key
      remoteRef:
        key: hermes-carolyn
        property: mistral_api_key
    - secretKey: mail_password
      remoteRef:
        key: hermes-carolyn
        property: mail_password
    - secretKey: mail_password_quentinj
      remoteRef:
        key: hermes-carolyn
        property: mail_password_quentinj
    - secretKey: github_token
      remoteRef:
        key: hermes-carolyn
        property: github_token
    # unetassedecafe bot: git push to its fork and PRs, never main
    - secretKey: github_bot_token
      remoteRef:
        key: hermes-carolyn
        property: github_bot_token
    - secretKey: netbird_setup_key
      remoteRef:
        key: hermes-carolyn
        property: netbird_setup_key
    - secretKey: arr_ssh_key
      remoteRef:
        key: hermes-carolyn
        property: arr_ssh_key
    - secretKey: sonarr_api_key
      remoteRef:
        key: hermes-carolyn
        property: sonarr_api_key
    - secretKey: radarr_api_key
      remoteRef:
        key: hermes-carolyn
        property: radarr_api_key
    - secretKey: prowlarr_api_key
      remoteRef:
        key: hermes-carolyn
        property: prowlarr_api_key
    - secretKey: deluge_password
      remoteRef:
        key: hermes-carolyn
        property: deluge_password
    - secretKey: webui_password
      remoteRef:
        key: hermes-carolyn
        property: webui_password
    # Gateway webapp listener: password for the `basic` dashboard provider and
    # the HMAC secret that keeps its sessions alive across restarts.
    - secretKey: dashboard_password
      remoteRef:
        key: hermes-carolyn
        property: dashboard_password
    - secretKey: dashboard_secret
      remoteRef:
        key: hermes-carolyn
        property: dashboard_secret
    - secretKey: hass_token
      remoteRef:
        key: hermes-carolyn
        property: hass_token
    - secretKey: grafana_token
      remoteRef:
        key: hermes-carolyn
        property: grafana_token
    # The one key both sides read. Hatchdoor (mocha/apps/hatchdoor) points its
    # MCP token at this same path, because a Secret cannot cross namespaces:
    # one key, two readers, nothing to keep in sync.
    - secretKey: hatchdoor_mcp_token
      remoteRef:
        key: hermes-carolyn
        property: hatchdoor_mcp_token
    # Read by the sync-cron initContainer to resolve the ${VAR} references in the
    # committed cron spec. They live here, not in git, for the same reason the
    # mail addresses above do: the spec is a file in a public repo.
    - secretKey: cron_channel_news
      remoteRef:
        key: hermes-carolyn
        property: cron_channel_news
    - secretKey: cron_channel_briefing
      remoteRef:
        key: hermes-carolyn
        property: cron_channel_briefing
    # YouTube upload for the highlights pipeline (unlisted clips). Deliberately
    # not `google_oauth_client_id`: the calendar-mcp sidecar owns that one and
    # overwriting it breaks calendar access.
    - secretKey: youtube_client_id
      remoteRef:
        key: hermes-carolyn
        property: google_youtube_client_id
    - secretKey: youtube_client_secret
      remoteRef:
        key: hermes-carolyn
        property: google_youtube_client_secret
    - secretKey: youtube_refresh_token
      remoteRef:
        key: hermes-carolyn
        property: google_youtube_refresh_token
