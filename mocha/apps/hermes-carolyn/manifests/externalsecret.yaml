---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: hermes-carolyn
spec:
  refreshInterval: "1h"
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: hermes-carolyn
    creationPolicy: Owner
  data:
    - secretKey: bot_token
      remoteRef:
        key: hermes-carolyn
        property: bot_token
    - secretKey: allowed_users
      remoteRef:
        key: hermes-carolyn
        property: allowed_users
    - secretKey: mistral_api_key
      remoteRef:
        key: hermes-carolyn
        property: mistral_api_key
    - secretKey: mail_password
      remoteRef:
        key: hermes-carolyn
        property: mail_password
    - secretKey: github_token
      remoteRef:
        key: hermes-carolyn
        property: github_token
