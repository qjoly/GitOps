---
apiVersion: v1
kind: ConfigMap
metadata:
  name: hermes-carolyn-sbx
data:
  kubeconfig: |
    apiVersion: v1
    kind: Config
    clusters:
      - name: in-cluster
        cluster:
          server: https://kubernetes.default.svc
          certificate-authority: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
    contexts:
      - name: mocha
        context:
          cluster: in-cluster
          user: sa
    current-context: mocha
    users:
      - name: sa
        user:
          tokenFile: /var/run/secrets/kubernetes.io/serviceaccount/token
  sbx: |
    #!/usr/bin/env bash
    # Disposable gVisor sandboxes on mocha. The local checkout stays the source of truth:
    # code is copied in, changes come back as a git patch. `sbx up` seeds the unetassedecafe
    # bot token into /root/.git-credentials (file-only), so git/gh inside the sandbox act as
    # the bot too.
    set -euo pipefail
    
    here=$(cd "$(dirname "$(readlink -f "$0")")" && pwd)
    k() { kubectl --kubeconfig "${SBX_KUBECONFIG:-$here/../../kubeconfig}" --context "${SBX_CONTEXT:-mocha}" -n "${SBX_NAMESPACE:-sandboxes}" "$@"; }
    pod() { k get sandboxclaim "$1" -o jsonpath='{.status.sandbox.name}'; }
    
    usage() {
      cat >&2 <<'EOF'
    usage: sbx <command>
      up [name]             claim a sandbox, print its name (expires after $SBX_TTL seconds, default 4h)
      push <name> [dir]     replace /work with the git checkout at dir (tracked + untracked, minus ignored)
      exec <name> -- cmd…   run cmd in /work
      diff <name>           print changes made in /work since the push; apply with: sbx diff x | git apply
      down <name>           delete the sandbox
      ls                    list sandboxes
    Build artifacts are gitignored and stay out of diff: fetch them with kubectl cp.
    EOF
      exit 2
    }
    
    cmd=${1:-}; shift || true
    case $cmd in
      up)
        exp=$(( $(date +%s) + ${SBX_TTL:-14400} ))
        exp=$(date -u -d "@$exp" +%FT%TZ 2>/dev/null || date -u -r "$exp" +%FT%TZ)
        meta="generateName: sbx-"; [[ -n ${1:-} ]] && meta="name: $1"
        name=$(k create -o jsonpath='{.metadata.name}' -f - <<EOF
    apiVersion: extensions.agents.x-k8s.io/v1beta1
    kind: SandboxClaim
    metadata:
      $meta
    spec:
      warmPoolRef: { name: dev }
      lifecycle: { shutdownPolicy: Delete, shutdownTime: "$exp" }
    EOF
    )
        k wait "sandboxclaim/$name" --for=condition=Ready --timeout=5m >/dev/null
        # Seed the bot token as /root/.git-credentials (mode 0600, never in the sandbox
        # env): git/gh run inside the sandbox act as unetassedecafe. The token travels on
        # the exec stdin, never in argv, so it lands in no process list or log. /root is
        # not under /work, so `sbx push` never copies it back.
        tok=${GH_TOKEN:-}
        if [[ -z $tok ]]; then
          for p in /proc/[0-9]*/environ; do
            v=$(tr '\0' '\n' < "$p" 2>/dev/null | sed -n 's/^GH_TOKEN=//p' | head -1)
            [[ -n $v ]] && { tok=$v; break; }
          done
        fi
        if [[ -n $tok ]]; then
          printf '%s' "$tok" | k exec -i "$(pod "$name")" -- bash -ec '
            umask 077
            t=$(cat)
            printf "https://unetassedecafe:%s@github.com\n" "$t" > /root/.git-credentials
            chmod 600 /root/.git-credentials
            git config --global credential.helper "store --file=/root/.git-credentials"'
        else
          echo "sbx: warning: GH_TOKEN not found in the pod, sandbox left without git credentials" >&2
        fi
        echo "$name"
        ;;
      push)
        [[ $# -ge 1 ]] || usage
        cd "${2:-.}"
        # ls-files still lists tracked files deleted from the working tree, tar would choke on them.
        { git ls-files -z -co --exclude-standard; printf '.git\0'; } |
          while IFS= read -r -d '' f; do [[ -e $f || -L $f ]] && printf '%s\0' "$f"; done |
          COPYFILE_DISABLE=1 tar --null -T - -czf - |
          k exec -i "$(pod "$1")" -- bash -ec '
            find /work -mindepth 1 -delete
            tar xzf - -C /work --no-same-owner --warning=no-unknown-keyword
            cd /work
            # Snapshot what was pushed, local uncommitted edits included, so diff only shows sandbox work.
            git add -A
            git -c user.name=sbx -c user.email=sbx@localhost commit -qm "sbx base" --allow-empty --no-verify
            git tag -f sbx-base >/dev/null'
        ;;
      exec)
        [[ $# -ge 1 ]] || usage
        name=$1; shift; [[ ${1:-} == -- ]] && shift
        [[ $# -ge 1 ]] || usage
        k exec -i "$(pod "$name")" -- "$@"
        ;;
      diff)
        [[ $# -eq 1 ]] || usage
        k exec "$(pod "$1")" -- bash -ec 'cd /work && git add -A && git diff --cached --binary sbx-base'
        ;;
      down)
        [[ $# -eq 1 ]] || usage
        k delete sandboxclaim "$1" --wait=false
        ;;
      ls) k get sandboxclaims ;;
      *) usage ;;
    esac
  SKILL.md: |
    ---
    name: sbx
    description: Use when a build, test suite, script or web research should run outside this machine - untrusted code, heavy builds, toolchains not installed locally, or several tasks to run in parallel. Drives disposable gVisor sandboxes on the mocha cluster with the `sbx` CLI; code is pushed from the local checkout and changes come back as a git patch.
    ---
    
    # Sandboxes on mocha (`sbx`)
    
    The local checkout stays the source of truth. A sandbox gets a copy, works on it, and hands back a patch.
    
    `sbx up` seeds the unetassedecafe bot token into the sandbox as `/root/.git-credentials` (mode 0600, file-only — never in the sandbox env, never under `/work`), so `git` and `gh` run inside the sandbox act as the bot, same as in the pod. Confirm the identity once per sandbox with `sbx exec "$n" -- gh api user`.
    
    Never pass any other token, kubeconfig or secret into a sandbox: pass data on `exec` stdin instead — never argv (visible in process lists), never a file in `/work` (`.git` is copied in by `sbx push`, `/work` comes back with `sbx diff`).
    
    ## Flow
    
    ```bash
    n=$(sbx up)                       # prints the sandbox name
    sbx push "$n" .                   # replaces /work with the checkout (gitignored files stay local)
    sbx exec "$n" -- bash -c 'mise install && make test'
    sbx diff "$n" > /tmp/$n.patch     # everything changed in /work since the push
    git apply /tmp/$n.patch
    sbx down "$n"
    ```
    
    - Always `sbx down` when done, even after a failure. Forgotten sandboxes die after 4 h (`SBX_TTL=<seconds> sbx up` to change it).
    - `exec` runs argv as-is in `/work`: wrap pipes, `&&` and globs in `bash -c '…'`. Stdin is forwarded, so `sbx exec "$n" -- bash -c 'cat > x' < x` works.
    - Run long builds in the background instead of blocking on them.
    - Read the patch before applying it: it is the only thing that crosses back.
    
    ## Publishing the result

    git and `gh` act as the `unetassedecafe` bot — in the pod via `GH_TOKEN` + `GIT_CONFIG_*`, in the
    sandbox via the `/root/.git-credentials` that `sbx up` seeds. The bot has `pull` on the upstream
    repos and push only on its own fork, so an upstream push returns
    `403 Permission ... denied to unetassedecafe`. That 403 is success at stopping a direct
    commit: never try to work around it.

    Two traps, both verified the hard way:

    - **The sandbox token is file-only on purpose.** `sbx up` writes `/root/.git-credentials` from the
      pod's `GH_TOKEN` over the exec stdin; it never appears in the sandbox env, in argv, or under
      `/work`. Do not copy it anywhere else (no remote URL, no `.git/config`, no file in `/work`):
      `sbx push` copies `.git` into the sandbox and `sbx diff` brings `/work` back.
    - **`gh` is not in the sandbox image.** Install it once per sandbox:
      ```sh
      curl -fsSL https://github.com/cli/cli/releases/download/v2.63.2/gh_2.63.2_linux_amd64.tar.gz \
        | tar xzf - -C /tmp && install -m755 /tmp/gh_2.63.2_linux_amd64/bin/gh /usr/local/bin/gh
      ```

    The branch must descend from `main` or `gh pr create` fails with "no history in common". Clone inside
    the sandbox and copy files in; a `git init` there produces an orphan commit:

    ```bash
    git clone -q --depth 1 https://github.com/qjoly/<repo>.git /tmp/branch
    cd /tmp/branch && git checkout -q -B <branch> origin/main
    cp /work/<changed files> .            # the files edited in the sandbox
    git add -A && git commit -m "<English message>"
    git push https://github.com/unetassedecafe/<repo>.git HEAD:<branch>
    gh pr create --repo qjoly/<repo> --head unetassedecafe:<branch> --base main --fill
    ```

    Verify the PR before claiming it exists: `gh pr view` for author, `head`, `base` and the file list,
    and confirm it is open, not draft. A URL on stdout is not proof.

    Never write the token into a remote URL that persists, a `.git/config`, or a file left in `/work`:
    `sbx push` copies `.git` into the sandbox.

    ## Parallel work
    
    One sandbox per task, each `up` is independent. To keep patches from colliding, give each task its own local `git worktree` and branch, push from it, and apply its patch there.
    
    ## Inside the sandbox
    
    - Debian trixie with build-essential, git, curl, python3, running as root: `apt-get install` works.
    - `mise install` reads the repo's `mise.toml`; `mise use -g node@22` for anything else.
    - Internet is open, the cluster network is not reachable. Research is just `curl` from `exec`.
    - Up to 4 CPU, 8 GiB RAM, 30 GiB disk. Write only under `/work`, `/root` or `/tmp`: the rest of the filesystem lives in RAM.
    
    ## Build artifacts
    
    They are usually gitignored, so `diff` leaves them out. Stream them back with tar:
    
    ```bash
    sbx exec "$n" -- tar czf - -C /work dist | tar xzf -
    ```
    
    ## When something fails
    
    - `sbx up` hangs or errors: `sbx ls`, then check the mocha OIDC login (`kubectl --kubeconfig ~/code/perso/GitOps/mocha/kubeconfig --context mocha get ns` may need a browser).
    - `git apply` refuses the patch: the local checkout moved since the push. Try `git apply --3way`, or push again and redo the work.
