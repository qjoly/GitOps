---
apiVersion: v1
kind: ConfigMap
metadata:
  name: hermes-carolyn-cron
data:
  # Declarative cron fleet. cron-sync.py reconciles cron/jobs.json against
  # this spec on every pod start: jobs are matched by NAME (Hermes mints a
  # random id), so an existing job keeps its id, its output history and its
  # execution rows. Jobs created at runtime are kept, not pruned.
  #
  # This file is committed, so it holds no mail address, no Discord id and no
  # chat name. Those are written as ${VAR} and resolved at apply time from the
  # Secret-backed env vars the pod already has; an unresolved reference aborts
  # the reconcile instead of writing a placeholder.
  #
  # One-shots are deliberately absent: they are transient reminders, not
  # configuration.
