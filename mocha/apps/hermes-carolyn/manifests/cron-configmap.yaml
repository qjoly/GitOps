        {
          "name": "Achats catchall → agenda",
          "prompt": "Tâche récurrente : surveiller la boîte ${MAIL_ADDRESS_CATCHALL} (compte email MCP « catchall ») et ajouter les NOUVEAUX achats/colis dans Google Calendar (compte ${GOOGLE_CALENDAR_EMAIL}, agenda primaire « ${GOOGLE_CALENDAR_EMAIL} », fuseau Europe/Paris).\n\n1. Lecture, sur TOUS les dossiers qui peuvent contenir des achats — pas seulement INBOX. Lister d'abord les dossiers (list_mailboxes) puis interroger au minimum : INBOX, SocialNetworks, Promotions, Quittances. Dans chacun, liste les 30 derniers mails et recherche par mots-clés (« commande », « colis », « expédition », « livraison », « suivi », « shipped », « order », « vinted », « leboncoin »), en ne retenant que les résultats des 45 derniers jours. Ignorer Github, Paperless, Spam, Trash (volumineux et hors sujet).\n   Important : les notifications Vinted et leboncoin arrivent souvent dans le dossier SocialNetworks, pas en INBOX — ne jamais les chercher uniquement en INBOX.\n\n2. Ce qui compte comme achat : confirmation/récapitulatif de commande, mail d'expédition, mail de suivi transporteur, avis de passage, colis prêt en point relais, mise à jour « commande en cours d'acheminement » avec date de livraison. Ignore les publicités, newsletters, codes promo, relances d'avis type « how did it go? ».\n\n3. Anti-doublon, étape OBLIGATOIRE avant toute création : interroge Google Calendar sur les 90 derniers jours et les 90 prochains avec, pour chaque candidat, une recherche par mot-clé (nom de boutique + nom d'article). Crée l'événement UNIQUEMENT s'il n'en existe pas déjà un pour ce mail/colis. Ne modifie ni ne duplique jamais un événement existant. Si un événement du même achat existe mais que son statut a changé (ex. colis expédié alors que seul le mail de commande était enregistré), tu peux au plus le mettre à jour via action=update — jamais en créer un second.\n\n4. Événements à créer :\n   - Achat : événement daté du jour et de l'heure du mail de commande (convertir en Europe/Paris), durée 6 min, titre « 🛒 Commande <boutique> — <article> (<prix>) », visibilité private, transparency transparent. Description : numéro de commande, article, prix, adresse de livraison, transporteur.\n   - Livraison/retrait : événement en journée entière à la date de livraison annoncée dans le mail (prendre la fin de la fourchette si le mail en donne une, ex. « 25 nov. - 26 nov. » → 26 nov.). Si le mail ne donne qu'un délai (« 3 à 5 jours ouvrés »), caler sur la date d'expédition + 5 jours ouvrés. Titre « 📦 <Retrait colis|Livraison> — <article> », rappel popup 1440 min avant, transparency transparent, visibility private. Description : transporteur, numéro de suivi et lien de suivi cliquable s'il existe, adresse du point relais ou de livraison.\n\n5. Ne fais jamais d'action destructive : pas de suppression, pas de déplacement d'événements existants. Si un doute subsiste sur un doublon, ne crée rien et signale-le.\n\n6. Après chaque création, relis l'événement depuis l'API (get_events) pour confirmer qu'il existe bien.\n\nRéponse finale (elle est livrée à l'utilisateur) : un résumé très court et actionnable en français, une ligne par nouvel événement avec sa date et son lien Google Calendar. S'il n'y a rien de neuf, réponds uniquement « Aucun nouvel achat à ajouter. » — pas de pavé, pas de récapitulatif des mails parcourus. N'invente jamais de justification sur les habitudes de l'utilisateur : si tu hésites, dis simplement ce que tu hésites à faire.",
