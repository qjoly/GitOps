  # Reconciles the spec above against cron/jobs.json. Identity is the job
  # name; the scheduler-owned state fields (last_run_at, next_run_at,
  # failure_streak, repeat.completed, fire_claim, paused_at, ...) are
  # never written, so a restart cannot reset a job's run history.
  cron-sync.py: |
    #!/usr/bin/env python3
    """Reconcile cron/jobs.json against the spec shipped in the GitOps ConfigMap.

    The seed rewrites config.yaml on every start but nothing touches cron state, so
    the jobs file lives only on the PVC and is lost with the volume. This script is
    the durable copy: it runs from an initContainer, compares the spec against what
    is on disk, and creates, updates or removes jobs to match.

    Identity is the job NAME, because Hermes mints a random id at creation. The id
    of an existing job is preserved so its output history and execution rows stay
    attached. A job present on disk but absent from the spec is removed only when
    --prune is passed; the default leaves it alone, so a job created at runtime is
    never destroyed by a restart.

    State fields (last_run_at, failure_streak, next_run_at, repeat.completed,
    last_dispatch, fire_claim, paused_at, ...) belong to the scheduler and are
    never written here.
    """

    from __future__ import annotations

    import argparse
    import json
    import os
    import re
    import sys
    from pathlib import Path

    # Fields the spec owns: everything a human decides about a job.
    MANAGED = (
        "name", "prompt", "schedule", "timezone", "deliver", "origin", "enabled",
        "enabled_toolsets", "skills", "script", "no_agent", "model", "provider",
        "workdir", "wrap_response", "catch_up", "monitor_script", "monitor_url",
        "context_from", "interpreter", "grace_minutes", "reasoning_effort",
        "failure_deliver", "paused", "attach_to_session",
    )
    # Never copied from the spec onto an existing job: the scheduler owns these.
    RUNTIME_ONLY = frozenset({
        "id", "created_at", "last_run_at", "last_status", "last_error", "last_failure",
        "last_dispatch", "failure_streak", "next_run_at", "state", "fire_claim",
        "paused_at", "paused_reason", "canonical_completions", "repeat",
        "last_delivery_error", "last_delivery_unverified", "monitor_state",
        "preflight_alerted", "schedule_display",
    })


    def spec_schedule(value) -> str:
        """The value to hand to create_job/update_job when applying the spec."""
        if isinstance(value, dict):
            return value.get("expr") or value.get("display") or ""
        return str(value or "").strip()


    # The spec is committed to git, so it carries no mail address, no Discord id and
    # no chat name. Values that identify the user are written as ${VAR} and resolved
    # from the environment the pod already has (Secret-backed env vars); a reference
    # that does not resolve is a hard error, never an empty string silently applied.
    _REF = re.compile(r"\$\{([A-Z_][A-Z0-9_]*)\}")


    def expand(value, *, where: str):
        """Resolve every ${VAR} in a string from os.environ; raise on a missing one."""
        if not isinstance(value, str):
            return value

        def sub(m):
            name = m.group(1)
            got = os.environ.get(name, "")
            if not got:
                raise SystemExit(
                    "cron-sync: %s references ${%s} but it is not set in the "
                    "environment; refusing to write a job with a placeholder" % (where, name))
            return got

        return _REF.sub(sub, value)


    def norm_schedule(value):
        """Canonical cron/interval expression, whichever shape we are handed.

        The spec keeps the human form ("every monday 18:00") because that is what a
        reviewer reads in git; the store keeps the parsed dict. Both go through
        parse_schedule so the comparison is on the meaning, not the spelling.
        """
        if isinstance(value, dict) and value.get("expr"):
            return "cron:" + value["expr"]
        raw = str(value or "").strip()
        if not raw:
            return ""
        try:
            from cron.jobs import parse_schedule

            parsed = parse_schedule(raw)
            if parsed.get("kind") == "cron":
                return "cron:" + parsed["expr"]
            if parsed.get("kind") == "interval":
                return f"interval:{parsed['minutes']}"
            return f"{parsed.get('kind')}:{parsed.get('run_at') or raw}"
        except Exception:
            return raw


    def sync_profile(home: Path, jobs_spec: list[dict], *, prune: bool, dry_run: bool) -> dict:
        """Create/update/remove jobs for one profile's cron store."""
        from cron.jobs import create_job, load_jobs, remove_job, update_job, use_cron_store

        created = updated = removed = unchanged = 0
        with use_cron_store(home):
            existing = {j.get("name"): j for j in load_jobs()}

            for want in jobs_spec:
                name = want.get("name")
                if not name:
                    continue
                fields = {k: v for k, v in want.items() if k in MANAGED and k not in RUNTIME_ONLY}
                for ref_key in ("deliver", "failure_deliver", "prompt"):
                    if ref_key in fields:
                        fields[ref_key] = expand(fields[ref_key], where=f"{name}.{ref_key}")

                cur = existing.get(name)
                if cur is None:
                    print(f"cron-sync[{home.name}]: + create {name!r}")
                    if not dry_run:
                        create_job(
                            prompt=fields.get("prompt"),
                            schedule=spec_schedule(fields.get("schedule")),
                            name=name, deliver=fields.get("deliver"),
                            origin=fields.get("origin") or None, skills=fields.get("skills"),
                            model=fields.get("model"), provider=fields.get("provider"),
                            script=fields.get("script"),
                            enabled_toolsets=fields.get("enabled_toolsets"),
                            workdir=fields.get("workdir"),
                            no_agent=bool(fields.get("no_agent")),
                            attach_to_session=fields.get("attach_to_session"),
                            monitor_script=fields.get("monitor_script"),
                            monitor_url=fields.get("monitor_url"),
                            reasoning_effort=fields.get("reasoning_effort"),
                            failure_deliver=fields.get("failure_deliver"),
                            catch_up=fields.get("catch_up"),
                            timezone=fields.get("timezone"),
                            grace_minutes=fields.get("grace_minutes"),
                            wrap_response=fields.get("wrap_response"),
                            paused=bool(fields.get("paused", False)),
                        )
                    created += 1
                    continue

                drift = {}
                for key, want_val in fields.items():
                    have_val = cur.get(key)
                    if key == "schedule":
                        if norm_schedule(want_val) != norm_schedule(have_val):
                            # Send the spec's own spelling, not the comparison form.
                            drift[key] = spec_schedule(want_val)
                    elif isinstance(want_val, list) and isinstance(have_val, list):
                        if set(map(str, want_val)) != set(map(str, have_val)):
                            drift[key] = want_val
                    elif want_val != have_val:
                        drift[key] = want_val
                if drift:
                    print(f"cron-sync[{home.name}]: ~ update {name!r}: {sorted(drift)}")
                    if not dry_run:
                        update_job(cur["id"], drift)
                    updated += 1
                else:
                    unchanged += 1

            wanted = {w.get("name") for w in jobs_spec}
            for name, job in existing.items():
                if name in wanted:
                    continue
                if prune:
                    print(f"cron-sync[{home.name}]: - remove {name!r} (not in spec)")
                    if not dry_run:
                        remove_job(job["id"])
                    removed += 1
                else:
                    print(f"cron-sync[{home.name}]: keeping {name!r} (not in spec, --prune not given)")

        return {"created": created, "updated": updated, "removed": removed, "unchanged": unchanged}


    def main() -> int:
        ap = argparse.ArgumentParser(description="Reconcile cron jobs with the shipped spec.")
        ap.add_argument("--spec", required=True, help="path to spec.json")
        ap.add_argument("--home", default="/opt/data", help="HERMES_HOME of the install")
        ap.add_argument("--agent-root", default=None,
                        help="the hermes-agent tree to import (default: <home>/hermes-agent)")
        ap.add_argument("--prune", action="store_true",
                        help="delete jobs on disk that the spec does not list")
        ap.add_argument("--dry-run", action="store_true")
        args = ap.parse_args()

        agent_root = Path(args.agent_root) if args.agent_root else Path(args.home) / "hermes-agent"
        if not (agent_root / "cron" / "jobs.py").is_file():
            print(f"cron-sync: no hermes-agent tree at {agent_root}; leaving jobs untouched")
            return 0
        sys.path.insert(0, str(agent_root))

        spec_path = Path(args.spec)
        if not spec_path.is_file():
            print(f"cron-sync: no spec at {spec_path}; leaving jobs untouched")
            return 0

        spec = json.loads(spec_path.read_text()).get("jobs") or []
        home = Path(args.home)
        totals = {"created": 0, "updated": 0, "removed": 0, "unchanged": 0}

        # Jobs are grouped by _profile: null -> the install's own store,
        # "veille" -> profiles/veille/cron.
        by_profile: dict[str, list] = {}
        for job in spec:
            prof = job.get("_profile") or ""
            by_profile.setdefault(prof, []).append(job)

        for prof, jobs in by_profile.items():
            target = home / "profiles" / prof if prof else home
            if not (target / "cron").is_dir() and not args.dry_run:
                print(f"cron-sync: profile {prof!r} has no cron dir at {target}; skipping")
                continue
            try:
                counts = sync_profile(target, jobs, prune=args.prune, dry_run=args.dry_run)
            except Exception as exc:  # one profile's bad store must not block the others
                print(f"cron-sync[{prof or 'default'}]: FAILED: {type(exc).__name__}: {exc}")
                continue
            for k, v in counts.items():
                totals[k] += v

        print("cron-sync: {created} created, {updated} updated, {removed} removed, "
              "{unchanged} unchanged".format(**totals))
        return 0


    if __name__ == "__main__":
        raise SystemExit(main())
