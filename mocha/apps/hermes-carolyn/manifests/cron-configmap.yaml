    {
      "jobs": [
        {
          "name": "News Open Source hebdo - Discord",
          "prompt": "Tu prépares la rubrique news Open Source / Tech de l'émission du lundi soir. Deux livrables dans la même réponse : le message Discord (court) puis le diaporama du live.\n\nPÉRIMÈTRE, par ordre de priorité :\n1. DRAMA & LICENSING : changements de licence, forks, projets qui s'arrêtent, CLA, rug-pulls, controverse, gouvernance de fondation.\n2. CLOUD / INFRA / KUBERNETES : CNCF, releases majeures (Postgres, nginx, distros, runtimes), décisions cloud (AWS/Azure/GCP/OVH), sécurité critique d'infra.\n3. OPEN SOURCE + IA : modèles à poids ouverts vs fermés, politiques IA des projets, mainteneurs face aux patchs IA.\n4. Le reste seulement si vraiment marquant.\n\nSOURCES À EXTRAIRE (pas de simples snippets) : approachableopensource.com/news/ (éditions de la semaine), linuxiac.com + son weekly wrap-up, lwn.net, theregister.com, opensource.googleblog.com, news.ycombinator.com, huggingface.co/models?sort=trending. Si une page bloque, change de source. N'invente jamais un fait ni une URL.\n\nChoisis 4 à 5 sujets, chacun daté de la semaine écoulée.\n\n=== LIVRABLE 1 : LE MESSAGE DISCORD ===\nContrainte dure : MOINS DE 1900 CARACTÈRES au total. Compte avant de rendre.\n- ligne 1 : **📰 News Open Source — semaine du <JJ/MM>**\n- 3 à 5 blocs de 3 lignes : titre en gras avec emoji ; UNE phrase (fait + pourquoi c'est intéressant) ; le lien markdown seul sur sa ligne.\n- ligne finale : **En 3 mots :** + 3 à 5 mots.\nInterdits : tableau, titre #, préambule, politesse, conclusion récapitulative. Ton direct de chronique radio, français.\n\n=== LIVRABLE 2 : LE DIAPORAMA ===\nÉtape A. Écris /opt/data/cache/scratch/news-stories.json au format exact :\n{\"semaine\":\"16/11\",\"stories\":[{\"kicker\":\"licensing\",\"titre\":\"...\",\"puce1\":\"...\",\"puce2\":\"...\",\"url\":\"https://...\",\"source\":\"redict.io\",\"repo\":\"https://github.com/...\",\"meme\":{\"id\":\"drake\",\"text\":[\"haut\",\"bas\"],\"legende\":\"...\"},\"image\":{\"url\":\"https://...\",\"legende\":\"...\"}}],\"en_3_mots\":[\"Redict\"]}\n- kicker : 1-2 mots minuscules (licensing, infrastructure, cloud, base de données, open source + IA).\n- titre : max 90 caractères, sans point final.\n- puce1/puce2 : une phrase chacun, max 160 caractères, avec chiffres/dates.\n- url : le lien source exact consulté. Ne l'invente jamais.\n- repo : SEULEMENT si un dépôt GitHub/GitLab précis est au cœur du sujet, et seulement si tu as vérifié qu'il existe en visitant la page. Sinon omets le champ.\n- MÉDIA : chaque sujet reçoit soit un meme, soit une image, soit aucun des deux (le build tombe proprement en pleine largeur sans média, ce n'est pas une erreur).\n  • meme : assert de la blague, 2 lignes de 1 à 4 mots MAXIMUM chacune, en français, format ids autorisés : drake, fine, doge, stonks, kombucha, both, money, db, facepalm, sk, afraid, panik, tp, iwd. Ajoute une legende d'une phrase. Utilise-le pour les sujets à fort potentiel comique (licence qui se referme, projet qui meurt, décision absurde).\n  • image : l'URL directe d'une image pertinente si tu en as une fiable (illustration officielle, capture, schéma publié). Ne mets JAMAIS d'URL inventée ni un moteur de recherche : si tu n'as pas de vraie URL d'image, mets un meme ou rien.\n- 4 ou 5 stories maximum.\n\nÉtape B. Génère le deck :\npython3 /opt/data/scripts/build-news-deck.py /opt/data/cache/scratch/news-stories.json /opt/data/artifacts/news-open-source/news-open-source-<AAAA-MM-JJ du lundi>.html\nLes images sont téléchargées et inlinées en base64 : le .html reste un fichier unique, ouvrable hors ligne, liens cliquables. Un média qui échoue est ignoré avec un avertissement, ce n'est pas bloquant. S'il y a une erreur de script, corrige le JSON et relance.\n\nÉtape C. Vérifie avec ls -la que le fichier existe et dépasse 8000 octets.\n\n=== RÉPONSE FINALE ===\nDans cet ordre, sans rien d'autre :\n1. le texte du message Discord (commence par **📰 News Open Source — semaine du ...),\n2. une ligne vide,\n3. la ligne MEDIA:/opt/data/artifacts/news-open-source/news-open-source-<date>.html seule (c'est ce qui attache le fichier au message Discord).\nPas d'explication, pas de « j'ai généré », pas de résumé du process.",
          "schedule": "every monday 18:00",
          "timezone": "Europe/Paris",
          "deliver": "discord:${CRON_CHANNEL_NEWS}",
          "enabled_toolsets": [
