---
# email-mcp only supports several accounts through its TOML file: the
# MCP_EMAIL_* env vars build a single account and skip this file entirely.
apiVersion: v1
kind: ConfigMap
metadata:
  name: hermes-carolyn-email-mcp
data:
  config.toml: |
    [settings]
    rate_limit = 10
    # Global: drops every mailbox-write tool (send, move, delete, labels...)
    read_only = true

    [settings.server]
    host = "127.0.0.1"
    port = 8080
    path = "/mcp"

    [[accounts]]
    name = "catchall"
    email = "catchall@une-pause-cafe.fr"
    password = "env:MAIL_PASSWORD_CATCHALL"

    [accounts.imap]
    host = "mail.infomaniak.com"
    port = 993
    tls = true

    [accounts.smtp]
    host = "mail.infomaniak.com"
    port = 465
    tls = true

    [[accounts]]
    name = "quentinj"
    email = "quentinj@une-pause-cafe.fr"
    password = "env:MAIL_PASSWORD_QUENTINJ"

    [accounts.imap]
    host = "mail.infomaniak.com"
    port = 993
    tls = true

    [accounts.smtp]
    host = "mail.infomaniak.com"
    port = 465
    tls = true
