    #!/usr/bin/env python3
    """Talk to the Deluge daemon and print JSON.
    
    Runs inside the deluge container: pi pipes this file to `podman exec -i deluge python3 -`.
    
    Usage:
      deluge_rpc.py torrents
      deluge_rpc.py status
      deluge_rpc.py pause <hash>...
      deluge_rpc.py resume <hash>...
      deluge_rpc.py remove <hash>... [--with-data]
    """
    import json
    import sys
    
    from twisted.internet import reactor
    from deluge.ui.client import client
    
    HOST = "127.0.0.1"
    PORT = 58846
    
    KEYS = [
        "name",
        "ratio",
        "total_uploaded",
        "total_done",
        "total_size",
        "upload_payload_rate",
        "download_payload_rate",
        "num_seeds",
        "num_peers",
        "total_seeds",
        "total_peers",
        "distributed_copies",
        "max_upload_speed",
        "max_download_speed",
        "stop_at_ratio",
        "stop_ratio",
        "time_added",
        "state",
        "tracker_host",
        "seeding_time",
        "time_since_transfer",
        "is_finished",
        "progress",
        "label",
        "save_path",
    ]
    
    SESSION_KEYS = [
        "upload_rate",
        "download_rate",
        "payload_upload_rate",
        "payload_download_rate",
        "dht_nodes",
    ]
    
    
    def emit(payload):
        print(json.dumps(payload, default=str))
    
    
    def finish(result):
        emit(result)
        stopped = client.disconnect()
        stopped.addBoth(lambda _: reactor.stop())
        return result
    
    
    def fail(error):
        emit({"error": getattr(error, "getErrorMessage", lambda: str(error))()})
        try:
            client.disconnect()
        except Exception:
            pass
        reactor.stop()
    
    
    def run_torrents():
        return client.core.get_torrents_status({}, KEYS)
    
    
    def run_status():
        def with_session(session):
            def with_torrents(torrents):
                size = sum(t.get("total_size") or 0 for t in torrents.values())
                done = sum(t.get("total_done") or 0 for t in torrents.values())
                up = sum(t.get("total_uploaded") or 0 for t in torrents.values())
                seeding = sum(1 for t in torrents.values() if t.get("state") == "Seeding")
                return {
                    "session": session,
                    "count": len(torrents),
                    "seeding": seeding,
                    "size": size,
                    "downloaded": done,
                    "uploaded": up,
                    "ratio": (up / done) if done else 0,
                }
            return client.core.get_torrents_status({}, ["total_size", "total_done", "total_uploaded", "state"]).addCallback(with_torrents)
        return client.core.get_session_status(SESSION_KEYS).addCallback(with_session)
    
    
    def run_bulk(method, hashes):
        from twisted.internet import defer
        defs = [getattr(client.core, method)(h) for h in hashes]
        def check(results):
            errors = [str(r[1]).split(":")[0][:60] for r in results if not r[0]]
            return {"ok": len(results) - len(errors), "errors": sorted(set(errors))[:3]}
        return defer.DeferredList(defs, consumeErrors=True).addCallback(check)
    
    
    def run_remove(hashes, with_data):
        from twisted.internet import defer
        defs = [client.core.remove_torrent(h, with_data) for h in hashes]
        def check(results):
            errors = [str(r[1]).split(":")[0][:60] for r in results if not r[0]]
            return {"removed": len(results) - len(errors), "errors": sorted(set(errors))[:3], "with_data": with_data}
        return defer.DeferredList(defs, consumeErrors=True).addCallback(check)
    
    
    def main(argv):
        if len(argv) < 2:
            emit({"error": "usage: deluge_rpc.py torrents|status|pause|resume|remove ..."})
            return 2
        cmd, rest = argv[1], argv[2:]
        with_data = "--with-data" in rest
        targets = [a for a in rest if not a.startswith("--")]
    
        if cmd == "torrents":
            action = run_torrents
        elif cmd == "status":
            action = run_status
        elif cmd == "set":
            if not targets:
                emit({"error": "set needs key=value pairs"})
                return 2
            values = {}
            for item in targets:
                key, _, raw = item.partition("=")
                try:
                    values[key] = json.loads(raw)
                except Exception:
                    values[key] = raw
            action = lambda: client.core.set_config(values).addCallback(lambda _: {"set": values})
        elif cmd == "reannounce":
            if not targets:
                emit({"error": "no torrent hash"})
                return 2
            action = lambda: client.core.force_reannounce(targets).addCallback(lambda _: {"ok": len(targets)})
        elif cmd in ("pause", "resume"):
            if not targets:
                emit({"error": "no torrent hash"})
                return 2
            action = lambda: run_bulk(cmd + "_torrent", targets)
        elif cmd == "remove":
            if not targets:
                emit({"error": "no torrent hash"})
                return 2
            action = lambda: run_remove(targets, with_data)
        else:
            emit({"error": f"unknown command: {cmd}"})
            return 2
    
        user = "pi"
        password = __import__("os").environ.get("DELUGE_PASSWORD", "")
        connecting = client.connect(HOST, PORT, user, password)
        connecting.addCallback(lambda _: action())
        connecting.addCallbacks(finish, fail)
        reactor.run()
        return 0
    
    
    if __name__ == "__main__":
        sys.exit(main(sys.argv))
