    """Delete /media/tmp entries that no Deluge torrent references.
    
    Runs on the server: arr.sh pipes the active torrent names to a file, then calls
    this script. A file keeps its blocks when a hardlink to the library still
    exists, so the reclaimable figure counts only the unique inodes.
    
    Usage: purge_orphans.py <names-file> [--apply]
    """
    import os
    import shutil
    import sys
    
    names = set(line.rstrip('\n') for line in open(sys.argv[1]))
    ROOT = os.environ.get('ARR_MEDIA_ROOT', '/data/media')
    TMP = os.path.join(ROOT, 'tmp')
    LIBRARIES = tuple(os.path.join(ROOT, d) for d in ('Series', 'Films', 'Anime'))
    apply = '--apply' in sys.argv
    
    lib = set()
    for base in LIBRARIES:
        for root, _d, files in os.walk(base):
            for f in files:
                try:
                    lib.add(os.lstat(os.path.join(root, f)).st_ino)
                except OSError:
                    pass
    
    free = shared = 0
    count = 0
    for entry in sorted(os.listdir(TMP)):
        if entry in names:
            continue
        p = os.path.join(TMP, entry)
        size = unique = 0
        if os.path.isdir(p) and not os.path.islink(p):
            for root, _d, files in os.walk(p):
                for f in files:
                    fp = os.path.join(root, f)
                    try:
                        st = os.lstat(fp)
                    except OSError:
                        continue
                    size += st.st_size
                    if st.st_ino not in lib:
                        unique += st.st_size
        else:
            st = os.lstat(p)
            size = unique = st.st_size
        count += 1
        free += unique
        shared += size - unique
        print(f"{unique / 2**30:8.1f}G unique  {entry}")
        if apply:
            if os.path.isdir(p) and not os.path.islink(p):
                shutil.rmtree(p)
            else:
                os.remove(p)
    
    print(f"entries: {count}  reclaimable: {free / 2**30:.1f}G  shared with library: {shared / 2**30:.1f}G")
    print("applied" if apply else "dry run")
