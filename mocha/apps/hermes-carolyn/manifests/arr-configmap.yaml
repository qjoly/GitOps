    #!/usr/bin/env python3
    """Build a Sonarr/Radarr ManualImport payload from a manual-import listing.
    
    Reads three JSON files from --dir:
      listing.json   output of GET /manualimport?folder=...
      episodes.json  output of GET /episode?seriesId=...   (tv only)
    and writes the files payload to stdout. The mapping table goes to stderr.
    
    Exit codes: 0 ok, 1 nothing matched, 2 usage error.
    """
    import argparse
    import json
    import os
    import re
    import sys
    
    MEDIA = (".mkv", ".mp4", ".avi", ".m4v", ".ts")
    WITH_SEASON = re.compile(r"[Ss](\d{1,2})[Ee](\d{1,3})")
    EPISODE_ONLY = re.compile(r"[Ee](\d{1,3})(?![0-9.])")
    
    
    def load(path):
        with open(path, encoding="utf-8") as fh:
            return json.load(fh)
    
    
    def main():
        ap = argparse.ArgumentParser()
        ap.add_argument("--kind", choices=["tv", "movie"], required=True)
        ap.add_argument("--id", type=int, required=True)
        ap.add_argument("--dir", required=True)
        ap.add_argument("--mode", default="move", choices=["move", "copy"])
        ap.add_argument("--map", action="append", default=[], metavar="REGEX=SxxEyy",
                        help="force one file to a season and episode, e.g. 'E06\\.5=S00E04'")
        args = ap.parse_args()
    
        listing_path = os.path.join(args.dir, "listing.json")
        if not os.path.exists(listing_path):
            print("missing listing.json", file=sys.stderr)
            return 2
        listing = load(listing_path)
    
        episodes = {}
        if args.kind == "tv":
            eps_path = os.path.join(args.dir, "episodes.json")
            if not os.path.exists(eps_path):
                print("missing episodes.json", file=sys.stderr)
                return 2
            for ep in load(eps_path):
                episodes[(ep["seasonNumber"], ep["episodeNumber"])] = ep["id"]
    
        queue = {}
        folders = {}
        q_path = os.path.join(args.dir, "queue.json")
        if os.path.exists(q_path):
            for rec in load(q_path).get("records", []):
                out = (rec.get("outputPath") or "").rstrip("/")
                dl = rec.get("downloadId")
                if not (out and dl):
                    continue
                if out.lower().endswith(MEDIA):
                    queue[out] = dl
                else:
                    folders[out] = dl
    
        def download_id(path):
            if path in queue:
                return queue[path]
            for folder, dl in folders.items():
                if path.startswith(folder + "/"):
                    return dl
            return None
    
        forced = []
        for item in args.map:
            pattern, _, target = item.partition("=")
            match = re.fullmatch(r"[Ss](\d{1,2})[Ee](\d{1,3})", target.strip())
            if not pattern or not match:
                print(f"bad --map value: {item}", file=sys.stderr)
                return 2
            forced.append((re.compile(pattern), int(match.group(1)), int(match.group(2))))
    
        rows, skipped = [], []
        for entry in listing:
            path = entry.get("path") or ""
            name = os.path.basename(path)
            if not path.lower().endswith(MEDIA):
                skipped.append((name, "not a media file"))
                continue
            if args.kind == "tv":
                override = next(((season, episode) for regex, season, episode in forced
                                 if regex.search(name)), None)
                if override:
                    season, episode = override
                else:
                    match = WITH_SEASON.search(name)
                    if match:
                        season, episode = int(match.group(1)), int(match.group(2))
                    else:
                        match = EPISODE_ONLY.search(name)
                        if not match:
                            skipped.append((name, "no episode number"))
                            continue
                        season, episode = 1, int(match.group(1))
                episode_id = episodes.get((season, episode))
                if episode_id is None:
                    skipped.append((name, f"S{season:02d}E{episode:02d} not in Sonarr"))
                    continue
                rows.append({
                    "path": path,
                    "name": name,
                    "season": season,
                    "episode": episode,
                    "episodeId": episode_id,
                    "quality": entry.get("quality"),
                    "languages": entry.get("languages"),
                    "releaseGroup": entry.get("releaseGroup"),
                    "downloadId": download_id(path) or entry.get("downloadId"),
                })
            else:
                rows.append({
                    "path": path,
                    "name": name,
                    "season": 0,
                    "episode": 0,
                    "episodeId": args.id,
                    "quality": entry.get("quality"),
                    "languages": entry.get("languages"),
                    "releaseGroup": entry.get("releaseGroup"),
                    "downloadId": download_id(path) or entry.get("downloadId"),
                })
    
        rows.sort(key=lambda r: (r["season"], r["episode"], r["name"]))
        for row in rows:
            print(f"S{row['season']:02d}E{row['episode']:02d}\t{row['name']}", file=sys.stderr)
        for name, why in skipped:
            print(f"skipped: {name} ({why})", file=sys.stderr)
        print(f"matched: {len(rows)}  skipped: {len(skipped)}", file=sys.stderr)
    
        files = []
        for row in rows:
            item = {
                "path": row["path"],
                "quality": row["quality"],
                "languages": row["languages"],
                "releaseGroup": row["releaseGroup"],
                "downloadId": row["downloadId"],
            }
