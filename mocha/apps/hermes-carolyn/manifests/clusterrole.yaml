---
# Cluster-wide read-only access for the agent (service account sbx), without
# Secrets. RBAC cannot subtract, so the core group is listed resource by
# resource and the other groups one by one: a new API group stays invisible to
# the agent until it is added here.
#
# Left out on purpose:
# - core: secrets, and the subresources that grant more than a read even with
#   `get` (pods/exec, pods/attach, pods/portforward over websocket, nodes/proxy,
#   services/proxy)
# - dex.coreos.com: Dex state (client secrets, signing keys, refresh tokens)
# - clickhouse.altinity.com: the ClickHouseInstallation spec holds the admin
#   password in clear
# - generators.external-secrets.io: GeneratorStates hold generated values
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: hermes-carolyn-readonly
rules:
  - apiGroups: [""]
    resources:
      - componentstatuses
      - configmaps
      - endpoints
      - events
      - limitranges
      - namespaces
      - namespaces/status
      - nodes
      - nodes/status
      - persistentvolumeclaims
      - persistentvolumeclaims/status
      - persistentvolumes
      - persistentvolumes/status
      - pods
      - pods/log
      - pods/status
      - podtemplates
      - replicationcontrollers
      - replicationcontrollers/scale
      - replicationcontrollers/status
      - resourcequotas
      - resourcequotas/status
      - serviceaccounts
      - services
      - services/status
    verbs: ["get", "list", "watch"]
  - apiGroups:
      - acme.cert-manager.io
      - admissionregistration.k8s.io
      - agents.x-k8s.io
      - apiextensions.k8s.io
      - apiregistration.k8s.io
      - apps
      - aquasecurity.github.io
      - argoproj.io
      - autopilot.k0sproject.io
      - autoscaling
      - batch
      - cert-manager.io
      - certificates.k8s.io
      - cilium.io
      - coordination.k8s.io
      - discovery.k8s.io
      - events.k8s.io
      - extensions.agents.x-k8s.io
      - external-secrets.io
      - externaldns.k8s.io
      - flowcontrol.apiserver.k8s.io
      - helm.k0sproject.io
      - hub.traefik.io
      - local.openebs.io
      - metrics.k8s.io
      - monitoring.coreos.com
      - netbird.io
      - networking.k8s.io
      - node.k8s.io
      - opentelemetry.io
      - policy
      - rbac.authorization.k8s.io
      - resource.k8s.io
      - resources.signoz.io
      - scheduling.k8s.io
      - snapshot.storage.k8s.io
      - storage.k8s.io
      - traefik.io
      - vault.banzaicloud.com
      - volsync.backube
      - weebo.si.rs
    resources: ["*"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: hermes-carolyn-readonly
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: hermes-carolyn-readonly
subjects:
  - kind: ServiceAccount
    name: sbx
    namespace: hermes-carolyn
