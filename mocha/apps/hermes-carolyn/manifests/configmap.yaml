---
apiVersion: v1
kind: ConfigMap
metadata:
  name: hermes-carolyn-config
data:
  config.yaml: |
    model:
      default: "mistral-large-latest"
      provider: "custom"
      base_url: "https://api.mistral.ai/v1"
      key_env: "MISTRAL_API_KEY"

    mcp_servers:
      github:
        url: "http://127.0.0.1:8082/mcp"
        trust: untrusted
        connect_timeout: 30
        headers:
          Authorization: "Bearer ${GH_TOKEN}"

    command_allowlist:
      - mcp:github/create_or_update_file
      - mcp:github/push_files
      - mcp:github/create_branch
      - mcp:github/create_pull_request
      - mcp:github/delete_file

    webapp:
      enabled: true
      host: "0.0.0.0"
      port: 9120
      public_url: "https://hermes-carolyn-gw.nb.mocha.thoughtless.eu"

    dashboard:
      basic_auth:
        username: "carolyn"
      trusted_proxies:
        - 10.0.0.0/8

    database:
      journal_mode: "wal"
