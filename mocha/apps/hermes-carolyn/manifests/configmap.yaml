---
apiVersion: v1
kind: ConfigMap
metadata:
  name: hermes-carolyn-config
data:
  config.yaml: |
    model:
      # Served by Mistral's API under this exact ID
      default: "deepseek-v4-1-flash-1017"
      provider: "custom"
      base_url: "https://api.mistral.ai/v1"
      key_env: "MISTRAL_API_KEY"

    platforms:
      discord:
        enabled: true

    discord:
      require_mention: true
      auto_thread: true

    mcp_servers:
      email:
        url: "http://127.0.0.1:8080/mcp"
        trust: untrusted
        connect_timeout: 120
        tools:
          prompts: false
          resources: false
          include:
            - list_emails
            - search_emails
            - get_email
            - get_emails
            - get_thread
            - list_mailboxes
            - list_accounts
            - get_email_stats
      github:
        url: "http://127.0.0.1:8082/mcp"
        trust: untrusted
        connect_timeout: 30
        headers:
          Authorization: "Bearer ${GITHUB_TOKEN}"
      # Google Calendar (read/write), calendar-mcp sidecar
      calendar:
        url: "http://127.0.0.1:8083/mcp"
        trust: untrusted
        connect_timeout: 60
      # Home Assistant's built-in MCP server; only entities exposed to Assist
      # are reachable. Goes through Cloudflare, which lets httpx's UA through.
      homeassistant:
        url: "https://home.thoughtless.eu/api/mcp"
        trust: untrusted
        connect_timeout: 30
        headers:
          Authorization: "Bearer ${HA_MCP_TOKEN}"
      # Grafana (mocha), read-only, grafana-mcp sidecar
      grafana:
        url: "http://127.0.0.1:8084/mcp"
        trust: untrusted
        connect_timeout: 30

    # Triage is the inbox (nothing runs there, no auto-decompose); moving a
    # task to Ready dispatches it, unassigned ones to the default profile.
    kanban:
      default_assignee: "default"
      auto_decompose: false

    browser:
      cdp_url: "http://127.0.0.1:9222"

    # The gateway's Webapp listener (the browser-hosted Desktop: Bots tab,
    # sessions, routines) and the JSON-RPC/WS backend a dev machine's Desktop
    # connects to as a remote gateway. Served to NetBird peers only, by the
    # hermes-carolyn-gateway Ingress on hermes-carolyn-gw.nb.mocha.thoughtless.eu.
    #
    # 0.0.0.0 (not 127.0.0.1) so traefik-internal, which reaches the pod over the
    # pod network, can connect. That non-loopback bind turns Hermes' auth gate ON,
    # and Hermes REFUSES to start the listener when the gate is on and no
    # provider is registered — hence the basic provider below.
    #
    # public_url is the exact hostname/origin the browser uses: the gate's
    # Host/Origin trust declaration behind a proxy, and the base for the WS
    # cross-origin check. It must match the Ingress host character for character.
    webapp:
      enabled: true
      host: "0.0.0.0"
      port: 9120
      public_url: "https://hermes-carolyn-gw.nb.mocha.thoughtless.eu"

    # Username/password sign-in for the webapp listener — the bundled `basic`
    # provider, no OAuth IDP. Only the username sits here; the password comes
    # from Vault through HERMES_DASHBOARD_BASIC_AUTH_PASSWORD (env wins over any
    # value in this file, so no secret is ever committed). The signing secret is
    # likewise env-only: without it every restart would end every session.
    dashboard:
      basic_auth:
        username: "carolyn"
      # Only traefik-internal ever talks to this port, so its kubelet node IPs are
      # what uvicorn may believe in X-Forwarded-* (bounded: never a public CIDR).
      # Needed for the Secure cookie and https redirect_uri behind TLS termination.
      trusted_proxies:
        - 10.0.0.0/8

    database:
      journal_mode: "wal"
