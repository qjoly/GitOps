---
apiVersion: v1
kind: ConfigMap
metadata:
  name: hermes-carolyn-config
data:
  config.yaml: |
    model:
      default: "mistral-large-latest"
      provider: "custom"
      base_url: "https://api.mistral.ai/v1"
      key_env: "MISTRAL_API_KEY"

    fallback_providers:
      - provider: custom
        model: "gpt-oss:20b"
        base_url: "http://ollama.ollama.svc.cluster.local:11434/v1"

    fallback:
      min_switch_reset_seconds: 0

    platforms:
      discord:
        enabled: true

    discord:
      require_mention: true
      auto_thread: true

    mcp_servers:
      email:
        url: "http://127.0.0.1:8080/mcp"
        trust: untrusted
        connect_timeout: 120
        tools:
          prompts: false
          resources: false
          include:
            - list_emails
            - search_emails
            - get_email
            - get_emails
            - get_thread
            - list_mailboxes
            - list_accounts
            - get_email_stats
      github:
        url: "http://127.0.0.1:8082/mcp"
        trust: untrusted
        connect_timeout: 30

    database:
      journal_mode: "wal"
