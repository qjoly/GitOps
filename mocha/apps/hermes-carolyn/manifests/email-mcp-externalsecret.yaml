---
# email-mcp only supports several accounts through its TOML file: the
# MCP_EMAIL_* env vars build a single account and skip this file entirely.
# The TOML only accepts env:/keychain: references for `password`, so the whole
# file is rendered here to keep the mail addresses out of git. Passwords stay
# env: references to the hermes-carolyn Secret (see deployment.yaml).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: hermes-carolyn-email-mcp
spec:
  refreshInterval: "1h"
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: hermes-carolyn-email-mcp
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        # Read by the sync-cron initContainer.
        mail_address_catchall: "{{ .mail_address_catchall }}"
        config.toml: |
          [settings]
          rate_limit = 10
          # Global: drops every mailbox-write tool (send, move, delete, labels...)
          read_only = true

          [settings.server]
          host = "127.0.0.1"
          port = 8080
          path = "/mcp"

          [[accounts]]
          name = "catchall"
          email = "{{ .mail_address_catchall }}"
          password = "env:MAIL_PASSWORD_CATCHALL"

          [accounts.imap]
          host = "mail.infomaniak.com"
          port = 993
          tls = true

          [accounts.smtp]
          host = "mail.infomaniak.com"
          port = 465
          tls = true

          [[accounts]]
          name = "quentinj"
          email = "{{ .mail_address_quentinj }}"
          password = "env:MAIL_PASSWORD_QUENTINJ"

          [accounts.imap]
          host = "mail.infomaniak.com"
          port = 993
          tls = true

          [accounts.smtp]
          host = "mail.infomaniak.com"
          port = 465
          tls = true
  data:
    - secretKey: mail_address_catchall
      remoteRef:
        key: hermes-carolyn
        property: mail_address_catchall
    - secretKey: mail_address_quentinj
      remoteRef:
        key: hermes-carolyn
        property: mail_address_quentinj
