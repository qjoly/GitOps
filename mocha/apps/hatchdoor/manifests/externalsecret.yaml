---
# The two bearer tokens, neither of them in git.
#
# Both live under the app's own Vault path (`hatchdoor/…`) rather than being
# mixed into hermes-carolyn's keys: they are this service's credentials, and
# only the Hermes pod (for the MCP one) and the user (for the web one) need
# them.
#
# Rotation is safe and expected: change the value in Vault, let the
# ExternalSecret refresh, restart the pod. Agents holding the old MCP token
# then get a 401 and need the new one.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: hatchdoor-credentials
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault-backend
  target:
    name: hatchdoor-credentials
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    # Browser login. A non-loopback bind refuses to start without it.
    - secretKey: web_token
      remoteRef:
        key: hatchdoor
        property: web_token
    # Agent access. /mcp bypasses the web auth layer, so it needs its own token
    # -- and it is read from hermes-carolyn's path, not this app's, because the
    # Hermes pod needs the same value and a Secret cannot cross namespaces.
    # One key for both consumers: no copy to keep in sync, and rotating it is a
    # single `vault kv patch`.
    - secretKey: mcp_token
      remoteRef:
        key: hermes-carolyn
        property: hatchdoor_mcp_token
---
# The web UI is a private notebook: only the internal Traefik may reach it,
# and only through the NetBird Ingress, the same door as the other internal
# apps. Nothing in the cluster gets a direct path to the vault.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: hatchdoor
spec:
  endpointSelector:
    matchLabels:
      k8s:io.kubernetes.pod.namespace: hatchdoor
      app: hatchdoor
  ingress:
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: traefik-internal
            app.kubernetes.io/name: traefik
      toPorts:
        - ports:
            - port: "42824"
              protocol: TCP
    # The Hermes agent calls /mcp directly on the Service, without going
    # through Traefik.
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: hermes-carolyn
            app.kubernetes.io/name: hermes-carolyn
      toPorts:
        - ports:
            - port: "42824"
              protocol: TCP
    # Kubelet probes come from the host.
    - fromEntities:
        - host
      toPorts:
        - ports:
            - port: "42824"
              protocol: TCP
---
# Internal-only hostname, reachable by NetBird peers. No TLS here: the
# `*.nb` hosts are plain HTTP on the tunnel, like the other internal apps.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: hatchdoor
spec:
  ingressClassName: traefik-internal
  rules:
    - host: hatchdoor.nb.mocha.thoughtless.eu
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: hatchdoor
                port:
                  number: 80
