---
# Same atcr credentials as tranquil-pds: one robot account for the whole registry,
# so both namespaces read the same Vault key.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: atcr-pull
  namespace: blueweave
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault-backend
  target:
    name: atcr-pull
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      mergePolicy: Replace
      type: kubernetes.io/dockerconfigjson
  data:
    - secretKey: .dockerconfigjson
      remoteRef:
        key: tranquil-pds
        property: dockerconfigjson
---
# App env (OAuth ids/secrets, session key): the whole Vault key becomes envFrom.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: blueweave-secrets
  namespace: blueweave
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault-backend
  target:
    name: blueweave-secrets
    creationPolicy: Owner
    deletionPolicy: Retain
  dataFrom:
    - extract:
        key: blueweave
