apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# blueweave-secrets is created by hand in the namespace, it is not in this repo.
resources:
  - namespace.yaml
  - config.yaml
  - pvc.yaml
  - deployment.yaml
  - service.yaml
  - ingress.yaml
  - podmonitor.yaml

images:
  - name: atcr.io/une-tasse-de.cafe/blueweave
    newTag: main
