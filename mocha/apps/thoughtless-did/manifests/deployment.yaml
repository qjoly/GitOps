apiVersion: apps/v1
kind: Deployment
metadata:
  name: thoughtless-did
  labels:
    app: thoughtless-did
spec:
  replicas: 1
  selector:
    matchLabels:
      app: thoughtless-did
  template:
    metadata:
      labels:
        app: thoughtless-did
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: nginx
          image: nginxinc/nginx-unprivileged:1.31-alpine
          ports:
            - name: http
              containerPort: 8080
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 30
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 64Mi
          volumeMounts:
            - name: web
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
            - name: web
              mountPath: /srv/well-known/did.json
              subPath: did.json
            - name: web
              mountPath: /srv/well-known/atproto-did
              subPath: atproto-did
      volumes:
        - name: web
          configMap:
            name: thoughtless-did
