---
# Applies retention and reclaims uploads stalled for a day. Also clears every namespace no [repository] declares.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: angos-prune
  labels:
    app: angos
spec:
  schedule: "15 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  startingDeadlineSeconds: 600
  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        metadata:
          labels:
            app: angos
            job: prune
        spec:
          restartPolicy: OnFailure
          automountServiceAccountToken: false
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: prune
              # Same tag as the Deployment: a newer layout would read the store as unknown keys.
              image: ghcr.io/project-angos/angos:1.12.5
              args: ["-c", "/config/config.toml", "-c", "/credentials/secrets.toml", "prune", "-u", "24h"]
              env:
                - name: RUST_LOG
                  value: info
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: [ALL]
              volumeMounts:
                - name: config
                  mountPath: /config
                  readOnly: true
                - name: credentials
                  mountPath: /credentials
                  readOnly: true
              resources:
                requests:
                  cpu: 100m
                  memory: 128Mi
                limits:
                  memory: 512Mi
          volumes:
            - name: config
              configMap:
                name: angos-config
            - name: credentials
              secret:
                secretName: angos-credentials
---
# Reclaims the blobs the prune at :15 left unreferenced; unknown keys go to _lost_and_found/.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: angos-scrub
  labels:
    app: angos
spec:
  schedule: "45 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  startingDeadlineSeconds: 600
  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        metadata:
          labels:
            app: angos
            job: scrub
        spec:
          restartPolicy: OnFailure
          automountServiceAccountToken: false
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: scrub
              # Same tag as the Deployment: a newer layout would read the store as unknown keys.
              image: ghcr.io/project-angos/angos:1.12.5
              args: ["-c", "/config/config.toml", "-c", "/credentials/secrets.toml", "scrub"]
              env:
                - name: RUST_LOG
                  value: info
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: [ALL]
              volumeMounts:
                - name: config
                  mountPath: /config
                  readOnly: true
                - name: credentials
                  mountPath: /credentials
                  readOnly: true
              resources:
                requests:
                  cpu: 100m
                  memory: 128Mi
                limits:
                  memory: 512Mi
          volumes:
            - name: config
              configMap:
                name: angos-config
            - name: credentials
              secret:
                secretName: angos-credentials
