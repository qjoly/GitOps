---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: angos-credentials
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: angos-credentials
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        secrets.toml: |
          [blob_store.s3]
          access_key_id = "{{ .s3_access_key }}"
          secret_key = "{{ .s3_secret_key }}"

          [metadata_store.s3]
          access_key_id = "{{ .s3_access_key }}"
          secret_key = "{{ .s3_secret_key }}"

          [auth.token_service]
          secret_key = "{{ .token_secret_key }}"

          [auth.identity.admin]
          username = "admin"
          password = "{{ .admin_password_hash }}"

          [auth.identity.scanner]
          username = "scanner"
          password = "{{ .scanner_password_hash }}"

          [global.scan]
          token = "{{ .scanner_token }}"
  data:
    - secretKey: s3_access_key
      remoteRef: { key: angos, property: s3_access_key }
    - secretKey: s3_secret_key
      remoteRef: { key: angos, property: s3_secret_key }
    - secretKey: token_secret_key
      remoteRef: { key: angos, property: token_secret_key }
    - secretKey: admin_password_hash
      remoteRef: { key: angos, property: admin_password_hash }
    - secretKey: scanner_password_hash
      remoteRef: { key: angos, property: scanner_password_hash }
    - secretKey: scanner_token
      remoteRef: { key: angos, property: scanner_token }
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: angos-scanner
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: angos-scanner
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        scanner.toml: |
          [scanner]
          port = 8766
          token = "{{ .scanner_token }}"

          [scanner.registry]
          url = "https://registry.mocha.thoughtless.eu"
          username = "scanner"
          password = "{{ .scanner_password }}"
        password: "{{ .scanner_password }}"
  data:
    - secretKey: scanner_token
      remoteRef: { key: angos, property: scanner_token }
    - secretKey: scanner_password
      remoteRef: { key: angos, property: scanner_password }
