---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: angos
  annotations:
    cert-manager.io/cluster-issuer: cloudflare
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - registry.mocha.thoughtless.eu
      secretName: angos-tls
  rules:
    - host: registry.mocha.thoughtless.eu
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: angos
                port:
                  name: http
