---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: abcdesktop-mongod-keyfile
spec:
  refreshInterval: "1h"
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: abcdesktop-mongod-keyfile
    creationPolicy: Owner
  data:
    - secretKey: mongod.keyfile
      remoteRef:
        key: abcdesktop
        property: mongod_keyfile
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: secret-mongodb
spec:
  refreshInterval: "1h"
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: secret-mongodb
    creationPolicy: Owner
    template:
      metadata:
        labels:
          abcdesktop/role: mongodb
      data:
        MONGO_ROOT_USERNAME: "root"
        MONGO_ROOT_PASSWORD: "{{ .rootPassword }}"
        MONGO_USERNAME: "pyos"
        MONGO_PASSWORD: "{{ .pyosPassword }}"
        MONGO_USERS_LIST: "pyos:readWrite:{{ .pyosPassword }}"
        MONGO_DBS_LIST: "image,fail2ban,loginHistory,applications,profiles,desktop"
        MONGODB_URL: "mongodb://pyos:{{ .pyosPassword }}@mongodb"
  data:
    - secretKey: rootPassword
      remoteRef:
        key: abcdesktop
        property: mongo_root_password
    - secretKey: pyosPassword
      remoteRef:
        key: abcdesktop
        property: mongo_pyos_password
