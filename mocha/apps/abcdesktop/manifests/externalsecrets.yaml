# All the material below is generated once and pushed to kv/abcdesktop, see
# the README next to this file.
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: abcdesktop-jwt-desktop-payload
spec:
  refreshInterval: "1h"
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: abcdesktopjwtdesktoppayload
    creationPolicy: Owner
    template:
      metadata:
        labels:
          # pyos and the router look up their keys by this label.
          abcdesktop/role: desktop.payloadkeys
  data:
    - secretKey: abcdesktop_jwt_desktop_payload_private_key.pem
      remoteRef:
        key: abcdesktop
        property: jwt_desktop_payload_private_key
    - secretKey: abcdesktop_jwt_desktop_payload_public_key.pem
      remoteRef:
        key: abcdesktop
        property: jwt_desktop_payload_public_key
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: abcdesktop-jwt-desktop-signing
spec:
  refreshInterval: "1h"
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: abcdesktopjwtdesktopsigning
    creationPolicy: Owner
    template:
      metadata:
        labels:
          abcdesktop/role: desktop.signingkeys
  data:
    - secretKey: abcdesktop_jwt_desktop_signing_private_key.pem
      remoteRef:
        key: abcdesktop
        property: jwt_desktop_signing_private_key
    - secretKey: abcdesktop_jwt_desktop_signing_public_key.pem
      remoteRef:
        key: abcdesktop
        property: jwt_desktop_signing_public_key
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: abcdesktop-jwt-user-signing
spec:
  refreshInterval: "1h"
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: abcdesktopjwtusersigning
    creationPolicy: Owner
    template:
      metadata:
        labels:
          abcdesktop/role: user.signingkeys
  data:
    - secretKey: abcdesktop_jwt_user_signing_private_key.pem
      remoteRef:
        key: abcdesktop
        property: jwt_user_signing_private_key
    - secretKey: abcdesktop_jwt_user_signing_public_key.pem
