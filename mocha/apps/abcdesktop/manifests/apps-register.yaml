# Applications are not manifests: pyos keeps them in mongodb and the upstream
# way to add one is to POST the output of `docker inspect` to its manager API.
# This Job rebuilds that payload straight from the registry, so the app list is
# declared here instead of clicked in the console.
apiVersion: v1
kind: ConfigMap
metadata:
  name: apps-register
data:
  applist: |
    ghcr.io/abcdesktopio/firefox.d:4.4
    ghcr.io/abcdesktopio/firefoxrockylinux.d:4.4
    ghcr.io/abcdesktopio/vscode.d:4.4
    ghcr.io/abcdesktopio/terminal.d:4.4
  register.py: |
    import json, os, sys, time, urllib.error, urllib.request

    PYOS = 'http://pyos:8000/API/manager/image'
    ACCEPT = ','.join([
        'application/vnd.oci.image.index.v1+json',
        'application/vnd.docker.distribution.manifest.list.v2+json',
        'application/vnd.oci.image.manifest.v1+json',
        'application/vnd.docker.distribution.manifest.v2+json',
    ])

    def fetch(url, accept=None, token=None, data=None):
        req = urllib.request.Request(url, data=data)
        if accept:
            req.add_header('Accept', accept)
        if token:
            req.add_header('Authorization', f'Bearer {token}')
        if data:
            req.add_header('Content-Type', 'application/json')
        return json.loads(urllib.request.urlopen(req, timeout=30).read())

    def inspect(image):
        """Rebuild a `docker inspect` payload from the registry API."""
        host, path = image.split('/', 1)
        repo, tag = path.rsplit(':', 1)
        token = fetch(f"https://{host}/token?scope=repository:{repo}:pull&service={host}")['token']
        manifest = fetch(f"https://{host}/v2/{repo}/manifests/{tag}", ACCEPT, token)
        if 'manifests' in manifest:
            digest = next(m['digest'] for m in manifest['manifests']
                          if m.get('platform', {}).get('architecture') == 'amd64')
            manifest = fetch(f"https://{host}/v2/{repo}/manifests/{digest}", ACCEPT, token)
        config = fetch(f"https://{host}/v2/{repo}/blobs/{manifest['config']['digest']}", None, token)
        return {
            'Id': manifest['config']['digest'],
            'RepoTags': [image],
            'Created': config.get('created'),
            'Architecture': config.get('architecture'),
            'Os': config.get('os'),
            'Config': config.get('config', {}),
        }

    images = [l.strip() for l in open('/config/applist') if l.strip() and not l.startswith('#')]

    # PostSync runs while pyos may still be rolling out
    for attempt in range(30):
        try:
            fetch(PYOS)
            break
        except (urllib.error.URLError, OSError) as e:
            print(f"waiting for pyos ({e})", flush=True)
            time.sleep(5)
    else:
        sys.exit('pyos never answered')

    failed = []
    for image in images:
        try:
            fetch(PYOS, data=json.dumps(inspect(image)).encode())
            print(f"OK {image}", flush=True)
        except Exception as e:
            print(f"FAILED {image}: {e}", flush=True)
            failed.append(image)

    sys.exit(1 if failed else 0)
---
apiVersion: batch/v1
kind: Job
metadata:
  name: apps-register
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 3
  template:
    spec:
      restartPolicy: OnFailure
      automountServiceAccountToken: false
      containers:
        - name: register
          # reuses the pyos image: python3 is all this needs and the node
          # already has it pulled
          image: ghcr.io/abcdesktopio/pyos:4.4.alpine_latest
          command: [python3, /config/register.py]
          volumeMounts:
            - name: config
              mountPath: /config
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
      volumes:
        - name: config
          configMap:
            name: apps-register
