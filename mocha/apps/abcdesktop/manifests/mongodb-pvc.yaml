# Upstream keeps the mongodb data in an emptyDir, which drops the user
# preferences and the login history on every restart.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mongodb-data
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: openebs-lvmpv
  resources:
    requests:
      storage: 4Gi
