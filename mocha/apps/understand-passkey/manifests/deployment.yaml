apiVersion: apps/v1
kind: Deployment
metadata:
  name: understand-passkey
  labels:
    app: understand-passkey
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: understand-passkey
  template:
    metadata:
      labels:
        app: understand-passkey
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: understand-passkey
          image: ghcr.io/qjoly/understand-passkey:sha-ea017a6
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: PORT
              value: "8080"
            - name: RP_ID
              value: understand-passkeys-with.a-cup-of.coffee
            - name: RP_ORIGIN
              value: https://understand-passkeys-with.a-cup-of.coffee
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 15
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 128Mi
