---
apiVersion: v1
kind: ConfigMap
metadata:
  name: hermes-config
data:
  config.yaml: |
    model:
      default: "gpt-oss:20b"
      provider: "custom"
      base_url: "http://ollama.ollama.svc.cluster.local:11434/v1"

    providers:
      ollama:
        base_url: "http://ollama.ollama.svc.cluster.local:11434/v1"

    platforms:
      discord:
        enabled: true

    discord:
      require_mention: true
      auto_thread: true

    database:
      journal_mode: "wal"
