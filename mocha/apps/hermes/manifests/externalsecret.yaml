---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: hermes
spec:
  refreshInterval: "1h"
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: hermes
    creationPolicy: Owner
  data:
    - secretKey: bot_token
      remoteRef:
        key: hermes
        property: bot_token
    - secretKey: allowed_users
      remoteRef:
        key: hermes
        property: allowed_users
