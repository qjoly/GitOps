---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: hermes-webui
  annotations:
    cert-manager.io/cluster-issuer: cloudflare
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - hermes.mocha.thoughtless.eu
      secretName: hermes-webui-tls
  rules:
    - host: hermes.mocha.thoughtless.eu
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: hermes-webui
                port:
                  number: 8787
