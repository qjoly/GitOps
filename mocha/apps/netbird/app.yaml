apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: netbird
  namespace: argocd
spec:
  project: default
  syncPolicy:
    automated:
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
  destination:
    server: https://kubernetes.default.svc
    namespace: netbird
  sources:
    - repoURL: https://netbirdio.github.io/helms
      chart: netbird
      targetRevision: 1.9.0
      helm:
        values: |
          fullnameOverride: netbird
          management:
            image:
              tag: 0.75.0
            persistentVolume:
              enabled: true
              size: 256Mi
              storageClass: openebs-lvmpv
            envFromSecret:
              RELAY_PASSWORD: netbird/relayPassword
              DATASTORE_ENCRYPTION_KEY: netbird/datastoreEncryptionKey
              TURN_PASSWORD: netbird/turnPassword
            configmap: |-
              {
                "Stuns": [
                  {
                    "Proto": "udp",
                    "URI": "stun:5.196.80.72:3478",
                    "Username": "",
                    "Password": ""
                  }
                ],
                "TURNConfig": {
                  "TimeBasedCredentials": false,
                  "CredentialsTTL": "12h0m0s",
                  "Secret": "secret",
                  "Turns": [
                    {
                      "Proto": "udp",
                      "URI": "turn:5.196.80.72:3478",
                      "Username": "netbird",
                      "Password": "{{ .TURN_PASSWORD }}"
                    }
                  ]
                },
                "Relay": {
                  "Addresses": ["rels://netbird.mocha.thoughtless.eu:443/relay"],
                  "CredentialsTTL": "24h",
                  "Secret": "{{ .RELAY_PASSWORD }}"
                },
                "Signal": {
                  "Proto": "https",
                  "URI": "netbird.mocha.thoughtless.eu:443",
                  "Username": "",
                  "Password": ""
                },
                "Datadir": "/var/lib/netbird/",
                "DataStoreEncryptionKey": "{{ .DATASTORE_ENCRYPTION_KEY }}",
                "HttpConfig": {
                  "LetsEncryptDomain": "",
                  "CertFile": "",
                  "CertKey": "",
                  "AuthAudience": "netbird",
                  "AuthIssuer": "https://authentik.mocha.thoughtless.eu/application/o/netbird/",
                  "AuthUserIDClaim": "",
                  "AuthKeysLocation": "https://authentik.mocha.thoughtless.eu/application/o/netbird/jwks/",
                  "OIDCConfigEndpoint": "https://authentik.mocha.thoughtless.eu/application/o/netbird/.well-known/openid-configuration",
                  "IdpSignKeyRefreshEnabled": false
                },
                "DeviceAuthorizationFlow": {
                  "Provider": "hosted",
                  "ProviderConfig": {
                    "ClientID": "netbird",
                    "ClientSecret": "",
                    "Domain": "authentik.mocha.thoughtless.eu",
                    "Audience": "netbird",
                    "TokenEndpoint": "https://authentik.mocha.thoughtless.eu/application/o/token/",
                    "DeviceAuthEndpoint": "https://authentik.mocha.thoughtless.eu/application/o/device/",
                    "AuthorizationEndpoint": "",
                    "Scope": "openid profile email offline_access",
                    "UseIDToken": false,
                    "RedirectURLs": null
                  }
                },
                "PKCEAuthorizationFlow": {
                  "ProviderConfig": {
                    "ClientID": "netbird",
                    "ClientSecret": "",
                    "Domain": "",
                    "Audience": "netbird",
                    "TokenEndpoint": "https://authentik.mocha.thoughtless.eu/application/o/token/",
                    "DeviceAuthEndpoint": "",
                    "AuthorizationEndpoint": "https://authentik.mocha.thoughtless.eu/application/o/authorize/",
                    "Scope": "openid profile email offline_access",
                    "UseIDToken": false,
                    "RedirectURLs": ["http://localhost:53000"]
                  }
                },
                "StoreConfig": {
                  "Engine": "sqlite"
                },
                "ReverseProxy": {
                  "TrustedHTTPProxies": null,
                  "TrustedHTTPProxiesCount": 0,
                  "TrustedPeers": null
                }
              }
          signal:
            image:
              tag: 0.75.0
          relay:
            image:
              tag: 0.75.0
            envFromSecret:
              NB_AUTH_SECRET: netbird/relayPassword
            env:
              NB_LOG_LEVEL: info
              NB_LISTEN_ADDRESS: ":33080"
              NB_EXPOSED_ADDRESS: "rels://netbird.mocha.thoughtless.eu:443/relay"
          dashboard:
            image:
              tag: v2.90.7
            env:
              NETBIRD_MGMT_API_ENDPOINT: https://netbird.mocha.thoughtless.eu:443
              NETBIRD_MGMT_GRPC_API_ENDPOINT: https://netbird.mocha.thoughtless.eu:443
              AUTH_CLIENT_ID: netbird
              AUTH_CLIENT_SECRET: ""
              AUTH_AUTHORITY: https://authentik.mocha.thoughtless.eu/application/o/netbird/
              AUTH_AUDIENCE: netbird
              USE_AUTH0: "false"
              AUTH_SUPPORTED_SCOPES: "openid profile email offline_access"
              AUTH_REDIRECT_URI: /nb-auth
              AUTH_SILENT_REDIRECT_URI: /nb-silent-auth
              NETBIRD_TOKEN_SOURCE: accessToken
              LETSENCRYPT_DOMAIN: none
    - repoURL: https://github.com/qjoly/gitops.git
      targetRevision: HEAD
      path: mocha/apps/netbird/manifests
