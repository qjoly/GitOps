# Only traefik-internal serves the mac.nb ingress to NetBird peers, and only on
# the reverse-listener port. The chisel control port 2333 is reached via
# kubectl port-forward, which enters the pod netns and is not affected.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-traefik-internal-mac
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: traefik-internal
      ports:
        - protocol: TCP
          port: 8080
