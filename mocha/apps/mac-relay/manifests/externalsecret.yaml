apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: mac-relay
spec:
  refreshInterval: "1h"
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: mac-relay
    creationPolicy: Owner
  data:
    # chisel --auth value "user:password", shared with the Mac (mise run nb:mac).
    # Set once with: mise run vault:kv put kv/netbird mac_relay_auth="mac:$(openssl rand -hex 24)"
    - secretKey: auth
      remoteRef:
        key: netbird
        property: mac_relay_auth
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
