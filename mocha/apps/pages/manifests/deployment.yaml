apiVersion: v1
kind: ConfigMap
metadata:
  name: pages-conf
  namespace: pages
data:
  default.conf: |
    server {
      listen 8080;
      root /usr/share/nginx/html;
      index index.html;
      charset utf-8;
      # No directory listing: these pages are private documents.
      autoindex off;
      location / {
        try_files $uri $uri/index.html =404;
      }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pages
  namespace: pages
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: pages
  template:
    metadata:
      labels:
        app: pages
    spec:
      containers:
        - name: nginx
          image: nginx:1.31-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
              # nginx entrypoint chowns its cache dirs then drops to uid 101
              add: ["CHOWN", "SETUID", "SETGID"]
          readinessProbe:
            httpGet:
              # root 404s until the first page is published; probe a known page
              path: /colis.html
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 20
          volumeMounts:
            - name: pages
              mountPath: /usr/share/nginx/html
            - name: conf
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
      volumes:
        - name: pages
          persistentVolumeClaim:
            claimName: pages
        - name: conf
          configMap:
            name: pages-conf
