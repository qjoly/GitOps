apiVersion: v1
kind: ServiceAccount
metadata:
  name: factorio-rollout
  namespace: factorio-lucca
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: factorio-rollout
  namespace: factorio-lucca
rules:
  - apiGroups: ["apps"]
    resources: ["deployments"]
    resourceNames: ["factorio"]
    verbs: ["get", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: factorio-rollout
  namespace: factorio-lucca
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: factorio-rollout
subjects:
  - kind: ServiceAccount
    name: factorio-rollout
    namespace: factorio-lucca
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: factorio-rollout
  namespace: factorio-lucca
spec:
  schedule: "0 1 * * *"
  timeZone: "Europe/Paris"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 300
      template:
        spec:
          serviceAccountName: factorio-rollout
          restartPolicy: OnFailure
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            fsGroup: 65532
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: rollout
              image: registry.k8s.io/kubectl:v1.37.1
              command: ["kubectl"]
              args:
                - rollout
                - restart
                - deployment/factorio
                - -n
                - factorio-lucca
              env:
                - name: HOME
                  value: /tmp
              volumeMounts:
                - name: tmp
                  mountPath: /tmp
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
              resources:
                requests: { cpu: "10m", memory: "32Mi" }
                limits: { cpu: "200m", memory: "128Mi" }
          volumes:
            - name: tmp
              emptyDir: {}
