---
# The generator script and the local source patches stay as manifests: they are
# 70+ kB of content, which has no place in a chart's values.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: trmnl-server-config
  namespace: argocd
spec:
  project: default
  syncPolicy:
    automated:
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
  destination:
    server: https://kubernetes.default.svc
    namespace: trmnl-server
  source:
    repoURL: https://github.com/qjoly/gitops.git
    targetRevision: HEAD
    path: mocha/apps/trmnl-server/manifests
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: trmnl-server
  namespace: argocd
spec:
  project: default
  syncPolicy:
    automated:
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
  destination:
    server: https://kubernetes.default.svc
    namespace: trmnl-server
  source:
    repoURL: https://rubxkube.github.io/charts
    chart: trmnl-server
    targetRevision: 0.1.0
    helm:
      values: |
        server:
          hostname: trmnl.mocha.thoughtless.eu
          extraEnv:
            SCREEN_SLOTS: "3"
          patch:
            enabled: true
            configMapName: trmnl-server-patch
            files:
              - trmnl_server.py
              - config.py

        persistence:
          storageClassName: openebs-lvmpv

        # signoz-api-key and trmnl-upload-token come from Vault via the
        # ExternalSecrets in manifests/externalsecret.yaml.
        generator:
          enabled: true
          activeDeadlineSeconds: 300
          configMapName: image-generator-script
          secretEnv:
            - envName: SIGNOZ_API_KEY
              name: signoz-api-key
              key: api_key
          env:
            CLUSTERS: mocha,turing
          # One subject per slot; the display cycles through them by itself.
          screens:
            - name: health
              env:
                SCREEN: HEALTH
                SLOT: "0"
            - name: volumes
              env:
                SCREEN: VOLUMES
                SLOT: "1"
            - name: resources
              env:
                SCREEN: RESOURCES
                SLOT: "2"

        ingressRoute:
          enabled: true

        certificate:
          enabled: true
          issuerRef:
            name: cloudflare
            kind: ClusterIssuer
