---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: trmnl-server
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: trmnl-server
  template:
    metadata:
      labels:
        app: trmnl-server
    spec:
      initContainers:
        - name: clone
          image: alpine/git:2.47.2
          workingDir: /app
          command:
            - sh
            - -c
            - |
              set -e
              if [ -d /app/.git ]; then
                git -C /app fetch origin
                git -C /app checkout 5e2a83bc8ab78214c1f1132048d65945888117ec
              else
                rm -rf /tmp/clone
                git clone https://github.com/ohAnd/trmnlServer.git /tmp/clone
                git -C /tmp/clone checkout 5e2a83bc8ab78214c1f1132048d65945888117ec
                cp -a /tmp/clone/. /app/
                rm -rf /tmp/clone
              fi
          volumeMounts:
            - name: data
              mountPath: /app
        - name: deps
          image: python:3.12-slim
          workingDir: /app
          command:
            - sh
            - -c
            - pip install --no-cache-dir --target=/app/deps -r requirements.txt
          volumeMounts:
            - name: data
              mountPath: /app
      containers:
        - name: trmnl-server
          image: python:3.12-slim
          workingDir: /app
          command:
            - python
            - trmnl_server.py
          env:
            - name: PYTHONPATH
              value: /app/deps
            - name: SERVER_HOSTNAME
              value: "trmnl.mocha.thoughtless.eu"
            - name: SERVER_PORT
              value: "83"
          ports:
            - name: https
              containerPort: 83
          volumeMounts:
            - name: data
              mountPath: /app
            - name: patch
              mountPath: /app/trmnl_server.py
              subPath: trmnl_server.py
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 256Mi
          readinessProbe:
            tcpSocket:
              port: 83
            initialDelaySeconds: 10
            periodSeconds: 15
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: trmnl-server-data
        - name: patch
          configMap:
            name: trmnl-server-patch
