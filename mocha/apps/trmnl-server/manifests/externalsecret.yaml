---
# One Vault key holds the three values the server and its generator need.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: trmnl-upload-token
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault-backend
  target:
    name: trmnl-upload-token
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: token
      remoteRef:
        key: trmnl-server
        property: upload_token
