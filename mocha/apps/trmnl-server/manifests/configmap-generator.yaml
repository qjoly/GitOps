---
apiVersion: v1
kind: ConfigMap
metadata:
  name: image-generator-script
data:
  generate_image.py: |
    #!/usr/bin/env python3
    """
    Generates the screen images for the self-hosted trmnl-server.

    The device cycles through the slots on its own (slot_index in the patched
    trmnl_server.py), so each slot holds a fixed subject rather than a rotation
    driven from here:

      slot 0 - HEALTH    : active alerts, then ArgoCD applications off their target
      slot 1 - VOLUMES   : PVC fill per cluster
      slot 2 - RESOURCES : CPU and memory, used and reserved, then per-node detail

    Every screen puts the clusters side by side so they can be compared without
    waiting for the display to flip.
    """
    import os
    import sys
    import time
    from datetime import datetime
    from zoneinfo import ZoneInfo
    from io import BytesIO
    import requests
    from PIL import Image, ImageDraw, ImageFont

    DISPLAY_TZ = ZoneInfo(os.environ.get("DISPLAY_TZ", "Europe/Paris"))

    SIGNOZ_URL = os.environ.get("SIGNOZ_URL", "http://signoz.signoz.svc.cluster.local:8080")
    SIGNOZ_KEY = os.environ["SIGNOZ_API_KEY"]
    CLUSTERS = [c.strip() for c in os.environ.get("CLUSTERS", "mocha,turing").split(",") if c.strip()]
    SCREEN = os.environ.get("SCREEN", "HEALTH").upper()
    SLOT = os.environ.get("SLOT", "0")
    UPLOAD_URL = os.environ.get(
        "UPLOAD_URL",
        f"https://trmnl-server.trmnl-server.svc.cluster.local:443/custom/upload_screen?slot={SLOT}",
    )
    UPLOAD_TOKEN = os.environ["UPLOAD_TOKEN"]

    WIDTH, HEIGHT = 800, 480
    MARGIN = 14
    TOPBAR_H = 32
    GUTTER = 16
    COL_W = (WIDTH - MARGIN * 2 - GUTTER) // 2

    F_BAR = 21      # top bar
    F_CLUSTER = 19  # cluster name, white on black
    F_BODY = 16
    F_SMALL = 13

    DISK_WARN_PCT = float(os.environ.get("DISK_WARN_PCT", "85"))
    NODE_WARN_PCT = float(os.environ.get("NODE_WARN_PCT", "85"))

    session = requests.Session()
    session.headers.update({"SIGNOZ-API-KEY": SIGNOZ_KEY, "Content-Type": "application/json"})


    def now_ms():
        return int(time.time() * 1000)


    def scalar_query(queries, window_ms=1_800_000):
        """Runs a scalar query_range and returns {queryName: [row, ...]}."""
        end = now_ms()
        body = {
            "schemaVersion": "v1",
            "start": end - window_ms,
            "end": end,
            "requestType": "scalar",
            "compositeQuery": {"queries": queries},
            "formatOptions": {"formatTableResultForUI": False, "fillGaps": False},
        }
        resp = session.post(f"{SIGNOZ_URL}/api/v5/query_range", json=body, timeout=20)
        resp.raise_for_status()
        return {r["queryName"]: (r.get("data") or []) for r in resp.json()["data"]["data"]["results"]}


    def metric_query(name, metric, time_agg, space_agg, group_by, expression, disabled=False):
        return {
            "type": "builder_query",
            "spec": {
                "name": name,
                "signal": "metrics",
                "disabled": disabled,
                "aggregations": [
                    {
                        "metricName": metric,
                        "timeAggregation": time_agg,
                        "spaceAggregation": space_agg,
                        "reduceTo": "last",
                    }
                ],
                "filter": {"expression": expression},
                "groupBy": [{"name": g, "fieldContext": "resource"} for g in group_by],
            },
        }


    def get_active_alerts():
        """SigNoz rules are not scoped to a cluster. A rule carrying a `cluster`
        label is attributed to it; everything else is treated as global."""
        resp = session.get(f"{SIGNOZ_URL}/api/v1/rules", timeout=15)
        resp.raise_for_status()
        alerts = []
        for rule in resp.json()["data"]["rules"]:
            if rule.get("state") in ("inactive", "disabled"):
                continue
            labels = rule.get("labels") or {}
            alerts.append(
                {
                    "name": rule["alert"],
                    "critical": labels.get("severity") == "critical",
                    "cluster": labels.get("cluster"),
                }
            )
        alerts.sort(key=lambda a: not a["critical"])
        return alerts


    def get_argocd_drift(cluster):
        """argocd_app_info carries one series per application, valued 1, with the
        sync and health state as attributes. Counting series therefore counts
        applications."""
        base = f"k8s.cluster.name = '{cluster}'"
        results = scalar_query(
            [
                metric_query("A", "argocd_app_info", "latest", "count", [], base),
                metric_query("B", "argocd_app_info", "latest", "count", ["name"],
                             f"{base} AND sync_status != 'Synced'"),
                metric_query("C", "argocd_app_info", "latest", "count", ["name"],
                             f"{base} AND health_status != 'Healthy'"),
            ]
        )
        total = int(results.get("A", [[0]])[0][-1]) if results.get("A") else 0
        out_of_sync = [r[0] for r in results.get("B", [])]
        degraded = [r[0] for r in results.get("C", [])]
        return {"total": total, "out_of_sync": out_of_sync, "degraded": degraded}


    def get_cluster_resources(cluster):
        where = f"k8s.cluster.name = '{cluster}'"
        results = scalar_query(
            [
                metric_query("A", "k8s.node.cpu.time", "rate", "sum", [], where),
                metric_query("B", "k8s.node.allocatable_cpu", "latest", "sum", [], where),
                metric_query("C", "k8s.node.memory.working_set", "latest", "sum", [], where),
                metric_query("D", "k8s.node.allocatable_memory", "latest", "sum", [], where),
                metric_query("E", "k8s.container.cpu_request", "latest", "sum", [], where),
                metric_query("F", "k8s.container.memory_request", "latest", "sum", [], where),
                metric_query("G", "k8s.pod.phase", "latest", "count", [], where),
                metric_query("H", "k8s.namespace.phase", "latest", "count", [], where),
                metric_query("I", "k8s.deployment.desired", "latest", "sum", [], where),
                metric_query("J", "k8s.deployment.available", "latest", "sum", [], where),
                metric_query("K", "k8s.node.condition_ready", "latest", "sum", [], where),
            ]
        )

        def one(key):
            rows = results.get(key) or []
            return rows[0][-1] if rows else None

        cpu_alloc, mem_alloc = one("B"), one("D")
        return {
            "cpu_used_pct": 100 * one("A") / cpu_alloc if one("A") and cpu_alloc else None,
            "cpu_req_pct": 100 * one("E") / cpu_alloc if one("E") and cpu_alloc else None,
            "mem_used_pct": 100 * one("C") / mem_alloc if one("C") and mem_alloc else None,
            "mem_req_pct": 100 * one("F") / mem_alloc if one("F") and mem_alloc else None,
            "cpu_label": f"{one('A'):.1f} used / {one('E'):.1f} req of {cpu_alloc:.0f}c"
            if one("A") and one("E") and cpu_alloc else "",
            "mem_label": f"{human_bytes(one('C'))} used / {human_bytes(one('F'))} req "
            f"of {human_bytes(mem_alloc)}" if one("C") and one("F") and mem_alloc else "",
            "nodes": int(one("K")) if one("K") else 0,
            "pods": int(one("G")) if one("G") else 0,
            "namespaces": int(one("H")) if one("H") else 0,
            "replicas_desired": int(one("I")) if one("I") else 0,
            "replicas_available": int(one("J")) if one("J") else 0,
        }


    def get_disk_usage(cluster):
        """Fill ratio per PVC. The metric also covers configMap/secret/emptyDir
        volumes, whose claim name is present but empty - without the filter they
        come back as the node filesystem."""
        where = f"k8s.cluster.name = '{cluster}' AND k8s.persistentvolumeclaim.name != ''"
        group = ["k8s.namespace.name", "k8s.persistentvolumeclaim.name"]
        results = scalar_query(
            [
                metric_query("A", "k8s.volume.available", "latest", "max", group, where, disabled=True),
                metric_query("B", "k8s.volume.capacity", "latest", "max", group, where, disabled=True),
                {"type": "builder_formula", "spec": {"name": "F1", "expression": "(1 - A/B) * 100"}},
                metric_query("C", "k8s.volume.capacity", "latest", "max", group, where),
            ]
        )
        sizes = {(r[0], r[1]): r[-1] for r in results.get("C", [])}
        volumes = [
            {"ns": r[0], "pvc": r[1], "pct": r[-1], "size": sizes.get((r[0], r[1]))}
            for r in results.get("F1", [])
        ]
        # PVCs sharing one filesystem (CephFS on turing) all report the pool rather
        # than the claim, and would otherwise repeat the same row.
        groups = {}
        for vol in volumes:
            groups.setdefault((round(vol["pct"], 1), round((vol["size"] or 0) / 1e9, 1)), []).append(vol)
        merged = []
        for members in groups.values():
            head = members[0]
            if len(members) > 1:
                head = dict(head, ns="", pvc=f"{len(members)} PVCs, shared volume")
            merged.append(head)
        merged.sort(key=lambda v: v["pct"], reverse=True)
        return merged


    def get_node_usage(cluster):
        where = f"k8s.cluster.name = '{cluster}'"
        group = ["k8s.node.name"]
        results = scalar_query(
            [
                metric_query("A", "k8s.node.cpu.time", "rate", "sum", group, where),
                metric_query("B", "k8s.node.allocatable_cpu", "latest", "max", group, where),
                metric_query("C", "k8s.node.memory.working_set", "latest", "max", group, where),
                metric_query("D", "k8s.node.allocatable_memory", "latest", "max", group, where),
            ]
        )
        by_name = {}
        for key, rows in results.items():
            for row in rows:
                by_name.setdefault(row[0], {})[key] = row[-1]
        nodes = []
        for name, v in sorted(by_name.items()):
            cpu_used, cpu_total = v.get("A"), v.get("B")
            mem_used, mem_total = v.get("C"), v.get("D")
            nodes.append(
                {
                    "name": name,
                    "cpu_pct": 100 * cpu_used / cpu_total if cpu_used and cpu_total else None,
                    "mem_pct": 100 * mem_used / mem_total if mem_used and mem_total else None,
                    "cpu_label": f"{cpu_used:.1f}/{cpu_total:.0f}c" if cpu_used and cpu_total else "",
                    "mem_label": f"{human_bytes(mem_used)}/{human_bytes(mem_total)}" if mem_used else "",
                }
            )
        return nodes


    _UNICODE_TO_ASCII = {
        "—": "-",
        "–": "-",
        "‘": "'",
        "’": "'",
        "“": '"',
        "”": '"',
        "…": "...",
        "•": "-",
    }


    def sanitize(value):
        value = "" if value is None else str(value)
        for uni, ascii_ in _UNICODE_TO_ASCII.items():
            value = value.replace(uni, ascii_)
        return value


    def font(size):
        return ImageFont.load_default(size=size)


    def text(draw, xy, body, size, bold=False, fill=0, anchor=None):
        """stroke_width fakes a bold weight; the bundled font ships regular only."""
        draw.text(
            xy,
            sanitize(body),
            font=font(size),
            fill=fill,
            anchor=anchor,
            stroke_width=1 if bold else 0,
            stroke_fill=fill,
        )


    def fit(draw, body, size, max_width):
        """Middle ellipsis: PVC and node names are told apart by their tail."""
        body = sanitize(body)
        f = font(size)
        if draw.textlength(body, font=f) <= max_width:
            return body
        lo, hi = 1, len(body)
        while lo < hi:
            mid = (lo + hi + 1) // 2
            if draw.textlength(f"{body[: mid // 2]}..{body[-(mid - mid // 2):]}", font=f) <= max_width:
                lo = mid
            else:
                hi = mid - 1
        return f"{body[: lo // 2]}..{body[-(lo - lo // 2):]}"


    def plural(count, singular):
        return f"{count} {singular}{'' if count == 1 else 's'}"


    def human_bytes(value):
        if value is None:
            return "?"
        for unit in ("B", "K", "M", "G", "T"):
            if value < 1024:
                return f"{value:.0f}{unit}"
            value /= 1024
        return f"{value:.0f}P"


    def band(draw, x, y, w, label, size=F_CLUSTER, right=None):
        """Filled bar with reversed text - the only section marker that still
        separates cleanly once the content is this dense."""
        h = size + 9
        draw.rectangle((x, y, x + w, y + h), fill=0)
        text(draw, (x + 7, y + 3), label, size, bold=True, fill=1)
        if right:
            text(draw, (x + w - 7, y + 4), right, F_SMALL, fill=1, anchor="ra")
        return y + h + 6


    def mini_bar(draw, x, y, w, h, frac):
        draw.rectangle((x, y, x + w, y + h), outline=0, width=1)
        inner = w - 4
        filled = int(max(0.0, min(1.0, frac)) * inner)
        if filled > 0:
            draw.rectangle((x + 2, y + 2, x + 2 + filled, y + h - 2), fill=0)


    def pct_label(draw, right, y, pct, warn):
        label = "?" if pct is None else f"{pct:.0f}%"
        if warn:
            w = draw.textlength(label, font=font(F_BODY))
            draw.rectangle((right - w - 6, y - 2, right + 3, y + F_BODY + 4), fill=0)
            text(draw, (right, y), label, F_BODY, bold=True, fill=1, anchor="ra")
        else:
            text(draw, (right, y), label, F_BODY, bold=True, anchor="ra")


    def topbar(draw, title, note=""):
        draw.rectangle((0, 0, WIDTH, TOPBAR_H), fill=0)
        text(draw, (MARGIN, 4), title, F_BAR, bold=True, fill=1)
        stamp = datetime.now(DISPLAY_TZ).strftime("%a %d %b  %H:%M")
        text(draw, (WIDTH - MARGIN, 7), stamp, F_SMALL, fill=1, anchor="ra")
        if note:
            text(draw, (WIDTH // 2, 7), note, F_SMALL, fill=1, anchor="ma")
        return TOPBAR_H + 8


    def alert_block(draw, x, y, w, alerts, limit):
        for alert in alerts[:limit]:
            marker = (x + 2, y + 4, x + 11, y + 13)
            # Hollow for warnings, solid for critical.
            draw.rectangle(marker, outline=0, width=2, fill=0 if alert["critical"] else 1)
            scope = f"[{alert['cluster']}] " if alert["cluster"] else ""
            text(draw, (x + 18, y), fit(draw, scope + alert["name"], F_BODY, w - 20), F_BODY)
            y += F_BODY + 5
        if not alerts:
            text(draw, (x + 2, y), "No active alert", F_BODY)
            y += F_BODY + 5
        return y


    def node_block(draw, x, y, w, nodes):
        bar_x = x + 18
        bar_w = w - 18 - 56
        for node in nodes:
            text(draw, (x + 2, y), fit(draw, node["name"], F_BODY, w - 70), F_BODY, bold=True)
            text(draw, (x + w, y + 1), node["mem_label"], F_SMALL, anchor="ra")
            y += F_BODY + 4
            for key, label in (("cpu", "C"), ("mem", "R")):
                pct = node[f"{key}_pct"]
                text(draw, (x + 2, y - 2), label, F_SMALL)
                mini_bar(draw, bar_x, y, bar_w, 10, (pct or 0) / 100)
                pct_label(draw, x + w, y - 3, pct, pct is not None and pct >= NODE_WARN_PCT)
                y += 15
            y += 6
        if not nodes:
            text(draw, (x + 2, y), "No data", F_BODY)
            y += F_BODY + 5
        return y


    def volume_block(draw, x, y, w, volumes, limit, bottom):
        for vol in volumes[:limit]:
            if y + 28 > bottom:
                break
            warn = vol["pct"] is not None and vol["pct"] >= DISK_WARN_PCT
            name = f"{vol['ns']}/{vol['pvc']}" if vol["ns"] else vol["pvc"]
            text(draw, (x + 2, y), fit(draw, name, F_BODY, w - 92), F_BODY)
            text(draw, (x + w - 48, y + 1), human_bytes(vol["size"]), F_SMALL, anchor="ra")
            pct_label(draw, x + w, y, vol["pct"], warn)
            y += F_BODY + 3
            mini_bar(draw, x + 2, y, w - 4, 9, (vol["pct"] or 0) / 100)
            y += 18
        if not volumes:
            text(draw, (x + 2, y), "No data", F_BODY)
        return y


    def drift_block(draw, x, y, w, drift):
        if drift["total"] == 0:
            text(draw, (x + 2, y), "No metrics", F_BODY)
            return y + F_BODY + 5
        if not drift["out_of_sync"] and not drift["degraded"]:
            text(draw, (x + 2, y), "All synced and healthy", F_BODY)
            return y + F_BODY + 5
        for label, names, solid in (
            ("Degraded", drift["degraded"], True),
            ("OutOfSync", drift["out_of_sync"], False),
        ):
            if not names:
                continue
            text(draw, (x + 2, y), f"{label} ({len(names)})", F_SMALL, bold=True)
            y += F_SMALL + 4
            for name in names[:6]:
                marker = (x + 6, y + 4, x + 13, y + 11)
                draw.rectangle(marker, outline=0, width=2, fill=0 if solid else 1)
                text(draw, (x + 20, y), fit(draw, name, F_BODY, w - 22), F_BODY)
                y += F_BODY + 4
            if len(names) > 6:
                text(draw, (x + 20, y), f"+{len(names) - 6} more", F_SMALL)
                y += F_SMALL + 4
            y += 4
        return y


    def meter(draw, x, y, w, label, used_pct, req_pct, detail):
        """Two bars per resource: what is actually consumed, and what is reserved by
        requests. Reserved above 100% is the interesting case, so it is not clamped
        out of sight - the percentage stays readable even when the bar is full."""
        text(draw, (x + 2, y), label, F_SMALL, bold=True)
        text(draw, (x + w, y), detail, F_SMALL, anchor="ra")
        y += F_SMALL + 4
        for tag, pct in (("used", used_pct), ("req", req_pct)):
            text(draw, (x + 2, y - 1), tag, F_SMALL)
            mini_bar(draw, x + 34, y, w - 34 - 46, 10, (pct or 0) / 100)
            pct_label(draw, x + w, y - 3, pct, pct is not None and pct >= 100)
            y += 15
        return y + 5


    def screen_health(draw):
        alerts = get_active_alerts()
        firing = len(alerts)
        y = topbar(draw, "HEALTH")

        y = band(draw, MARGIN, y, WIDTH - MARGIN * 2, "ALERTS", right=f"{firing} firing")
        y = alert_block(draw, MARGIN, y, WIDTH - MARGIN * 2, alerts, 5) + 8

        for index, cluster in enumerate(CLUSTERS[:2]):
            x = MARGIN + index * (COL_W + GUTTER)
            try:
                drift = get_argocd_drift(cluster)
            except Exception as e:
                print(f"[warn] argocd for {cluster}: {e}", file=sys.stderr)
                drift = {"total": 0, "out_of_sync": [], "degraded": []}
            col_y = band(draw, x, y, COL_W, cluster.upper(), right=plural(drift["total"], "app"))
            drift_block(draw, x, col_y, COL_W, drift)

        mid = MARGIN + COL_W + GUTTER // 2
        draw.line((mid, y, mid, HEIGHT - MARGIN), fill=0, width=1)


    def screen_volumes(draw):
        y = topbar(draw, "VOLUMES")
        for index, cluster in enumerate(CLUSTERS[:2]):
            x = MARGIN + index * (COL_W + GUTTER)
            try:
                volumes = get_disk_usage(cluster)
            except Exception as e:
                print(f"[warn] volumes for {cluster}: {e}", file=sys.stderr)
                volumes = []
            over = sum(1 for v in volumes if v["pct"] and v["pct"] >= DISK_WARN_PCT)
            col_y = band(draw, x, y, COL_W, cluster.upper(),
                         right=f"{over} over {DISK_WARN_PCT:.0f}%" if over
                         else plural(len(volumes), "volume"))
            volume_block(draw, x, col_y, COL_W, volumes, 12, HEIGHT - MARGIN)

        mid = MARGIN + COL_W + GUTTER // 2
        draw.line((mid, y, mid, HEIGHT - MARGIN), fill=0, width=1)


    def screen_resources(draw):
        y = topbar(draw, "RESOURCES")
        for index, cluster in enumerate(CLUSTERS[:2]):
            x = MARGIN + index * (COL_W + GUTTER)
            try:
                res = get_cluster_resources(cluster)
            except Exception as e:
                print(f"[warn] resources for {cluster}: {e}", file=sys.stderr)
                res = None
            try:
                nodes = get_node_usage(cluster)
            except Exception as e:
                print(f"[warn] nodes for {cluster}: {e}", file=sys.stderr)
                nodes = []

            col_y = band(draw, x, y, COL_W, cluster.upper(),
                         right=plural(res["nodes"] if res else len(nodes), "node"))
            if not res:
                text(draw, (x + 2, col_y), "No data", F_BODY)
                continue

            # k8s.deployment.* counts replicas, not Deployment objects.
            short = res["replicas_desired"] - res["replicas_available"]
            counters = f"{res['pods']} pods   {res['namespaces']} ns   " + (
                f"{plural(short, 'replica')} short" if short > 0
                else plural(res["replicas_desired"], "replica")
            )
            text(draw, (x + 2, col_y), counters, F_BODY)
            col_y += F_BODY + 8

            col_y = meter(draw, x, col_y, COL_W, "CPU", res["cpu_used_pct"], res["cpu_req_pct"],
                          res["cpu_label"])
            col_y = meter(draw, x, col_y, COL_W, "MEMORY", res["mem_used_pct"], res["mem_req_pct"],
                          res["mem_label"])
            col_y = band(draw, x, col_y, COL_W, "NODES", size=F_SMALL + 2)
            node_block(draw, x, col_y, COL_W, nodes[:4])

        mid = MARGIN + COL_W + GUTTER // 2
        draw.line((mid, y, mid, HEIGHT - MARGIN), fill=0, width=1)


    SCREENS = {
        "HEALTH": screen_health,
        "VOLUMES": screen_volumes,
        "RESOURCES": screen_resources,
    }


    def render():
        img = Image.new("1", (WIDTH, HEIGHT), 1)
        draw = ImageDraw.Draw(img)
        SCREENS[SCREEN](draw)
        return img


    def main():
        try:
            img = render()
        except Exception as e:
            print(f"[error] screen {SCREEN} failed: {e}", file=sys.stderr)
            img = Image.new("1", (WIDTH, HEIGHT), 1)
            draw = ImageDraw.Draw(img)
            topbar(draw, SCREEN, "collection failed")
            text(draw, (WIDTH // 2, HEIGHT // 2), "NO DATA", 60, bold=True, anchor="mm")

        if os.environ.get("PREVIEW_PATH"):
            img.save(os.environ["PREVIEW_PATH"])
            print(f"wrote preview to {os.environ['PREVIEW_PATH']}")
            return

        buf = BytesIO()
        img.save(buf, format="BMP")
        resp = requests.post(
            UPLOAD_URL,
            data=buf.getvalue(),
            headers={"Authorization": f"Bearer {UPLOAD_TOKEN}", "Content-Type": "image/bmp"},
            verify=False,  # backend uses a self-signed cert, this call stays inside the cluster
            timeout=15,
        )
        resp.raise_for_status()
        print(f"uploaded {SCREEN} to slot {SLOT}: {resp.json()}")


    if __name__ == "__main__":
        main()
