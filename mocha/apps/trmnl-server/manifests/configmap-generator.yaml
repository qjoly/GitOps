---
apiVersion: v1
kind: ConfigMap
metadata:
  name: image-generator-script
data:
  generate_image.py: |
    #!/usr/bin/env python3
    """
    Generates the screen image for the self-hosted trmnl-server.

    The display hangs on a wall and is read from a few metres away, which caps the
    useful content at a handful of lines. Rather than shrinking everything to fit,
    the screen shows one subject per refresh and rotates between them:

      0 - ALERTS : active SigNoz alerts
      1 - DISK   : fullest PVCs on the cluster
      2 - NODES  : CPU and memory pressure per node

    The rotation is derived from the clock rather than stored, since the CronJob
    keeps no state between runs. The slot is folded in so the two screens never
    show the same panel at the same time.
    """
    import os
    import sys
    import time
    from datetime import datetime
    from zoneinfo import ZoneInfo
    from io import BytesIO
    import requests
    from PIL import Image, ImageDraw, ImageFont

    DISPLAY_TZ = ZoneInfo(os.environ.get("DISPLAY_TZ", "Europe/Paris"))

    SIGNOZ_URL = os.environ.get("SIGNOZ_URL", "http://signoz.signoz.svc.cluster.local:8080")
    SIGNOZ_KEY = os.environ["SIGNOZ_API_KEY"]
    CLUSTER_NAME = os.environ.get("CLUSTER_NAME", "mocha")
    SLOT = os.environ.get("SLOT", "0")  # "0" -> screen.bmp, "1" -> screen1.bmp
    UPLOAD_URL = os.environ.get(
        "UPLOAD_URL",
        f"https://trmnl-server.trmnl-server.svc.cluster.local:443/custom/upload_screen?slot={SLOT}",
    )
    UPLOAD_TOKEN = os.environ["UPLOAD_TOKEN"]

    WIDTH, HEIGHT = 800, 480
    HEADER_H = 62
    MARGIN = 22
    ROTATION_SECONDS = int(os.environ.get("ROTATION_SECONDS", "900"))
    DISK_WARN_PCT = float(os.environ.get("DISK_WARN_PCT", "85"))
    NODE_WARN_PCT = float(os.environ.get("NODE_WARN_PCT", "85"))

    session = requests.Session()
    session.headers.update({"SIGNOZ-API-KEY": SIGNOZ_KEY, "Content-Type": "application/json"})


    def now_ms():
        return int(time.time() * 1000)


    def scalar_query(queries, window_ms=1_800_000):
        """Runs a scalar query_range and returns {queryName: [(group..., value)]}."""
        end = now_ms()
        body = {
            "schemaVersion": "v1",
            "start": end - window_ms,
            "end": end,
            "requestType": "scalar",
            "compositeQuery": {"queries": queries},
            "formatOptions": {"formatTableResultForUI": False, "fillGaps": False},
        }
        resp = session.post(f"{SIGNOZ_URL}/api/v5/query_range", json=body, timeout=20)
        resp.raise_for_status()
        out = {}
        for result in resp.json()["data"]["data"]["results"]:
            out[result["queryName"]] = result.get("data") or []
        return out


    def metric_query(name, metric, time_agg, space_agg, group_by, expression, disabled=False):
        return {
            "type": "builder_query",
            "spec": {
                "name": name,
                "signal": "metrics",
                "disabled": disabled,
                "aggregations": [
                    {
                        "metricName": metric,
                        "timeAggregation": time_agg,
                        "spaceAggregation": space_agg,
                        "reduceTo": "last",
                    }
                ],
                "filter": {"expression": expression},
                "groupBy": [{"name": g, "fieldContext": "resource"} for g in group_by],
            },
        }


    def get_active_alerts():
        """SigNoz rules are not scoped to a cluster. A rule carrying a `cluster`
        label is honoured; everything else is treated as global and shown on both
        screens."""
        resp = session.get(f"{SIGNOZ_URL}/api/v1/rules", timeout=15)
        resp.raise_for_status()
        alerts = []
        for rule in resp.json()["data"]["rules"]:
            if rule.get("state") in ("inactive", "disabled"):
                continue
            labels = rule.get("labels") or {}
            if labels.get("cluster", CLUSTER_NAME) != CLUSTER_NAME:
                continue
            alerts.append({"name": rule["alert"], "critical": labels.get("severity") == "critical"})
        alerts.sort(key=lambda a: not a["critical"])
        return alerts


    def get_disk_usage():
        """Fill ratio per PVC. The metric also covers configMap/secret/emptyDir
        volumes, which carry an empty claim name and would otherwise show up as the
        node filesystem."""
        where = f"k8s.cluster.name = '{CLUSTER_NAME}' AND k8s.persistentvolumeclaim.name != ''"
        group = ["k8s.namespace.name", "k8s.persistentvolumeclaim.name"]
        results = scalar_query(
            [
                metric_query("A", "k8s.volume.available", "latest", "max", group, where, disabled=True),
                metric_query("B", "k8s.volume.capacity", "latest", "max", group, where, disabled=True),
                {"type": "builder_formula", "spec": {"name": "F1", "expression": "(1 - A/B) * 100"}},
                metric_query("C", "k8s.volume.capacity", "latest", "max", group, where),
            ]
        )
        sizes = {(r[0], r[1]): r[-1] for r in results.get("C", [])}
        volumes = []
        for row in results.get("F1", []):
            ns, pvc, pct = row[0], row[1], row[-1]
            volumes.append({"ns": ns, "pvc": pvc, "pct": pct, "size": sizes.get((ns, pvc))})
        # PVCs backed by one shared filesystem (CephFS on turing) all report the
        # pool, not the claim, and would otherwise fill the panel with the same row.
        collapsed = {}
        for vol in volumes:
            key = (round(vol["pct"], 1), round((vol["size"] or 0) / 1e9, 1))
            collapsed.setdefault(key, []).append(vol)
        merged = []
        for group in collapsed.values():
            head = group[0]
            if len(group) > 1:
                head = dict(head, ns="", pvc=f"{len(group)} PVCs on a shared volume")
            merged.append(head)
        merged.sort(key=lambda v: v["pct"], reverse=True)
        return merged


    def get_node_usage():
        where = f"k8s.cluster.name = '{CLUSTER_NAME}'"
        group = ["k8s.node.name"]
        results = scalar_query(
            [
                metric_query("A", "k8s.node.cpu.time", "rate", "sum", group, where),
                metric_query("B", "k8s.node.allocatable_cpu", "latest", "max", group, where),
                metric_query("C", "k8s.node.memory.working_set", "latest", "max", group, where),
                metric_query("D", "k8s.node.allocatable_memory", "latest", "max", group, where),
            ]
        )
        by_name = {}
        for key, rows in results.items():
            for row in rows:
                by_name.setdefault(row[0], {})[key] = row[-1]
        nodes = []
        for name, v in sorted(by_name.items()):
            cpu_used, cpu_total = v.get("A"), v.get("B")
            mem_used, mem_total = v.get("C"), v.get("D")
            nodes.append(
                {
                    "name": name,
                    "cpu_used": cpu_used,
                    "cpu_total": cpu_total,
                    "cpu_pct": 100 * cpu_used / cpu_total if cpu_used and cpu_total else None,
                    "mem_used": mem_used,
                    "mem_total": mem_total,
                    "mem_pct": 100 * mem_used / mem_total if mem_used and mem_total else None,
                }
            )
        return nodes


    _UNICODE_TO_ASCII = {
        "—": "-",
        "–": "-",
        "‘": "'",
        "’": "'",
        "“": '"',
        "”": '"',
        "…": "...",
        "•": "-",
    }


    def sanitize(text):
        text = "" if text is None else str(text)
        for uni, ascii_ in _UNICODE_TO_ASCII.items():
            text = text.replace(uni, ascii_)
        return text


    def font(size):
        return ImageFont.load_default(size=size)


    def text(draw, xy, body, size, bold=False, fill=0, anchor=None):
        """stroke_width fakes a bold weight; the bundled font ships regular only."""
        draw.text(
            xy,
            sanitize(body),
            font=font(size),
            fill=fill,
            anchor=anchor,
            stroke_width=max(1, size // 22) if bold else 0,
            stroke_fill=fill,
        )


    def fit(draw, body, size, max_width, bold=False):
        """Shortens with a middle ellipsis: PVC and pod names differ by their tail."""
        body = sanitize(body)
        f = font(size)
        if draw.textlength(body, font=f) <= max_width:
            return body
        lo, hi = 1, len(body)
        while lo < hi:
            mid = (lo + hi + 1) // 2
            head, tail = body[: mid // 2], body[-(mid - mid // 2) :]
            if draw.textlength(f"{head}..{tail}", font=f) <= max_width:
                lo = mid
            else:
                hi = mid - 1
        return f"{body[: lo // 2]}..{body[-(lo - lo // 2):]}"


    def human_bytes(value):
        if value is None:
            return "?"
        for unit in ("B", "K", "M", "G", "T"):
            if value < 1024:
                return f"{value:.0f}{unit}" if unit != "B" else f"{value:.0f}B"
            value /= 1024
        return f"{value:.0f}P"


    def draw_bar(draw, x, y, w, h, frac):
        draw.rectangle((x, y, x + w, y + h), outline=0, width=3)
        inner = w - 8
        filled = int(max(0.0, min(1.0, frac)) * inner)
        if filled > 0:
            draw.rectangle((x + 4, y + 4, x + 4 + filled, y + h - 4), fill=0)


    def draw_pct(draw, right, y, pct, size, warn):
        """Warning levels get the inverted treatment - it is the only emphasis that
        survives at this viewing distance."""
        label = "?" if pct is None else f"{pct:.0f}%"
        w = draw.textlength(label, font=font(size))
        if warn:
            draw.rectangle((right - w - 14, y - 6, right + 6, y + size + 8), fill=0)
            text(draw, (right, y), label, size, bold=True, fill=1, anchor="ra")
        else:
            text(draw, (right, y), label, size, bold=True, anchor="ra")


    def draw_header(img, draw, panel_name):
        draw.rectangle((0, 0, WIDTH, HEADER_H), fill=0)
        text(draw, (MARGIN, 10), CLUSTER_NAME.upper(), 38, bold=True, fill=1)
        text(draw, (WIDTH - MARGIN, 16), panel_name, 30, bold=True, fill=1, anchor="ra")


    def draw_footer(draw, index):
        """Dots show where the rotation stands, so a glance tells you another
        subject is coming rather than that the screen is stuck."""
        stamp = datetime.now(DISPLAY_TZ).strftime("%a %d %b %H:%M")
        text(draw, (WIDTH - MARGIN, HEIGHT - 26), stamp, 18, anchor="ra")
        x = MARGIN
        for i in range(len(PANELS)):
            box = (x, HEIGHT - 22, x + 12, HEIGHT - 10)
            draw.rectangle(box, outline=0, width=2, fill=0 if i == index else 1)
            x += 20


    def panel_alerts(draw, alerts):
        top = HEADER_H + 40
        if not alerts:
            text(draw, (WIDTH // 2, top + 40), "ALL CLEAR", 110, bold=True, anchor="ma")
            text(draw, (WIDTH // 2, top + 210), "no active alert", 36, anchor="ma")
            return
        count = str(len(alerts))
        text(draw, (MARGIN, top - 10), count, 150, bold=True)
        number_w = draw.textlength(count, font=font(150))
        label = "ALERT FIRING" if len(alerts) == 1 else "ALERTS FIRING"
        text(draw, (MARGIN + number_w + 30, top + 50), label, 40, bold=True)
        y = top + 170
        for alert in alerts[:3]:
            if y > HEIGHT - 80:
                break
            marker = (MARGIN, y + 10, MARGIN + 18, y + 28)
            # Hollow marker for warnings, solid for critical.
            draw.rectangle(marker, outline=0, width=3, fill=0 if alert["critical"] else 1)
            text(draw, (MARGIN + 36, y), fit(draw, alert["name"], 34, WIDTH - MARGIN * 2 - 36), 34)
            y += 52


    def panel_disk(draw, volumes):
        top = HEADER_H + 20
        if not volumes:
            text(draw, (WIDTH // 2, top + 80), "NO DATA", 90, bold=True, anchor="ma")
            return
        row_h = 96
        pct_w = 150
        for vol in volumes[:4]:
            warn = vol["pct"] is not None and vol["pct"] >= DISK_WARN_PCT
            name = f"{vol['ns']}/{vol['pvc']}" if vol["ns"] else vol["pvc"]
            text(draw, (MARGIN, top), fit(draw, name, 30, WIDTH - MARGIN * 2 - pct_w), 30)
            draw_pct(draw, WIDTH - MARGIN, top, vol["pct"], 38, warn)
            size = human_bytes(vol["size"])
            text(draw, (WIDTH - MARGIN, top + 46), size, 22, anchor="ra")
            draw_bar(draw, MARGIN, top + 44, WIDTH - MARGIN * 2 - 80, 36, (vol["pct"] or 0) / 100)
            top += row_h


    def _node_rows(node):
        return (
            ("cpu", "CPU", f"{node['cpu_used']:.1f}/{node['cpu_total']:.0f}c"
             if node["cpu_used"] is not None and node["cpu_total"] else ""),
            ("mem", "RAM", f"{human_bytes(node['mem_used'])}/{human_bytes(node['mem_total'])}"
             if node["mem_used"] is not None else ""),
        )


    def panel_nodes(draw, nodes):
        top = HEADER_H + 18
        available = HEIGHT - top - 46
        if not nodes:
            text(draw, (WIDTH // 2, top + 80), "NO DATA", 90, bold=True, anchor="ma")
            return
        visible = nodes[:4]
        block = available // len(visible)

        if len(visible) <= 2:
            # Room to breathe: node name on its own line, thick bars, absolute values.
            bar_h = min(66, (block - 60) // 2 - 8)
            name_size = 40
            node_h = name_size + 10 + bar_h * 2 + 20
            y = top + max(0, (available - node_h * len(visible)) // 2)
            bar_x, right_w = MARGIN + 92, 160
            bar_w = WIDTH - MARGIN - right_w - bar_x
            for node in visible:
                text(draw, (MARGIN, y), fit(draw, node["name"], name_size, WIDTH - MARGIN * 2),
                     name_size, bold=True)
                row = y + name_size + 10
                for key, label, detail in _node_rows(node):
                    pct = node[f"{key}_pct"]
                    text(draw, (MARGIN, row + (bar_h - 26) // 2), label, 26)
                    draw_bar(draw, bar_x, row, bar_w, bar_h, (pct or 0) / 100)
                    draw_pct(draw, WIDTH - MARGIN, row, pct, 34, pct is not None and pct >= NODE_WARN_PCT)
                    if detail:
                        text(draw, (WIDTH - MARGIN, row + 40), detail, 20, anchor="ra")
                    row += bar_h + 6
                y += node_h
            return

        # Three nodes or more: the name moves to a left column and the bars thin
        # out. Bar length still carries the reading, so height can go.
        name_size = 28
        bar_h = max(18, min(30, (block - 22) // 2 - 6))
        name_w = 180
        bar_x = MARGIN + name_w + 42
        right_w = 110
        bar_w = WIDTH - MARGIN - right_w - bar_x
        y = top + max(0, (available - block * len(visible)) // 2)
        for node in visible:
            pair_h = bar_h * 2 + 6
            text(draw, (MARGIN, y + (pair_h - name_size) // 2),
                 fit(draw, node["name"], name_size, name_w), name_size, bold=True)
            row = y
            for key, label, _ in _node_rows(node):
                pct = node[f"{key}_pct"]
                text(draw, (bar_x - 32, row + (bar_h - 20) // 2), label[0], 20)
                draw_bar(draw, bar_x, row, bar_w, bar_h, (pct or 0) / 100)
                draw_pct(draw, WIDTH - MARGIN, row - 2, pct, 26,
                         pct is not None and pct >= NODE_WARN_PCT)
                row += bar_h + 6
            y += block
        if len(nodes) > len(visible):
            text(draw, (WIDTH - MARGIN, HEIGHT - 48), f"+{len(nodes) - len(visible)} more", 20, anchor="ra")


    PANELS = ("ALERTS", "DISK", "NODES")


    def current_panel():
        override = os.environ.get("PANEL")
        if override:
            return PANELS.index(override.upper())
        # Offsetting by the slot keeps the two screens on different subjects.
        return (int(time.time()) // ROTATION_SECONDS + int(SLOT)) % len(PANELS)


    def render(index):
        img = Image.new("1", (WIDTH, HEIGHT), 1)
        draw = ImageDraw.Draw(img)
        name = PANELS[index]
        draw_header(img, draw, name)

        if name == "ALERTS":
            panel_alerts(draw, get_active_alerts())
        elif name == "DISK":
            panel_disk(draw, get_disk_usage())
        else:
            panel_nodes(draw, get_node_usage())

        draw_footer(draw, index)
        return img


    def main():
        index = current_panel()
        try:
            img = render(index)
        except Exception as e:
            print(f"[error] panel {PANELS[index]} failed: {e}", file=sys.stderr)
            img = Image.new("1", (WIDTH, HEIGHT), 1)
            draw = ImageDraw.Draw(img)
            draw_header(img, draw, PANELS[index])
            text(draw, (WIDTH // 2, HEADER_H + 120), "NO DATA", 90, bold=True, anchor="ma")
            text(draw, (WIDTH // 2, HEADER_H + 230), "collection failed", 30, anchor="ma")
            draw_footer(draw, index)

        buf = BytesIO()
        img.save(buf, format="BMP")

        if os.environ.get("PREVIEW_PATH"):
            img.save(os.environ["PREVIEW_PATH"])
            print(f"wrote preview to {os.environ['PREVIEW_PATH']}")
            return

        resp = requests.post(
            UPLOAD_URL,
            data=buf.getvalue(),
            headers={"Authorization": f"Bearer {UPLOAD_TOKEN}", "Content-Type": "image/bmp"},
            verify=False,  # backend uses a self-signed cert, this call stays inside the cluster
            timeout=15,
        )
        resp.raise_for_status()
        print(f"uploaded {PANELS[index]} to slot {SLOT}: {resp.json()}")


    if __name__ == "__main__":
        main()
