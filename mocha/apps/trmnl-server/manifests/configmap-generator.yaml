---
apiVersion: v1
kind: ConfigMap
metadata:
  name: image-generator-script
data:
  generate_image.py: |
    #!/usr/bin/env python3
    """
    Generates images/screen.bmp for the self-hosted trmnl-server, combining:
    - SigNoz active alerts (via /api/v1/rules)
    - SigNoz node CPU/memory (via /api/v5/query_range)
    - Recently-restarted pods (via /api/v5/query_range, delta over the window)
    - GitHub PRs authored by GH_USERNAME still awaiting review

    Runs as a Kubernetes CronJob, writes directly to /app/images/screen.bmp on
    the PVC shared with the trmnl-server Deployment.
    """
    import os
    import sys
    import time
    from datetime import datetime
    from zoneinfo import ZoneInfo
    from io import BytesIO
    import requests
    from PIL import Image, ImageDraw, ImageFont

    DISPLAY_TZ = ZoneInfo(os.environ.get("DISPLAY_TZ", "Europe/Paris"))

    SIGNOZ_URL = os.environ.get("SIGNOZ_URL", "http://signoz.signoz.svc.cluster.local:8080")
    SIGNOZ_KEY = os.environ["SIGNOZ_API_KEY"]
    CLUSTER_NAME = os.environ.get("CLUSTER_NAME", "mocha")
    GH_TOKEN = os.environ["GITHUB_TOKEN"]
    GH_USERNAME = os.environ.get("GITHUB_USERNAME", "qjoly")
    SLOT = os.environ.get("SLOT", "0")  # "0" -> screen.bmp, "1" -> screen1.bmp
    UPLOAD_URL = os.environ.get(
        "UPLOAD_URL",
        f"https://trmnl-server.trmnl-server.svc.cluster.local:443/custom/upload_screen?slot={SLOT}",
    )
    UPLOAD_TOKEN = os.environ["UPLOAD_TOKEN"]

    WIDTH, HEIGHT = 800, 480

    session = requests.Session()
    session.headers.update({"SIGNOZ-API-KEY": SIGNOZ_KEY, "Content-Type": "application/json"})


    def now_ms():
        return int(time.time() * 1000)


    def signoz_query_range(metric_name, time_agg, space_agg, group_by, window_ms=900_000):
        end = now_ms()
        start = end - window_ms
        body = {
            "schemaVersion": "v1",
            "start": start,
            "end": end,
            "requestType": "time_series",
            "compositeQuery": {
                "queries": [
                    {
                        "type": "builder_query",
                        "spec": {
                            "name": "A",
                            "signal": "metrics",
                            "aggregations": [
                                {
                                    "metricName": metric_name,
                                    "temporality": "",
                                    "timeAggregation": time_agg,
                                    "spaceAggregation": space_agg,
                                }
                            ],
                            "filter": {"expression": f"k8s.cluster.name = '{CLUSTER_NAME}'"},
                            "groupBy": [{"name": g} for g in group_by],
                            "disabled": False,
                        },
                    }
                ]
            },
        }
        resp = session.post(f"{SIGNOZ_URL}/api/v5/query_range", json=body, timeout=15)
        resp.raise_for_status()
        data = resp.json()
        series = data["data"]["data"]["results"][0]["aggregations"][0]["series"]
        out = {}
        for s in series:
            label = s["labels"][0]["value"] if s["labels"] else "?"
            values = [v["value"] for v in s["values"] if not v.get("partial")]
            if values:
                out[label] = values
        return out


    def get_active_alerts():
        resp = session.get(f"{SIGNOZ_URL}/api/v1/rules", timeout=15)
        resp.raise_for_status()
        rules = resp.json()["data"]["rules"]
        return [r["alert"] for r in rules if r.get("state") not in ("inactive", "disabled")]


    def get_node_stats():
        mem = signoz_query_range("k8s.node.memory.working_set", "latest", "max", ["k8s.node.name"])
        cpu = signoz_query_range("k8s.node.cpu.time", "rate", "sum", ["k8s.node.name"])
        nodes = {}
        for name, values in mem.items():
            nodes.setdefault(name, {})["mem_gb"] = values[-1] / (1024**3)
        for name, values in cpu.items():
            nodes.setdefault(name, {})["cpu_cores"] = values[-1]
        return nodes


    def get_recent_pod_restarts():
        restarts = signoz_query_range(
            "k8s.container.restarts", "latest", "max", ["k8s.pod.name"], window_ms=900_000
        )
        recent = []
        for pod, values in restarts.items():
            if len(values) >= 2 and values[-1] > values[0]:
                recent.append((pod, int(values[-1] - values[0])))
        return recent


    EXCLUDED_ORGS = ["une-tasse-de-cafe", "LuccaSA"]
    EXCLUDED_REPOS = ["qjoly/notes"]


    def _search_prs(review_qualifier):
        exclusions = " ".join(f"-org:{org}" for org in EXCLUDED_ORGS) + " " + " ".join(
            f"-repo:{repo}" for repo in EXCLUDED_REPOS
        )
        query = (
            f"is:pr is:open draft:false author:{GH_USERNAME} "
            f"review:{review_qualifier} archived:false {exclusions}"
        )
        resp = requests.get(
            "https://api.github.com/search/issues",
            params={"q": query, "sort": "updated", "order": "desc", "per_page": 20},
            headers={
                "Authorization": f"Bearer {GH_TOKEN}",
                "Accept": "application/vnd.github+json",
            },
            timeout=15,
        )
        resp.raise_for_status()
        return resp.json().get("items", [])


    def get_pending_prs():
        # "review:none" - nobody has reviewed it yet; "review:changes_requested" -
        # reviewed but sent back, waiting on a fresh look. Together these cover
        # PRs actually waiting on a human, unlike "review:required" which only
        # matches repos with a branch-protection rule mandating review.
        items = _search_prs("none") + _search_prs("changes_requested")
        seen = set()
        prs = []
        for it in items:
            if it["id"] in seen:
                continue
            seen.add(it["id"])
            repo = "/".join(it["repository_url"].split("/")[-2:])
            prs.append({"title": it["title"], "repo": repo, "number": it["number"]})
        return prs


    _UNICODE_TO_ASCII = {
        "—": "-",  # em dash
        "–": "-",  # en dash
        "‘": "'",
        "’": "'",
        "“": '"',
        "”": '"',
        "…": "...",  # ellipsis
        "•": "-",  # bullet
    }


    def sanitize(text):
        """PIL's bundled default font is missing glyphs for common unicode
        punctuation (em dash, curly quotes, bullet...) - they render as empty
        boxes. Fold them down to ASCII lookalikes; leave accented letters
        (é, à, ç...) alone since the font renders those fine."""
        for uni, ascii_ in _UNICODE_TO_ASCII.items():
            text = text.replace(uni, ascii_)
        return text


    def truncate(text, max_chars):
        text = sanitize(text)
        return text if len(text) <= max_chars else text[: max_chars - 3] + "..."


    def section_header(draw, x, y, w, title, font, pad=6):
        """Filled black bar with white text - reads as a strong section label on e-ink."""
        h = font.size + pad * 2
        draw.rectangle((x, y, x + w, y + h), fill=0)
        draw.text((x + pad, y + pad - 1), title, font=font, fill=1)
        return y + h


    def bullet_row(draw, x, y, w, mark, text, font, mark_fill=0):
        """A small square/triangle marker followed by a line of text, wrapped to width."""
        box = font.size - 6
        box_y = y + (font.size - box) // 2
        if mark == "square":
            draw.rectangle((x, box_y, x + box, box_y + box), fill=mark_fill)
        elif mark == "dash":
            draw.rectangle((x, y + font.size // 2, x + box, y + font.size // 2 + 2), fill=mark_fill)
        text_x = x + box + 10
        draw.text((text_x, y), text, font=font, fill=0)
        return text_x, y + font.size + 8


    def empty_row(draw, x, y, font, label="Nothing to report"):
        draw.text((x, y), label, font=font, fill=0)
        return y + font.size + 8


    def render(alerts, nodes, restarts, prs):
        img = Image.new("1", (WIDTH, HEIGHT), 1)  # 1 = white
        draw = ImageDraw.Draw(img)

        font_title = ImageFont.load_default(size=30)
        font_meta = ImageFont.load_default(size=15)
        font_h2 = ImageFont.load_default(size=18)
        font_body = ImageFont.load_default(size=16)

        margin = 18
        gutter = 20
        col_w = (WIDTH - margin * 2 - gutter) // 2
        left_x = margin
        right_x = margin + col_w + gutter
        content_bottom = HEIGHT - 34

        # outer frame
        draw.rectangle((0, 0, WIDTH - 1, HEIGHT - 1), outline=0, width=2)

        # --- header ---
        draw.text((margin, 14), CLUSTER_NAME, font=font_title, fill=0)
        title_w = draw.textlength(CLUSTER_NAME, font=font_title)
        subtitle = "cluster dashboard"
        draw.text((margin + title_w + 12, 22), subtitle, font=font_meta, fill=0)
        ts = datetime.now(DISPLAY_TZ).strftime("%a %d %b, %H:%M")
        tw = draw.textlength(ts, font=font_meta)
        draw.text((WIDTH - margin - tw, 24), ts, font=font_meta, fill=0)
        draw.line((margin, 54, WIDTH - margin, 54), fill=0, width=3)

        top = 66

        # --- left column ---
        y = top
        alert_title = f"ALERTS ({len(alerts)})" if alerts else "ALERTS"
        y = section_header(draw, left_x, y, col_w, alert_title, font_h2) + 10
        if alerts:
            for a in alerts[:4]:
                _, y = bullet_row(draw, left_x + 4, y, col_w, "square", truncate(a, 44), font_body)
        else:
            y = empty_row(draw, left_x + 4, y, font_body, "All clear")
        y += 14

        y = section_header(draw, left_x, y, col_w, "NODES", font_h2) + 10
        for name, stats in sorted(nodes.items()):
            cpu = stats.get("cpu_cores")
            mem = stats.get("mem_gb")
            cpu_s = f"{cpu:.1f} cores" if cpu is not None else "n/a"
            mem_s = f"{mem:.1f} GB" if mem is not None else "n/a"
            _, y = bullet_row(
                draw, left_x + 4, y, col_w, "dash", f"{truncate(name, 18)}", font_body
            )
            draw.text((left_x + 4 + 24, y - 8), f"{cpu_s}  /  {mem_s}", font=font_meta, fill=0)
            y += 12
        if not nodes:
            y = empty_row(draw, left_x + 4, y, font_body, "No data")
        y += 14

        restart_title = f"POD RESTARTS ({len(restarts)})" if restarts else "POD RESTARTS"
        y = section_header(draw, left_x, y, col_w, restart_title, font_h2) + 10
        if restarts:
            for pod, delta in restarts[:4]:
                if y > content_bottom - font_body.size:
                    break
                _, y = bullet_row(
                    draw, left_x + 4, y, col_w, "square", f"{truncate(pod, 28)} +{delta}", font_body
                )
        else:
            y = empty_row(draw, left_x + 4, y, font_body, "All clear")

        # --- right column ---
        ry = top
        pr_title = f"PRs AWAITING REVIEW ({len(prs)})" if prs else "PRs AWAITING REVIEW"
        ry = section_header(draw, right_x, ry, col_w, pr_title, font_h2) + 10
        if prs:
            for pr in prs[:8]:
                if ry > content_bottom - (font_body.size + font_meta.size):
                    break
                _, ry = bullet_row(
                    draw,
                    right_x + 4,
                    ry,
                    col_w,
                    "square",
                    truncate(f"#{pr['number']} {pr['title']}", 42),
                    font_body,
                )
                draw.text((right_x + 4 + 24, ry - 8), truncate(pr["repo"], 40), font=font_meta, fill=0)
                ry += 12
        else:
            ry = empty_row(draw, right_x + 4, ry, font_body, "Nothing pending")

        # vertical divider between columns
        draw.line((margin + col_w + gutter // 2, top, margin + col_w + gutter // 2, content_bottom), fill=0, width=1)

        # --- footer ---
        draw.line((margin, HEIGHT - 30, WIDTH - margin, HEIGHT - 30), fill=0, width=1)
        draw.text((margin, HEIGHT - 24), "trmnl-server · refreshed every 15 min", font=font_meta, fill=0)
        return img


    def main():
        alerts, nodes, restarts, prs = [], {}, [], []
        try:
            alerts = get_active_alerts()
        except Exception as e:
            print(f"[warn] failed to fetch alerts: {e}", file=sys.stderr)
        try:
            nodes = get_node_stats()
        except Exception as e:
            print(f"[warn] failed to fetch node stats: {e}", file=sys.stderr)
        try:
            restarts = get_recent_pod_restarts()
        except Exception as e:
            print(f"[warn] failed to fetch pod restarts: {e}", file=sys.stderr)
        try:
            prs = get_pending_prs()
        except Exception as e:
            print(f"[warn] failed to fetch GitHub PRs: {e}", file=sys.stderr)

        img = render(alerts, nodes, restarts, prs)
        buf = BytesIO()
        img.save(buf, format="BMP")

        resp = requests.post(
            UPLOAD_URL,
            data=buf.getvalue(),
            headers={
                "Authorization": f"Bearer {UPLOAD_TOKEN}",
                "Content-Type": "image/bmp",
            },
            verify=False,  # backend uses a self-signed cert, this call stays inside the cluster
            timeout=15,
        )
        resp.raise_for_status()
        print(f"uploaded screen.bmp: {resp.json()}")


    if __name__ == "__main__":
        main()

