apiVersion: v1
kind: Service
metadata:
  name: pr-gitops-grafana-annotation
  labels:
    app: pr-gitops-grafana-annotation
spec:
  selector:
    app: pr-gitops-grafana-annotation
  ports:
    - name: http
      port: 8080
      targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pr-gitops-grafana-annotation
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: pr-gitops-grafana-annotation
  template:
    metadata:
      labels:
        app: pr-gitops-grafana-annotation
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: pr-gitops-grafana-annotation
          image: ghcr.io/qjoly/pr-gitops-grafana-annotation:latest
          env:
            - name: LISTEN_ADDR
              value: ":8080"
            - name: GITHUB_REPO
              value: "qjoly/gitops"
            - name: GRAFANA_URL
              value: "http://grafana.monitoring.svc.cluster.local"
            - name: ANNOTATION_TAGS
              value: "gitops,deploy"
            - name: GITHUB_WEBHOOK_SECRET
              valueFrom:
                secretKeyRef:
                  name: pr-gitops-grafana-annotation
                  key: github_webhook_secret
            - name: GRAFANA_TOKEN
              valueFrom:
                secretKeyRef:
                  name: pr-gitops-grafana-annotation
                  key: grafana_token
          ports:
            - name: http
              containerPort: 8080
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 64Mi
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 15
            timeoutSeconds: 5
