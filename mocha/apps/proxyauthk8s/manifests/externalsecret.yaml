apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: proxyauthk8s-back-oidc
spec:
  refreshInterval: "1h"
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: proxyauthk8s-back-oidc
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        OIDC_ISSUER_URL: https://authentik.mocha.thoughtless.eu/application/o/proxyauthk8s/
        OIDC_CLIENT_ID: "{{ .client_id }}"
        OIDC_CLIENT_SECRET: "{{ .client_secret }}"
        OIDC_SCOPES: openid profile email offline_access
        OIDC_AUDIENCE: "{{ .client_id }}"
  data:
    # authentik generates both: it ignores the clientID asked for in the
    # provisioner values once the provider exists.
    - secretKey: client_id
      remoteRef:
        key: proxyauthk8s
        property: client_id
    - secretKey: client_secret
      remoteRef:
        key: proxyauthk8s
        property: client_secret
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: proxyauthk8s-oidc-provider
spec:
  refreshInterval: "1h"
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: proxyauthk8s-oidc-provider
    creationPolicy: Owner
  data:
    - secretKey: client_id
      remoteRef:
        key: proxyauthk8s
        property: client_id
    - secretKey: client_secret
      remoteRef:
        key: proxyauthk8s
        property: client_secret
