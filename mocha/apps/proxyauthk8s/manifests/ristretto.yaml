apiVersion: weebo.si.rs/v1
kind: ProxyKubeApi
metadata:
  name: ristretto
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  enabled: true
  expose_via_dashboard: true
  cert:
    ConfigMap:
      name: ristretto-ca
      key: ca.crt
