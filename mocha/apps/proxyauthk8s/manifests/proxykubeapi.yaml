apiVersion: weebo.si.rs/v1
kind: ProxyKubeApi
metadata:
  name: mocha
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  enabled: true
  expose_via_dashboard: true
  cert:
    ConfigMap:
      name: kube-root-ca.crt
      key: ca.crt
  service:
    KubernetesService:
      name: kubernetes
      namespace: default
      port: 443
  auth_config:
    # Kubernetes, not OidcProvider: the dashboard hands out an id token, which
    # authentik's /userinfo refuses — it only takes access tokens. The apiserver
    # validates the id token itself, which is what it is configured for.
    validate_against: Kubernetes
    oidc_provider:
      enabled: true
      # mocha-oidc, the client this cluster's apiserver trusts (see
      # mocha/corium/mocha.yaml); a token minted for any other client is
      # rejected on arrival.
      issuer_url: https://authentik.mocha.thoughtless.eu/application/o/mocha-oidc/
      client_id: mocha-oidc
      extra_scope: openid profile email offline_access
