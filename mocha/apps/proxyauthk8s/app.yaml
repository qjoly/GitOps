apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: proxyauthk8s
  namespace: argocd
spec:
  project: default
  ignoreDifferences:
    - group: apps
      kind: StatefulSet
      name: dragonfly
      jsonPointers:
        - /spec/persistentVolumeClaimRetentionPolicy
        - /spec/podManagementPolicy
        - /spec/revisionHistoryLimit
      jqPathExpressions:
        - '.spec.volumeClaimTemplates[].spec.volumeMode'
        - '.spec.volumeClaimTemplates[].status'
  syncPolicy:
    automated:
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
  destination:
    server: https://kubernetes.default.svc
    namespace: proxyauthk8s
  sources:
    - repoURL: ghcr.io/batleforc/proxyauthk8s
      chart: chart-crd
      targetRevision: 0.5.0
    - repoURL: ghcr.io/batleforc/proxyauthk8s
      chart: chart
      targetRevision: 0.4.0
      helm:
        releaseName: proxyauthk8s
        values: |
          ingress:
            className: traefik
            host: proxyauth.mocha.thoughtless.eu
            annotations:
              cert-manager.io/cluster-issuer: cloudflare
            tls:
              enabled: true
              secretName: proxyauth-tls

          oidc:
            source: secret
            objectName: proxyauthk8s-back-oidc

          back:
            redis:
              source: env
              value:
                url: redis://dragonfly.proxyauthk8s.svc:6379
            logFormat: json
            # The binary always exports OTLP; unset it falls back to localhost
            # and floods the logs with connection refused.
            env:
              # authentik only authenticates introspection with a client secret,
              # which the public client the dashboard needs cannot have: every
              # token comes back "inactive". warn falls through to the JWT aud.
              - name: OIDC_AUDIENCE_VALIDATION
                value: warn
              - name: OTEL_EXPORTER_OTLP_ENDPOINT
                value: http://signoz-otel-collector.signoz.svc.cluster.local:4317
              - name: OTEL_SERVICE_NAME
                value: proxyauthk8s

          metrics:
            prometheus:
              enabled: true
            serviceMonitor:
              enabled: true

          # ristretto sits behind the home NAT: the proxy cannot dial its
          # apiserver, so its agent dials out to this gateway instead.
          agentGateway:
            enabled: true
            mode: separate
            replicaCount: 2
            tokenSecretName: proxyauthk8s-gateway-token
            # Same reason as back.env: unset, the OTLP exporter retries against
            # localhost and floods the logs.
            env:
              - name: OTEL_EXPORTER_OTLP_ENDPOINT
                value: http://signoz-otel-collector.signoz.svc.cluster.local:4317
              - name: OTEL_SERVICE_NAME
                value: proxyauthk8s-gateway
            ingress:
              enabled: true
              className: traefik
              host: agent-proxyauth.mocha.thoughtless.eu
              annotations:
                cert-manager.io/cluster-issuer: cloudflare
              tls:
                enabled: true
                secretName: proxyauth-agent-tls
    - repoURL: ghcr.io/dragonflydb/dragonfly/helm
      chart: dragonfly
      targetRevision: v1.40.1
      helm:
        releaseName: dragonfly
        values: |
          # Sessions only: one snapshot a minute is enough to survive a restart.
          storage:
            enabled: true
            requests: 512Mi
            storageClassName: openebs-lvmpv
          extraArgs:
            - --dbfilename=dump-{timestamp}
            - --snapshot_cron=* * * * *
          podSecurityContext:
            fsGroup: 2000
          securityContext:
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 1000
    - repoURL: https://github.com/qjoly/gitops.git
      targetRevision: HEAD
      path: mocha/apps/proxyauthk8s/manifests
