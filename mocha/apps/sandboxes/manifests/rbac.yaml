---
# Lets the hermes-carolyn pod drive sbx (SandboxClaims + pod exec) in this
# namespace through its own service account token.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: sbx
  namespace: sandboxes
rules:
  - apiGroups: ["extensions.agents.x-k8s.io"]
    resources: ["sandboxclaims", "sandboxes"]
    verbs: ["get", "list", "watch", "create", "delete"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: sbx
  namespace: sandboxes
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: sbx
subjects:
  - kind: ServiceAccount
    name: sbx
    namespace: hermes-carolyn
