# Read-only Kubernetes access FROM the sandbox VMs themselves.
#
# The SandboxTemplate (dev.yaml) mounts this SA's token and a kubeconfig into
# every VM, so `kubectl get pods -A` etc. work inside a sandbox. The VMs only
# get get/list/watch (+ pods/log) — no create/update/delete/exec — and the
# egress to the API server is opened by the NetworkPolicy at the bottom of
# this file (the managed sandbox policy is internet-only).
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: sandbox-ro
  namespace: sandboxes
---
# Wildcard read-only, cluster-wide: this is a lab, and "kubectl RO" for
# debugging means being able to inspect anything. No write verbs at all.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: sandbox-readonly
rules:
  - apiGroups: ["*"]
    resources: ["*"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: sandbox-readonly
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: sandbox-readonly
subjects:
  - kind: ServiceAccount
    name: sandbox-ro
    namespace: sandboxes
---
# Legacy SA token Secret (k8s >= 1.24 no longer creates one automatically).
# Mounted read-only into the VMs at /var/run/secrets/kubernetes.io/serviceaccount.
apiVersion: v1
kind: Secret
metadata:
  name: sandbox-ro-token
  namespace: sandboxes
  annotations:
    kubernetes.io/service-account.name: sandbox-ro
type: kubernetes.io/service-account-token
---
# Kubeconfig the VMs use: straight to the API server ClusterIP, no in-cluster
# DNS needed, CA + token from the mounted SA secret.
apiVersion: v1
kind: ConfigMap
metadata:
  name: sandbox-ro-kubeconfig
  namespace: sandboxes
data:
  kubeconfig: |
    apiVersion: v1
    kind: Config
    clusters:
      - name: mocha
        cluster:
          # Via the apiserver-proxy pod (same namespace): the VMs cannot reach
          # the node IP directly (Cilium classifies it as reserved:host and
          # denies egress to it). socat passes TLS through end-to-end, but the
          # apiserver cert has no SAN for this ClusterIP, hence the skip-verify
          # (lab, read-only token, traffic stays inside the cluster CNI).
          server: https://apiserver-proxy.sandboxes.svc.cluster.local:443
          insecure-skip-tls-verify: true
    contexts:
      - name: mocha
        context:
          cluster: mocha
          user: ro
    current-context: mocha
    users:
      - name: ro
        user:
          tokenFile: /var/run/secrets/kubernetes.io/serviceaccount/token
---
# The egress to the API server is NOT a standalone NetworkPolicy anymore: with
# networkPolicyManagement=Managed and spec.networkPolicy set on the dev template,
# the controller REPLACES its default internet-only policy with the template's
# rules (dev.yaml allows the needed ports to all pods via namespaceSelector).
---
# TCP proxy to the real API server. The VMs cannot dial the node IP directly
# (Cilium: reserved:host identity, egress denied, ipBlock never matches), so
# they reach the apiserver through this pod's ClusterIP instead. socat forwards
# raw TCP, TLS stays end-to-end between the VM and the apiserver.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: apiserver-proxy
  namespace: sandboxes
spec:
  replicas: 1
  selector:
    matchLabels:
      app: apiserver-proxy
  template:
    metadata:
      labels:
        app: apiserver-proxy
    spec:
      containers:
        - name: socat
          image: docker.io/alpine/socat:1.8.1.3
          args: ["TCP-LISTEN:443,fork,reuseaddr", "TCP:5.196.80.72:6443"]
          ports:
            - { containerPort: 443 }
---
apiVersion: v1
kind: Service
metadata:
  name: apiserver-proxy
  namespace: sandboxes
spec:
  selector:
    app: apiserver-proxy
  ports:
    - { port: 443, targetPort: 443, protocol: TCP }
