---
# Everything this pod authenticates with, and nothing of it lives in git.
#
# Two Vault sources, on purpose:
#
#  - `hermes-carolyn/joplin_api_token` is the clipper token. The Hermes pod reads
#    the SAME key as ${JOPLIN_API_TOKEN}, so the two sides cannot drift: rotate
#    it in Vault and both pick it up on their next refresh / restart.
#  - `joplin/sync_*` are the credentials of the user's existing sync target.
#    They are app-specific and only this pod needs them, so they live under the
#    app's own path rather than being mixed into hermes-carolyn's keys.
#
# The whole credential set is rendered into ONE secret (`joplin-credentials`)
# via a template, so the deployment has a single reference and a missing key
# fails the ExternalSecret instead of leaving a half-configured pod running.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: joplin-credentials
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault-backend
  target:
    name: joplin-credentials
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      data:
        api_token: "{{ .api_token }}"
        sync_url: "{{ .sync_url }}"
        sync_username: "{{ .sync_username }}"
        sync_password: "{{ .sync_password }}"
  data:
    - secretKey: api_token
      remoteRef:
        key: hermes-carolyn
        property: joplin_api_token
    - secretKey: sync_url
      remoteRef:
        key: joplin
        property: sync_url
    - secretKey: sync_username
      remoteRef:
        key: joplin
        property: sync_username
    - secretKey: sync_password
      remoteRef:
        key: joplin
        property: sync_password
