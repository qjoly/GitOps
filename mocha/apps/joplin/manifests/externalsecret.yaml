---
# Single source of truth for the clipper token. Both consumers read the SAME
# Vault key, `hermes-carolyn/joplin_api_token`:
#
#   - the joplin pod, which sets it as `api.token` (every Data API call and the
#     MCP endpoint then require it), and
#   - the Hermes pod, which expands it as ${JOPLIN_API_TOKEN} in the MCP
#     server headers and uses it from cron jobs that write notes.
#
# One key means the two cannot drift: rotate it in Vault and both sides pick it
# up on their next refresh / restart.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: joplin-api
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault-backend
  target:
    name: joplin-api
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: api_token
      remoteRef:
        key: hermes-carolyn
        property: joplin_api_token
