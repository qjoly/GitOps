apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: spindle
  namespace: argocd
spec:
  project: default
  syncPolicy:
    # les labels pod-security vivent dans manifests/namespace.yaml:
    # managedNamespaceMetadata ne rattrape pas un namespace deja cree sans eux
    automated:
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
  destination:
    server: https://kubernetes.default.svc
    namespace: spindle
  source:
    repoURL: https://github.com/qjoly/gitops.git
    targetRevision: HEAD
    path: mocha/apps/spindle/manifests
