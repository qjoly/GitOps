---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: hermes-openrouter
spec:
  refreshInterval: "1h"
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: hermes-openrouter
    creationPolicy: Owner
  data:
    - secretKey: bot_token
      remoteRef:
        key: hermes-openrouter
        property: bot_token
    - secretKey: allowed_users
      remoteRef:
        key: hermes-openrouter
        property: allowed_users
    - secretKey: openrouter_api_key
      remoteRef:
        key: hermes-openrouter
        property: openrouter_api_key
    - secretKey: mail_password
      remoteRef:
        key: hermes-openrouter
        property: mail_password
