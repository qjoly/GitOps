---
apiVersion: v1
kind: ConfigMap
metadata:
  name: hermes-openrouter-config
data:
  config.yaml: |
    model:
      default: gemini-3.7-flash
      provider: gemini
      base_url: https://generativelanguage.googleapis.com/v1beta

    fallback_providers:
      - provider: custom
        model: gpt-oss:20b
        base_url: http://ollama.ollama.svc.cluster.local:11434/v1

    fallback:
      min_switch_reset_seconds: 0

    platforms:
      discord:
        enabled: true

    discord:
      require_mention: true
      auto_thread: false

    database:
      journal_mode: "wal"
