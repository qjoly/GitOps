---
apiVersion: v1
kind: ConfigMap
metadata:
  name: hermes-openrouter-config
data:
  config.yaml: |
    model:
      default: "openai/gpt-oss-20b"
      provider: "openrouter"
      base_url: "https://openrouter.ai/api/v1"

    fallback_providers:
      - provider: openrouter
        model: "mistralai/mistral-nemo"
      - provider: custom
        model: "gpt-oss:20b"
        base_url: "http://ollama.ollama.svc.cluster.local:11434/v1"

    fallback:
      min_switch_reset_seconds: 0

    platforms:
      discord:
        enabled: true

    discord:
      require_mention: true
      auto_thread: false

    database:
      journal_mode: "wal"
