---
apiVersion: v1
kind: ConfigMap
metadata:
  name: hermes-openrouter-config
data:
  config.yaml: |
    model:
      default: "openai/gpt-oss-20b"
      provider: "openrouter"
      base_url: "https://openrouter.ai/api/v1"

    fallback_providers:
      - provider: openrouter
        model: "mistralai/mistral-nemo"
      - provider: custom
        model: "gpt-oss:20b"
        base_url: "http://ollama.ollama.svc.cluster.local:11434/v1"

    fallback:
      min_switch_reset_seconds: 0

    platforms:
      discord:
        enabled: true

    discord:
      require_mention: true
      auto_thread: true

    mcp_servers:
      email:
        url: "http://127.0.0.1:8080/mcp"
        trust: untrusted
        connect_timeout: 120
        tools:
          prompts: false
          resources: false
          include:
            - list_emails
            - search_emails
            - get_email
            - get_emails
            - get_thread
            - list_mailboxes
            - list_accounts
            - get_email_stats

    database:
      journal_mode: "wal"
