---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hermes-openrouter
  labels:
    app.kubernetes.io/name: hermes-openrouter
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: hermes-openrouter
  template:
    metadata:
      labels:
        app.kubernetes.io/name: hermes-openrouter
    spec:
      initContainers:
        - name: seed-config
          image: busybox:1.38
          command:
            - sh
            - -c
            - test -f /opt/data/config.yaml || cp /config/config.yaml /opt/data/config.yaml
          volumeMounts:
            - name: data
              mountPath: /opt/data
            - name: config
              mountPath: /config
      containers:
        - name: hermes-openrouter
          image: docker.io/nousresearch/hermes-agent:v0.23.3
          args:
            - gateway
            - run
          env:
            - name: MISTRAL_API_KEY
              valueFrom:
                secretKeyRef:
                  name: hermes-openrouter
                  key: mistral_api_key
            - name: HERMES_API_TIMEOUT
              value: "1800"
            - name: DISCORD_BOT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: hermes-openrouter
                  key: bot_token
            - name: DISCORD_ALLOWED_USERS
              valueFrom:
                secretKeyRef:
                  name: hermes-openrouter
                  key: allowed_users
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 4Gi
          volumeMounts:
            - name: data
              mountPath: /opt/data
        - name: email-mcp
          image: ghcr.io/codefuturist/email-mcp:0.6.0
          args:
            - http
          env:
            - name: MCP_EMAIL_ADDRESS
              value: catchall@une-pause-cafe.fr
            - name: MCP_EMAIL_IMAP_HOST
              value: mail.infomaniak.com
            - name: MCP_EMAIL_SMTP_HOST
              value: mail.infomaniak.com
            - name: MCP_EMAIL_READ_ONLY
              value: "true"
            - name: MCP_EMAIL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: hermes-openrouter
                  key: mail_password
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - name: mcp-cache
              mountPath: /home/node/.cache/email-mcp
            - name: mcp-state
              mountPath: /home/node/.local/state/email-mcp
        - name: webui
          image: ghcr.io/nesquena/hermes-webui:0.52.731
          ports:
            - name: http
              containerPort: 8787
          env:
            - name: HERMES_HOME
              value: /home/hermeswebui/.hermes
            - name: HERMES_WEBUI_HOST
              value: 0.0.0.0
            - name: HERMES_WEBUI_PORT
              value: "8787"
            - name: HERMES_WEBUI_STATE_DIR
              value: /home/hermeswebui/.hermes/webui
            # Match the uid/gid that owns hermes-openrouter-data (the agent image's hermes user)
            - name: WANTED_UID
              value: "10000"
            - name: WANTED_GID
              value: "10000"
            - name: HERMES_WEBUI_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: hermes-openrouter
                  key: webui_password
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "2"
              memory: 4Gi
          readinessProbe:
            httpGet:
              path: /health
              port: http
          volumeMounts:
            - name: data
              mountPath: /home/hermeswebui/.hermes
            - name: data
              mountPath: /workspace
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: hermes-openrouter-data
        - name: config
          configMap:
            name: hermes-openrouter-config
        - name: mcp-cache
          emptyDir: {}
        - name: mcp-state
          emptyDir: {}
      terminationGracePeriodSeconds: 60
