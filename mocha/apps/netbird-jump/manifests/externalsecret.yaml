apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: netbird-jump
spec:
  refreshInterval: "1h"
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: netbird-jump
    creationPolicy: Owner
  data:
    # Reusable + ephemeral setup key "k8s-netbird-jump", auto-group "users".
    - secretKey: setupKey
      remoteRef:
        key: netbird
        property: jump_setup_key
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
