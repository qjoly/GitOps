apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: homepage
resources:
  - config.yaml
  - deployment.yaml
  - services.yaml
  - ingress.yaml
  - generator.yaml
configMapGenerator:
  - name: homepage-generator
    files:
      - scripts/generate.py
generatorOptions:
  disableNameSuffixHash: true
