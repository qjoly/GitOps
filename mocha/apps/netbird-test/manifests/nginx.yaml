# Sample of a NetBird-only app: an Ingress on the traefik-internal class,
# reachable at https://nginx-test.nb.mocha.thoughtless.eu from NetBird peers
# allowed by the users-to-k8s-traefik-internal policy.
apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx-test
data:
  index.html: |
    <h1>Hello from mocha, through NetBird</h1>
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-test
  labels:
    app: nginx-test
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nginx-test
  template:
    metadata:
      labels:
        app: nginx-test
    spec:
      containers:
        - name: nginx
          image: nginxinc/nginx-unprivileged:1.31.7-alpine
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /
              port: http
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 64Mi
          volumeMounts:
            - name: html
              mountPath: /usr/share/nginx/html
      volumes:
        - name: html
          configMap:
            name: nginx-test
---
apiVersion: v1
kind: Service
metadata:
  name: nginx-test
spec:
  selector:
    app: nginx-test
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: nginx-test
spec:
  # Served by the NetBird-only Traefik; the *.nb wildcard is its default cert.
  ingressClassName: traefik-internal
  rules:
    - host: nginx-test.nb.mocha.thoughtless.eu
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: nginx-test
                port:
                  name: http
