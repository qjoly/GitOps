# nginx reachable only through NetBird: no Service, no Ingress, and the
# NetworkPolicy drops in-cluster ingress. Traffic arrives on the sidecar's
# wt0 interface, inside the pod network namespace, where nginx listens.
apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx-test
data:
  index.html: |
    <h1>Hello from mocha, through NetBird</h1>
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-test
  labels:
    app: nginx-test
spec:
  replicas: 1
  strategy:
    # A single peer per setup key hostname, avoid two pods racing.
    type: Recreate
  selector:
    matchLabels:
      app: nginx-test
  template:
    metadata:
      labels:
        app: nginx-test
    spec:
      containers:
        - name: nginx
          image: nginxinc/nginx-unprivileged:1.31.7-alpine
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /
              port: http
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 64Mi
          volumeMounts:
            - name: html
              mountPath: /usr/share/nginx/html
        - name: netbird
          # Kept in line with the management server version.
          image: netbirdio/netbird:0.83.1
          env:
            - name: NB_SETUP_KEY
              valueFrom:
                secretKeyRef:
                  name: netbird-test
                  key: setupKey
            - name: NB_MANAGEMENT_URL
              value: https://netbird.mocha.thoughtless.eu:443
            - name: NB_HOSTNAME
              value: nginx-test
            - name: NB_LOG_LEVEL
              value: info
          securityContext:
            capabilities:
              add:
                - NET_ADMIN
                - SYS_RESOURCE
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 128Mi
          volumeMounts:
            - name: netbird-state
              mountPath: /var/lib/netbird
            # Only used if kernel WireGuard is unavailable (userspace fallback).
            - name: tun
              mountPath: /dev/net/tun
      volumes:
        - name: tun
          hostPath:
            path: /dev/net/tun
            type: CharDevice
        - name: html
          configMap:
            name: nginx-test
        # Ephemeral peer: a restart registers a fresh one, the old one is
        # garbage-collected by the management server.
        - name: netbird-state
          emptyDir: {}
