apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: netbird-test
spec:
  refreshInterval: "1h"
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: netbird-test
    creationPolicy: Owner
  data:
    # Reusable + ephemeral setup key created in the NetBird dashboard.
    - secretKey: setupKey
      remoteRef:
        key: netbird
        property: test_setup_key
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
