apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: autovod
  namespace: autovod
spec:
  refreshInterval: "1h"
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: autovod
    creationPolicy: Owner
  data:
    - secretKey: client_secrets.json
      remoteRef:
        key: autovod
        property: client_secrets.json
    - secretKey: request.token
      remoteRef:
        key: autovod
        property: request.token
    - secretKey: twitch_oauth_token
      remoteRef:
        key: autovod
        property: twitch_oauth_token
