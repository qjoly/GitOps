<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Factorio Map</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/openseadragon/6.1.1/openseadragon.min.js"></script>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #14110d; color: #e8e2d6;
    font: 14px/1.4 system-ui, sans-serif; }
  #app { display: flex; flex-direction: column; height: 100%; }
  header { display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
    padding: 8px 14px; background: #1e1a14; border-bottom: 1px solid #3a3226; }
  header h1 { font-size: 15px; margin: 0; color: #f4a637; letter-spacing: .5px; }
  #tabs { display: flex; gap: 6px; flex-wrap: wrap; }
  .tab { padding: 4px 12px; border: 1px solid #3a3226; border-radius: 4px;
    background: #26211a; cursor: pointer; text-transform: capitalize; }
  .tab.active { background: #f4a637; color: #14110d; border-color: #f4a637; font-weight: 600; }
  label.toggle { display: flex; align-items: center; gap: 5px; cursor: pointer; user-select: none; }
  #timebar { display: flex; align-items: center; gap: 10px; margin-left: auto; }
  #timebar input[type=range] { width: 200px; }
  #stamp { font-variant-numeric: tabular-nums; color: #b8ad99; min-width: 150px; }
  #share { padding: 4px 10px; border: 1px solid #3a3226; border-radius: 4px;
    background: #26211a; color: #e8e2d6; cursor: pointer; }
  #share:hover { background: #f4a637; color: #14110d; border-color: #f4a637; }
  #share.copied { background: #4caf50; color: #14110d; border-color: #4caf50; }
  #coords { font-variant-numeric: tabular-nums; color: #8f8672; font-size: 12px; min-width: 118px; }
  #osd { flex: 1; background: #0d0b08; position: relative; }
  #msg { position: absolute; inset: 0; display: flex; align-items: center;
    justify-content: center; color: #b8ad99; pointer-events: none; }
  .station { display: flex; align-items: center; gap: 4px; transform: translate(-4px, -50%);
    white-space: nowrap; cursor: pointer; }
  .station .dot { width: 9px; height: 9px; border-radius: 50%; flex: none;
    background: #f4a637; border: 1px solid #000; box-shadow: 0 0 0 1px rgba(255,255,255,.4); }
  .station .lbl { font-size: 11px; color: #fff; text-shadow: 0 0 3px #000, 0 0 3px #000, 0 1px 2px #000;
    background: rgba(0,0,0,.35); padding: 0 3px; border-radius: 2px; }
  .station:hover .lbl { background: #f4a637; color: #14110d; text-shadow: none; }
  .station:hover .dot { box-shadow: 0 0 0 2px #f4a637; }
</style>
</head>
<body>
<div id="app">
  <header>
    <h1>FACTORIO&nbsp;MAP</h1>
    <div id="tabs"></div>
    <label class="toggle"><input type="checkbox" id="stationsToggle" checked> stations</label>
    <button id="share" title="Copy a link to this exact view">🔗 link</button>
    <span id="coords" title="cursor / view center (game tiles)">—</span>
    <div id="timebar">
      <input id="time" type="range" min="0" max="0" value="0" step="1">
      <span id="stamp">—</span>
    </div>
  </header>
  <div id="osd"><div id="msg">loading…</div></div>
</div>
<script>
const $ = (s) => document.querySelector(s);
let renders = [], surfaces = [], curSurface = null, curIdx = 0, viewer = null, stations = null;
let pendingView = null, hashTimer = null;

function fmt(ts) {
  const m = ts.match(/^(\d{4})(\d{2})(\d{2})-(\d{2})(\d{2})/);
  return m ? `${m[1]}-${m[2]}-${m[3]} ${m[4]}:${m[5]} UTC` : ts;
}
const base = () => `renders/${renders[curIdx].timestamp}/${curSurface}`;

// ---- shareable deep links: #s=<surface>&x=<gx>&y=<gy>&z=<zoom>&t=<render> ----
// x,y are factorio game tiles (robust across renders), derived from the
// per-surface {gx0,gy0,ppt} mapping in <surface>.stations.json (ppt = px/tile).
function imgToGame(px, py) {
  const { gx0, gy0, ppt } = stations;
  return { x: gx0 + px / ppt, y: gy0 + py / ppt };
}
function gameToImg(gx, gy) {
  const { gx0, gy0, ppt } = stations;
  return { px: (gx - gx0) * ppt, py: (gy - gy0) * ppt };
}
function parseHash() {
  const h = location.hash.replace(/^#/, '');
  if (!h) return null;
  const p = new URLSearchParams(h);
  if (!p.get('s')) return null;
  return { s: p.get('s'), x: parseFloat(p.get('x')), y: parseFloat(p.get('y')),
    z: parseFloat(p.get('z')), t: p.get('t') || '' };
}
function viewCenterGame() {
  if (!viewer || !stations) return null;
  const item = viewer.world.getItemAt(0);
  if (!item) return null;
  const ip = item.viewportToImageCoordinates(viewer.viewport.getCenter());
  const g = imgToGame(ip.x, ip.y);
  return { x: Math.round(g.x), y: Math.round(g.y), z: +viewer.viewport.getZoom().toFixed(3) };
}
function writeHash() {
  const g = viewCenterGame();
  if (!g) return;
  const ts = renders[curIdx] ? renders[curIdx].timestamp : '';
  history.replaceState(null, '',
    `#s=${encodeURIComponent(curSurface)}&x=${g.x}&y=${g.y}&z=${g.z}&t=${ts}`);
  $('#coords').textContent = `x ${g.x}  y ${g.y}`;
}
const scheduleWriteHash = () => { clearTimeout(hashTimer); hashTimer = setTimeout(writeHash, 250); };
function applyPendingView() {
  if (!pendingView || !viewer || !stations) return;
  const item = viewer.world.getItemAt(0);
  if (!item) return;
  const { px, py } = gameToImg(pendingView.x, pendingView.y);
  if (pendingView.z) viewer.viewport.zoomTo(pendingView.z, null, true);
  viewer.viewport.panTo(item.imageToViewportCoordinates(px, py), true);
  viewer.viewport.applyConstraints(true);
  pendingView = null;
}

function placeStations() {
  if (!viewer) return;
  viewer.clearOverlays();
  if (!$('#stationsToggle').checked || !stations || !stations.stations) return;
  const item = viewer.world.getItemAt(0);
  if (!item) return;
  for (const st of stations.stations) {
    if (!st.name) continue;
    const label = st.name.replace(/\[[^\]]*\]/g, '').replace(/\s+/g, ' ').trim();
    const { px, py } = gameToImg(st.x, st.y);
    const el = document.createElement('div');
    el.className = 'station';
    const c = st.color;
    const col = c ? `rgb(${(c.r*255)|0},${(c.g*255)|0},${(c.b*255)|0})` : '#f4a637';
    el.innerHTML = `<span class="dot" style="background:${col}"></span>` +
      (label ? `<span class="lbl"></span>` : '');
    if (label) el.querySelector('.lbl').textContent = label;
    el.title = (label || st.name) + ' — click to zoom in';
    el.addEventListener('click', (ev) => { ev.stopPropagation(); focusStation(st); });
    viewer.addOverlay({ element: el, location: item.imageToViewportCoordinates(px, py),
      placement: OpenSeadragon.Placement.LEFT });
  }
}

function focusStation(st) {
  if (!viewer || !stations) return;
  const item = viewer.world.getItemAt(0);
  if (!item) return;
  const { px, py } = gameToImg(st.x, st.y);
  const p = item.imageToViewportCoordinates(px, py);
  viewer.viewport.panTo(p, false);
  viewer.viewport.zoomTo(viewer.viewport.getMaxZoom() * 0.5, p, false);
}

function loadStations() {
  stations = null;
  fetch(base() + '.stations.json?_=' + Date.now())
    .then(r => r.ok ? r.json() : null)
    .then(d => { stations = d; placeStations(); applyPendingView(); scheduleWriteHash(); })
    .catch(() => {});
}

function show() {
  $('#stamp').textContent = renders[curIdx] ? fmt(renders[curIdx].timestamp) : '—';
  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.s === curSurface));
  const src = base() + '.dzi';
  if (!viewer) {
    viewer = OpenSeadragon({
      id: 'osd', prefixUrl: 'https://cdnjs.cloudflare.com/ajax/libs/openseadragon/5.0.1/images/',
      tileSources: src, showNavigator: true, navigatorPosition: 'BOTTOM_RIGHT',
      minZoomImageRatio: 0.5, maxZoomPixelRatio: 4, animationTime: 0.4,
    });
    viewer.addHandler('open', () => { placeStations(); applyPendingView(); });
    viewer.addHandler('animation-finish', scheduleWriteHash);
    new OpenSeadragon.MouseTracker({ element: viewer.element, moveHandler: (e) => {
      const item = viewer.world.getItemAt(0);
      if (!stations || !item) return;
      const ip = item.viewportToImageCoordinates(viewer.viewport.pointFromPixel(e.position));
      const g = imgToGame(ip.x, ip.y);
      $('#coords').textContent = `x ${Math.round(g.x)}  y ${Math.round(g.y)}`;
    } }).setTracking(true);
  } else {
    viewer.open(src);
  }
  loadStations();
}

function buildTabs() {
  const el = $('#tabs'); el.innerHTML = '';
  surfaces.forEach(s => {
    const d = document.createElement('div');
    d.className = 'tab'; d.dataset.s = s; d.textContent = s.replace(/-/g, ' ');
    d.onclick = () => { curSurface = s; show(); };
    el.appendChild(d);
  });
}

$('#stationsToggle').onchange = placeStations;

$('#share').onclick = () => {
  writeHash();
  const b = $('#share');
  const done = () => { b.classList.add('copied'); b.textContent = '✓ copied';
    setTimeout(() => { b.classList.remove('copied'); b.textContent = '🔗 link'; }, 1400); };
  if (navigator.clipboard) navigator.clipboard.writeText(location.href).then(done, done); else done();
};

fetch('index.json?_=' + Date.now()).then(r => r.json()).then(data => {
  renders = (data.renders || []).filter(r => (r.surfaces || []).length);
  if (!renders.length) { $('#msg').textContent = 'no renders yet'; return; }
  const set = new Set();
  renders.forEach(r => r.surfaces.forEach(s => set.add(s)));
  surfaces = [...set].sort((a, b) => (a === 'nauvis' ? -1 : b === 'nauvis' ? 1 : a.localeCompare(b)));
  const hv = parseHash();
  curSurface = (hv && surfaces.includes(hv.s)) ? hv.s : surfaces[0];
  curIdx = renders.length - 1;
  if (hv && hv.t) { const i = renders.findIndex(r => r.timestamp === hv.t); if (i >= 0) curIdx = i; }
  if (hv && isFinite(hv.x) && isFinite(hv.y)) pendingView = { x: hv.x, y: hv.y, z: isFinite(hv.z) ? hv.z : 0 };
  const slider = $('#time');
  slider.max = renders.length - 1; slider.value = curIdx;
  slider.oninput = () => { curIdx = +slider.value; show(); };
  buildTabs();
  $('#msg').remove();
  show();
}).catch(e => { $('#msg').textContent = 'failed to load index.json'; console.error(e); });
</script>
</body>
</html>
