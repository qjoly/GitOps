apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: factorio-map-serve
  namespace: factorio-lucca
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: openebs-hostpath
  resources:
    requests:
      storage: 80Gi
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: factorio-map-nginx
  namespace: factorio-lucca
data:
  default.conf: |
    server {
        listen 8080;
        server_name _;
        root /srv;
        absolute_redirect off;
        types {
            application/json  json;
            image/jpeg        jpg;
            text/html         html;
            application/xml   dzi;
        }
        default_type application/octet-stream;
        location = / { try_files /index.html =404; add_header Cache-Control "no-store" always; }
        location = /index.html { add_header Cache-Control "no-store" always; }
        location = /index.json { add_header Cache-Control "no-store" always; }
        location / { try_files $uri =404; add_header Cache-Control "public, max-age=86400" always; }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: factorio-map-web
  namespace: factorio-lucca
  labels: { app: factorio-map-web }
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels: { app: factorio-map-web }
  template:
    metadata:
      labels: { app: factorio-map-web }
    spec:
      securityContext:
        runAsNonRoot: true
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      imagePullSecrets:
        - name: atcr-pull
      containers:
        - name: nginx
          image: nginxinc/nginx-unprivileged:1.27-alpine
          ports:
            - containerPort: 8080
          volumeMounts:
            - { name: srv, mountPath: /srv, readOnly: true }
            - { name: tpl, mountPath: /etc/nginx/conf.d, readOnly: true }
          resources:
            requests: { cpu: 10m, memory: 32Mi }
            limits: { memory: 128Mi }
          securityContext:
            runAsUser: 101
            runAsGroup: 101
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
        - name: sync
          image: atcr.io/une-tasse-de.cafe/factorio-map:0.5.3
          command: ["/usr/local/bin/sync.sh"]
          env:
            - name: S3_ENDPOINT
              value: "https://rustfs.thoughtless.eu"
            - name: S3_BUCKET
              value: "factorio"
            - name: SYNC_INTERVAL
              value: "120"
            - name: AWS_ACCESS_KEY_ID
              valueFrom: { secretKeyRef: { name: factorio-map-s3, key: AWS_ACCESS_KEY_ID } }
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom: { secretKeyRef: { name: factorio-map-s3, key: AWS_SECRET_ACCESS_KEY } }
          volumeMounts:
            - { name: srv, mountPath: /srv }
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { memory: 1Gi }
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
      volumes:
        - name: srv
          persistentVolumeClaim:
            claimName: factorio-map-serve
        - name: tpl
          configMap:
            name: factorio-map-nginx
---
apiVersion: v1
kind: Service
metadata:
  name: factorio-map-web
  namespace: factorio-lucca
spec:
  selector: { app: factorio-map-web }
  ports:
    - port: 80
      targetPort: 8080
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: factorio-map
  namespace: factorio-lucca
  annotations:
    cert-manager.io/cluster-issuer: cloudflare
spec:
  ingressClassName: traefik
  tls:
    - secretName: factorio-map-tls
      hosts:
        - factorio-map.mocha.thoughtless.eu
  rules:
    - host: factorio-map.mocha.thoughtless.eu
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: factorio-map-web
                port:
                  number: 80
