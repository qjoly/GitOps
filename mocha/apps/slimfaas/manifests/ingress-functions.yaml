apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: functions-ratelimit
  namespace: slimfaas
spec:
  rateLimit:
    average: 20
    burst: 50
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: slimfaas-functions
  namespace: slimfaas
  annotations:
    cert-manager.io/cluster-issuer: cloudflare
    traefik.ingress.kubernetes.io/router.middlewares: slimfaas-functions-ratelimit@kubernetescrd
    homepage.thoughtless.eu/hide: "true"
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - fn.mocha.thoughtless.eu
      secretName: slimfaas-functions-tls
  rules:
    - host: fn.mocha.thoughtless.eu
      http:
        paths:
          - path: /function
            pathType: Prefix
            backend:
              service:
                name: slimfaas-http
                port:
                  number: 5000
          - path: /async-function
            pathType: Prefix
            backend:
              service:
                name: slimfaas-http
                port:
                  number: 5000
