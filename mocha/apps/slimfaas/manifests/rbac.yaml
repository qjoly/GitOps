apiVersion: v1
kind: ServiceAccount
metadata:
  name: slimfaas
  namespace: slimfaas
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: slimfaas-workload-manager
  namespace: slimfaas
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["endpoints"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["replicasets"]
    verbs: ["get"]
  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["apps"]
    resources: ["deployments/scale", "statefulsets/scale"]
    verbs: ["get", "update", "patch"]
  - apiGroups: ["batch"]
    resources: ["jobs", "cronjobs"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: slimfaas-workload-manager
  namespace: slimfaas
subjects:
  - kind: ServiceAccount
    name: slimfaas
    namespace: slimfaas
roleRef:
  kind: Role
  name: slimfaas-workload-manager
  apiGroup: rbac.authorization.k8s.io
