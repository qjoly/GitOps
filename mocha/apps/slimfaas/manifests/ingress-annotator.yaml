apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: annotator-prefix
  namespace: slimfaas
spec:
  addPrefix:
    prefix: /function/annotator
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: annotator
  namespace: slimfaas
  annotations:
    cert-manager.io/cluster-issuer: cloudflare
    traefik.ingress.kubernetes.io/router.middlewares: slimfaas-annotator-prefix@kubernetescrd
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - annotator.mocha.thoughtless.eu
      secretName: annotator-tls
  rules:
    - host: annotator.mocha.thoughtless.eu
      http:
        paths:
          - path: /webhook/github
            pathType: Prefix
            backend:
              service:
                name: slimfaas-http
                port:
                  number: 5000
