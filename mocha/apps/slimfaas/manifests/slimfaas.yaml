apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: slimfaas
  namespace: slimfaas
spec:
  podManagementPolicy: OrderedReady
  replicas: 1
  serviceName: slimfaas
  selector:
    matchLabels:
      app: slimfaas
  volumeClaimTemplates:
    - metadata:
        name: slimfaas-volume
      spec:
        accessModes:
          - ReadWriteOnce
        storageClassName: openebs-lvmpv
        resources:
          requests:
            storage: 2Gi
    - metadata:
        name: slimfaas-backup
      spec:
        accessModes:
          - ReadWriteOnce
        storageClassName: openebs-lvmpv
        resources:
          requests:
            storage: 1Gi
  template:
    metadata:
      labels:
        app: slimfaas
    spec:
      serviceAccountName: slimfaas
      containers:
        - name: slimfaas
          image: axaguildev/slimfaas:0.84.16
          imagePullPolicy: IfNotPresent
          livenessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 3
            periodSeconds: 10
            timeoutSeconds: 8
          readinessProbe:
            httpGet:
              path: /ready
              port: 5000
            initialDelaySeconds: 3
            periodSeconds: 10
            timeoutSeconds: 8
          env:
            - name: SlimFaas__BaseSlimDataUrl
              value: "http://{pod_name}.slimfaas.{namespace}.svc:3262"
            - name: SlimData__Directory
              value: "/database"
            - name: SlimData__BackupDirectory
              value: "/backup"
            - name: SlimFaas__ExposeLogs
              value: "true"
            - name: SlimFaas__ExposeDataMetadata
              value: "false"
            - name: Data__DefaultVisibility
              value: "Private"
            - name: Logging__LogLevel__Default
              value: "Information"
          volumeMounts:
            - name: slimfaas-volume
              mountPath: /database
            - name: slimfaas-backup
              mountPath: /backup
          resources:
            requests:
              memory: "600Mi"
              cpu: "200m"
            limits:
              memory: "600Mi"
          ports:
            - containerPort: 5000
              name: slimfaas
            - containerPort: 5003
              name: slimfaas-ws
            - containerPort: 3262
              name: slimdata
---
apiVersion: v1
kind: Service
metadata:
  name: slimfaas
  namespace: slimfaas
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector:
    app: slimfaas
  ports:
    - name: http
      port: 5000
    - name: slimfaas-ws
      port: 5003
    - name: slimdata
      port: 3262
---
apiVersion: v1
kind: Service
metadata:
  name: slimfaas-http
  namespace: slimfaas
spec:
  publishNotReadyAddresses: false
  selector:
    app: slimfaas
  ports:
    - name: http
      port: 5000
      targetPort: 5000
    - name: slimfaas-ws
      port: 5003
      targetPort: 5003
