apiVersion: v1
kind: Service
metadata:
  name: tranquil-pds-db
spec:
  selector:
    app: tranquil-pds-db
  ports:
    - port: 5432
      targetPort: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: tranquil-pds-db
spec:
  serviceName: tranquil-pds-db
  replicas: 1
  selector:
    matchLabels:
      app: tranquil-pds-db
  template:
    metadata:
      labels:
        app: tranquil-pds-db
    spec:
      containers:
        - name: postgres
          image: {{ .Values.db.image }}
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_USER
              value: tranquil_pds
            - name: POSTGRES_DB
              value: pds
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secretName }}
                  key: DB_PASSWORD
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql
          resources:
            {{- toYaml .Values.db.resources | nindent 12 }}
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "tranquil_pds", "-d", "pds"]
            initialDelaySeconds: 5
            periodSeconds: 10
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: {{ .Values.storageClass }}
        resources:
          requests:
            storage: {{ .Values.db.storage }}
