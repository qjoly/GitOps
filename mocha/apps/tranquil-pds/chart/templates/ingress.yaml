apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: tranquil-pds
spec:
  ingressClassName: {{ .Values.ingress.className }}
  tls:
    - hosts:
        - {{ .Values.ingress.host }}
        - "*.{{ .Values.ingress.host }}"
      secretName: {{ .Values.ingress.tlsSecretName }}
  rules:
    - host: {{ .Values.ingress.host }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: tranquil-pds
                port:
                  number: 80
    - host: "*.{{ .Values.ingress.host }}"
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: tranquil-pds
                port:
                  number: 80
