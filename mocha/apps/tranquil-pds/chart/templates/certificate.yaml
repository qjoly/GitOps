apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: tranquil-pds-tls
spec:
  secretName: {{ .Values.ingress.tlsSecretName }}
  issuerRef:
    name: {{ .Values.ingress.clusterIssuer }}
    kind: ClusterIssuer
  dnsNames:
    - {{ .Values.ingress.host }}
    - "*.{{ .Values.ingress.host }}"
