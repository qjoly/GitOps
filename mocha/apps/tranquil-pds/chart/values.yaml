image: atcr.io/tranquil.farm/tranquil-pds:latest

# Private atcr.io repo: bootstrapped dockerconfigjson pull secret.
imagePullSecret: atcr-pull

# Bootstrapped out-of-band. Consumed as env vars by the app:
#   PDS_HOSTNAME, DATABASE_URL, JWT_SECRET, DPOP_SECRET, MASTER_KEY
# and by the postgres StatefulSet: DB_PASSWORD (must match the password in DATABASE_URL).
secretName: tranquil-pds-secrets

storageClass: openebs-lvmpv

app:
  # UID/GID the distroless nonroot image runs as; also owns the mounted data volume.
  runAsUser: 65532
  # Persistent filesystem blob store under /var/lib/tranquil-pds (~1Gi per active user).
  storage: 10Gi
  # Non-secret config overrides. Every option also has an env var (see example.toml).
  env:
    INVITE_CODE_REQUIRED: "true"
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 1Gi

db:
  image: postgres:18-alpine
  storage: 5Gi
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 512Mi

ingress:
  # User handles are served as subdomains, so the cert must cover the apex and *.host.
  host: pds.mocha.thoughtless.eu
  className: traefik
  clusterIssuer: cloudflare
  tlsSecretName: tranquil-pds-tls
