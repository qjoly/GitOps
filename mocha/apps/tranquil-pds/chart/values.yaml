image: atcr.io/tranquil.farm/tranquil-pds:latest
imagePullPolicy: Always

# Private atcr.io repo. Pull secret materialized from Vault (kv/tranquil-pds
# key `dockerconfigjson`) via external-secrets — see templates/pull-secret.yaml.
imagePullSecret: atcr-pull

# Vault-backed (external-secrets). Keys: DB_PASSWORD, JWT_SECRET, DPOP_SECRET,
# MASTER_KEY, SSO_OIDC_CLIENT_ID, SSO_OIDC_CLIENT_SECRET.
secretName: tranquil-pds-secrets

storageClass: openebs-lvmpv

app:
  blobStorage: 10Gi
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 1Gi

db:
  image: postgres:18-alpine
  storage: 10Gi
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 512Mi

ingress:
  host: pds.mocha.thoughtless.eu
  className: traefik
  clusterIssuer: cloudflare
  tlsSecretName: tranquil-pds-tls

sso:
  issuer: https://authentik.mocha.thoughtless.eu/application/o/tranquil-pds/
  displayName: Authentik

vault:
  key: tranquil-pds
