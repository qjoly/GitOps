apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: tranquil-pds
  namespace: argocd
spec:
  project: default
  ignoreDifferences:
    - group: apps
      kind: StatefulSet
      name: tranquil-pds-db
      jsonPointers:
        - /spec/persistentVolumeClaimRetentionPolicy
        - /spec/podManagementPolicy
        - /spec/revisionHistoryLimit
      jqPathExpressions:
        - '.spec.volumeClaimTemplates[].apiVersion'
        - '.spec.volumeClaimTemplates[].kind'
        - '.spec.volumeClaimTemplates[].metadata.creationTimestamp'
        - '.spec.volumeClaimTemplates[].spec.volumeMode'
        - '.spec.volumeClaimTemplates[].status'
  syncPolicy:
    automated:
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - RespectIgnoreDifferences=true
  destination:
    server: https://kubernetes.default.svc
    namespace: tranquil-pds
  source:
    repoURL: https://rubxkube.github.io/charts
    chart: tranquil-pds
    targetRevision: 0.2.0
    helm:
      values: |
        # Pinned to a digest that ships the built-in frontend (/app UI).
        # The :latest tag drifted to a build without the `frontend` feature.
        image: atcr.io/tranquil.farm/tranquil-pds@sha256:9d803e048be9231ddc5dde854b9f581bf40a614adb6c812ac497bc7b8d4c06ce
        imagePullPolicy: IfNotPresent
        storageClass: openebs-lvmpv
        ingress:
          host: pds.mocha.thoughtless.eu
          className: traefik
          clusterIssuer: cloudflare
        sso:
          issuer: https://authentik.mocha.thoughtless.eu/application/o/tranquil-pds/
          displayName: Authentik
        # Default relay list minus relay.fire.hose.cam (dead host, spams requestCrawl WARNs).
        crawlers:
          - https://relay3.fr.hose.cam
          - https://bsky.network
          - https://northamerica.firehose.network
          - https://europe.firehose.network
          - https://asia.firehose.network
          - https://atproto.africa
          - https://relay.upcloud.world
