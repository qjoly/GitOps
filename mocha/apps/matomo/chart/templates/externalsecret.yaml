apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: matomo-db
spec:
  refreshInterval: "1h"
  secretStoreRef:
    name: {{ .Values.vault.secretStore }}
    kind: ClusterSecretStore
  target:
    name: matomo-db
    creationPolicy: Owner
  # The three strategy fields are the CRD defaults, spelled out because the live
  # object carries them: omitting them leaves the Application permanently
  # OutOfSync, with selfHeal reapplying on every pass.
  data:
    - secretKey: db_password
      remoteRef:
        key: {{ .Values.vault.key }}
        property: db_password
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
    - secretKey: db_root_password
      remoteRef:
        key: {{ .Values.vault.key }}
        property: db_root_password
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
