apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: matomo-data
  annotations:
    # config.ini.php (including the salt), the UI-installed plugins and the GeoIP
    # databases only exist here.
    argocd.argoproj.io/sync-options: Prune=false
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: {{ .Values.storageClass }}
  resources:
    requests:
      storage: {{ .Values.matomo.storage }}
---
apiVersion: v1
kind: Service
metadata:
  name: matomo
  labels:
    app: matomo
spec:
  selector:
    app: matomo
  ports:
    - name: http
      port: 80
      targetPort: 80
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: matomo
spec:
  replicas: 1
  # The data volume is RWO on a local LVM PV, so never two pods at once.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: matomo
  template:
    metadata:
      labels:
        app: matomo
    spec:
      containers:
        - name: matomo
          image: {{ .Values.image }}
          # Only the entrypoint reads these, to write config.ini.php on first
          # install. Once that file exists on the volume, it is the source of truth.
          env:
            - name: MATOMO_DATABASE_HOST
              value: matomo-db
            - name: MATOMO_DATABASE_ADAPTER
              value: mysql
            - name: MATOMO_DATABASE_TABLES_PREFIX
              value: matomo_
            - name: MATOMO_DATABASE_DBNAME
              value: {{ .Values.db.name }}
            - name: MATOMO_DATABASE_USERNAME
              value: {{ .Values.db.user }}
            - name: MATOMO_DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: matomo-db
                  key: db_password
          ports:
            - name: http
              containerPort: 80
          volumeMounts:
            - name: data
              mountPath: /var/www/html
          resources:
            {{- toYaml .Values.matomo.resources | nindent 12 }}
          readinessProbe:
            httpGet:
              path: /matomo.php
              port: 80
            initialDelaySeconds: 20
            periodSeconds: 15
            timeoutSeconds: 5
        {{- if .Values.archive.enabled }}
        - name: archive
          image: {{ .Values.image }}
          workingDir: /var/www/html
          # Everything on the volume belongs to www-data (33), and that is who
          # Apache serves as: archiving as root would leave root-owned files in
          # tmp/ that the web process can no longer write.
          securityContext:
            runAsUser: 33
            runAsGroup: 33
          # The loop never exits, even when an archive run fails: this container
          # sharing the pod means a crash would take the whole pod NotReady and
          # pull Matomo out of the Service.
          command:
            - sh
            - -c
            - |
              while true; do
                sleep {{ .Values.archive.intervalSeconds }}
                php console core:archive --url=https://{{ .Values.ingress.host }} || echo "archive run failed"
              done
          volumeMounts:
            - name: data
              mountPath: /var/www/html
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 1Gi
        {{- end }}
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: matomo-data
