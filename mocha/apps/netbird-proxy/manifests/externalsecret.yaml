apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: netbird-proxy
spec:
  refreshInterval: "1h"
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: netbird-proxy
    creationPolicy: Owner
  data:
    - secretKey: proxyToken
      remoteRef:
        key: netbird
        property: proxy_token
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
