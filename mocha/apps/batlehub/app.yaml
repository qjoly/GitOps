---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: batlehub
  namespace: argocd
spec:
  project: default
  syncPolicy:
    automated:
      selfHeal: true
      prune: true
    syncOptions:
      - CreateNamespace=true
  destination:
    server: https://kubernetes.default.svc
    namespace: batlehub
  sources:
    - repoURL: ghcr.io/batlehub/batlehub/charts
      chart: batlehub
      targetRevision: 1.10.0
      helm:
        valuesObject:
          ingress:
            enabled: true
            className: traefik
            host: batlehub.mocha.thoughtless.eu
            annotations:
              cert-manager.io/cluster-issuer: cloudflare
            tls:
              - secretName: batlehub-tls
                hosts:
                  - batlehub.mocha.thoughtless.eu
          # The chart's 512Mi got OOMKilled under normal use.
          resources:
            requests:
              memory: 256Mi
            limits:
              memory: 1Gi
          # Artifacts live in the batlehub bucket of turing's rustfs.
          persistence:
            enabled: false
          envFrom:
            - secretRef:
                name: batlehub-s3
          # The database URL and the admin token live in this second layer, which replaces the chart's placeholders.
          credentials:
            enabled: true
            existingSecret: batlehub-credentials
          config:
            server:
              host: "0.0.0.0"
              port: 8080
              # Traefik's pod range, so the advertised URLs keep the https scheme.
              trusted_proxies: ["10.244.0.0/16"]
              static_dir: /app/ui/dist
            database:
              type: postgresql
              url: "postgresql://batlehub@batlehub-db:5432/batlehub"
            storage:
              type: s3
              bucket: batlehub
              region: us-east-1
              endpoint_url: https://s3.thoughtless.eu
              force_path_style: true
            registries:
              - type: npm
                name: npm
                rbac: &public
                  anonymous: ["releases:read", "source:read"]
                  user: ["releases:read", "source:read"]
                  admin: ["*"]
              - type: pypi
                name: pypi
                rbac: *public
              - type: cargo
                name: cargo
                rbac: *public
              - type: goproxy
                name: go
                rbac: *public
              # Reserved to token holders so the GitHub API quota is not spent by anyone on the internet.
              - type: github
                name: github
                rbac:
                  anonymous: []
                  user: ["releases:read", "source:read"]
                  admin: ["*"]
    - repoURL: https://github.com/qjoly/gitops.git
      targetRevision: HEAD
      path: mocha/apps/batlehub/manifests
