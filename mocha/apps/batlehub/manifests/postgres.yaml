---
apiVersion: v1
kind: Service
metadata:
  name: batlehub-db
spec:
  clusterIP: None
  selector:
    app: batlehub-db
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: batlehub-db
spec:
  serviceName: batlehub-db
  replicas: 1
  selector:
    matchLabels:
      app: batlehub-db
  template:
    metadata:
      labels:
        app: batlehub-db
    spec:
      containers:
        - name: postgres
          image: postgres:18-alpine
          env:
            - name: POSTGRES_DB
              value: batlehub
            - name: POSTGRES_USER
              value: batlehub
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: batlehub-credentials
                  key: POSTGRES_PASSWORD
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          ports:
            - name: postgres
              containerPort: 5432
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 512Mi
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "batlehub", "-d", "batlehub"]
            initialDelaySeconds: 10
            periodSeconds: 10
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: openebs-hostpath
        resources:
          requests:
            storage: 5Gi
