---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: batlehub-credentials
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: batlehub-credentials
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        POSTGRES_PASSWORD: "{{ .db_password }}"
        credentials.toml: |
          [database]
          url = "postgresql://batlehub:{{ .db_password }}@batlehub-db:5432/batlehub"

          [[auth]]
          type = "token"

          [[auth.tokens]]
          value = "{{ .admin_token }}"
          role = "admin"
          user_id = "admin"

          # Merged into the github registry of the chart values, by name.
          [[registries]]
          type = "github"
          name = "github"

          [registries.upstream_auth]
          type = "bearer"
          token = "{{ .github_token }}"
  data:
    - secretKey: db_password
      remoteRef: { key: batlehub, property: db_password }
    - secretKey: admin_token
      remoteRef: { key: batlehub, property: admin_token }
    - secretKey: github_token
      remoteRef: { key: batlehub, property: github_token }
