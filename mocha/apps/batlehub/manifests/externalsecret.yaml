---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: batlehub-credentials
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: batlehub-credentials
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        POSTGRES_PASSWORD: "{{ .db_password }}"
        credentials.toml: |
          [database]
          url = "postgresql://batlehub:{{ .db_password }}@batlehub-db:5432/batlehub"

          [[auth]]
          type = "token"

          [[auth.tokens]]
          value = "{{ .admin_token }}"
          role = "admin"
          user_id = "admin"

          [[auth]]
          type = "oidc"
          issuer_url = "https://authentik.mocha.thoughtless.eu/application/o/batlehub/"
          client_id = "{{ .oidc_client_id }}"
          client_secret = "{{ .oidc_client_secret }}"
          redirect_uri = "https://batlehub.mocha.thoughtless.eu/api/v1/auth/oidc/callback"
          scopes = ["openid", "profile", "email"]
          user_id_claim = "preferred_username"
          role_claim = "groups"

          [auth.role_mappings]
          "batlehub-admins" = "admin"
          "batlehub-users" = "user"

          # Merged into the github registry of the chart values, by name.
          [[registries]]
          type = "github"
          name = "github"

          [registries.upstream_auth]
          type = "bearer"
          token = "{{ .github_token }}"
          
          [registries.rbac]
          anonymous = ["releases:read", "source:read"]
          user = ["releases:read", "source:read"]
          admin = ["*"]
          
          [registries.sbom]
          enabled = true
          formats = ["spdx", "cyclonedx"]
          
          [registries.readme]
          
          [[registries.rules]]
          kind = "release_age_gate"
          min_age_secs = 36000
          bypass_roles = ["admin"]
          
          [vulnerability_scan]
          enabled = true
          interval_secs = 86400
  data:
    - secretKey: db_password
      remoteRef: { key: batlehub, property: db_password }
    - secretKey: admin_token
      remoteRef: { key: batlehub, property: admin_token }
    - secretKey: github_token
      remoteRef: { key: batlehub, property: github_token }
    - secretKey: oidc_client_id
      remoteRef: { key: batlehub, property: oidc_client_id }
    - secretKey: oidc_client_secret
      remoteRef: { key: batlehub, property: oidc_client_secret }
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: batlehub-s3
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: batlehub-s3
    creationPolicy: Owner
  data:
    - secretKey: AWS_ACCESS_KEY_ID
      remoteRef: { key: batlehub, property: s3_access_key }
    - secretKey: AWS_SECRET_ACCESS_KEY
      remoteRef: { key: batlehub, property: s3_secret_key }
