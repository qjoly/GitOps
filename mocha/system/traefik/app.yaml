apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: traefik
  namespace: argocd
spec:
  project: default
  syncPolicy:
    automated:
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
  destination:
    server: https://kubernetes.default.svc
    namespace: traefik
  source:
    repoURL: https://traefik.github.io/charts
    targetRevision: 42.3.1
    chart: traefik
    helm:
      values: |
        accessLog:
          enabled: true
          format: json
        metrics:
          prometheus: null
          otlp:
            enabled: true
            addEntryPointsLabels: true
            addRoutersLabels: true
            addServicesLabels: true
            resourceAttributes:
              k8s.cluster.name: mocha
            http:
              enabled: true
              endpoint: http://signoz-otel-collector.signoz.svc.cluster.local:4318/v1/metrics
        service:
          # Cluster would have kube-proxy rewrite every client IP to the node's.
          spec:
            externalTrafficPolicy: Local
        ports:
          websecure:
            forwardedHeaders:
              trustedIPs:
                - 85.17.65.41/32
                - 10.244.0.217/32
            transport:
              respondingTimeouts:
                readTimeout: 300
                writeTimeout: 300
                idleTimeout: 300
              lifeCycle:
                requestAcceptGraceTimeout: 300
                graceTimeOut: 300
              keepAliveMaxRequests: 100
              keepAliveMaxTime: 300