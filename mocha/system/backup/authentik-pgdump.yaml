apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: restic-authentik-pg
  namespace: authentik
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: restic-authentik-pg
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        AWS_ACCESS_KEY_ID: "{{ .aws_access_key_id }}"
        AWS_SECRET_ACCESS_KEY: "{{ .aws_secret_access_key }}"
        AWS_DEFAULT_REGION: de
        RESTIC_PASSWORD: "{{ .restic_password }}"
        RESTIC_REPOSITORY: "s3:https://de-s3.storage.bunnycdn.com/mocha-coffee/authentik-postgres"
  data:
    - secretKey: aws_access_key_id
      remoteRef:
        key: restic
        property: AWS_ACCESS_KEY_ID
    - secretKey: aws_secret_access_key
      remoteRef:
        key: restic
        property: AWS_SECRET_ACCESS_KEY
    - secretKey: restic_password
      remoteRef:
        key: restic
        property: RESTIC_PASSWORD
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: authentik-pgdump
  namespace: authentik
spec:
  schedule: "30 0 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        spec:
          restartPolicy: OnFailure
          securityContext:
            runAsNonRoot: true
            runAsUser: 999
            fsGroup: 999
          volumes:
            - name: work
              emptyDir: {}
          initContainers:
            - name: pgdump
              image: postgres:18.6-bookworm
              command: ["/bin/sh", "-c"]
              args:
                - |
                  set -eu
                  pg_dump --no-owner --no-privileges --clean --if-exists \
                    | gzip -9 > /work/authentik.sql.gz
                  echo "dump size: $(du -h /work/authentik.sql.gz)"
              env:
                - name: PGHOST
                  value: authentik-postgresql
                - name: PGPORT
                  value: "5432"
                - name: PGUSER
                  value: authentik
                - name: PGDATABASE
                  value: authentik
                - name: PGPASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: authentik-secrets
                      key: password
              volumeMounts:
                - name: work
                  mountPath: /work
          containers:
            - name: upload
              image: restic/restic:0.17.3
              command: ["/bin/sh", "-c"]
              args:
                - |
                  set -eu
                  export RESTIC_CACHE_DIR=/work/cache
                  restic cat config >/dev/null 2>&1 || restic init
                  restic backup /work/authentik.sql.gz --host mocha --tag authentik-postgres
                  restic forget --keep-daily 7 --keep-weekly 4 --keep-monthly 6 --prune
              envFrom:
                - secretRef:
                    name: restic-authentik-pg
              volumeMounts:
                - name: work
                  mountPath: /work
