apiVersion: batch/v1
kind: CronJob
metadata:
  name: toutou-db-dump
  namespace: toutou
spec:
  schedule: "15 1 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        spec:
          restartPolicy: OnFailure
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            fsGroup: 1000
            seccompProfile:
              type: RuntimeDefault
          volumes:
            - name: work
              emptyDir: {}
          initContainers:
            - name: dump
              image: postgres:18-alpine
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop: ["ALL"]
              command: ["/bin/sh", "-c"]
              args:
                - |
                  set -eu
                  pg_dump --no-owner --no-privileges --clean --if-exists \
                    | gzip -9 > /work/toutou.sql.gz
                  echo "dump size: $(du -h /work/toutou.sql.gz)"
              env:
                - name: PGHOST
                  value: toutou-db
                - name: PGPORT
                  value: "5432"
                - name: PGUSER
                  value: toutou
                - name: PGDATABASE
                  value: toutou
                - name: PGPASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: toutou-secrets
                      key: POSTGRES_PASSWORD
              volumeMounts:
                - name: work
                  mountPath: /work
          containers:
            - name: upload
              image: restic/restic:0.17.3
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop: ["ALL"]
              command: ["/bin/sh", "-c"]
              args:
                - |
                  set -eu
                  export RESTIC_CACHE_DIR=/work/cache
                  restic cat config >/dev/null 2>&1 || restic init
                  restic backup /work/toutou.sql.gz --host mocha --tag toutou-db
                  restic forget --keep-daily 7 --keep-weekly 4 --keep-monthly 6 --prune
              envFrom:
                - secretRef:
                    name: restic-toutou-db-dump
              volumeMounts:
                - name: work
                  mountPath: /work
---
