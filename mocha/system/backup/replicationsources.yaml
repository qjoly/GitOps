apiVersion: volsync.backube/v1alpha1
kind: ReplicationSource
metadata:
  name: vaultwarden-data
  namespace: vaultwarden
spec:
  sourcePVC: vaultwarden-data
  trigger:
    schedule: "0 1 * * *"
  restic:
    repository: restic-vaultwarden-data
    copyMethod: Direct
    cacheCapacity: 512Mi
    pruneIntervalDays: 7
    retain:
      daily: 7
      weekly: 4
      monthly: 3
