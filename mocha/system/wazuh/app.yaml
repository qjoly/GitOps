apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: wazuh
  namespace: argocd
spec:
  project: default
  syncPolicy:
    managedNamespaceMetadata:
      labels:
        pod-security.kubernetes.io/enforce: privileged
        pod-security.kubernetes.io/audit: privileged
        pod-security.kubernetes.io/warn: privileged
    automated:
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
  destination:
    server: https://kubernetes.default.svc
    namespace: wazuh
  sources:
    - repoURL: https://morgoved.github.io/wazuh-helm/
      chart: wazuh
      targetRevision: 2.0.3
      helm:
        values: |
          indexer:
            replicas: 1
            storageClass: openebs-lvmpv
            sysctlImage:
              enabled: true
            cred:
              existingSecret: indexer-cred
              # wazuh: existingSecret only feeds the runtime password (env var).
              # The security-config bootstrap reads passwordHash via a Helm
              # `lookup()` that ArgoCD's helm-template rendering never
              # resolves (always nil) - it silently falls back to this
              # literal, so it has to be set explicitly and kept in sync
              # with the plaintext password stored in Vault (kv/wazuh).
              # Must be $2a$/$2b$ - OpenSearch Security silently blanks out
              # $2y$ hashes (e.g. from `htpasswd -B`) instead of rejecting them.
              passwordHash: "$2a$12$UqIPAgI.ZHTbsohMG3BfJ.SUafFj0OuYymAcMCoWZtzr2VacKXLIa"
            # wazuh: chart's securityadmin Job defaults to a Helm-native hook
            # (post-install/post-upgrade), inert under ArgoCD's helm-template
            # rendering. A PostSync hook doesn't work either: ArgoCD only runs
            # PostSync once every plain Sync-phase resource is Healthy, and
            # wazuh-dashboard can never become healthy until this job has run
            # (deadlock). Use a plain sync-wave instead, ahead of the
            # dashboard's wave, with Replace so the immutable Job re-applies
            # cleanly on every sync.
            job:
              annotations:
                argocd.argoproj.io/sync-wave: "1"
                # wazuh: Replace=true alone still goes through kubectl
                # replace, which the API server rejects for the Job's
                # immutable spec.selector/template - Force=true is what
                # actually makes ArgoCD delete+recreate on that conflict.
                argocd.argoproj.io/sync-options: Replace=true,Force=true
            networkPolicy:
              extraEgresses:
                - ports:
                    - protocol: TCP
                      port: 443
                  to:
                    - ipBlock:
                        cidr: 0.0.0.0/0
                # wazuh: the ipBlock rule above doesn't reach Traefik's
                # ClusterIP - Cilium treats a plain 0.0.0.0/0 CIDR rule as
                # "world"/external only and excludes cluster-internal
                # Service/Pod ranges. Allow Traefik explicitly by identity.
                # Port 8443 (not just the Service's 443) because Cilium's
                # socket-based LB rewrites the destination to the backend
                # port before NetworkPolicy enforcement sees the packet.
                - ports:
                    - protocol: TCP
                      port: 443
                    - protocol: TCP
                      port: 8443
                  to:
                    - namespaceSelector:
                        matchLabels:
                          kubernetes.io/metadata.name: traefik
                      podSelector:
                        matchLabels:
                          app.kubernetes.io/name: traefik
            # wazuh: authentik.mocha.thoughtless.eu resolves to mocha's own
            # node IP - a pod reaching it hits the hairpin-NAT problem
            # (single-node cluster, no loopback for a pod calling its own
            # node's public IP) and the OIDC discovery/JWKS fetch just times
            # out. Route it to Traefik's ClusterIP instead - same Host-based
            # routing, no round-trip through the public IP. Update this IP if
            # the traefik Service in mocha/system/traefik is ever recreated.
            extraSpec:
              pod:
                hostAliases:
                  - ip: "10.107.215.8"
                    hostnames:
                      - "authentik.mocha.thoughtless.eu"
          dashboard:
            replicas: 1
            # wazuh: wait for the securityadmin job (wave 1) to push the real
            # credentials before starting - otherwise it crashloops forever
            # trying to authenticate against an unconfigured security index.
            annotations:
              argocd.argoproj.io/sync-wave: "2"
            cred:
              existingSecret: dashboard-cred
              # wazuh: same lookup() caveat as indexer.cred above.
              passwordHash: "$2a$12$fFtpHyW5kmsRVt2dM1yA..7T.AppZZOQ9ku.juID6xGSHQBOPoU0S"
            # wazuh: basic_internal_auth_domain's order/challenge are actually
            # configurable here (not hardcoded, despite an earlier comment in
            # this file claiming otherwise) - both Authentik's and Wazuh's
            # official SSO integration guides put basic first with
            # challenge:false, so the SSO domain (order 1, challenge:true by
            # default) owns the passive 401 challenge instead of basic.
            basicAuth:
              order: 0
              challenge: false
            ingress:
              enabled: true
              className: traefik
              annotations:
                cert-manager.io/cluster-issuer: cloudflare
              host: wazuh.mocha.thoughtless.eu
              tls:
                - secretName: wazuh-tls
                  hosts:
                    - wazuh.mocha.thoughtless.eu
            networkPolicy:
              extraEgresses:
                - ports:
                    - protocol: TCP
                      port: 443
                  to:
                    - ipBlock:
                        cidr: 0.0.0.0/0
                # wazuh: the ipBlock rule above doesn't reach Traefik's
                # ClusterIP - Cilium treats a plain 0.0.0.0/0 CIDR rule as
                # "world"/external only and excludes cluster-internal
                # Service/Pod ranges. Allow Traefik explicitly by identity.
                # Port 8443 (not just the Service's 443) because Cilium's
                # socket-based LB rewrites the destination to the backend
                # port before NetworkPolicy enforcement sees the packet.
                - ports:
                    - protocol: TCP
                      port: 443
                    - protocol: TCP
                      port: 8443
                  to:
                    - namespaceSelector:
                        matchLabels:
                          kubernetes.io/metadata.name: traefik
                      podSelector:
                        matchLabels:
                          app.kubernetes.io/name: traefik
            # wazuh: same hairpin-NAT workaround as indexer.extraSpec.pod above.
            extraSpec:
              pod:
                hostAliases:
                  - ip: "10.107.215.8"
                    hostnames:
                      - "authentik.mocha.thoughtless.eu"
            sso:
              # wazuh: OIDC abandoned - the wazuh-security-dashboards-plugin's
              # openid flow never got past the dashboard's own Bearer
              # authinfo call to the indexer (confirmed via debug logs: zero
              # trace of it, across every config combination tried: scope,
              # subjectKey/rolesKey, auth-domain order/challenge, the
              # openid.header fix, session.keepalive). Neither Authentik's
              # nor Wazuh's own integration docs cover OIDC for this pairing
              # - SAML is the only officially documented path, so that's
              # what's wired up here instead.
              saml:
                enabled: true
                metadataUrl: "https://authentik.mocha.thoughtless.eu/application/saml/wazuh-saml/metadata/"
                idpEntityId: "https://authentik.mocha.thoughtless.eu/application/saml/wazuh-saml/metadata/"
                spEntityId: "wazuh-saml"
                kibanaUrl: "https://wazuh.mocha.thoughtless.eu"
                # wazuh: chart has no existingSecret hook for this field
                # either (same limitation as wazuh.key below) - value is
                # also recorded in Vault (kv/wazuh#saml_exchange_key) as the
                # canonical record.
                exchangeKey: "93813f573ae8289a2510392771f48a13c245b881bd0b6d61b223ff49a0062ba4"
                roleMappings:
                  allAccess:
                    backendRoles: ["wazuh-admin"]
          wazuh:
            # wazuh: chart v2.0.3 has no existingSecret hook for the cluster key (baked
            # straight into a Secret from this literal value) - low risk here since
            # worker.enabled is false, so there's no cluster peer to authenticate against.
            key: "f8e7b4e8dee5872787fcebeb1adeca01"
            apiCred:
              existingSecret: wazuh-api-cred
            authd:
              existingSecret: wazuh-authd-pass
            master:
              storageClass: openebs-lvmpv
            worker:
              enabled: false
    - repoURL: https://github.com/qjoly/gitops.git
      targetRevision: HEAD
      path: mocha/system/wazuh/manifests
