apiVersion: resources.signoz.io/v1alpha1
kind: Rule
metadata:
  name: kubernetes-node-memory-pressure
  namespace: signoz
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  providerConfigRef:
    name: mocha
  objectTemplate:
    spec:
      schemaVersion: v2alpha1
      alert: Kubernetes node memory pressure
      alertType: METRIC_BASED_ALERT
      ruleType: threshold_rule
      description: k8s.node.condition_memory_pressure is active.
      labels:
        severity: warning
      annotations:
        summary: Kubernetes node under memory pressure
        description: k8s.node.condition_memory_pressure is active.
      condition:
        compositeQuery:
          queryType: builder
          panelType: graph
          queries:
          - type: builder_query
            spec:
              name: A
              signal: metrics
              disabled: false
              aggregations:
              - metricName: k8s.node.condition_memory_pressure
                timeAggregation: latest
                spaceAggregation: max
              filter:
                expression: ''
              groupBy:
              - name: k8s.cluster.name
              - name: k8s.node.name
        selectedQueryName: A
        thresholds:
          kind: basic
          spec:
          - name: warning
            op: above
            matchType: at_least_once
            target: 0
            channels:
            - discord
      evaluation:
        kind: rolling
        spec:
          evalWindow: 5m
          frequency: 1m
      notificationSettings:
        usePolicy: false
        renotify:
          enabled: false
