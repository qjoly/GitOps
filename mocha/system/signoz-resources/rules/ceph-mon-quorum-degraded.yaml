apiVersion: resources.signoz.io/v1alpha1
kind: Rule
metadata:
  name: ceph-mon-quorum-degraded
  namespace: signoz
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  providerConfigRef:
    name: mocha
  objectTemplate:
    spec:
      schemaVersion: v2alpha1
      alert: Ceph mon quorum degraded
      alertType: METRIC_BASED_ALERT
      ruleType: threshold_rule
      description: Fewer than 3 mons in quorum on turing.
      labels:
        severity: critical
      annotations:
        summary: Ceph mon quorum degraded
        description: Fewer than 3 mons in quorum on turing.
      condition:
        compositeQuery:
          queryType: builder
          panelType: graph
          queries:
          - type: builder_query
            spec:
              name: A
              signal: metrics
              disabled: false
              aggregations:
              - metricName: ceph_mon_quorum_status
                timeAggregation: latest
                spaceAggregation: sum
              filter:
                expression: k8s.cluster.name = 'turing'
              groupBy:
              - name: k8s.cluster.name
        selectedQueryName: A
        thresholds:
          kind: basic
          spec:
          - name: critical
            op: below
            matchType: at_least_once
            target: 3
            channels:
            - discord
      evaluation:
        kind: rolling
        spec:
          evalWindow: 5m
          frequency: 1m
      notificationSettings:
        usePolicy: false
        renotify:
          enabled: false
