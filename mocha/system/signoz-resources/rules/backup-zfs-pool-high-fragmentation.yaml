apiVersion: resources.signoz.io/v1alpha1
kind: Rule
metadata:
  name: backup-zfs-pool-high-fragmentation
  namespace: signoz
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  providerConfigRef:
    name: mocha
  objectTemplate:
    spec:
      schemaVersion: v2alpha1
      alert: Backup ZFS pool high fragmentation
      alertType: METRIC_BASED_ALERT
      ruleType: threshold_rule
      description: ZFS pool fragmentation above 60% on affogato.
      labels:
        severity: warning
      annotations:
        summary: Backup pool fragmentation high
        description: ZFS pool fragmentation above 60% on affogato.
      condition:
        compositeQuery:
          queryType: builder
          panelType: graph
          queries:
          - type: builder_query
            spec:
              name: A
              signal: metrics
              disabled: false
              aggregations:
              - metricName: zfs_pool_fragmentation_ratio
                timeAggregation: latest
                spaceAggregation: max
              filter:
                expression: k8s.cluster.name = 'affogato'
              groupBy:
              - name: k8s.cluster.name
              - name: pool
        selectedQueryName: A
        thresholds:
          kind: basic
          spec:
          - name: warning
            op: above
            matchType: at_least_once
            target: 60
            channels:
            - discord
      evaluation:
        kind: rolling
        spec:
          evalWindow: 15m
          frequency: 5m
      notificationSettings:
        usePolicy: false
        renotify:
          enabled: false
