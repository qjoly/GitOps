apiVersion: resources.signoz.io/v1alpha1
kind: Rule
metadata:
  name: proxmox-storage-not-available
  namespace: signoz
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  providerConfigRef:
    name: mocha
  objectTemplate:
    spec:
      schemaVersion: v2alpha1
      alert: Proxmox storage not available
      alertType: METRIC_BASED_ALERT
      ruleType: threshold_rule
      description: pve_up = 0 for a Proxmox storage (id storage/...).
      labels:
        severity: warning
      annotations:
        summary: A Proxmox storage is not available
        description: pve_up = 0 for a Proxmox storage (id storage/...).
      condition:
        compositeQuery:
          queryType: builder
          panelType: graph
          queries:
          - type: builder_query
            spec:
              name: A
              signal: metrics
              disabled: false
              aggregations:
              - metricName: pve_up
                timeAggregation: latest
                spaceAggregation: min
              filter:
                expression: k8s.cluster.name = 'proxmox-01' AND id LIKE 'storage/%'
              groupBy:
              - name: k8s.cluster.name
              - name: id
        selectedQueryName: A
        thresholds:
          kind: basic
          spec:
          - name: warning
            op: below
            matchType: at_least_once
            target: 1
            channels:
            - discord
      evaluation:
        kind: rolling
        spec:
          evalWindow: 10m
          frequency: 5m
      notificationSettings:
        usePolicy: false
        renotify:
          enabled: false
