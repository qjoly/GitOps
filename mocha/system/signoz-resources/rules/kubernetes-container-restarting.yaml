apiVersion: resources.signoz.io/v1alpha1
kind: Rule
metadata:
  name: kubernetes-container-restarting
  namespace: signoz
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  providerConfigRef:
    name: mocha
  objectTemplate:
    spec:
      schemaVersion: v2alpha1
      alert: Kubernetes container restarting
      alertType: METRIC_BASED_ALERT
      ruleType: threshold_rule
      description: More than 3 restarts over 15m (possible CrashLoopBackOff).
      labels:
        severity: warning
      annotations:
        summary: Container restarting frequently
        description: More than 3 restarts over 15m (possible CrashLoopBackOff).
      condition:
        compositeQuery:
          queryType: builder
          panelType: graph
          queries:
          - type: builder_query
            spec:
              name: A
              signal: metrics
              disabled: false
              aggregations:
              - metricName: k8s.container.restarts
                timeAggregation: increase
                spaceAggregation: max
              filter:
                expression: ''
              groupBy:
              - name: k8s.cluster.name
              - name: k8s.pod.name
              - name: k8s.container.name
        selectedQueryName: A
        thresholds:
          kind: basic
          spec:
          - name: warning
            op: above
            matchType: at_least_once
            target: 3
            channels:
            - discord
      evaluation:
        kind: rolling
        spec:
          evalWindow: 15m
          frequency: 5m
      notificationSettings:
        usePolicy: false
        renotify:
          enabled: false
