apiVersion: resources.signoz.io/v1alpha1
kind: Rule
metadata:
  name: externalsecret-not-ready
  namespace: signoz
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  providerConfigRef:
    name: mocha
  objectTemplate:
    spec:
      schemaVersion: v2alpha1
      alert: ExternalSecret not ready
      alertType: METRIC_BASED_ALERT
      ruleType: threshold_rule
      description: An ExternalSecret has been failing to sync for over 15m. The referenced Vault path or property is usually missing, so the target Kubernetes Secret is never created and the workloads consuming it stay stuck in CreateContainerConfigError.
      labels:
        severity: warning
      annotations:
        summary: An ExternalSecret is not syncing
        description: externalsecret_status_condition{condition=Ready,status=False} = 1 for over 15m.
      condition:
        compositeQuery:
          queryType: builder
          panelType: graph
          queries:
          - type: builder_query
            spec:
              name: A
              signal: metrics
              disabled: false
              aggregations:
              - metricName: externalsecret_status_condition
                timeAggregation: latest
                spaceAggregation: max
              filter:
                expression: condition = 'Ready' AND status = 'False'
              groupBy:
              - name: k8s.cluster.name
              - name: namespace
              - name: name
        selectedQueryName: A
        thresholds:
          kind: basic
          spec:
          - name: warning
            op: above
            matchType: all_the_times
            target: 0
            channels:
            - discord
      evaluation:
        kind: rolling
        spec:
          evalWindow: 15m
          frequency: 5m
      notificationSettings:
        usePolicy: false
        renotify:
          enabled: false
