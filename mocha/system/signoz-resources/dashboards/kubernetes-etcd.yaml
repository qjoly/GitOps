apiVersion: resources.signoz.io/v1alpha1
kind: Dashboard
metadata:
  name: kubernetes-etcd
  namespace: signoz
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  providerConfigRef:
    name: mocha
  objectTemplate:
    spec:
      schemaVersion: v6
      name: kubernetes-etcd
      tags:
      - key: tag
        value: kubernetes
      - key: tag
        value: control-plane
      - key: tag
        value: etcd
      - key: tag
        value: prometheus
      spec:
        display:
          name: Kubernetes Etcd
          description: Standard etcd view using native etcd server metrics (leadership, proposals, client request traffic, and storage latency).
        variables:
        - kind: ListVariable
          spec:
            name: service.name
            display:
              name: service.name
              description: Auto-discovered services (from metric labels).
            allowAllValue: true
            allowMultiple: true
            sort: none
            plugin:
              kind: signoz/DynamicVariable
              spec:
                name: service.name
                signal: metrics
        - kind: ListVariable
          spec:
            name: k8s.cluster.name
            display:
              name: k8s.cluster.name
              description: Optional cluster label selector.
            allowAllValue: true
            allowMultiple: true
            sort: none
            plugin:
              kind: signoz/DynamicVariable
              spec:
                name: k8s.cluster.name
                signal: metrics
        - kind: ListVariable
          spec:
            name: deployment_environment_name
            display:
              name: deployment_environment_name
              description: Optional OTel environment label selector.
            allowAllValue: true
            allowMultiple: true
            sort: none
            plugin:
              kind: signoz/DynamicVariable
              spec:
                name: deployment.environment.name
                signal: metrics
        - kind: ListVariable
          spec:
            name: deployment_environment
            display:
              name: deployment_environment
              description: Optional legacy environment label selector.
            allowAllValue: true
            allowMultiple: true
            sort: none
            plugin:
              kind: signoz/DynamicVariable
              spec:
                name: deployment.environment
                signal: metrics
        panels:
          auto-discovered-etcd-services:
            kind: Panel
            spec:
              display:
                name: Auto-Discovered Etcd Services
                description: ''
              plugin:
                kind: signoz/TimeSeriesPanel
                spec:
                  visualization:
                    timePreference: global_time
                    fillSpans: false
                  formatting:
                    unit: reqps
                  chartAppearance:
                    lineInterpolation: spline
                    showPoints: false
                    lineStyle: solid
                    fillMode: none
                    spanGaps:
                      fillOnlyBelow: false
                      fillLessThan: ''
                  axes:
                    isLogScale: false
                  legend:
                    position: bottom
                    mode: list
                  thresholds: []
              queries:
              - kind: time_series
                spec:
                  name: A
                  plugin:
                    kind: signoz/BuilderQuery
                    spec:
                      name: A
                      stepInterval: 60
                      signal: metrics
                      aggregations:
                      - metricName: etcd_server_client_requests_total
                        timeAggregation: rate
                        spaceAggregation: sum
                        reduceTo: avg
                      disabled: false
                      filter:
                        expression: service.name IN $service.name AND k8s.cluster.name IN $k8s.cluster.name
                      groupBy:
                      - name: service.name
                        fieldDataType: string
                      having:
                        expression: ''
                      legend: '{{service.name}}'
              links: []
          client-requests-s:
            kind: Panel
            spec:
              display:
                name: Client Requests / s
                description: ''
              plugin:
                kind: signoz/NumberPanel
                spec:
                  visualization:
                    timePreference: global_time
                  formatting:
                    unit: reqps
                  thresholds: []
              queries:
              - kind: scalar
                spec:
                  name: A
                  plugin:
                    kind: signoz/BuilderQuery
                    spec:
                      name: A
                      stepInterval: 60
                      signal: metrics
                      aggregations:
                      - metricName: etcd_server_client_requests_total
                        timeAggregation: rate
                        spaceAggregation: sum
                        reduceTo: avg
                      disabled: false
                      filter:
                        expression: service.name IN $service.name AND k8s.cluster.name IN $k8s.cluster.name
                      groupBy: []
                      having:
                        expression: ''
                      legend: client req/s
              links: []
          has-leader:
            kind: Panel
            spec:
              display:
                name: Has Leader
                description: ''
              plugin:
                kind: signoz/NumberPanel
                spec:
                  visualization:
                    timePreference: global_time
                  formatting:
                    unit: short
                  thresholds: []
              queries:
              - kind: scalar
                spec:
                  name: A
                  plugin:
                    kind: signoz/BuilderQuery
                    spec:
                      name: A
                      stepInterval: 60
                      signal: metrics
                      aggregations:
                      - metricName: etcd_server_has_leader
                        timeAggregation: latest
                        spaceAggregation: max
                        reduceTo: last
                      disabled: false
                      filter:
                        expression: service.name IN $service.name AND k8s.cluster.name IN $k8s.cluster.name
                      groupBy: []
                      having:
                        expression: ''
                      legend: leader=1
              links: []
          proposals-pending:
            kind: Panel
            spec:
              display:
                name: Proposals Pending
                description: ''
              plugin:
                kind: signoz/NumberPanel
                spec:
                  visualization:
                    timePreference: global_time
                  formatting:
                    unit: short
                  thresholds: []
              queries:
              - kind: scalar
                spec:
                  name: A
                  plugin:
                    kind: signoz/BuilderQuery
                    spec:
                      name: A
                      stepInterval: 60
                      signal: metrics
                      aggregations:
                      - metricName: etcd_server_proposals_pending
                        timeAggregation: latest
                        spaceAggregation: max
                        reduceTo: last
                      disabled: false
                      filter:
                        expression: service.name IN $service.name AND k8s.cluster.name IN $k8s.cluster.name
                      groupBy: []
                      having:
                        expression: ''
                      legend: pending
              links: []
          db-size:
            kind: Panel
            spec:
              display:
                name: DB Size
                description: ''
              plugin:
                kind: signoz/NumberPanel
                spec:
                  visualization:
                    timePreference: global_time
                  formatting:
                    unit: By
                  thresholds: []
              queries:
              - kind: scalar
                spec:
                  name: A
                  plugin:
                    kind: signoz/BuilderQuery
                    spec:
                      name: A
                      stepInterval: 60
                      signal: metrics
                      aggregations:
                      - metricName: etcd_mvcc_db_total_size_in_bytes
                        timeAggregation: latest
                        spaceAggregation: max
                        reduceTo: last
                      disabled: false
                      filter:
                        expression: service.name IN $service.name AND k8s.cluster.name IN $k8s.cluster.name
                      groupBy: []
                      having:
                        expression: ''
                      legend: db size
              links: []
          client-requests-by-type:
            kind: Panel
            spec:
              display:
                name: Client Requests By Type
                description: ''
              plugin:
                kind: signoz/TimeSeriesPanel
                spec:
                  visualization:
                    timePreference: global_time
                    fillSpans: false
                  formatting:
                    unit: reqps
                  chartAppearance:
                    lineInterpolation: spline
                    showPoints: false
                    lineStyle: solid
                    fillMode: none
                    spanGaps:
                      fillOnlyBelow: false
                      fillLessThan: ''
                  axes:
                    isLogScale: false
                  legend:
                    position: bottom
                    mode: list
                  thresholds: []
              queries:
              - kind: time_series
                spec:
                  name: A
                  plugin:
                    kind: signoz/BuilderQuery
                    spec:
                      name: A
                      stepInterval: 60
                      signal: metrics
                      aggregations:
                      - metricName: etcd_server_client_requests_total
                        timeAggregation: rate
                        spaceAggregation: sum
                        reduceTo: avg
                      disabled: false
                      filter:
                        expression: service.name IN $service.name AND k8s.cluster.name IN $k8s.cluster.name
                      groupBy:
                      - name: type
                        fieldDataType: string
                      having:
                        expression: ''
                      legend: '{{type}}'
              links: []
          apply-duration-p50-p90-p99:
            kind: Panel
            spec:
              display:
                name: Apply Duration (p50/p90/p99)
                description: ''
              plugin:
                kind: signoz/TimeSeriesPanel
                spec:
                  visualization:
                    timePreference: global_time
                    fillSpans: false
                  formatting:
                    unit: reqps
                  chartAppearance:
                    lineInterpolation: spline
                    showPoints: false
                    lineStyle: solid
                    fillMode: none
                    spanGaps:
                      fillOnlyBelow: false
                      fillLessThan: ''
                  axes:
                    isLogScale: false
                  legend:
                    position: bottom
                    mode: list
                  thresholds: []
              queries:
              - kind: time_series
                spec:
                  name: A
                  plugin:
                    kind: signoz/CompositeQuery
                    spec:
                      queries:
                      - type: builder_query
                        spec:
                          name: A
                          stepInterval: 60
                          signal: metrics
                          aggregations:
                          - metricName: etcd_server_apply_duration_seconds.bucket
                            spaceAggregation: p50
                            reduceTo: avg
                          disabled: false
                          filter:
                            expression: service.name IN $service.name AND k8s.cluster.name IN $k8s.cluster.name
                          groupBy: []
                          having:
                            expression: ''
                          legend: p50
                      - type: builder_query
                        spec:
                          name: B
                          stepInterval: 60
                          signal: metrics
                          aggregations:
                          - metricName: etcd_server_apply_duration_seconds.bucket
                            spaceAggregation: p90
                            reduceTo: avg
                          disabled: false
                          filter:
                            expression: service.name IN $service.name AND k8s.cluster.name IN $k8s.cluster.name
                          groupBy: []
                          having:
                            expression: ''
                          legend: p90
                      - type: builder_query
                        spec:
                          name: C
                          stepInterval: 60
                          signal: metrics
                          aggregations:
                          - metricName: etcd_server_apply_duration_seconds.bucket
                            spaceAggregation: p99
                            reduceTo: avg
                          disabled: false
                          filter:
                            expression: service.name IN $service.name AND k8s.cluster.name IN $k8s.cluster.name
                          groupBy: []
                          having:
                            expression: ''
                          legend: p99
              links: []
          range-duration-p50-p90-p99:
            kind: Panel
            spec:
              display:
                name: Range Duration (p50/p90/p99)
                description: ''
              plugin:
                kind: signoz/TimeSeriesPanel
                spec:
                  visualization:
                    timePreference: global_time
                    fillSpans: false
                  formatting:
                    unit: reqps
                  chartAppearance:
                    lineInterpolation: spline
                    showPoints: false
                    lineStyle: solid
                    fillMode: none
                    spanGaps:
                      fillOnlyBelow: false
                      fillLessThan: ''
                  axes:
                    isLogScale: false
                  legend:
                    position: bottom
                    mode: list
                  thresholds: []
              queries:
              - kind: time_series
                spec:
                  name: A
                  plugin:
                    kind: signoz/CompositeQuery
                    spec:
                      queries:
                      - type: builder_query
                        spec:
                          name: A
                          stepInterval: 60
                          signal: metrics
                          aggregations:
                          - metricName: etcd_server_range_duration_seconds.bucket
                            spaceAggregation: p50
                            reduceTo: avg
                          disabled: false
                          filter:
                            expression: service.name IN $service.name AND k8s.cluster.name IN $k8s.cluster.name
                          groupBy: []
                          having:
                            expression: ''
                          legend: p50
                      - type: builder_query
                        spec:
                          name: B
                          stepInterval: 60
                          signal: metrics
                          aggregations:
                          - metricName: etcd_server_range_duration_seconds.bucket
                            spaceAggregation: p90
                            reduceTo: avg
                          disabled: false
                          filter:
                            expression: service.name IN $service.name AND k8s.cluster.name IN $k8s.cluster.name
                          groupBy: []
                          having:
                            expression: ''
                          legend: p90
                      - type: builder_query
                        spec:
                          name: C
                          stepInterval: 60
                          signal: metrics
                          aggregations:
                          - metricName: etcd_server_range_duration_seconds.bucket
                            spaceAggregation: p99
                            reduceTo: avg
                          disabled: false
                          filter:
                            expression: service.name IN $service.name AND k8s.cluster.name IN $k8s.cluster.name
                          groupBy: []
                          having:
                            expression: ''
                          legend: p99
              links: []
          wal-fsync-duration-p50-p90-p99:
            kind: Panel
            spec:
              display:
                name: WAL Fsync Duration (p50/p90/p99)
                description: ''
              plugin:
                kind: signoz/TimeSeriesPanel
                spec:
                  visualization:
                    timePreference: global_time
                    fillSpans: false
                  formatting:
                    unit: reqps
                  chartAppearance:
                    lineInterpolation: spline
                    showPoints: false
                    lineStyle: solid
                    fillMode: none
                    spanGaps:
                      fillOnlyBelow: false
                      fillLessThan: ''
                  axes:
                    isLogScale: false
                  legend:
                    position: bottom
                    mode: list
                  thresholds: []
              queries:
              - kind: time_series
                spec:
                  name: A
                  plugin:
                    kind: signoz/CompositeQuery
                    spec:
                      queries:
                      - type: builder_query
                        spec:
                          name: A
                          stepInterval: 60
                          signal: metrics
                          aggregations:
                          - metricName: etcd_disk_wal_fsync_duration_seconds.bucket
                            spaceAggregation: p50
                            reduceTo: avg
                          disabled: false
                          filter:
                            expression: service.name IN $service.name AND k8s.cluster.name IN $k8s.cluster.name
                          groupBy: []
                          having:
                            expression: ''
                          legend: p50
                      - type: builder_query
                        spec:
                          name: B
                          stepInterval: 60
                          signal: metrics
                          aggregations:
                          - metricName: etcd_disk_wal_fsync_duration_seconds.bucket
                            spaceAggregation: p90
                            reduceTo: avg
                          disabled: false
                          filter:
                            expression: service.name IN $service.name AND k8s.cluster.name IN $k8s.cluster.name
                          groupBy: []
                          having:
                            expression: ''
                          legend: p90
                      - type: builder_query
                        spec:
                          name: C
                          stepInterval: 60
                          signal: metrics
                          aggregations:
                          - metricName: etcd_disk_wal_fsync_duration_seconds.bucket
                            spaceAggregation: p99
                            reduceTo: avg
                          disabled: false
                          filter:
                            expression: service.name IN $service.name AND k8s.cluster.name IN $k8s.cluster.name
                          groupBy: []
                          having:
                            expression: ''
                          legend: p99
              links: []
        layouts:
        - kind: Grid
          spec:
            items:
            - x: 0
              y: 0
              width: 3
              height: 4
              content:
                $ref: '#/spec/panels/auto-discovered-etcd-services'
            - x: 3
              y: 0
              width: 3
              height: 2
              content:
                $ref: '#/spec/panels/client-requests-s'
            - x: 6
              y: 0
              width: 3
              height: 2
              content:
                $ref: '#/spec/panels/has-leader'
            - x: 9
              y: 0
              width: 3
              height: 2
              content:
                $ref: '#/spec/panels/proposals-pending'
            - x: 0
              y: 4
              width: 6
              height: 2
              content:
                $ref: '#/spec/panels/db-size'
            - x: 6
              y: 4
              width: 6
              height: 4
              content:
                $ref: '#/spec/panels/client-requests-by-type'
            - x: 0
              y: 8
              width: 6
              height: 4
              content:
                $ref: '#/spec/panels/apply-duration-p50-p90-p99'
            - x: 6
              y: 8
              width: 6
              height: 4
              content:
                $ref: '#/spec/panels/range-duration-p50-p90-p99'
            - x: 0
              y: 12
              width: 6
              height: 4
              content:
                $ref: '#/spec/panels/wal-fsync-duration-p50-p90-p99'
