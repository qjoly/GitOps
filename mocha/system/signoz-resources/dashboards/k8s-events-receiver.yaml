apiVersion: resources.signoz.io/v1alpha1
kind: Dashboard
metadata:
  name: k8s-events-receiver
  namespace: signoz
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  providerConfigRef:
    name: mocha
  objectTemplate:
    spec:
      schemaVersion: v6
      name: k8s-events-receiver
      tags:
      - key: tag
        value: k8s
      - key: tag
        value: cloud
      - key: tag
        value: events
      spec:
        display:
          name: Kubernetes Cluster Events
          description: This dashboard displays specific event and object kind counts, as well as their respective time-series charts, allowing the viewer to understand what's happening inside a cluster at a glance.
        variables:
        - kind: ListVariable
          spec:
            name: k8s.cluster.name
            display:
              name: k8s.cluster.name
              description: The k8s cluster name
            allowAllValue: false
            allowMultiple: false
            sort: none
            plugin:
              kind: signoz/DynamicVariable
              spec:
                name: k8s.cluster.name
                signal: all
        - kind: ListVariable
          spec:
            name: k8s.namespace.name
            display:
              name: k8s.namespace.name
              description: The k8s namespace name
            allowAllValue: true
            allowMultiple: true
            sort: none
            plugin:
              kind: signoz/DynamicVariable
              spec:
                name: k8s.namespace.name
                signal: all
        panels:
          scaling-replica-s-count:
            kind: Panel
            spec:
              display:
                name: Scaling Replica's Count
                description: ''
              plugin:
                kind: signoz/NumberPanel
                spec:
                  visualization:
                    timePreference: global_time
                  formatting:
                    unit: none
                  thresholds: []
              queries:
              - kind: scalar
                spec:
                  name: A
                  plugin:
                    kind: signoz/BuilderQuery
                    spec:
                      name: A
                      stepInterval: 60
                      signal: logs
                      aggregations:
                      - expression: count()
                      disabled: false
                      filter:
                        expression: (k8s.cluster.name IN $k8s.cluster.name AND k8s.namespace.name IN $k8s.namespace.name AND k8s.event.reason = 'ScalingReplicaSet')
                      groupBy: []
                      having:
                        expression: ''
                      legend: ''
              links: []
          event-count:
            kind: Panel
            spec:
              display:
                name: Event Count
                description: ''
              plugin:
                kind: signoz/NumberPanel
                spec:
                  visualization:
                    timePreference: global_time
                  formatting:
                    unit: none
                  thresholds: []
              queries:
              - kind: scalar
                spec:
                  name: A
                  plugin:
                    kind: signoz/BuilderQuery
                    spec:
                      name: A
                      stepInterval: 60
                      signal: logs
                      aggregations:
                      - expression: count()
                      disabled: false
                      filter:
                        expression: (k8s.cluster.name IN $k8s.cluster.name AND k8s.namespace.name IN $k8s.namespace.name)
                      groupBy: []
                      having:
                        expression: ''
                      legend: ''
              links: []
          successful-delete-events:
            kind: Panel
            spec:
              display:
                name: Successful Delete Events
                description: ''
              plugin:
                kind: signoz/NumberPanel
                spec:
                  visualization:
                    timePreference: global_time
                  formatting:
                    unit: none
                  thresholds: []
              queries:
              - kind: scalar
                spec:
                  name: A
                  plugin:
                    kind: signoz/BuilderQuery
                    spec:
                      name: A
                      stepInterval: 60
                      signal: logs
                      aggregations:
                      - expression: count()
                      disabled: false
                      filter:
                        expression: (k8s.cluster.name IN $k8s.cluster.name AND k8s.namespace.name IN $k8s.namespace.name AND k8s.event.reason = 'SuccessfulDelete')
                      groupBy: []
                      having:
                        expression: ''
                      legend: ''
              links: []
          deployments-count:
            kind: Panel
            spec:
              display:
                name: Deployments Count
                description: ''
              plugin:
                kind: signoz/NumberPanel
                spec:
                  visualization:
                    timePreference: global_time
                  formatting:
                    unit: none
                  thresholds: []
              queries:
              - kind: scalar
                spec:
                  name: A
                  plugin:
                    kind: signoz/BuilderQuery
                    spec:
                      name: A
                      stepInterval: 60
                      signal: logs
                      aggregations:
                      - expression: count()
                      disabled: false
                      filter:
                        expression: (k8s.cluster.name IN $k8s.cluster.name AND k8s.namespace.name IN $k8s.namespace.name AND k8s.object.kind = 'Deployment')
                      groupBy: []
                      having:
                        expression: ''
                      legend: ''
              links: []
          scheduled-events-count:
            kind: Panel
            spec:
              display:
                name: Scheduled Events Count
                description: ''
              plugin:
                kind: signoz/NumberPanel
                spec:
                  visualization:
                    timePreference: global_time
                  formatting:
                    unit: none
                  thresholds: []
              queries:
              - kind: scalar
                spec:
                  name: A
                  plugin:
                    kind: signoz/BuilderQuery
                    spec:
                      name: A
                      stepInterval: 60
                      signal: logs
                      aggregations:
                      - expression: count()
                      disabled: false
                      filter:
                        expression: (k8s.cluster.name IN $k8s.cluster.name AND k8s.namespace.name IN $k8s.namespace.name AND k8s.event.reason = 'Scheduled')
                      groupBy: []
                      having:
                        expression: ''
                      legend: ''
              links: []
          killing-events:
            kind: Panel
            spec:
              display:
                name: Killing Events
                description: ''
              plugin:
                kind: signoz/NumberPanel
                spec:
                  visualization:
                    timePreference: global_time
                  formatting:
                    unit: none
                  thresholds: []
              queries:
              - kind: scalar
                spec:
                  name: A
                  plugin:
                    kind: signoz/BuilderQuery
                    spec:
                      name: A
                      stepInterval: 60
                      signal: logs
                      aggregations:
                      - expression: count()
                      disabled: false
                      filter:
                        expression: (k8s.cluster.name IN $k8s.cluster.name AND k8s.namespace.name IN $k8s.namespace.name AND k8s.event.reason = 'Killing')
                      groupBy: []
                      having:
                        expression: ''
                      legend: ''
              links: []
          pulled-images-count:
            kind: Panel
            spec:
              display:
                name: Pulled Images Count
                description: ''
              plugin:
                kind: signoz/NumberPanel
                spec:
                  visualization:
                    timePreference: global_time
