                  formatting:
                    unit: none
                  thresholds: []
              queries:
              - kind: scalar
                spec:
                  name: A
                  plugin:
                    kind: signoz/BuilderQuery
                    spec:
                      name: A
                      stepInterval: 60
                      signal: logs
                      aggregations:
                      - expression: count()
                      disabled: false
                      filter:
                        expression: (k8s.cluster.name IN $k8s.cluster.name AND k8s.namespace.name IN $k8s.namespace.name AND k8s.event.reason = 'SuccessfulDelete')
                      groupBy: []
                      having:
                        expression: ''
                      legend: ''
              links: []
          field-path-count-for-x-container:
            kind: Panel
            spec:
              display:
                name: Field Path Count for X Container
                description: ''
              plugin:
                kind: signoz/NumberPanel
                spec:
                  visualization:
                    timePreference: global_time
                  formatting:
                    unit: none
                  thresholds: []
              queries:
              - kind: scalar
                spec:
                  name: A
                  plugin:
                    kind: signoz/BuilderQuery
                    spec:
                      name: A
                      stepInterval: 60
                      signal: logs
                      aggregations:
                      - expression: count()
                      disabled: false
                      filter:
                        expression: (k8s.cluster.name IN $k8s.cluster.name AND k8s.namespace.name IN $k8s.namespace.name AND k8s.object.fieldpath = 'spec.containers{kubernetes-bootcamp}')
                      groupBy: []
                      having:
                        expression: ''
                      legend: ''
              links: []
          event-count-over-time:
            kind: Panel
            spec:
              display:
                name: Event Count over Time
                description: ''
              plugin:
                kind: signoz/TimeSeriesPanel
                spec:
                  visualization:
                    timePreference: global_time
                    fillSpans: false
                  formatting:
                    unit: none
                  chartAppearance:
                    lineInterpolation: spline
                    showPoints: false
                    lineStyle: solid
                    fillMode: none
                    spanGaps:
                      fillOnlyBelow: false
                      fillLessThan: ''
                  axes:
                    isLogScale: false
                  legend:
                    position: bottom
                    mode: list
                  thresholds: []
              queries:
              - kind: time_series
                spec:
                  name: A
                  plugin:
                    kind: signoz/BuilderQuery
                    spec:
                      name: A
                      stepInterval: 1980
                      signal: logs
                      aggregations:
                      - expression: count()
                      disabled: false
                      filter:
                        expression: (k8s.cluster.name IN $k8s.cluster.name AND k8s.namespace.name IN $k8s.namespace.name)
                      groupBy: []
                      having:
                        expression: ''
                      legend: Events
              links: []
          pulled-images-vs-successfully-created-containers:
            kind: Panel
            spec:
              display:
                name: Pulled Images vs Successfully Created Containers
                description: ''
              plugin:
                kind: signoz/TimeSeriesPanel
                spec:
                  visualization:
                    timePreference: global_time
                    fillSpans: false
                  formatting:
                    unit: none
                  chartAppearance:
