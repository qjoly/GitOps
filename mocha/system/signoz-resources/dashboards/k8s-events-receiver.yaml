                    showPoints: false
                    lineStyle: solid
                    fillMode: none
                    spanGaps:
                      fillOnlyBelow: false
                      fillLessThan: ''
                  axes:
                    isLogScale: false
                  legend:
                    position: bottom
                    mode: list
                  thresholds: []
              queries:
              - kind: time_series
                spec:
                  name: A
                  plugin:
                    kind: signoz/CompositeQuery
                    spec:
                      queries:
                      - type: builder_query
                        spec:
                          name: A
                          stepInterval: 1980
                          signal: logs
                          aggregations:
                          - expression: count()
                          disabled: false
                          filter:
                            expression: (k8s.cluster.name IN $k8s.cluster.name AND k8s.namespace.name IN $k8s.namespace.name AND k8s.event.reason = 'Pulled')
                          groupBy: []
                          having:
                            expression: ''
                          legend: Pulled Images
                      - type: builder_query
                        spec:
                          name: B
                          stepInterval: 1980
                          signal: logs
                          aggregations:
                          - expression: count()
                          disabled: false
                          filter:
                            expression: (k8s.cluster.name IN $k8s.cluster.name AND k8s.namespace.name IN $k8s.namespace.name AND k8s.event.reason = 'SuccessfulCreate')
                          groupBy: []
                          having:
                            expression: ''
                          legend: Created Pods
              links: []
          scaling-replica-sets-over-time:
            kind: Panel
            spec:
              display:
