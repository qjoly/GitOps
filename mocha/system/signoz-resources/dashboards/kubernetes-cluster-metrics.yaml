apiVersion: resources.signoz.io/v1alpha1
kind: Dashboard
metadata:
  name: kubernetes-cluster-metrics
  namespace: signoz
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  providerConfigRef:
    name: mocha
  objectTemplate:
    spec:
      schemaVersion: v6
      name: kubernetes-cluster-metrics
      tags:
      - key: tag
        value: k8s
      - key: tag
        value: cluster
      - key: tag
        value: k8sclusterreceiver
      spec:
        display:
          name: Kubernetes Cluster Metrics
          description: This dashboard uses the metrics sent using `k8sclusterreceiver` to show the desired and currently running pods for deployments, daemonsets, statefulset, replicasets and pods count by phase.
        variables:
        - kind: ListVariable
          spec:
            name: k8s.cluster.name
            display:
              name: k8s.cluster.name
              description: Name of the cluster
            allowAllValue: true
            allowMultiple: true
            sort: none
            plugin:
              kind: signoz/DynamicVariable
              spec:
                name: k8s.cluster.name
                signal: all
        - kind: ListVariable
          spec:
            name: k8s.namespace.name
            display:
              name: k8s.namespace.name
              description: The k8s namespace name.
            allowAllValue: true
            allowMultiple: true
            sort: alphabetical-asc
            plugin:
              kind: signoz/DynamicVariable
              spec:
                name: k8s.namespace.name
                signal: all
        panels:
          pod-phase-by-namespace:
            kind: Panel
            spec:
              display:
                name: Pod phase by namespace
                description: ''
              plugin:
                kind: signoz/TablePanel
                spec:
                  visualization:
                    timePreference: global_time
                  formatting: {}
                  thresholds: []
              queries:
              - kind: scalar
                spec:
                  name: A
                  plugin:
                    kind: signoz/ClickHouseSQL
                    spec:
                      name: A
                      query: SELECT ts.resource_attrs['k8s.namespace.name'] AS `k8s.namespace.name`, countIf(toInt32(s.last_value) = 1) AS Pending, countIf(toInt32(s.last_value) = 2) AS Running, countIf(toInt32(s.last_value) = 3) AS Succeeded, countIf(toInt32(s.last_value) = 4) AS Failed, countIf(toInt32(s.last_value) = 5) AS Unknown FROM (SELECT fingerprint, argMax(value, unix_milli) AS last_value FROM signoz_metrics.distributed_samples_v4 WHERE metric_name = 'k8s.pod.phase' AND unix_milli >= $end_timestamp_ms - 600000 AND unix_milli < $end_timestamp_ms GROUP BY fingerprint) AS s INNER JOIN (SELECT DISTINCT fingerprint, resource_attrs FROM signoz_metrics.distributed_time_series_v4_6hrs WHERE metric_name = 'k8s.pod.phase' AND temporality = 'Unspecified' AND resource_attrs['k8s.cluster.name'] = $k8s.cluster.name) AS ts USING fingerprint GROUP BY `k8s.namespace.name` ORDER BY Running DESC
                      disabled: false
                      legend: ''
              links: []
          pod-replicas:
            kind: Panel
            spec:
              display:
                name: Pod replicas
                description: ''
              plugin:
                kind: signoz/TablePanel
                spec:
                  visualization:
                    timePreference: global_time
                  formatting: {}
                  thresholds: []
              queries:
              - kind: scalar
                spec:
                  name: A
                  plugin:
                    kind: signoz/CompositeQuery
                    spec:
                      queries:
                      - type: builder_query
                        spec:
                          name: A
                          stepInterval: 60
                          signal: metrics
                          aggregations:
                          - metricName: k8s.hpa.current_replicas
                            timeAggregation: avg
                            spaceAggregation: sum
                            reduceTo: last
                          disabled: false
                          filter:
                            expression: (k8s.cluster.name IN $k8s.cluster.name AND k8s.namespace.name IN $k8s.namespace.name)
                          groupBy:
                          - name: k8s.hpa.name
                            fieldContext: attribute
                            fieldDataType: string
                          having:
                            expression: ''
                          legend: current_replicas
                      - type: builder_query
                        spec:
                          name: B
                          stepInterval: 60
                          signal: metrics
                          aggregations:
                          - metricName: k8s.hpa.desired_replicas
                            timeAggregation: avg
                            spaceAggregation: sum
                            reduceTo: last
                          disabled: false
                          filter:
                            expression: (k8s.cluster.name IN $k8s.cluster.name AND k8s.namespace.name IN $k8s.namespace.name)
                          groupBy:
                          - name: k8s.hpa.name
                            fieldContext: attribute
                            fieldDataType: string
                          having:
                            expression: ''
                          legend: desired_replicas
                      - type: builder_query
                        spec:
                          name: C
                          stepInterval: 60
                          signal: metrics
                          aggregations:
                          - metricName: k8s.hpa.min_replicas
                            timeAggregation: avg
                            spaceAggregation: sum
                            reduceTo: last
                          disabled: false
                          filter:
                            expression: (k8s.cluster.name IN $k8s.cluster.name AND k8s.namespace.name IN $k8s.namespace.name)
                          groupBy:
                          - name: k8s.hpa.name
                            fieldContext: attribute
                            fieldDataType: string
                          having:
                            expression: ''
                          legend: min_replicas
                      - type: builder_query
                        spec:
                          name: D
                          stepInterval: 60
                          signal: metrics
                          aggregations:
                          - metricName: k8s.hpa.max_replicas
                            timeAggregation: avg
                            spaceAggregation: sum
                            reduceTo: last
                          disabled: false
                          filter:
                            expression: (k8s.cluster.name IN $k8s.cluster.name AND k8s.namespace.name IN $k8s.namespace.name)
                          groupBy:
                          - name: k8s.hpa.name
                            fieldContext: attribute
                            fieldDataType: string
                          having:
                            expression: ''
                          legend: max_replicas
              links: []
          deployments-available-and-desired:
            kind: Panel
            spec:
              display:
                name: Deployments available and desired
                description: ''
              plugin:
                kind: signoz/TablePanel
                spec:
                  visualization:
                    timePreference: global_time
                  formatting: {}
                  thresholds: []
              queries:
              - kind: scalar
                spec:
                  name: A
                  plugin:
                    kind: signoz/CompositeQuery
                    spec:
                      queries:
                      - type: builder_query
                        spec:
                          name: A
                          stepInterval: 60
                          signal: metrics
                          aggregations:
                          - metricName: k8s.deployment.available
                            timeAggregation: latest
                            spaceAggregation: sum
                            reduceTo: last
                          disabled: false
                          filter:
                            expression: (k8s.cluster.name IN $k8s.cluster.name AND k8s.namespace.name IN $k8s.namespace.name)
                          groupBy:
                          - name: k8s.deployment.name
                            fieldContext: attribute
                            fieldDataType: string
                          having:
                            expression: ''
                          legend: available
                      - type: builder_query
                        spec:
                          name: B
                          stepInterval: 60
                          signal: metrics
                          aggregations:
                          - metricName: k8s.deployment.desired
                            timeAggregation: latest
                            spaceAggregation: sum
                            reduceTo: last
                          disabled: false
                          filter:
                            expression: (k8s.cluster.name IN $k8s.cluster.name AND k8s.namespace.name IN $k8s.namespace.name)
                          groupBy:
                          - name: k8s.deployment.name
                            fieldContext: attribute
                            fieldDataType: string
                          having:
                            expression: ''
                          legend: desired
              links: []
          jobs:
            kind: Panel
            spec:
              display:
                name: Jobs
                description: ''
              plugin:
                kind: signoz/TablePanel
                spec:
                  visualization:
                    timePreference: global_time
                  formatting: {}
                  thresholds: []
              queries:
              - kind: scalar
                spec:
                  name: A
                  plugin:
                    kind: signoz/CompositeQuery
                    spec:
                      queries:
                      - type: builder_query
                        spec:
                          name: A
                          stepInterval: 60
                          signal: metrics
                          aggregations:
                          - metricName: k8s.job.active_pods
                            timeAggregation: max
                            spaceAggregation: sum
                            reduceTo: last
                          disabled: false
                          filter:
                            expression: (k8s.cluster.name IN $k8s.cluster.name AND k8s.namespace.name IN $k8s.namespace.name)
                          groupBy:
                          - name: k8s.job.name
                            fieldContext: attribute
                            fieldDataType: string
                          having:
                            expression: ''
                          legend: running
                      - type: builder_query
                        spec:
                          name: B
                          stepInterval: 60
                          signal: metrics
                          aggregations:
                          - metricName: k8s.job.successful_pods
                            timeAggregation: max
                            spaceAggregation: sum
                            reduceTo: last
                          disabled: false
                          filter:
                            expression: (k8s.cluster.name IN $k8s.cluster.name AND k8s.namespace.name IN $k8s.namespace.name)
                          groupBy:
                          - name: k8s.job.name
                            fieldContext: attribute
                            fieldDataType: string
                          having:
                            expression: ''
                          legend: successful
                      - type: builder_query
                        spec:
                          name: C
                          stepInterval: 60
                          signal: metrics
                          aggregations:
                          - metricName: k8s.job.failed_pods
                            timeAggregation: max
                            spaceAggregation: sum
                            reduceTo: last
                          disabled: false
                          filter:
                            expression: (k8s.cluster.name IN $k8s.cluster.name AND k8s.namespace.name IN $k8s.namespace.name)
                          groupBy:
                          - name: k8s.job.name
                            fieldContext: attribute
                            fieldDataType: string
                          having:
                            expression: ''
                          legend: failed
                      - type: builder_query
                        spec:
                          name: D
                          stepInterval: 60
                          signal: metrics
                          aggregations:
                          - metricName: k8s.job.desired_successful_pods
                            timeAggregation: max
                            spaceAggregation: sum
                            reduceTo: last
                          disabled: false
                          filter:
                            expression: (k8s.cluster.name IN $k8s.cluster.name AND k8s.namespace.name IN $k8s.namespace.name)
                          groupBy:
                          - name: k8s.job.name
                            fieldContext: attribute
                            fieldDataType: string
                          having:
                            expression: ''
                          legend: desired successful
              links: []
          daemonset-nodes:
            kind: Panel
            spec:
              display:
                name: Daemonset nodes
                description: ''
              plugin:
                kind: signoz/TablePanel
                spec:
                  visualization:
                    timePreference: global_time
                  formatting: {}
                  thresholds: []
              queries:
              - kind: scalar
                spec:
                  name: A
                  plugin:
                    kind: signoz/CompositeQuery
                    spec:
                      queries:
                      - type: builder_query
                        spec:
                          name: A
                          stepInterval: 60
                          signal: metrics
                          aggregations:
                          - metricName: k8s.daemonset.current_scheduled_nodes
                            timeAggregation: avg
                            spaceAggregation: avg
                            reduceTo: last
                          disabled: false
                          filter:
                            expression: (k8s.cluster.name IN $k8s.cluster.name AND k8s.namespace.name IN $k8s.namespace.name)
                          groupBy:
                          - name: k8s.daemonset.name
                            fieldContext: attribute
                            fieldDataType: string
                          having:
                            expression: ''
                          legend: current_nodes
                      - type: builder_query
                        spec:
                          name: B
                          stepInterval: 60
                          signal: metrics
                          aggregations:
                          - metricName: k8s.daemonset.desired_scheduled_nodes
                            timeAggregation: avg
                            spaceAggregation: avg
                            reduceTo: last
                          disabled: false
                          filter:
                            expression: (k8s.cluster.name IN $k8s.cluster.name AND k8s.namespace.name IN $k8s.namespace.name)
                          groupBy:
                          - name: k8s.daemonset.name
                            fieldContext: attribute
                            fieldDataType: string
                          having:
                            expression: ''
                          legend: desired_nodes
                      - type: builder_query
                        spec:
                          name: C
                          stepInterval: 60
                          signal: metrics
                          aggregations:
                          - metricName: k8s.daemonset.ready_nodes
                            timeAggregation: avg
                            spaceAggregation: avg
                            reduceTo: last
                          disabled: false
                          filter:
                            expression: (k8s.cluster.name IN $k8s.cluster.name AND k8s.namespace.name IN $k8s.namespace.name)
                          groupBy:
                          - name: k8s.daemonset.name
                            fieldContext: attribute
                            fieldDataType: string
                          having:
                            expression: ''
                          legend: ready_nodes
              links: []
          statefulset-pods:
            kind: Panel
            spec:
              display:
                name: Statefulset pods
                description: ''
              plugin:
                kind: signoz/TablePanel
                spec:
                  visualization:
                    timePreference: global_time
                  formatting: {}
                  thresholds: []
              queries:
              - kind: scalar
                spec:
                  name: A
                  plugin:
                    kind: signoz/CompositeQuery
                    spec:
                      queries:
                      - type: builder_query
                        spec:
                          name: A
                          stepInterval: 60
                          signal: metrics
                          aggregations:
                          - metricName: k8s.statefulset.current_pods
                            timeAggregation: max
                            spaceAggregation: sum
                            reduceTo: last
                          disabled: false
                          filter:
                            expression: (k8s.cluster.name IN $k8s.cluster.name AND k8s.namespace.name IN $k8s.namespace.name)
                          groupBy:
                          - name: k8s.statefulset.name
                            fieldContext: attribute
                            fieldDataType: string
                          having:
                            expression: ''
                          legend: current
                      - type: builder_query
                        spec:
                          name: B
                          stepInterval: 60
                          signal: metrics
                          aggregations:
                          - metricName: k8s.statefulset.desired_pods
                            timeAggregation: max
                            spaceAggregation: sum
                            reduceTo: last
                          disabled: false
                          filter:
                            expression: (k8s.cluster.name IN $k8s.cluster.name AND k8s.namespace.name IN $k8s.namespace.name)
                          groupBy:
                          - name: k8s.statefulset.name
                            fieldContext: attribute
                            fieldDataType: string
                          having:
                            expression: ''
                          legend: desired
                      - type: builder_query
                        spec:
                          name: C
                          stepInterval: 60
                          signal: metrics
                          aggregations:
                          - metricName: k8s.statefulset.ready_pods
                            timeAggregation: max
                            spaceAggregation: sum
                            reduceTo: last
                          disabled: false
                          filter:
                            expression: (k8s.cluster.name IN $k8s.cluster.name AND k8s.namespace.name IN $k8s.namespace.name)
                          groupBy:
                          - name: k8s.statefulset.name
                            fieldContext: attribute
                            fieldDataType: string
                          having:
                            expression: ''
                          legend: ready
                      - type: builder_query
                        spec:
                          name: D
                          stepInterval: 60
                          signal: metrics
                          aggregations:
                          - metricName: k8s.statefulset.updated_pods
                            timeAggregation: max
                            spaceAggregation: sum
                            reduceTo: last
                          disabled: false
                          filter:
                            expression: (k8s.cluster.name IN $k8s.cluster.name AND k8s.namespace.name IN $k8s.namespace.name)
                          groupBy:
                          - name: k8s.statefulset.name
                            fieldContext: attribute
                            fieldDataType: string
                          having:
                            expression: ''
                          legend: updated
              links: []
        layouts:
        - kind: Grid
          spec:
            items:
            - x: 0
              y: 0
              width: 12
              height: 4
              content:
                $ref: '#/spec/panels/pod-phase-by-namespace'
            - x: 0
              y: 4
              width: 12
              height: 4
              content:
                $ref: '#/spec/panels/pod-replicas'
            - x: 0
              y: 8
              width: 6
              height: 4
              content:
                $ref: '#/spec/panels/deployments-available-and-desired'
            - x: 6
              y: 8
              width: 6
              height: 4
              content:
                $ref: '#/spec/panels/jobs'
            - x: 0
              y: 12
              width: 6
              height: 4
              content:
                $ref: '#/spec/panels/daemonset-nodes'
            - x: 6
              y: 12
              width: 6
              height: 4
              content:
                $ref: '#/spec/panels/statefulset-pods'
