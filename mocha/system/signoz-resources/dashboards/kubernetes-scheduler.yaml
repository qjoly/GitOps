apiVersion: resources.signoz.io/v1alpha1
kind: Dashboard
metadata:
  name: kubernetes-scheduler
  namespace: signoz
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  providerConfigRef:
    name: mocha
  objectTemplate:
    spec:
      schemaVersion: v6
      name: kubernetes-scheduler
      tags:
      - key: tag
        value: kubernetes
      - key: tag
        value: control-plane
      - key: tag
        value: scheduler
      - key: tag
        value: prometheus
      spec:
        display:
          name: Kubernetes Scheduler
          description: Standard control-plane view for kube-scheduler queue pressure, scheduling throughput, and duration buckets.
        variables:
        - kind: ListVariable
          spec:
            name: service.name
            display:
              name: service.name
              description: Auto-discovered services (from metric labels).
            allowAllValue: true
            allowMultiple: true
            sort: none
            plugin:
              kind: signoz/DynamicVariable
              spec:
                name: service.name
                signal: metrics
        - kind: ListVariable
          spec:
            name: k8s.cluster.name
            display:
              name: k8s.cluster.name
              description: Optional cluster label selector.
            allowAllValue: true
            allowMultiple: true
            sort: none
            plugin:
              kind: signoz/DynamicVariable
              spec:
                name: k8s.cluster.name
                signal: metrics
        - kind: ListVariable
          spec:
            name: deployment_environment_name
            display:
              name: deployment_environment_name
              description: Optional OTel environment label selector.
            allowAllValue: true
            allowMultiple: true
            sort: none
            plugin:
              kind: signoz/DynamicVariable
              spec:
                name: deployment.environment.name
                signal: metrics
        - kind: ListVariable
          spec:
            name: deployment_environment
            display:
              name: deployment_environment
              description: Optional legacy environment label selector.
            allowAllValue: true
            allowMultiple: true
            sort: none
            plugin:
              kind: signoz/DynamicVariable
              spec:
                name: deployment.environment
                signal: metrics
        panels:
          auto-discovered-scheduler-services:
            kind: Panel
            spec:
              display:
                name: Auto-Discovered Scheduler Services
                description: ''
              plugin:
                kind: signoz/TimeSeriesPanel
                spec:
                  visualization:
                    timePreference: global_time
                    fillSpans: false
                  formatting:
                    unit: reqps
                  chartAppearance:
                    lineInterpolation: spline
                    showPoints: false
                    lineStyle: solid
                    fillMode: none
                    spanGaps:
                      fillOnlyBelow: false
                      fillLessThan: ''
                  axes:
                    isLogScale: false
                  legend:
                    position: bottom
                    mode: list
                  thresholds: []
              queries:
              - kind: time_series
                spec:
                  name: A
                  plugin:
                    kind: signoz/BuilderQuery
                    spec:
                      name: A
                      stepInterval: 60
                      signal: metrics
                      aggregations:
                      - metricName: scheduler_schedule_attempts_total
                        timeAggregation: rate
                        spaceAggregation: sum
                        reduceTo: avg
                      disabled: false
                      filter:
                        expression: service.name IN $service.name AND k8s.cluster.name IN $k8s.cluster.name
                      groupBy:
                      - name: service.name
                        fieldDataType: string
                      having:
                        expression: ''
                      legend: '{{service.name}}'
              links: []
          scheduling-attempts-s:
            kind: Panel
            spec:
              display:
                name: Scheduling Attempts / s
                description: ''
              plugin:
                kind: signoz/NumberPanel
                spec:
                  visualization:
                    timePreference: global_time
                  formatting:
                    unit: reqps
                  thresholds: []
              queries:
              - kind: scalar
                spec:
                  name: A
                  plugin:
                    kind: signoz/BuilderQuery
                    spec:
                      name: A
                      stepInterval: 60
                      signal: metrics
                      aggregations:
                      - metricName: scheduler_schedule_attempts_total
                        timeAggregation: rate
                        spaceAggregation: sum
                        reduceTo: avg
                      disabled: false
                      filter:
                        expression: service.name IN $service.name AND k8s.cluster.name IN $k8s.cluster.name
                      groupBy: []
                      having:
                        expression: ''
                      legend: attempts/s
              links: []
          pending-pods:
            kind: Panel
            spec:
              display:
                name: Pending Pods
                description: ''
              plugin:
                kind: signoz/NumberPanel
                spec:
                  visualization:
                    timePreference: global_time
                  formatting:
                    unit: short
                  thresholds: []
              queries:
              - kind: scalar
                spec:
                  name: A
                  plugin:
                    kind: signoz/BuilderQuery
                    spec:
                      name: A
                      stepInterval: 60
                      signal: metrics
                      aggregations:
                      - metricName: scheduler_pending_pods
                        timeAggregation: latest
                        spaceAggregation: sum
                        reduceTo: last
                      disabled: false
                      filter:
                        expression: service.name IN $service.name AND k8s.cluster.name IN $k8s.cluster.name
                      groupBy: []
                      having:
                        expression: ''
                      legend: pending
              links: []
          go-routines:
            kind: Panel
            spec:
              display:
                name: Go Routines
                description: ''
              plugin:
                kind: signoz/NumberPanel
                spec:
                  visualization:
                    timePreference: global_time
                  formatting:
                    unit: short
                  thresholds: []
              queries:
              - kind: scalar
                spec:
                  name: A
                  plugin:
                    kind: signoz/BuilderQuery
                    spec:
                      name: A
                      stepInterval: 60
                      signal: metrics
                      aggregations:
                      - metricName: go_goroutines
                        timeAggregation: latest
                        spaceAggregation: sum
                        reduceTo: last
                      disabled: false
                      filter:
                        expression: service.name IN $service.name AND k8s.cluster.name IN $k8s.cluster.name
                      groupBy: []
                      having:
                        expression: ''
                      legend: goroutines
              links: []
          process-rss:
            kind: Panel
            spec:
              display:
                name: Process RSS
                description: ''
              plugin:
                kind: signoz/NumberPanel
                spec:
                  visualization:
                    timePreference: global_time
                  formatting:
                    unit: By
                  thresholds: []
              queries:
              - kind: scalar
                spec:
                  name: A
                  plugin:
                    kind: signoz/BuilderQuery
                    spec:
                      name: A
                      stepInterval: 60
                      signal: metrics
                      aggregations:
                      - metricName: process_resident_memory_bytes
                        timeAggregation: latest
                        spaceAggregation: avg
                        reduceTo: last
                      disabled: false
                      filter:
                        expression: service.name IN $service.name AND k8s.cluster.name IN $k8s.cluster.name
                      groupBy: []
                      having:
                        expression: ''
                      legend: rss
              links: []
          scheduling-attempts-by-result:
            kind: Panel
            spec:
              display:
                name: Scheduling Attempts By Result
                description: ''
              plugin:
                kind: signoz/TimeSeriesPanel
                spec:
                  visualization:
                    timePreference: global_time
                    fillSpans: false
                  formatting:
                    unit: reqps
                  chartAppearance:
                    lineInterpolation: spline
                    showPoints: false
                    lineStyle: solid
                    fillMode: none
                    spanGaps:
                      fillOnlyBelow: false
                      fillLessThan: ''
                  axes:
                    isLogScale: false
                  legend:
                    position: bottom
                    mode: list
                  thresholds: []
              queries:
              - kind: time_series
                spec:
                  name: A
                  plugin:
                    kind: signoz/BuilderQuery
                    spec:
                      name: A
                      stepInterval: 60
                      signal: metrics
                      aggregations:
                      - metricName: scheduler_schedule_attempts_total
                        timeAggregation: rate
                        spaceAggregation: sum
                        reduceTo: avg
                      disabled: false
                      filter:
                        expression: service.name IN $service.name AND k8s.cluster.name IN $k8s.cluster.name
                      groupBy:
                      - name: result
                        fieldDataType: string
                      having:
                        expression: ''
                      legend: '{{result}}'
              links: []
          e2e-scheduling-duration-p50-p90-p99:
            kind: Panel
            spec:
              display:
                name: E2E Scheduling Duration (p50/p90/p99)
                description: ''
              plugin:
                kind: signoz/TimeSeriesPanel
                spec:
                  visualization:
                    timePreference: global_time
                    fillSpans: false
                  formatting:
                    unit: reqps
                  chartAppearance:
                    lineInterpolation: spline
                    showPoints: false
                    lineStyle: solid
                    fillMode: none
                    spanGaps:
                      fillOnlyBelow: false
                      fillLessThan: ''
                  axes:
                    isLogScale: false
                  legend:
                    position: bottom
                    mode: list
                  thresholds: []
              queries:
              - kind: time_series
                spec:
                  name: A
                  plugin:
                    kind: signoz/CompositeQuery
                    spec:
                      queries:
                      - type: builder_query
                        spec:
                          name: A
                          stepInterval: 60
                          signal: metrics
                          aggregations:
                          - metricName: scheduler_scheduling_attempt_duration_seconds.bucket
                            spaceAggregation: p50
                            reduceTo: avg
                          disabled: false
                          filter:
                            expression: service.name IN $service.name AND k8s.cluster.name IN $k8s.cluster.name
                          groupBy: []
                          having:
                            expression: ''
                          legend: p50
                      - type: builder_query
                        spec:
                          name: B
                          stepInterval: 60
                          signal: metrics
                          aggregations:
                          - metricName: scheduler_scheduling_attempt_duration_seconds.bucket
                            spaceAggregation: p90
                            reduceTo: avg
                          disabled: false
                          filter:
                            expression: service.name IN $service.name AND k8s.cluster.name IN $k8s.cluster.name
                          groupBy: []
                          having:
                            expression: ''
                          legend: p90
                      - type: builder_query
                        spec:
                          name: C
                          stepInterval: 60
                          signal: metrics
                          aggregations:
                          - metricName: scheduler_scheduling_attempt_duration_seconds.bucket
                            spaceAggregation: p99
                            reduceTo: avg
                          disabled: false
                          filter:
                            expression: service.name IN $service.name AND k8s.cluster.name IN $k8s.cluster.name
                          groupBy: []
                          having:
                            expression: ''
                          legend: p99
              links: []
          framework-extension-p99-by-extension-point:
            kind: Panel
            spec:
              display:
                name: Framework Extension p99 by extension_point
                description: ''
              plugin:
                kind: signoz/TimeSeriesPanel
                spec:
                  visualization:
                    timePreference: global_time
                    fillSpans: false
                  formatting:
                    unit: reqps
                  chartAppearance:
                    lineInterpolation: spline
                    showPoints: false
                    lineStyle: solid
                    fillMode: none
                    spanGaps:
                      fillOnlyBelow: false
                      fillLessThan: ''
                  axes:
                    isLogScale: false
                  legend:
                    position: bottom
                    mode: list
                  thresholds: []
              queries:
              - kind: time_series
                spec:
                  name: A
                  plugin:
                    kind: signoz/BuilderQuery
                    spec:
                      name: A
                      stepInterval: 60
                      signal: metrics
                      aggregations:
                      - metricName: scheduler_framework_extension_point_duration_seconds.bucket
                        spaceAggregation: p99
                        reduceTo: avg
                      disabled: false
                      filter:
                        expression: service.name IN $service.name AND k8s.cluster.name IN $k8s.cluster.name
                      groupBy:
                      - name: extension_point
                        fieldDataType: string
                      having:
                        expression: ''
                      legend: p99 {{extension_point}}
              links: []
          workqueue-depth:
            kind: Panel
            spec:
              display:
                name: Workqueue Depth
                description: ''
              plugin:
                kind: signoz/TimeSeriesPanel
                spec:
                  visualization:
                    timePreference: global_time
                    fillSpans: false
                  formatting:
                    unit: short
                  chartAppearance:
                    lineInterpolation: spline
                    showPoints: false
                    lineStyle: solid
                    fillMode: none
                    spanGaps:
                      fillOnlyBelow: false
                      fillLessThan: ''
                  axes:
                    isLogScale: false
                  legend:
                    position: bottom
                    mode: list
                  thresholds: []
              queries:
              - kind: time_series
                spec:
                  name: A
                  plugin:
                    kind: signoz/BuilderQuery
                    spec:
                      name: A
                      stepInterval: 60
                      signal: metrics
                      aggregations:
                      - metricName: workqueue_depth
                        timeAggregation: latest
                        spaceAggregation: sum
                        reduceTo: last
                      disabled: false
                      filter:
                        expression: service.name IN $service.name AND k8s.cluster.name IN $k8s.cluster.name
                      groupBy:
                      - name: name
                        fieldDataType: string
                      having:
                        expression: ''
                      legend: '{{name}}'
              links: []
        layouts:
        - kind: Grid
          spec:
            items:
            - x: 0
              y: 0
              width: 3
              height: 4
              content:
                $ref: '#/spec/panels/auto-discovered-scheduler-services'
            - x: 3
              y: 0
              width: 3
              height: 2
              content:
                $ref: '#/spec/panels/scheduling-attempts-s'
            - x: 6
              y: 0
              width: 3
              height: 2
              content:
                $ref: '#/spec/panels/pending-pods'
            - x: 9
              y: 0
              width: 3
              height: 2
              content:
                $ref: '#/spec/panels/go-routines'
            - x: 0
              y: 4
              width: 6
              height: 2
              content:
                $ref: '#/spec/panels/process-rss'
            - x: 6
              y: 4
              width: 6
              height: 4
              content:
                $ref: '#/spec/panels/scheduling-attempts-by-result'
            - x: 0
              y: 8
              width: 6
              height: 4
              content:
                $ref: '#/spec/panels/e2e-scheduling-duration-p50-p90-p99'
            - x: 6
              y: 8
              width: 6
              height: 4
              content:
                $ref: '#/spec/panels/framework-extension-p99-by-extension-point'
            - x: 0
              y: 12
              width: 6
              height: 4
              content:
                $ref: '#/spec/panels/workqueue-depth'
