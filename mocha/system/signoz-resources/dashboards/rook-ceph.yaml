apiVersion: resources.signoz.io/v1alpha1
kind: Dashboard
metadata:
  name: rook-ceph
  namespace: signoz
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  providerConfigRef:
    name: mocha
  objectTemplate:
    spec:
      schemaVersion: v6
      name: rook-ceph
      tags:
      - key: tag
        value: rook
      - key: tag
        value: ceph
      - key: tag
        value: storage
      spec:
        display:
          name: Rook-Ceph
          description: Rook-Ceph cluster health, capacity, pools and OSD throughput (turing).
        variables: []
        panels:
          health-status:
            kind: Panel
            spec:
              display:
                name: Health status
                description: 0 = OK, 1 = WARN, 2 = ERR
              plugin:
                kind: signoz/NumberPanel
                spec:
                  visualization:
                    timePreference: global_time
                  formatting:
                    unit: short
                  thresholds: []
              queries:
              - kind: scalar
                spec:
                  name: A
                  plugin:
                    kind: signoz/BuilderQuery
                    spec:
                      name: A
                      stepInterval: 60
                      signal: metrics
                      aggregations:
                      - metricName: ceph_health_status
                        timeAggregation: latest
                        spaceAggregation: max
                        reduceTo: last
                      disabled: false
                      filter:
                        expression: k8s.cluster.name = 'turing'
                      groupBy: []
                      having:
                        expression: ''
                      legend: ''
              links: []
          osds-up:
            kind: Panel
            spec:
              display:
                name: OSDs up
                description: ''
              plugin:
                kind: signoz/NumberPanel
                spec:
                  visualization:
                    timePreference: global_time
                  formatting:
                    unit: short
                  thresholds: []
              queries:
              - kind: scalar
                spec:
                  name: A
                  plugin:
                    kind: signoz/BuilderQuery
                    spec:
                      name: A
                      stepInterval: 60
                      signal: metrics
                      aggregations:
                      - metricName: ceph_osd_up
                        timeAggregation: latest
                        spaceAggregation: sum
                        reduceTo: last
                      disabled: false
                      filter:
                        expression: k8s.cluster.name = 'turing'
                      groupBy: []
                      having:
                        expression: ''
                      legend: ''
              links: []
          mons-in-quorum:
            kind: Panel
            spec:
              display:
                name: Mons in quorum
                description: ''
              plugin:
                kind: signoz/NumberPanel
                spec:
                  visualization:
                    timePreference: global_time
                  formatting:
                    unit: short
                  thresholds: []
              queries:
              - kind: scalar
                spec:
                  name: A
                  plugin:
                    kind: signoz/BuilderQuery
                    spec:
                      name: A
                      stepInterval: 60
                      signal: metrics
                      aggregations:
                      - metricName: ceph_mon_quorum_status
                        timeAggregation: latest
                        spaceAggregation: sum
                        reduceTo: last
                      disabled: false
                      filter:
                        expression: k8s.cluster.name = 'turing'
                      groupBy: []
                      having:
                        expression: ''
                      legend: ''
              links: []
          placement-groups:
            kind: Panel
            spec:
              display:
                name: Placement groups
                description: ''
              plugin:
                kind: signoz/NumberPanel
                spec:
                  visualization:
                    timePreference: global_time
                  formatting:
                    unit: short
                  thresholds: []
              queries:
              - kind: scalar
                spec:
                  name: A
                  plugin:
                    kind: signoz/BuilderQuery
                    spec:
                      name: A
                      stepInterval: 60
                      signal: metrics
                      aggregations:
                      - metricName: ceph_pg_total
                        timeAggregation: latest
                        spaceAggregation: max
                        reduceTo: last
                      disabled: false
                      filter:
                        expression: k8s.cluster.name = 'turing'
                      groupBy: []
                      having:
                        expression: ''
                      legend: ''
              links: []
          used-capacity:
            kind: Panel
            spec:
              display:
                name: Used capacity
                description: ''
              plugin:
                kind: signoz/NumberPanel
                spec:
                  visualization:
                    timePreference: global_time
                  formatting:
                    unit: bytes
                  thresholds: []
              queries:
              - kind: scalar
                spec:
                  name: A
                  plugin:
                    kind: signoz/BuilderQuery
                    spec:
                      name: A
                      stepInterval: 60
                      signal: metrics
                      aggregations:
                      - metricName: ceph_cluster_total_used_bytes
                        timeAggregation: latest
                        spaceAggregation: max
                        reduceTo: last
                      disabled: false
                      filter:
                        expression: k8s.cluster.name = 'turing'
                      groupBy: []
                      having:
                        expression: ''
                      legend: ''
              links: []
          total-capacity:
            kind: Panel
            spec:
              display:
                name: Total capacity
                description: ''
              plugin:
                kind: signoz/NumberPanel
                spec:
                  visualization:
                    timePreference: global_time
                  formatting:
                    unit: bytes
                  thresholds: []
              queries:
              - kind: scalar
                spec:
                  name: A
                  plugin:
                    kind: signoz/BuilderQuery
                    spec:
                      name: A
                      stepInterval: 60
                      signal: metrics
                      aggregations:
                      - metricName: ceph_cluster_total_bytes
                        timeAggregation: latest
                        spaceAggregation: max
                        reduceTo: last
                      disabled: false
                      filter:
                        expression: k8s.cluster.name = 'turing'
                      groupBy: []
                      having:
                        expression: ''
                      legend: ''
              links: []
          capacity-used-over-time:
            kind: Panel
            spec:
              display:
                name: Capacity used over time
                description: ''
              plugin:
                kind: signoz/TimeSeriesPanel
                spec:
                  visualization:
                    timePreference: global_time
                    fillSpans: false
                  formatting:
                    unit: bytes
                  chartAppearance:
                    lineInterpolation: spline
                    showPoints: false
                    lineStyle: solid
                    fillMode: none
                    spanGaps:
                      fillOnlyBelow: false
                      fillLessThan: ''
                  axes:
                    isLogScale: false
                  legend:
                    position: bottom
                    mode: list
                  thresholds: []
              queries:
              - kind: time_series
                spec:
                  name: A
                  plugin:
                    kind: signoz/BuilderQuery
                    spec:
                      name: A
                      stepInterval: 60
                      signal: metrics
                      aggregations:
                      - metricName: ceph_cluster_total_used_bytes
                        timeAggregation: latest
                        spaceAggregation: max
                        reduceTo: last
                      disabled: false
                      filter:
                        expression: k8s.cluster.name = 'turing'
                      groupBy: []
                      having:
                        expression: ''
                      legend: used
              links: []
          stored-by-pool:
            kind: Panel
            spec:
              display:
                name: Stored by pool
                description: ''
              plugin:
                kind: signoz/BarChartPanel
                spec:
                  visualization:
                    timePreference: global_time
                    fillSpans: false
                  formatting:
                    unit: bytes
                  axes:
                    isLogScale: false
                  legend:
                    position: bottom
                    mode: list
                  thresholds: []
              queries:
              - kind: scalar
                spec:
                  name: A
                  plugin:
                    kind: signoz/PromQLQuery
                    spec:
                      name: A
                      query: ceph_pool_stored * on (pool_id) group_left(name) ceph_pool_metadata
                      disabled: false
                      legend: '{{name}}'
              links: []
          objects-by-pool:
            kind: Panel
            spec:
              display:
                name: Objects by pool
                description: ''
              plugin:
                kind: signoz/BarChartPanel
                spec:
                  visualization:
                    timePreference: global_time
                    fillSpans: false
                  formatting:
                    unit: short
                  axes:
                    isLogScale: false
                  legend:
                    position: bottom
                    mode: list
                  thresholds: []
              queries:
              - kind: time_series
                spec:
                  name: A
                  plugin:
                    kind: signoz/PromQLQuery
                    spec:
                      name: A
                      query: ceph_pool_objects * on (pool_id) group_left(name) ceph_pool_metadata
                      disabled: false
                      legend: '{{name}}'
              links: []
          pool-read-throughput:
            kind: Panel
            spec:
              display:
                name: Pool read throughput
                description: ''
              plugin:
                kind: signoz/TimeSeriesPanel
                spec:
                  visualization:
                    timePreference: global_time
                    fillSpans: false
                  formatting:
                    unit: Bps
                  chartAppearance:
                    lineInterpolation: spline
                    showPoints: false
                    lineStyle: solid
                    fillMode: none
                    spanGaps:
                      fillOnlyBelow: false
                      fillLessThan: ''
                  axes:
                    isLogScale: false
                  legend:
                    position: bottom
                    mode: list
                  thresholds: []
              queries:
              - kind: time_series
                spec:
                  name: A
                  plugin:
                    kind: signoz/BuilderQuery
                    spec:
                      name: A
                      stepInterval: 60
                      signal: metrics
                      aggregations:
                      - metricName: ceph_pool_rd_bytes
                        timeAggregation: rate
                        spaceAggregation: sum
                        reduceTo: last
                      disabled: false
                      filter:
                        expression: k8s.cluster.name = 'turing'
                      groupBy: []
                      having:
                        expression: ''
                      legend: read
              links: []
          pool-write-throughput:
            kind: Panel
            spec:
              display:
                name: Pool write throughput
                description: ''
              plugin:
                kind: signoz/TimeSeriesPanel
                spec:
                  visualization:
                    timePreference: global_time
                    fillSpans: false
                  formatting:
                    unit: Bps
                  chartAppearance:
                    lineInterpolation: spline
                    showPoints: false
                    lineStyle: solid
                    fillMode: none
                    spanGaps:
                      fillOnlyBelow: false
                      fillLessThan: ''
                  axes:
                    isLogScale: false
                  legend:
                    position: bottom
                    mode: list
                  thresholds: []
              queries:
              - kind: time_series
                spec:
                  name: A
                  plugin:
                    kind: signoz/BuilderQuery
                    spec:
                      name: A
                      stepInterval: 60
                      signal: metrics
                      aggregations:
                      - metricName: ceph_pool_wr_bytes
                        timeAggregation: rate
                        spaceAggregation: sum
                        reduceTo: last
                      disabled: false
                      filter:
                        expression: k8s.cluster.name = 'turing'
                      groupBy: []
                      having:
                        expression: ''
                      legend: write
              links: []
          osd-read-ops:
            kind: Panel
            spec:
              display:
                name: OSD read ops
                description: ''
              plugin:
                kind: signoz/TimeSeriesPanel
                spec:
                  visualization:
                    timePreference: global_time
                    fillSpans: false
                  formatting:
                    unit: short
                  chartAppearance:
                    lineInterpolation: spline
                    showPoints: false
                    lineStyle: solid
                    fillMode: none
                    spanGaps:
                      fillOnlyBelow: false
                      fillLessThan: ''
                  axes:
                    isLogScale: false
                  legend:
                    position: bottom
                    mode: list
                  thresholds: []
              queries:
              - kind: time_series
                spec:
                  name: A
                  plugin:
                    kind: signoz/BuilderQuery
                    spec:
                      name: A
                      stepInterval: 60
                      signal: metrics
                      aggregations:
                      - metricName: ceph_osd_op_r
                        timeAggregation: rate
                        spaceAggregation: sum
                        reduceTo: last
                      disabled: false
                      filter:
                        expression: k8s.cluster.name = 'turing'
                      groupBy: []
                      having:
                        expression: ''
                      legend: read op/s
              links: []
          osd-write-ops:
            kind: Panel
            spec:
              display:
                name: OSD write ops
                description: ''
              plugin:
                kind: signoz/TimeSeriesPanel
                spec:
                  visualization:
                    timePreference: global_time
                    fillSpans: false
                  formatting:
                    unit: short
                  chartAppearance:
                    lineInterpolation: spline
                    showPoints: false
                    lineStyle: solid
                    fillMode: none
                    spanGaps:
                      fillOnlyBelow: false
                      fillLessThan: ''
                  axes:
                    isLogScale: false
                  legend:
                    position: bottom
                    mode: list
                  thresholds: []
              queries:
              - kind: time_series
                spec:
                  name: A
                  plugin:
                    kind: signoz/BuilderQuery
                    spec:
                      name: A
                      stepInterval: 60
                      signal: metrics
                      aggregations:
                      - metricName: ceph_osd_op_w
                        timeAggregation: rate
                        spaceAggregation: sum
                        reduceTo: last
                      disabled: false
                      filter:
                        expression: k8s.cluster.name = 'turing'
                      groupBy: []
                      having:
                        expression: ''
                      legend: write op/s
              links: []
        layouts:
        - kind: Grid
          spec:
            items:
            - x: 0
              y: 0
              width: 6
              height: 2
              content:
                $ref: '#/spec/panels/health-status'
            - x: 6
              y: 0
              width: 6
              height: 2
              content:
                $ref: '#/spec/panels/osds-up'
            - x: 0
              y: 2
              width: 6
              height: 2
              content:
                $ref: '#/spec/panels/mons-in-quorum'
            - x: 6
              y: 2
              width: 6
              height: 2
              content:
                $ref: '#/spec/panels/placement-groups'
            - x: 0
              y: 4
              width: 6
              height: 2
              content:
                $ref: '#/spec/panels/used-capacity'
            - x: 6
              y: 4
              width: 6
              height: 2
              content:
                $ref: '#/spec/panels/total-capacity'
            - x: 0
              y: 6
              width: 6
              height: 4
              content:
                $ref: '#/spec/panels/capacity-used-over-time'
            - x: 6
              y: 6
              width: 6
              height: 3
              content:
                $ref: '#/spec/panels/stored-by-pool'
            - x: 0
              y: 10
              width: 6
              height: 4
              content:
                $ref: '#/spec/panels/objects-by-pool'
            - x: 6
              y: 10
              width: 6
              height: 4
              content:
                $ref: '#/spec/panels/pool-read-throughput'
            - x: 0
              y: 14
              width: 6
              height: 4
              content:
                $ref: '#/spec/panels/pool-write-throughput'
            - x: 6
              y: 14
              width: 6
              height: 4
              content:
                $ref: '#/spec/panels/osd-read-ops'
            - x: 0
              y: 18
              width: 6
              height: 4
              content:
                $ref: '#/spec/panels/osd-write-ops'
