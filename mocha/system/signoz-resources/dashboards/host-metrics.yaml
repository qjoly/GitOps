                  visualization:
                    timePreference: global_time
                  formatting:
                    unit: bytes
                  thresholds: []
              queries:
              - kind: scalar
                spec:
                  name: A
                  plugin:
                    kind: signoz/BuilderQuery
                    spec:
                      name: A
                      stepInterval: 60
                      signal: metrics
                      aggregations:
                      - metricName: k8s.node.allocatable_memory
                        timeAggregation: avg
                        spaceAggregation: sum
                        reduceTo: avg
                      disabled: false
                      filter:
                        expression: k8s.cluster.name IN $k8s.cluster.name AND k8s.node.name IN $k8s.node.name
                      groupBy: []
                      having:
                        expression: ''
                      legend: ''
              links: []
          cpu-usage:
            kind: Panel
            spec:
              display:
                name: CPU Usage
                description: ''
              plugin:
                kind: signoz/TimeSeriesPanel
                spec:
                  visualization:
                    timePreference: global_time
                    fillSpans: false
                  formatting:
                    unit: percentunit
                  chartAppearance:
                    lineInterpolation: spline
                    showPoints: false
                    lineStyle: solid
                    fillMode: none
                    spanGaps:
                      fillOnlyBelow: false
                      fillLessThan: ''
                  axes:
                    isLogScale: false
                    softMin: 0
                    softMax: 0
                  legend:
                    position: bottom
                    mode: list
                  thresholds: []
              queries:
              - kind: time_series
                spec:
                  name: A
                  plugin:
                    kind: signoz/CompositeQuery
                    spec:
                      queries:
                      - type: builder_query
                        spec:
                          name: A
                          stepInterval: 60
                          signal: metrics
                          aggregations:
                          - metricName: system.cpu.time
                            timeAggregation: rate
                            spaceAggregation: sum
                            reduceTo: avg
                          disabled: true
                          filter:
                            expression: k8s.cluster.name IN $k8s.cluster.name AND k8s.node.name IN $k8s.node.name
                          groupBy:
                          - name: state
                            fieldContext: attribute
                            fieldDataType: string
                          having:
                            expression: ''
                          legend: '{{state}}'
                      - type: builder_query
                        spec:
                          name: B
                          stepInterval: 60
                          signal: metrics
                          aggregations:
                          - metricName: system.cpu.time
                            timeAggregation: rate
                            spaceAggregation: sum
                            reduceTo: avg
                          disabled: true
                          filter:
                            expression: k8s.cluster.name IN $k8s.cluster.name AND k8s.node.name IN $k8s.node.name
                          groupBy: []
                          having:
                            expression: ''
                          legend: '{{state}}'
                      - type: builder_formula
                        spec:
                          name: F1
                          expression: A/B
                          disabled: false
                          legend: '{{state}}'
                          having:
                            expression: ''
                          functions: []
                          order: []
              links: []
