apiVersion: resources.signoz.io/v1alpha1
kind: Dashboard
metadata:
  name: host-metrics
  namespace: signoz
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  providerConfigRef:
    name: mocha
  objectTemplate:
    spec:
      schemaVersion: v6
      name: host-metrics
      tags:
      - key: tag
        value: hostmetrics
      - key: tag
        value: k8s
      - key: tag
        value: node
      spec:
        display:
          name: Host Metrics (k8s)
          description: This dashboard uses the system metrics collected from the `hostmetrics` receiver to show CPU, Memory, Disk, Network and Filesystem usage
        variables:
        - kind: ListVariable
          spec:
            name: k8s.cluster.name
            display:
              name: k8s.cluster.name
              description: Name of the cluster
            allowAllValue: true
            allowMultiple: true
            sort: none
            plugin:
              kind: signoz/DynamicVariable
              spec:
                name: k8s.cluster.name
                signal: all
        - kind: ListVariable
          spec:
            name: k8s.node.name
            display:
              name: k8s.node.name
              description: Name of the Node
            allowAllValue: true
            allowMultiple: true
            sort: alphabetical-asc
            plugin:
              kind: signoz/DynamicVariable
              spec:
                name: k8s.node.name
                signal: all
        panels:
          cpu-used:
            kind: Panel
            spec:
              display:
                name: CPU Used
                description: Node CPU utilization
              plugin:
                kind: signoz/NumberPanel
                spec:
                  visualization:
                    timePreference: global_time
                  formatting:
                    unit: short
                  thresholds: []
              queries:
              - kind: scalar
                spec:
                  name: A
                  plugin:
                    kind: signoz/BuilderQuery
                    spec:
                      name: A
                      stepInterval: 60
                      signal: metrics
                      aggregations:
                      - metricName: k8s.node.cpu.usage
                        timeAggregation: avg
                        spaceAggregation: avg
                        reduceTo: avg
                      disabled: false
                      filter:
                        expression: k8s.cluster.name IN $k8s.cluster.name AND k8s.node.name IN $k8s.node.name
                      groupBy: []
                      having:
                        expression: ''
                      legend: ''
              links: []
          allocatable-cpu:
            kind: Panel
            spec:
              display:
                name: Allocatable CPU
                description: Available CPU for Node
              plugin:
                kind: signoz/NumberPanel
                spec:
                  visualization:
                    timePreference: global_time
                  formatting:
                    unit: none
                  thresholds: []
              queries:
              - kind: scalar
                spec:
                  name: A
                  plugin:
                    kind: signoz/BuilderQuery
                    spec:
                      name: A
                      stepInterval: 60
                      signal: metrics
                      aggregations:
                      - metricName: k8s.node.allocatable_cpu
                        timeAggregation: avg
                        spaceAggregation: avg
                        reduceTo: avg
                      disabled: false
                      filter:
                        expression: k8s.cluster.name IN $k8s.cluster.name AND k8s.node.name IN $k8s.node.name
                      groupBy: []
                      having:
                        expression: ''
                      legend: ''
              links: []
          memory-used:
            kind: Panel
            spec:
              display:
                name: Memory Used
                description: ''
              plugin:
                kind: signoz/NumberPanel
                spec:
                  visualization:
                    timePreference: global_time
                  formatting:
                    unit: bytes
                  thresholds: []
              queries:
              - kind: scalar
                spec:
                  name: A
                  plugin:
                    kind: signoz/BuilderQuery
                    spec:
                      name: A
                      stepInterval: 60
                      signal: metrics
                      aggregations:
                      - metricName: k8s.node.memory.usage
                        timeAggregation: avg
                        spaceAggregation: sum
                        reduceTo: avg
                      disabled: false
                      filter:
                        expression: k8s.cluster.name IN $k8s.cluster.name AND k8s.node.name IN $k8s.node.name
                      groupBy: []
                      having:
                        expression: ''
                      legend: ''
              links: []
          allocatable-memory:
            kind: Panel
            spec:
              display:
                name: Allocatable Memory
                description: ''
              plugin:
                kind: signoz/NumberPanel
