                spec:
                  visualization:
                    timePreference: global_time
                    fillSpans: false
                  formatting:
                    unit: reqps
                  chartAppearance:
                    lineInterpolation: spline
                    showPoints: false
                    lineStyle: solid
                    fillMode: none
                    spanGaps:
                      fillOnlyBelow: false
                      fillLessThan: ''
                  axes:
                    isLogScale: false
                  legend:
                    position: bottom
                    mode: list
                  thresholds: []
              queries:
              - kind: time_series
                spec:
                  name: A
                  plugin:
                    kind: signoz/CompositeQuery
                    spec:
                      queries:
                      - type: builder_query
                        spec:
                          name: A
                          stepInterval: 60
                          signal: metrics
                          aggregations:
                          - metricName: kubelet_pod_start_duration_seconds.bucket
                            spaceAggregation: p50
                            reduceTo: avg
                          disabled: false
                          filter:
                            expression: service.name IN $service.name AND k8s.cluster.name IN $k8s.cluster.name
                          groupBy: []
                          having:
                            expression: ''
                          legend: p50
                      - type: builder_query
                        spec:
                          name: B
                          stepInterval: 60
                          signal: metrics
                          aggregations:
                          - metricName: kubelet_pod_start_duration_seconds.bucket
                            spaceAggregation: p90
                            reduceTo: avg
                          disabled: false
                          filter:
                            expression: service.name IN $service.name AND k8s.cluster.name IN $k8s.cluster.name
                          groupBy: []
                          having:
                            expression: ''
                          legend: p90
                      - type: builder_query
                        spec:
                          name: C
                          stepInterval: 60
                          signal: metrics
                          aggregations:
                          - metricName: kubelet_pod_start_duration_seconds.bucket
                            spaceAggregation: p99
                            reduceTo: avg
                          disabled: false
                          filter:
                            expression: service.name IN $service.name AND k8s.cluster.name IN $k8s.cluster.name
                          groupBy: []
                          having:
                            expression: ''
                          legend: p99
              links: []
          storage-operation-duration-p50-p90-p99:
            kind: Panel
            spec:
              display:
                name: Storage Operation Duration (p50/p90/p99)
                description: ''
              plugin:
                kind: signoz/TimeSeriesPanel
                spec:
                  visualization:
                    timePreference: global_time
                    fillSpans: false
                  formatting:
                    unit: reqps
                  chartAppearance:
                    lineInterpolation: spline
                    showPoints: false
                    lineStyle: solid
                    fillMode: none
                    spanGaps:
                      fillOnlyBelow: false
                      fillLessThan: ''
                  axes:
                    isLogScale: false
                  legend:
                    position: bottom
                    mode: list
                  thresholds: []
              queries:
              - kind: time_series
                spec:
                  name: A
                  plugin:
                    kind: signoz/CompositeQuery
                    spec:
                      queries:
                      - type: builder_query
                        spec:
                          name: A
                          stepInterval: 60
                          signal: metrics
                          aggregations:
                          - metricName: storage_operation_duration_seconds.bucket
                            spaceAggregation: p50
                            reduceTo: avg
                          disabled: false
                          filter:
                            expression: service.name IN $service.name AND k8s.cluster.name IN $k8s.cluster.name
                          groupBy: []
                          having:
                            expression: ''
                          legend: p50
                      - type: builder_query
                        spec:
                          name: B
                          stepInterval: 60
                          signal: metrics
                          aggregations:
                          - metricName: storage_operation_duration_seconds.bucket
                            spaceAggregation: p90
                            reduceTo: avg
                          disabled: false
                          filter:
                            expression: service.name IN $service.name AND k8s.cluster.name IN $k8s.cluster.name
                          groupBy: []
                          having:
                            expression: ''
                          legend: p90
                      - type: builder_query
                        spec:
                          name: C
                          stepInterval: 60
                          signal: metrics
                          aggregations:
                          - metricName: storage_operation_duration_seconds.bucket
                            spaceAggregation: p99
                            reduceTo: avg
                          disabled: false
                          filter:
                            expression: service.name IN $service.name AND k8s.cluster.name IN $k8s.cluster.name
                          groupBy: []
                          having:
                            expression: ''
                          legend: p99
              links: []
        layouts:
        - kind: Grid
          spec:
            items:
            - x: 0
              y: 0
              width: 3
              height: 4
              content:
                $ref: '#/spec/panels/auto-discovered-kubelet-services'
            - x: 3
              y: 0
              width: 3
              height: 2
              content:
                $ref: '#/spec/panels/running-pods'
            - x: 6
              y: 0
              width: 3
              height: 2
              content:
                $ref: '#/spec/panels/running-containers'
            - x: 9
              y: 0
              width: 3
              height: 2
              content:
                $ref: '#/spec/panels/started-pods-s'
            - x: 0
              y: 4
              width: 6
              height: 2
              content:
                $ref: '#/spec/panels/go-routines'
            - x: 6
              y: 4
              width: 6
              height: 4
              content:
                $ref: '#/spec/panels/runtime-operations-s-by-type'
            - x: 0
              y: 8
              width: 6
              height: 4
              content:
                $ref: '#/spec/panels/runtime-operation-duration-p50-p90-p99'
            - x: 6
              y: 8
              width: 6
              height: 4
              content:
