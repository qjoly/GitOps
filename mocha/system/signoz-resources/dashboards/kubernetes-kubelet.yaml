apiVersion: resources.signoz.io/v1alpha1
kind: Dashboard
metadata:
  name: kubernetes-kubelet
  namespace: signoz
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  providerConfigRef:
    name: mocha
  objectTemplate:
    spec:
      schemaVersion: v6
      name: kubernetes-kubelet
      tags:
      - key: tag
        value: kubernetes
      - key: tag
        value: node
      - key: tag
        value: kubelet
      - key: tag
        value: prometheus
      spec:
        display:
          name: Kubernetes Kubelet
          description: Node-agent view for kubelet runtime operations, pod lifecycle, and storage operation latencies.
        variables:
        - kind: ListVariable
          spec:
            name: service.name
            display:
              name: service.name
              description: Auto-discovered services (from metric labels).
            allowAllValue: true
            allowMultiple: true
            sort: none
            plugin:
              kind: signoz/DynamicVariable
              spec:
                name: service.name
                signal: metrics
        - kind: ListVariable
          spec:
            name: k8s.cluster.name
            display:
              name: k8s.cluster.name
              description: Optional cluster label selector.
            allowAllValue: true
            allowMultiple: true
            sort: none
            plugin:
              kind: signoz/DynamicVariable
              spec:
                name: k8s.cluster.name
                signal: metrics
        - kind: ListVariable
          spec:
            name: deployment_environment_name
            display:
              name: deployment_environment_name
              description: Optional OTel environment label selector.
            allowAllValue: true
            allowMultiple: true
            sort: none
            plugin:
              kind: signoz/DynamicVariable
              spec:
                name: deployment.environment.name
                signal: metrics
        - kind: ListVariable
          spec:
            name: deployment_environment
            display:
              name: deployment_environment
              description: Optional legacy environment label selector.
            allowAllValue: true
            allowMultiple: true
            sort: none
            plugin:
              kind: signoz/DynamicVariable
              spec:
                name: deployment.environment
                signal: metrics
        panels:
          auto-discovered-kubelet-services:
            kind: Panel
            spec:
              display:
                name: Auto-Discovered Kubelet Services
                description: ''
              plugin:
                kind: signoz/TimeSeriesPanel
                spec:
                  visualization:
                    timePreference: global_time
                    fillSpans: false
                  formatting:
                    unit: short
                  chartAppearance:
                    lineInterpolation: spline
                    showPoints: false
                    lineStyle: solid
                    fillMode: none
                    spanGaps:
                      fillOnlyBelow: false
                      fillLessThan: ''
                  axes:
                    isLogScale: false
                  legend:
                    position: bottom
                    mode: list
                  thresholds: []
              queries:
              - kind: time_series
                spec:
                  name: A
                  plugin:
                    kind: signoz/BuilderQuery
                    spec:
                      name: A
                      stepInterval: 60
                      signal: metrics
                      aggregations:
                      - metricName: kubelet_running_pods
                        timeAggregation: latest
                        spaceAggregation: sum
                        reduceTo: last
                      disabled: false
                      filter:
                        expression: service.name IN $service.name AND k8s.cluster.name IN $k8s.cluster.name
                      groupBy:
                      - name: service.name
                        fieldDataType: string
                      having:
                        expression: ''
                      legend: '{{service.name}}'
              links: []
          running-pods:
            kind: Panel
            spec:
              display:
                name: Running Pods
                description: ''
              plugin:
                kind: signoz/NumberPanel
                spec:
                  visualization:
                    timePreference: global_time
                  formatting:
                    unit: short
                  thresholds: []
              queries:
              - kind: scalar
                spec:
                  name: A
                  plugin:
                    kind: signoz/BuilderQuery
                    spec:
                      name: A
                      stepInterval: 60
                      signal: metrics
                      aggregations:
                      - metricName: kubelet_running_pods
                        timeAggregation: latest
                        spaceAggregation: sum
                        reduceTo: last
                      disabled: false
                      filter:
                        expression: service.name IN $service.name AND k8s.cluster.name IN $k8s.cluster.name
                      groupBy: []
                      having:
                        expression: ''
                      legend: pods
              links: []
          running-containers:
            kind: Panel
            spec:
              display:
                name: Running Containers
                description: ''
              plugin:
                kind: signoz/NumberPanel
                spec:
                  visualization:
                    timePreference: global_time
                  formatting:
                    unit: short
                  thresholds: []
              queries:
              - kind: scalar
                spec:
                  name: A
                  plugin:
                    kind: signoz/BuilderQuery
                    spec:
                      name: A
                      stepInterval: 60
                      signal: metrics
                      aggregations:
                      - metricName: kubelet_running_containers
                        timeAggregation: latest
                        spaceAggregation: sum
                        reduceTo: last
                      disabled: false
                      filter:
                        expression: service.name IN $service.name AND k8s.cluster.name IN $k8s.cluster.name
                      groupBy: []
                      having:
                        expression: ''
                      legend: containers
              links: []
          started-pods-s:
            kind: Panel
            spec:
              display:
                name: Started Pods / s
                description: ''
              plugin:
                kind: signoz/NumberPanel
                spec:
                  visualization:
                    timePreference: global_time
                  formatting:
                    unit: reqps
                  thresholds: []
              queries:
              - kind: scalar
                spec:
                  name: A
                  plugin:
                    kind: signoz/BuilderQuery
                    spec:
                      name: A
                      stepInterval: 60
                      signal: metrics
                      aggregations:
                      - metricName: kubelet_started_pods_total
                        timeAggregation: rate
                        spaceAggregation: sum
                        reduceTo: avg
                      disabled: false
                      filter:
                        expression: service.name IN $service.name AND k8s.cluster.name IN $k8s.cluster.name
                      groupBy: []
                      having:
                        expression: ''
                      legend: started/s
              links: []
          go-routines:
            kind: Panel
            spec:
              display:
                name: Go Routines
                description: ''
              plugin:
                kind: signoz/NumberPanel
                spec:
                  visualization:
                    timePreference: global_time
                  formatting:
                    unit: short
                  thresholds: []
              queries:
              - kind: scalar
                spec:
                  name: A
                  plugin:
                    kind: signoz/BuilderQuery
                    spec:
                      name: A
                      stepInterval: 60
                      signal: metrics
                      aggregations:
                      - metricName: go_goroutines
                        timeAggregation: latest
                        spaceAggregation: sum
                        reduceTo: last
                      disabled: false
                      filter:
                        expression: service.name IN $service.name AND k8s.cluster.name IN $k8s.cluster.name
                      groupBy: []
                      having:
                        expression: ''
                      legend: goroutines
              links: []
          runtime-operations-s-by-type:
            kind: Panel
            spec:
              display:
                name: Runtime Operations / s By Type
                description: ''
              plugin:
                kind: signoz/TimeSeriesPanel
                spec:
                  visualization:
                    timePreference: global_time
                    fillSpans: false
                  formatting:
                    unit: reqps
                  chartAppearance:
                    lineInterpolation: spline
                    showPoints: false
                    lineStyle: solid
                    fillMode: none
                    spanGaps:
                      fillOnlyBelow: false
                      fillLessThan: ''
                  axes:
                    isLogScale: false
                  legend:
                    position: bottom
                    mode: list
                  thresholds: []
              queries:
              - kind: time_series
                spec:
                  name: A
                  plugin:
                    kind: signoz/BuilderQuery
                    spec:
                      name: A
                      stepInterval: 60
                      signal: metrics
                      aggregations:
                      - metricName: kubelet_runtime_operations_total
                        timeAggregation: rate
                        spaceAggregation: sum
                        reduceTo: avg
                      disabled: false
                      filter:
                        expression: service.name IN $service.name AND k8s.cluster.name IN $k8s.cluster.name
                      groupBy:
                      - name: operation_type
                        fieldDataType: string
                      having:
                        expression: ''
                      legend: '{{operation_type}}'
              links: []
          runtime-operation-duration-p50-p90-p99:
            kind: Panel
            spec:
              display:
                name: Runtime Operation Duration (p50/p90/p99)
                description: ''
              plugin:
                kind: signoz/TimeSeriesPanel
                spec:
                  visualization:
                    timePreference: global_time
                    fillSpans: false
                  formatting:
                    unit: reqps
                  chartAppearance:
                    lineInterpolation: spline
                    showPoints: false
                    lineStyle: solid
                    fillMode: none
                    spanGaps:
                      fillOnlyBelow: false
                      fillLessThan: ''
                  axes:
                    isLogScale: false
                  legend:
                    position: bottom
                    mode: list
                  thresholds: []
              queries:
              - kind: time_series
                spec:
                  name: A
                  plugin:
                    kind: signoz/CompositeQuery
                    spec:
                      queries:
                      - type: builder_query
                        spec:
                          name: A
                          stepInterval: 60
                          signal: metrics
                          aggregations:
                          - metricName: kubelet_runtime_operations_duration_seconds.bucket
                            spaceAggregation: p50
                            reduceTo: avg
                          disabled: false
                          filter:
                            expression: service.name IN $service.name AND k8s.cluster.name IN $k8s.cluster.name
                          groupBy: []
                          having:
                            expression: ''
                          legend: p50
                      - type: builder_query
                        spec:
                          name: B
                          stepInterval: 60
                          signal: metrics
                          aggregations:
                          - metricName: kubelet_runtime_operations_duration_seconds.bucket
                            spaceAggregation: p90
                            reduceTo: avg
                          disabled: false
                          filter:
                            expression: service.name IN $service.name AND k8s.cluster.name IN $k8s.cluster.name
                          groupBy: []
                          having:
                            expression: ''
                          legend: p90
                      - type: builder_query
                        spec:
                          name: C
                          stepInterval: 60
                          signal: metrics
                          aggregations:
                          - metricName: kubelet_runtime_operations_duration_seconds.bucket
                            spaceAggregation: p99
                            reduceTo: avg
                          disabled: false
                          filter:
                            expression: service.name IN $service.name AND k8s.cluster.name IN $k8s.cluster.name
                          groupBy: []
                          having:
                            expression: ''
                          legend: p99
              links: []
          pod-start-duration-p50-p90-p99:
            kind: Panel
            spec:
              display:
                name: Pod Start Duration (p50/p90/p99)
                description: ''
              plugin:
