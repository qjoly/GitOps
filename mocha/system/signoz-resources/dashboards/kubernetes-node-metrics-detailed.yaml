apiVersion: resources.signoz.io/v1alpha1
kind: Dashboard
metadata:
  name: kubernetes-node-metrics-detailed
  namespace: signoz
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  providerConfigRef:
    name: mocha
  objectTemplate:
    spec:
      schemaVersion: v6
      name: kubernetes-node-metrics-detailed
      tags:
      - key: tag
        value: node
      - key: tag
        value: k8s
      - key: tag
        value: kubelet
      spec:
        display:
          name: Kubernetes Node Metrics - Detailed
          description: This dashboard uses the Kubernetes node metrics collected from the kubeletstats receiver to show CPU, Memory, Filesystem, and Network usage per node.
        variables:
        - kind: ListVariable
          spec:
            name: k8s.cluster.name
            display:
              name: k8s.cluster.name
              description: The k8s cluster name
            allowAllValue: false
            allowMultiple: false
            sort: none
            plugin:
              kind: signoz/DynamicVariable
              spec:
                name: k8s.cluster.name
                signal: all
        - kind: ListVariable
          spec:
            name: k8s.node.name
            display:
              name: k8s.node.name
              description: The k8s node name
            allowAllValue: true
            allowMultiple: true
            sort: alphabetical-asc
            plugin:
              kind: signoz/DynamicVariable
              spec:
                name: k8s.node.name
                signal: all
        panels:
          node-cpu-usage:
            kind: Panel
            spec:
              display:
                name: Node CPU usage
                description: ''
              plugin:
                kind: signoz/TimeSeriesPanel
                spec:
                  visualization:
                    timePreference: global_time
                    fillSpans: false
                  formatting:
                    unit: none
                  chartAppearance:
                    lineInterpolation: spline
                    showPoints: false
                    lineStyle: solid
                    fillMode: none
                    spanGaps:
                      fillOnlyBelow: false
                      fillLessThan: ''
                  axes:
                    isLogScale: false
                    softMin: 0
                    softMax: 0
                  legend:
                    position: bottom
                    mode: list
                  thresholds: []
              queries:
              - kind: time_series
                spec:
                  name: A
                  plugin:
                    kind: signoz/BuilderQuery
                    spec:
                      name: A
                      stepInterval: 60
                      signal: metrics
                      aggregations:
                      - metricName: k8s.node.cpu.usage
                        timeAggregation: avg
                        spaceAggregation: avg
                        reduceTo: avg
                      disabled: false
                      filter:
                        expression: (k8s.cluster.name IN $k8s.cluster.name AND k8s.node.name IN $k8s.node.name)
                      groupBy:
                      - name: k8s.node.name
                        fieldContext: attribute
                        fieldDataType: string
                      having:
                        expression: ''
                      legend: '{{k8s.node.name}}'
              links: []
          node-cpu:
            kind: Panel
            spec:
              display:
                name: Node CPU
                description: ''
              plugin:
                kind: signoz/TablePanel
                spec:
                  visualization:
                    timePreference: global_time
                  formatting: {}
                  thresholds: []
              queries:
              - kind: scalar
                spec:
                  name: A
                  plugin:
                    kind: signoz/CompositeQuery
                    spec:
                      queries:
                      - type: builder_query
                        spec:
                          name: A
                          stepInterval: 60
                          signal: metrics
                          aggregations:
                          - metricName: k8s.node.cpu.usage
                            timeAggregation: avg
                            spaceAggregation: avg
                            reduceTo: avg
                          disabled: false
                          filter:
                            expression: (k8s.cluster.name IN $k8s.cluster.name AND k8s.node.name IN $k8s.node.name)
                          groupBy:
                          - name: k8s.node.name
                            fieldContext: attribute
                            fieldDataType: string
                          having:
                            expression: ''
                          legend: average cpu usage
                      - type: builder_query
                        spec:
                          name: B
                          stepInterval: 60
                          signal: metrics
                          aggregations:
                          - metricName: k8s.node.allocatable_cpu
                            timeAggregation: avg
                            spaceAggregation: sum
                            reduceTo: avg
                          disabled: false
                          filter:
                            expression: (k8s.cluster.name IN $k8s.cluster.name AND k8s.node.name IN $k8s.node.name)
                          groupBy:
                          - name: k8s.node.name
                            fieldContext: attribute
                            fieldDataType: string
                          having:
                            expression: ''
                          legend: allocatable
              links: []
