apiVersion: resources.signoz.io/v1alpha1
kind: Dashboard
metadata:
  name: kubernetes-system-overview
  namespace: signoz
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  providerConfigRef:
    name: mocha
  objectTemplate:
    spec:
      schemaVersion: v6
      name: kubernetes-system-overview
      tags:
      - key: tag
        value: kubernetes
      - key: tag
        value: overview
      - key: tag
        value: control-plane
      - key: tag
        value: node
      - key: tag
        value: dns
      - key: tag
        value: prometheus
      spec:
        display:
          name: Kubernetes System Overview
          description: Combined view across control-plane, node, networking, and DNS components with distro-neutral service scoping.
        variables:
        - kind: ListVariable
          spec:
            name: service.name
            display:
              name: service.name
              description: Auto-discovered services (from metric labels).
            allowAllValue: true
            allowMultiple: true
            sort: none
            plugin:
              kind: signoz/DynamicVariable
              spec:
                name: service.name
                signal: metrics
        - kind: ListVariable
          spec:
            name: k8s.cluster.name
            display:
              name: k8s.cluster.name
              description: Optional cluster label selector.
            allowAllValue: true
            allowMultiple: true
            sort: none
            plugin:
              kind: signoz/DynamicVariable
              spec:
                name: k8s.cluster.name
                signal: metrics
        - kind: ListVariable
          spec:
            name: deployment_environment_name
            display:
              name: deployment_environment_name
              description: Optional OTel environment label selector.
            allowAllValue: true
            allowMultiple: true
            sort: none
            plugin:
              kind: signoz/DynamicVariable
              spec:
                name: deployment.environment.name
                signal: metrics
        - kind: ListVariable
          spec:
            name: deployment_environment
            display:
              name: deployment_environment
              description: Optional legacy environment label selector.
            allowAllValue: true
            allowMultiple: true
            sort: none
            plugin:
              kind: signoz/DynamicVariable
              spec:
                name: deployment.environment
                signal: metrics
        panels:
          api-requests-s:
            kind: Panel
            spec:
              display:
                name: API Requests / s
                description: ''
              plugin:
                kind: signoz/NumberPanel
                spec:
                  visualization:
                    timePreference: global_time
                  formatting:
                    unit: reqps
                  thresholds: []
              queries:
              - kind: scalar
                spec:
                  name: A
                  plugin:
                    kind: signoz/BuilderQuery
                    spec:
                      name: A
                      stepInterval: 60
                      signal: metrics
                      aggregations:
                      - metricName: apiserver_request_total
                        timeAggregation: rate
                        spaceAggregation: sum
                        reduceTo: avg
                      disabled: false
                      filter:
                        expression: service.name IN $service.name AND k8s.cluster.name IN $k8s.cluster.name
                      groupBy: []
                      having:
                        expression: ''
                      legend: apiserver req/s
              links: []
          scheduling-attempts-s:
            kind: Panel
            spec:
              display:
                name: Scheduling Attempts / s
                description: ''
              plugin:
                kind: signoz/NumberPanel
                spec:
                  visualization:
                    timePreference: global_time
                  formatting:
                    unit: reqps
                  thresholds: []
              queries:
              - kind: scalar
                spec:
                  name: A
                  plugin:
                    kind: signoz/BuilderQuery
                    spec:
                      name: A
                      stepInterval: 60
                      signal: metrics
                      aggregations:
                      - metricName: scheduler_schedule_attempts_total
