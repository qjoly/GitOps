                      stepInterval: 60
                      signal: metrics
                      aggregations:
                      - metricName: argocd_app_info
                        timeAggregation: latest
                        spaceAggregation: sum
                        reduceTo: last
                      disabled: false
                      filter:
                        expression: namespace = $namespace AND health_status IN $health.status AND sync_status IN $sync.status AND k8s.cluster.name IN $k8s.cluster.name
                      groupBy:
                      - name: repo
                        fieldContext: attribute
                        fieldDataType: string
                      having:
                        expression: ''
                      legend: Repo - {{repo}}
              links: []
          sync-activity:
            kind: Panel
            spec:
              display:
                name: Sync activity
                description: Show different phases of sync activity
              plugin:
                kind: signoz/TimeSeriesPanel
                spec:
                  visualization:
                    timePreference: global_time
                    fillSpans: false
                  formatting:
                    unit: none
                  chartAppearance:
                    lineInterpolation: spline
                    showPoints: false
                    lineStyle: solid
                    fillMode: none
                    spanGaps:
                      fillOnlyBelow: false
                      fillLessThan: ''
                  axes:
                    isLogScale: false
                    softMin: 0
                    softMax: 0
                  legend:
                    position: bottom
                    mode: list
                  thresholds: []
              queries:
              - kind: time_series
                spec:
                  name: A
                  plugin:
                    kind: signoz/BuilderQuery
                    spec:
                      name: A
                      stepInterval: 60
                      signal: metrics
                      aggregations:
                      - metricName: argocd_app_sync_total
                        timeAggregation: increase
                        spaceAggregation: sum
                        reduceTo: avg
                      disabled: false
                      filter:
                        expression: namespace = $namespace AND phase = 'Succeeded' AND k8s.cluster.name IN $k8s.cluster.name
                      groupBy:
                      - name: phase
                        fieldContext: attribute
                        fieldDataType: string
                      having:
                        expression: ''
                      legend: Phase - {{phase}}
              links: []
