apiVersion: resources.signoz.io/v1alpha1
kind: Dashboard
metadata:
  name: argocd
  namespace: signoz
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  providerConfigRef:
    name: mocha
  objectTemplate:
    spec:
      schemaVersion: v6
      name: argocd
      tags:
      - key: tag
        value: argocd
      spec:
        display:
          name: Argo CD Metrics
          description: ''
        variables:
        - kind: ListVariable
          spec:
            name: k8s.cluster.name
            display:
              name: k8s.cluster.name
              description: Name of the cluster
            allowAllValue: true
            allowMultiple: true
            sort: none
            plugin:
              kind: signoz/DynamicVariable
              spec:
                name: k8s.cluster.name
                signal: all
        - kind: ListVariable
          spec:
            name: health.status
            display:
              name: health.status
              description: Health status of an application
            allowAllValue: true
            allowMultiple: true
            sort: none
            plugin:
              kind: signoz/DynamicVariable
              spec:
                name: health_status
                signal: all
        - kind: ListVariable
          spec:
            name: namespace
            display:
              name: namespace
              description: Kubernetes Namespace
            allowAllValue: false
            allowMultiple: false
            sort: none
            plugin:
              kind: signoz/DynamicVariable
              spec:
                name: namespace
                signal: all
        - kind: ListVariable
          spec:
            name: sync.status
            display:
              name: sync.status
              description: Sync status of an application
            allowAllValue: true
            allowMultiple: true
            sort: none
            plugin:
              kind: signoz/DynamicVariable
              spec:
                name: sync_status
                signal: all
        panels:
          number-of-applications:
            kind: Panel
            spec:
              display:
                name: Number Of Applications
                description: Number of applications present in the ArgoCD Dashboard
              plugin:
                kind: signoz/NumberPanel
                spec:
                  visualization:
                    timePreference: global_time
                  formatting:
                    unit: none
                  thresholds: []
              queries:
              - kind: scalar
                spec:
                  name: A
                  plugin:
                    kind: signoz/BuilderQuery
                    spec:
                      name: A
                      stepInterval: 60
                      signal: metrics
                      aggregations:
                      - metricName: argocd_app_info
                        timeAggregation: latest
                        spaceAggregation: sum
                        reduceTo: avg
                      disabled: false
                      filter:
                        expression: k8s.cluster.name IN $k8s.cluster.name
                      groupBy: []
                      having:
                        expression: ''
                      legend: ''
              links: []
          repository-servers:
            kind: Panel
            spec:
              display:
                name: 'Repository Servers '
                description: Number for Repository present in the ArgoCD Dashboard
              plugin:
                kind: signoz/NumberPanel
                spec:
                  visualization:
                    timePreference: global_time
                  formatting:
                    unit: none
                  thresholds: []
              queries:
              - kind: scalar
                spec:
                  name: A
                  plugin:
                    kind: signoz/BuilderQuery
                    spec:
                      name: A
                      stepInterval: 60
                      signal: metrics
                      aggregations:
                      - metricName: argocd_app_info
                        timeAggregation: latest
                        spaceAggregation: sum
                        reduceTo: last
                      disabled: false
                      filter:
                        expression: namespace = $namespace AND k8s.cluster.name IN $k8s.cluster.name
                      groupBy: []
                      having:
                        expression: ''
                      legend: '{{health_status}}'
              links: []
          healthy:
            kind: Panel
            spec:
              display:
                name: Healthy
                description: Number of healthly applications in ArgoCD Dashboard
              plugin:
                kind: signoz/NumberPanel
                spec:
                  visualization:
                    timePreference: global_time
                  formatting:
                    unit: none
                  thresholds: []
              queries:
              - kind: scalar
                spec:
                  name: A
                  plugin:
                    kind: signoz/BuilderQuery
                    spec:
                      name: A
                      stepInterval: 60
                      signal: metrics
                      aggregations:
                      - metricName: argocd_app_info
                        timeAggregation: latest
                        spaceAggregation: sum
                        reduceTo: last
                      disabled: false
                      filter:
                        expression: namespace = $namespace AND health_status = 'Healthy' AND k8s.cluster.name IN $k8s.cluster.name
                      groupBy: []
                      having:
                        expression: ''
                      legend: ''
              links: []
          progressing:
            kind: Panel
            spec:
              display:
                name: Progressing
                description: 'Number of applications that are currently in progress '
              plugin:
                kind: signoz/NumberPanel
                spec:
                  visualization:
                    timePreference: global_time
                  formatting:
                    unit: none
                  thresholds: []
              queries:
              - kind: scalar
                spec:
                  name: A
                  plugin:
                    kind: signoz/BuilderQuery
                    spec:
                      name: A
                      stepInterval: 60
                      signal: metrics
                      aggregations:
                      - metricName: argocd_app_info
                        timeAggregation: latest
                        spaceAggregation: sum
                        reduceTo: last
                      disabled: false
                      filter:
                        expression: namespace = $namespace AND health_status = 'Progressing' AND k8s.cluster.name IN $k8s.cluster.name
                      groupBy: []
                      having:
                        expression: ''
                      legend: ''
              links: []
          suspended:
            kind: Panel
            spec:
              display:
                name: Suspended
                description: Number of application which are suspended
              plugin:
                kind: signoz/NumberPanel
                spec:
                  visualization:
                    timePreference: global_time
                  formatting:
                    unit: none
                  thresholds: []
              queries:
              - kind: scalar
                spec:
                  name: A
                  plugin:
                    kind: signoz/BuilderQuery
                    spec:
                      name: A
                      stepInterval: 60
                      signal: metrics
                      aggregations:
                      - metricName: argocd_app_info
                        timeAggregation: latest
                        spaceAggregation: sum
                        reduceTo: last
                      disabled: false
                      filter:
                        expression: namespace = $namespace AND health_status = 'Suspended' AND k8s.cluster.name IN $k8s.cluster.name
                      groupBy: []
                      having:
                        expression: ''
                      legend: ''
              links: []
          degraded:
            kind: Panel
            spec:
              display:
                name: Degraded
                description: Number of application which are degraded
              plugin:
                kind: signoz/NumberPanel
                spec:
                  visualization:
                    timePreference: global_time
                  formatting:
                    unit: none
                  thresholds: []
              queries:
              - kind: scalar
                spec:
                  name: A
                  plugin:
                    kind: signoz/BuilderQuery
                    spec:
                      name: A
                      stepInterval: 60
                      signal: metrics
                      aggregations:
                      - metricName: argocd_app_info
                        timeAggregation: latest
                        spaceAggregation: sum
                        reduceTo: last
                      disabled: false
                      filter:
                        expression: namespace = $namespace AND health_status = 'Degraded' AND k8s.cluster.name IN $k8s.cluster.name
                      groupBy: []
                      having:
                        expression: ''
                      legend: ''
              links: []
          application-health-distribution:
            kind: Panel
            spec:
              display:
                name: Application Health Distribution
                description: Distribution of application health statuses across all apps
              plugin:
                kind: signoz/PieChartPanel
                spec:
                  visualization:
                    timePreference: global_time
                  formatting:
                    unit: none
                  legend:
                    position: bottom
                    mode: list
              queries:
              - kind: scalar
                spec:
                  name: A
                  plugin:
                    kind: signoz/BuilderQuery
                    spec:
                      name: A
                      stepInterval: 60
                      signal: metrics
                      aggregations:
                      - metricName: argocd_app_info
                        timeAggregation: latest
                        spaceAggregation: sum
                        reduceTo: last
                      disabled: false
                      filter:
                        expression: namespace = $namespace AND k8s.cluster.name IN $k8s.cluster.name
                      groupBy:
                      - name: health_status
                        fieldContext: attribute
                        fieldDataType: string
                      having:
                        expression: ''
                      legend: '{{health_status}}'
              links: []
          sync-status-distribution:
            kind: Panel
            spec:
              display:
                name: Sync Status Distribution
                description: Distribution of application sync statuses across all apps
              plugin:
