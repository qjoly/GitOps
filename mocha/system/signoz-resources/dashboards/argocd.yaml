                        spaceAggregation: sum
                        reduceTo: avg
                      disabled: false
                      filter:
                        expression: k8s.cluster.name IN $k8s.cluster.name
                      groupBy: []
                      having:
                        expression: ''
                      legend: Namespace - {{namespace}}
              links: []
          k8s-api-activity:
            kind: Panel
            spec:
              display:
                name: K8s API Activity
                description: Shows the number of Kubernetes requests executed during application reconciliation
              plugin:
                kind: signoz/TimeSeriesPanel
