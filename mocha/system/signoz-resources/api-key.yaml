apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: signoz-api-key
  namespace: signoz
spec:
  refreshInterval: "1h"
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: signoz-api-key
  data:
    - secretKey: api_key
      remoteRef:
        key: signoz
        property: api_key
