apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: dex-config
  namespace: dex
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: dex-config
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        config.yaml: |
          issuer: https://dex.mocha.thoughtless.eu
          storage:
            type: kubernetes
            config:
              inCluster: true
          oauth2:
            skipApprovalScreen: true
            responseTypes: [code]
          enablePasswordDB: true
          staticPasswords:
            - email: qjoly@thoughtless.eu
              username: qjoly
              userID: 250a816b-2102-4ae4-9441-b47ed934b6ff
              hash: "{{ .qjoly_password_hash }}"
              emailVerified: true
              groups: [admins]
          staticClients:
            - id: argocd-mocha
              name: ArgoCD mocha
              secret: "{{ .argocd_mocha_secret }}"
              redirectURIs: [https://argocd.mocha.thoughtless.eu/auth/callback]
            - id: argocd-turing
              name: ArgoCD turing
              secret: "{{ .argocd_turing_secret }}"
              redirectURIs: [https://argocd-turing.thoughtless.eu/auth/callback]
            - id: argocd-doppio
              name: ArgoCD doppio
              secret: "{{ .argocd_doppio_secret }}"
              redirectURIs: [https://argocd.doppio.thoughtless.eu/auth/callback]
            - id: argocd-cli
              name: ArgoCD CLI
              public: true
              redirectURIs: [http://localhost:8085/auth/callback]
          sessions:
            absoluteLifetime: 24h
            validIfNotUsedFor: 1h
            cookieEncryptionKey: "{{ .session_cookie_key }}"
          mfa:
            authenticators:
              - id: webauthn
                type: WebAuthn
                config:
                  rpDisplayName: thoughtless.eu
                  rpID: dex.mocha.thoughtless.eu
                  rpOrigins: [https://dex.mocha.thoughtless.eu]
                  attestationPreference: none
                  userVerification: required
                  timeout: 60s
            defaultMFAChain: [webauthn]
  data:
    - secretKey: qjoly_password_hash
      remoteRef:
        key: dex
        property: qjoly_password_hash
    - secretKey: argocd_mocha_secret
      remoteRef:
        key: dex
        property: argocd_mocha_secret
    - secretKey: argocd_turing_secret
      remoteRef:
        key: dex
        property: argocd_turing_secret
    - secretKey: argocd_doppio_secret
      remoteRef:
        key: dex
        property: argocd_doppio_secret
    - secretKey: session_cookie_key
      remoteRef:
        key: dex
        property: session_cookie_key
