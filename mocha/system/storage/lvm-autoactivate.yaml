---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: lvm-autoactivate
  namespace: openebs
  labels:
    app.kubernetes.io/name: lvm-autoactivate
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: lvm-autoactivate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: lvm-autoactivate
    spec:
      priorityClassName: system-node-critical
      hostPID: true
      tolerations:
        - operator: Exists
      containers:
        - name: lvm-autoactivate
          image: openebs/lvm-driver:1.10.1
          command:
            - /bin/sh
            - -c
            - |
              set -o errexit
              # lvm-localpv needs the thin-pool dm target to provision thin
              # volumes, and Fedora does not load it on its own
              nsenter -t 1 -m -- modprobe dm-thin-pool || true
              # left alone, lvm-localpv sizes the pool after the first volume
              # it happens to provision -- 1 GiB, and it never grows it
              lvcreate -y -L 20G --thinpool lvmvg_thinpool lvmvg 2>/dev/null \
                || lvextend -L 20G lvmvg/lvmvg_thinpool 2>/dev/null \
                || true
              while true; do
                vgchange -aay || true
                sleep 120
              done
          securityContext:
            privileged: true
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 64Mi
          volumeMounts:
            - name: device-dir
              mountPath: /dev
      volumes:
        - name: device-dir
          hostPath:
            path: /dev
            type: Directory
