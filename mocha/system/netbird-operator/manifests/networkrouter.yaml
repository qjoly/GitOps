# In-cluster routing peer. The operator creates the NetBird network, its
# group and an ephemeral setup key, then runs the router pods here (they are
# privileged: NET_ADMIN, SYS_ADMIN, SYS_RESOURCE).
# Services are published with a NetworkResource next to them, which also adds
# <service>.<namespace>.nb.mocha.thoughtless.eu to the NetBird DNS zone below.
apiVersion: netbird.io/v1alpha1
kind: NetworkRouter
metadata:
  name: mocha
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  # The zone must already exist in NetBird (DNS > Zones).
  # NetBird-side state for that zone (not in git), set once via the API:
  # - zone distribution_groups: users, americano AND this router's group
  #   (without the router group, the router forwards instead of serving records)
  # - a DNS nameserver for domain nb.mocha.thoughtless.eu pointing at the
  #   router's current NetBird IP, assigned to groups users + americano.
  # WARNING: the router's setup key is ephemeral, so a router pod restart
  # gives it a NEW IP. Update the nameserver IP after any router restart,
  # or every peer loses *.nb resolution.
  dnsZoneRef:
    name: nb.mocha.thoughtless.eu
  workloadOverride:
    # Single node cluster: more replicas would only share its fate.
    replicas: 1
