apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: netbird-mgmt-api-key
spec:
  refreshInterval: "1h"
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: netbird-mgmt-api-key
    creationPolicy: Owner
  data:
    # PAT of the "k8s-operator" service user (NetBird dashboard).
    - secretKey: NB_API_KEY
      remoteRef:
        key: netbird
        property: operator_api_key
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
