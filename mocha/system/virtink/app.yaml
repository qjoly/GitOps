apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: virtink
  namespace: argocd
spec:
  project: default
  syncPolicy:
    automated:
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      # Virtink ships large CRDs; server-side apply avoids the client-side
      # last-applied-configuration annotation size limit.
      - ServerSideApply=true
  destination:
    server: https://kubernetes.default.svc
    namespace: virtink-system
  source:
    repoURL: https://github.com/qjoly/gitops.git
    targetRevision: HEAD
    # Vendored from smartxworks/virtink v0.17.0 release (virtink.yaml).
    # Cloud Hypervisor based VM runtime. Depends on cert-manager (present).
    path: mocha/system/virtink/manifests
