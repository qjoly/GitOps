---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# CAPI control-plane provider for Kamaji, rendered from the upstream repo at the
# release tag instead of vendoring the ~16k-line components file.
# config/default ships CRDs + RBAC + controller in namespace kamaji-system.
resources:
  - github.com/clastix/cluster-api-control-plane-provider-kamaji/config/default?ref=v0.20.0
# config/default leaves clusterctl feature-gate variables (${CACPPK_*}) in the
# controller args, which kustomize does not substitute. Pin them to the upstream
# defaults (all false) so the controller does not crashloop on literal ${...}.
patches:
  - target:
      kind: Deployment
      name: capi-kamaji-controller-manager
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: capi-kamaji-controller-manager
      spec:
        template:
          spec:
            containers:
              - name: controller
                args:
                  - --leader-elect
                  - --feature-gates=DynamicInfrastructureClusterPatch=false,ExternalClusterReference=false,ExternalClusterReferenceCrossNamespace=false,SkipInfraClusterPatch=false
                  - --dynamic-infrastructure-clusters=
