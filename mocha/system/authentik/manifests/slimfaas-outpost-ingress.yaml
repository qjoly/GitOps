apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: slimfaas-outpost
  namespace: authentik
  annotations:
    cert-manager.io/cluster-issuer: cloudflare
    homepage.thoughtless.eu/hide: "true"
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - slimfaas.mocha.thoughtless.eu
      secretName: slimfaas-outpost-tls
  rules:
    - host: slimfaas.mocha.thoughtless.eu
      http:
        paths:
          - path: /outpost.goauthentik.io
            pathType: Prefix
            backend:
              service:
                name: authentik-server
                port:
                  number: 80
