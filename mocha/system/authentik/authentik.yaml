apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: authentik
  namespace: argocd
spec:
  project: default
  ignoreDifferences:
    - group: apps
      kind: StatefulSet
      name: authentik-postgresql
      jsonPointers:
        - /spec/persistentVolumeClaimRetentionPolicy
        - /spec/podManagementPolicy
        - /spec/revisionHistoryLimit
      jqPathExpressions:
        - '.spec.volumeClaimTemplates[].spec.volumeMode'
        - '.spec.volumeClaimTemplates[].status'
  syncPolicy:
    automated:
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
  destination:
    server: https://kubernetes.default.svc
    namespace: authentik
  sources:
    - repoURL: https://charts.goauthentik.io
      chart: authentik
      targetRevision: 2026.8.1
      helm:
        values: |
          authentik:
            error_reporting:
              enabled: false
          global:
            env:
              - name: AUTHENTIK_SECRET_KEY
                valueFrom:
                  secretKeyRef:
                    name: authentik-secrets
                    key: AUTHENTIK_SECRET_KEY
              - name: AUTHENTIK_POSTGRESQL__PASSWORD
                valueFrom:
                  secretKeyRef:
                    name: authentik-secrets
                    key: password
              # Bootstraps the akadmin API token; reused by authentik-provisioner.
              - name: AUTHENTIK_BOOTSTRAP_TOKEN
                valueFrom:
                  secretKeyRef:
                    name: authentik-secrets
                    key: bootstrap-token
          server:
            ingress:
              enabled: true
              ingressClassName: traefik
              annotations:
                cert-manager.io/cluster-issuer: cloudflare
              hosts:
                - authentik.mocha.thoughtless.eu
              tls:
                - secretName: authentik-tls
                  hosts:
                    - authentik.mocha.thoughtless.eu
          postgresql:
            enabled: true
            auth:
              existingSecret: authentik-secrets
              secretKeys:
                userPasswordKey: password
                adminPasswordKey: postgres-password
            primary:
              persistence:
                enabled: true
                storageClass: openebs-lvmpv
                size: 8Gi
    - repoURL: https://github.com/qjoly/gitops.git
      targetRevision: HEAD
      path: mocha/system/authentik/manifests
    # authentik-provisioner: declaratively configures applications/providers.
    # Runs as an ArgoCD PostSync hook on every sync (idempotent).
    - repoURL: ghcr.io/qjoly/charts
      chart: authentik-provisioner
      targetRevision: 0.3.2
      helm:
        values: |
          authentik:
            url: http://authentik-server
            token:
              existingSecret: authentik-secrets
              key: bootstrap-token
          rbac:
            create: true
          job:
            helmHook: false
            argocdHook: PostSync
          config:
            managedBy: gitops-provisioner
            pruneGroups: false
            defaults:
              authorizationFlow: default-provider-authorization-implicit-consent
              invalidationFlow: default-provider-invalidation-flow
              subMode: user_email
            oauth2Providers:
              - slug: vaultwarden
                name: Provider for Vaultwarden
                appName: Vaultwarden
                clientType: confidential
                redirectURIs:
                  - https://vaultwarden.mocha.thoughtless.eu/identity/connect/oidc-signin
                scopes: [email, offline_access, profile, openid]
                subMode: user_email
                icon: https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/svg/vaultwarden.svg
              - slug: netbird
                name: Provider for Netbird
                appName: Netbird
                clientType: public
                clientID: netbird
                redirectURIs:
                  - https://netbird.mocha.thoughtless.eu/nb-auth
                  - https://netbird.mocha.thoughtless.eu/nb-silent-auth
                  - http://localhost:53000
                scopes: [email, offline_access, profile, openid]
                subMode: user_email
                icon: https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/svg/netbird.svg
              - slug: argocd-turing
                name: Provider for ArgoCD (turing)
                appName: ArgoCD Turing
                clientType: confidential
                redirectURIs:
                  - https://argocd-turing.thoughtless.eu/api/dex/callback
                scopes: [email, profile, openid]
                subMode: user_email
                icon: https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/svg/argo-cd.svg
                secretName: oidc-argocd-turing
              - slug: immich
                name: Provider for Immich (turing)
                appName: Immich
                clientType: confidential
                redirectURIs:
                  - https://immich.thoughtless.eu/auth/login
                  - https://immich.thoughtless.eu/user-settings
                  - app.immich:///oauth-callback
                scopes: [email, profile, openid]
                subMode: user_email
                icon: https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/svg/immich.svg
                secretName: oidc-immich
              - slug: paperless
                name: Provider for Paperless (turing)
                appName: Paperless
                clientType: confidential
                redirectURIs:
                  - https://paperless.thoughtless.eu/accounts/oidc/authentik/login/callback/
                scopes: [email, profile, openid]
                subMode: user_email
                icon: https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/svg/paperless-ngx.svg
                secretName: oidc-paperless
              - slug: grafana
                name: Provider for Grafana (mocha)
                appName: Grafana
                clientType: confidential
                redirectURIs:
                  - https://grafana.mocha.thoughtless.eu/login/generic_oauth
                scopes: [email, profile, openid]
                subMode: user_email
                icon: https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/svg/grafana.svg
                secretName: oidc-grafana
              - slug: omni
                name: Provider for Omni
                appName: Omni
                clientType: confidential
                redirectURIs:
                  - https://omni.home.une-tasse-de.cafe/oidc/consume
                scopes: [email, profile, openid]
                subMode: user_email
                icon: https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/svg/talos.svg
                secretName: oidc-omni
              - slug: k7
                name: Provider for K7 (americano)
                appName: K7
                clientType: confidential
                clientID: k7
                redirectURIs:
                  - https://k7.americano.thoughtless.eu/api/authentication/callback/login/oidc
                  - https://k7.americano.thoughtless.eu/api/authentication/callback/logout/oidc
                scopes: [email, profile, openid]
                subMode: user_email
                icon: https://raw.githubusercontent.com/kaybi-gh/k7/main/branding/logo.svg
                secretName: oidc-k7
              # Public client: the gateway does the PKCE flow itself, no secret.
              # The "groups" claim comes from the default profile scope mapping.
              - slug: mcp-gateway
                name: Provider for MCP Gateway (mocha)
                appName: MCP Gateway
                clientType: public
                clientID: mcp-gateway
                redirectURIs:
                  - https://mcp.mocha.thoughtless.eu/admin/callback
                  - https://mcp.mocha.thoughtless.eu/callback
                scopes: [email, profile, openid, offline_access]
                subMode: user_email
                icon: https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/svg/anthropic.svg
              # abcdesktop's pyos exchanges the code server-side but the
              # client_secret would have to sit in a ConfigMap, hence public.
              - slug: abcdesktop
                name: Provider for abcdesktop (mocha)
                appName: abcdesktop
                clientType: public
                clientID: abcdesktop
                redirectURIs:
                  - https://abcdesktop.mocha.thoughtless.eu/API/auth/oauth?manager=external&provider=authentik
                scopes: [email, profile, openid]
                subMode: user_email
                icon: https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/svg/kasm.svg
              - slug: toutou
                name: Provider for Toutou (mocha)
                appName: Toutou
                clientType: confidential
                redirectURIs:
                  - https://toutou.mocha.thoughtless.eu/api/auth/callback/oidc
                scopes: [email, profile, openid]
                subMode: user_email
                icon: https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/svg/dog.svg
                secretName: oidc-toutou
              - slug: tranquil-pds
                name: Provider for Tranquil PDS (mocha)
                appName: Tranquil PDS
                clientType: confidential
                redirectURIs:
                  - https://pds.mocha.thoughtless.eu/oauth/sso/callback
                scopes: [email, profile, openid]
                subMode: user_email
                icon: https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/svg/bluesky.svg
                secretName: oidc-tranquil-pds
            proxyProviders:
              - slug: prowlarr
                name: Prowlarr
                mode: forward_single
                externalHost: https://prowlarr.americano.thoughtless.eu
                accessTokenValidity: hours=24
                icon: https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/svg/prowlarr.svg
              - slug: radarr
                name: Radarr
                mode: forward_single
                externalHost: https://radarr.americano.thoughtless.eu
                accessTokenValidity: hours=24
                icon: https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/svg/radarr.svg
              - slug: sonarr
                name: Sonarr
                mode: forward_single
                externalHost: https://sonarr.americano.thoughtless.eu
                accessTokenValidity: hours=24
                icon: https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/svg/sonarr.svg
